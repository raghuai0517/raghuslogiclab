 textbook asks students to illustrate each of the ___ Fundamental Duties.","o":["11","6","10","12"],"a":0,"e":"The activity says: ‘Illustrate each of the 11 Fundamental Duties with drawings, pictures, poems or songs.’","n":"The 11th duty: parents/guardians to provide education to children aged 6–14.","te":{"q":"ఎన్ని ప్రాథమిక విధుల్లో ప్రతిదాన్నీ చిత్రించమని పాఠ్యపుస్తకం విద్యార్థులను కోరుతుంది?","o":["11","6","10","12"],"e":"కృత్యం ఇలా చెబుతుంది: ‘11 ప్రాథమిక విధుల్లో ప్రతిదాన్నీ బొమ్మలు, చిత్రాలు, కవితలు లేదా పాటలతో వివరించండి.’","n":"11వ విధి: 6–14 ఏళ్ల పిల్లలకు తల్లిదండ్రులు/సంరక్షకులు విద్యావకాశాలు కల్పించడం."}},{"t":"MCQ","q":"The Right of Children to Free and Compulsory Education (RTE) Act, 2009 came into force in Andhra Pradesh from —","o":["1 April 2009","26 January 2010","1 April 2010","15 August 2011"],"a":2,"e":"The back page says the RTE Act came into force from 1st April 2010 in Andhra Pradesh, for children aged 6–14 years.","n":"No child shall be subjected to physical punishment or mental harassment.","te":{"q":"ఉచిత, నిర్బంధ విద్యా హక్కు (RTE) చట్టం, 2009 ఆంధ్రప్రదేశ్‌లో అమల్లోకి వచ్చిన తేదీ —","o":["1 ఏప్రిల్ 2009","26 జనవరి 2010","1 ఏప్రిల్ 2010","15 ఆగస్టు 2011"],"e":"6–14 ఏళ్ల పిల్లలకు RTE చట్టం ఆంధ్రప్రదేశ్‌లో 2010 ఏప్రిల్ 1 నుండి అమల్లోకి వచ్చిందని చివరి పేజీ చెబుతుంది.","n":"ఏ బిడ్డనూ శారీరక శిక్షకు గానీ మానసిక వేధింపులకు గానీ గురిచేయకూడదు."}},{"t":"MCQ","q":"The illegal buying and selling of human beings, particularly women and children, across borders is called —","o":["Bonded labour","Begar","Human trafficking","Sedition"],"a":2,"e":"Glossary: Human Trafficking — in the context of Fundamental Rights, illegal trade in human beings, particularly women and children.","n":"It is prohibited under the Right against Exploitation.","te":{"q":"సరిహద్దుల గుండా మనుషులను, ముఖ్యంగా మహిళలు, పిల్లలను చట్టవిరుద్ధంగా కొనడం, అమ్మడాన్ని ఏమంటారు?","o":["వెట్టిచాకిరి","బేగార్","మానవ అక్రమ రవాణా","రాజద్రోహం"],"e":"పదకోశం: మానవ అక్రమ రవాణా — ప్రాథమిక హక్కుల సందర్భంలో మనుషుల, ముఖ్యంగా మహిళలు, పిల్లల చట్టవిరుద్ధ వ్యాపారం.","n":"దోపిడీని నిరోధించే హక్కు దీనిని నిషేధిస్తుంది."}},{"t":"MCQ","q":"‘Tyranny’ means —","o":["A society with organised political structure","An independent people","The cruel and unjust use of power or authority","A perfect goal or principle"],"a":2,"e":"Glossary: Tyranny — the cruel and unjust use of power or authority.","n":"Polity = a society with an organised political structure; Sovereign = an independent people; Ideal = a goal in its most perfect form.","te":{"q":"‘నిరంకుశత్వం’ (టిరనీ) అంటే —","o":["వ్యవస్థీకృత రాజకీయ నిర్మాణం గల సమాజం","స్వతంత్ర ప్రజలు","అధికారాన్ని క్రూరంగా, అన్యాయంగా వినియోగించడం","అత్యుత్తమ రూపంలో ఉన్న లక్ష్యం"],"e":"పదకోశం: నిరంకుశత్వం — అధికారాన్ని క్రూరంగా, అన్యాయంగా వినియోగించడం.","n":"పాలిటీ = వ్యవస్థీకృత రాజకీయ నిర్మాణం గల సమాజం; సార్వభౌమ = స్వతంత్ర ప్రజలు; ఆదర్శం = అత్యుత్తమ రూపంలోని లక్ష్యం."}}]},{"id":"civ2","subject":"Civics","unit":"Social and Political Life","no":2,"title":"Understanding Secularism","te":{"subject":"పౌరశాస్త్రం","unit":"సామాజిక మరియు రాజకీయ జీవనం","title":"లౌకికవాదాన్ని అర్థం చేసుకోవడం"},"questions":[{"t":"MCQ","q":"Secularism refers to —","o":["Separation of religion from the State","Promotion of one religion by the State","Rule by religious leaders","Banning all religions"],"a":0,"e":"‘Secularism refers to this separation of religion from the State.’","n":"The Indian Constitution allows individuals freedom to live by their religious beliefs.","te":{"q":"లౌకికవాదం అంటే —","o":["మతాన్ని రాజ్యం నుండి వేరు చేయడం","రాజ్యం ఒక మతాన్ని ప్రోత్సహించడం","మత నాయకుల పాలన","అన్ని మతాలను నిషేధించడం"],"e":"‘మతాన్ని రాజ్యం నుండి వేరు చేయడాన్నే లౌకికవాదం అంటారు.’","n":"భారత రాజ్యాంగం వ్యక్తులు తమ మత విశ్వాసాల ప్రకారం జీవించే స్వేచ్ఛను ఇస్తుంది."}},{"t":"MCQ","q":"The essence of secularism, according to the chapter’s introduction, is —","o":["Retaliation against discrimination","That all forms of domination related to religion should end","That the majority religion should rule","That religion should be private only"],"a":1,"e":"Fighting for justice for all — that no one should be discriminated against on religious grounds — rests on the idea that all religious domination should end. This is the essence of secularism.","n":"Retaliation is not the proper response.","te":{"q":"అధ్యాయం ప్రారంభం ప్రకారం లౌకికవాదపు సారాంశం —","o":["వివక్షకు ప్రతీకారం తీర్చుకోవడం","మతానికి సంబంధించిన అన్ని రకాల ఆధిపత్యాలు అంతం కావాలి","మెజారిటీ మతం పాలించాలి","మతం వ్యక్తిగతంగా మాత్రమే ఉండాలి"],"e":"అందరికీ న్యాయం కోసం పోరాడటం — మతం ఆధారంగా ఎవరిపైనా వివక్ష ఉండకూడదనే భావన మతపరమైన అన్ని ఆధిపత్యాలు అంతం కావాలనే దానిపై ఆధారపడి ఉంది. ఇదే లౌకికవాదపు సారాంశం.","n":"ప్రతీకారం సరైన ప్రతిస్పందన కాదు."}},{"t":"MCQ","q":"Which historical example of religious persecution is given in the textbook?","o":["Christians persecuted in Rome","Buddhists in Sri Lanka","Jews persecuted in Hitler’s Germany","Hindus in Nepal"],"a":2,"e":"The textbook mentions how Jews were persecuted in Hitler’s Germany and several millions were killed.","n":"It also mentions Israel’s treatment of minorities and restrictions in Saudi Arabia.","te":{"q":"పాఠ్యపుస్తకంలో ఇచ్చిన మత హింసకు చారిత్రక ఉదాహరణ ఏది?","o":["రోమ్‌లో క్రైస్తవులపై హింస","శ్రీలంకలో బౌద్ధులు","హిట్లర్ జర్మనీలో యూదులపై హింస","నేపాల్‌లో హిందువులు"],"e":"హిట్లర్ జర్మనీలో యూదులు హింసకు గురై లక్షలాది మంది చంపబడ్డారని పాఠ్యపుస్తకం పేర్కొంటుంది.","n":"ఇజ్రాయిల్‌లో మైనారిటీల పట్ల వ్యవహారం, సౌదీ అరేబియాలోని ఆంక్షలను కూడా ప్రస్తావిస్తుంది."}},{"t":"MCQ","q":"In which country, according to the textbook, are non-Muslims not allowed to build a temple or church or gather in public for prayers?","o":["Iran","Pakistan","Saudi Arabia","Turkey"],"a":2,"e":"In Saudi Arabia non-Muslims are not allowed to build a temple, church etc., nor gather in a public place for prayers.","n":"Discrimination happens more easily when one religion is officially recognised by the State.","te":{"q":"పాఠ్యపుస్తకం ప్రకారం ముస్లిమేతరులు దేవాలయం లేదా చర్చి నిర్మించడానికి, బహిరంగంగా ప్రార్థనల కోసం సమావేశం కావడానికి అనుమతి లేని దేశం ఏది?","o":["ఇరాన్","పాకిస్తాన్","సౌదీ అరేబియా","టర్కీ"],"e":"సౌదీ అరేబియాలో ముస్లిమేతరులు దేవాలయం, చర్చి వంటివి నిర్మించడానికి గానీ బహిరంగ ప్రదేశంలో ప్రార్థనలకు సమావేశం కావడానికి గానీ అనుమతి లేదు.","n":"ఒక మతానికి రాజ్యం అధికారిక గుర్తింపు ఇచ్చినప్పుడు వివక్ష సులభంగా జరుగుతుంది."}},{"t":"Statements","q":"Why is it important to separate religion from the State?\nI. To prevent the tyranny of the majority religious group over minorities.\nII. To protect the freedom of individuals to exit their religion, embrace another or interpret teachings differently.","o":["I only","II only","Both I and II","Neither I nor II"],"a":2,"e":"The textbook gives both reasons. The untouchability example illustrates the second reason.","n":"Domination based on religion violates the rights every citizen is guaranteed.","te":{"q":"మతాన్ని రాజ్యం నుండి వేరు చేయడం ఎందుకు ముఖ్యం?\nI. మైనారిటీలపై మెజారిటీ మత సమూహపు నిరంకుశత్వాన్ని నివారించడానికి.\nII. వ్యక్తులు తమ మతం నుండి బయటకు రావడానికి, మరో మతాన్ని స్వీకరించడానికి లేదా మత బోధనలను భిన్నంగా అర్థం చేసుకోవడానికి ఉన్న స్వేచ్ఛను కాపాడటానికి.","o":["I మాత్రమే","II మాత్రమే","I మరియు II రెండూ","I, II రెండూ కావు"],"e":"పాఠ్యపుస్తకం రెండు కారణాలనూ ఇస్తుంది. అంటరానితనం ఉదాహరణ రెండవ కారణాన్ని వివరిస్తుంది.","n":"మతం ఆధారంగా ఆధిపత్యం ప్రతి పౌరుడికి హామీ ఇచ్చిన హక్కులను ఉల్లంఘిస్తుంది."}},{"t":"MCQ","q":"According to the Constitution, which is an objective of the Indian secular State?","o":["That one religious community dominates another","That the State enforces a particular religion","That the State supports the majority religion","That some members do not dominate other members of the same religious community"],"a":3,"e":"The three objectives: one community does not dominate another; members do not dominate others in the same community; the State does not enforce any religion or take away religious freedom.","n":"Only a secular State can realise these objectives.","te":{"q":"రాజ్యాంగం ప్రకారం భారత లౌకిక రాజ్యపు లక్ష్యం ఏది?","o":["ఒక మత సమాజం మరొకదానిపై ఆధిపత్యం చెలాయించడం","రాజ్యం ఒక నిర్దిష్ట మతాన్ని అమలు చేయడం","రాజ్యం మెజారిటీ మతాన్ని సమర్థించడం","ఒకే మత సమాజంలోని కొందరు సభ్యులు ఇతర సభ్యులపై ఆధిపత్యం చెలాయించకుండా ఉండటం"],"e":"మూడు లక్ష్యాలు: ఒక సమాజం మరొకదానిపై ఆధిపత్యం చెలాయించకూడదు; ఒకే సమాజంలో సభ్యులు ఇతరులపై ఆధిపత్యం చెలాయించకూడదు; రాజ్యం ఏ మతాన్నీ అమలు చేయకూడదు, మత స్వేచ్ఛను హరించకూడదు.","n":"లౌకిక రాజ్యం మాత్రమే ఈ లక్ష్యాలను సాధించగలదు."}},{"t":"MCQ","q":"Government schools not celebrating religious festivals in school premises is an example of the strategy of —","o":["Distancing from religion","Intervention","Non-interference","Support"],"a":0,"e":"The Indian State distances itself from religion: government spaces like law courts, police stations and government schools should not promote any one religion.","n":"This rule does not apply to private schools.","te":{"q":"ప్రభుత్వ పాఠశాలల ప్రాంగణంలో మతపరమైన పండుగలు జరపకపోవడం ఏ వ్యూహానికి ఉదాహరణ?","o":["మతానికి దూరంగా ఉండటం","జోక్యం","జోక్యం చేసుకోకపోవడం","మద్దతు"],"e":"భారత రాజ్యం మతానికి దూరంగా ఉంటుంది: న్యాయస్థానాలు, పోలీస్ స్టేషన్లు, ప్రభుత్వ పాఠశాలల వంటి ప్రభుత్వ ప్రదేశాలు ఏ మతాన్నీ ప్రోత్సహించకూడదు.","n":"ఈ నియమం ప్రైవేట్ పాఠశాలలకు వర్తించదు."}},{"t":"MCQ","q":"A Sikh youth not having to wear a helmet because the pugri is central to his religious practice is an example of —","o":["Intervention","Non-interference","Distancing","Coercion"],"a":1,"e":"In non-interference, the State makes certain exceptions for particular religious communities to respect their sentiments.","n":"Paramjit’s storyboard illustrates this.","te":{"q":"తలపాగా (పగిడీ) తన మత ఆచారంలో ప్రధానమైనది కాబట్టి సిక్కు యువకుడు హెల్మెట్ ధరించనవసరం లేకపోవడం దేనికి ఉదాహరణ?","o":["జోక్యం","జోక్యం చేసుకోకపోవడం","దూరంగా ఉండటం","బలవంతం"],"e":"జోక్యం చేసుకోకపోవడం అనే వ్యూహంలో, మత భావాలను గౌరవించడానికి రాజ్యం కొన్ని మత సమాజాలకు మినహాయింపులు ఇస్తుంది.","n":"పరమ్‌జీత్ కథ దీనిని వివరిస్తుంది."}},{"t":"MCQ","q":"The Indian Constitution banning untouchability is an example of the strategy of —","o":["Distancing","Non-interference","Neutrality","Intervention"],"a":3,"e":"The State intervenes in religion to end a social practice that discriminates against ‘lower castes’ and violates their Fundamental Rights.","n":"Intervention may also be needed in personal laws for equal inheritance rights.","te":{"q":"భారత రాజ్యాంగం అంటరానితనాన్ని నిషేధించడం ఏ వ్యూహానికి ఉదాహరణ?","o":["దూరంగా ఉండటం","జోక్యం చేసుకోకపోవడం","తటస్థత","జోక్యం (ఇంటర్వెన్షన్)"],"e":"‘దిగువ కులాల’ పట్ల వివక్ష చూపుతూ వారి ప్రాథమిక హక్కులను ఉల్లంఘించే సామాజిక ఆచారాన్ని అంతం చేయడానికి రాజ్యం మతంలో జోక్యం చేసుకుంటుంది.","n":"సమాన వారసత్వ హక్కుల కోసం వ్యక్తిగత చట్టాల్లో కూడా జోక్యం అవసరం కావచ్చు."}},{"t":"Assertion–Reason","q":"Assertion (A): The State may intervene in religion-based ‘personal laws’ of communities.\nReason (R): It may need to ensure that laws relating to equal inheritance rights are respected.","o":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, but R is false","A is false, but R is true"],"a":0,"e":"The textbook says this directly. R explains A.","n":"Intervention can be through a ban or through support.","te":{"q":"నిశ్చితవాక్యం (A): రాజ్యం సమాజాల మతాధారిత ‘వ్యక్తిగత చట్టాల్లో’ జోక్యం చేసుకోవచ్చు.\nకారణం (R): సమాన వారసత్వ హక్కులకు సంబంధించిన చట్టాలు గౌరవించబడేలా చూడవలసి రావచ్చు.","o":["A మరియు R రెండూ సరైనవి, R అనేది A కు సరైన వివరణ","A మరియు R రెండూ సరైనవి, కానీ R అనేది A కు సరైన వివరణ కాదు","A సరైనది, కానీ R తప్పు","A తప్పు, కానీ R సరైనది"],"e":"పాఠ్యపుస్తకం ఇదే నేరుగా చెబుతుంది. R అనేది A ను వివరిస్తుంది.","n":"జోక్యం నిషేధం రూపంలో గానీ మద్దతు రూపంలో గానీ ఉండవచ్చు."}},{"t":"MCQ","q":"The Indian Constitution grants religious communities the right to set up their own schools and gives them financial aid on a —","o":["Preferential basis","Majority basis","Loan basis","Non-preferential basis"],"a":3,"e":"The intervention of the State can be in the form of support: financial aid to religious communities’ schools on a non-preferential basis.","n":"This is another way Indian secularism differs from strict separation.","te":{"q":"మత సమాజాలు సొంత పాఠశాలలు స్థాపించుకునే హక్కును ఇస్తూ భారత రాజ్యాంగం వాటికి ఏ ప్రాతిపదికన ఆర్థిక సహాయం అందిస్తుంది?","o":["ప్రాధాన్యత ప్రాతిపదికన","మెజారిటీ ప్రాతిపదికన","రుణ ప్రాతిపదికన","ప్రాధాన్యత లేని (వివక్ష లేని) ప్రాతిపదికన"],"e":"రాజ్య జోక్యం మద్దతు రూపంలో కూడా ఉంటుంది: మత సమాజాల పాఠశాలలకు ప్రాధాన్యత లేని ప్రాతిపదికన ఆర్థిక సహాయం.","n":"కఠిన విభజన నుండి భారత లౌకికవాదం భిన్నంగా ఉండే మరో మార్గం ఇది."}},{"t":"MCQ","q":"The First Amendment of the US Constitution prohibits the legislature from making laws —","o":["Against free speech only","On taxation","‘Respecting an establishment of religion’ or that ‘prohibit the free exercise of religion’","On immigration"],"a":2,"e":"The First Amendment means the legislature cannot declare any religion official or prefer one religion.","n":"In the USA, neither State nor religion can interfere in each other’s affairs.","te":{"q":"అమెరికా రాజ్యాంగపు మొదటి సవరణ శాసనసభ ఏ చట్టాలు చేయకుండా నిషేధిస్తుంది?","o":["వాక్ స్వాతంత్ర్యానికి వ్యతిరేకంగా మాత్రమే","పన్నులపై","‘మత స్థాపనకు సంబంధించిన’ లేదా ‘మత స్వేచ్ఛా ఆచరణను నిషేధించే’ చట్టాలు","వలసలపై"],"e":"మొదటి సవరణ ప్రకారం శాసనసభ ఏ మతాన్నీ అధికారిక మతంగా ప్రకటించకూడదు, ఏ మతానికీ ప్రాధాన్యత ఇవ్వకూడదు.","n":"అమెరికాలో రాజ్యం, మతం ఒకరి వ్యవహారాల్లో మరొకరు జోక్యం చేసుకోవు."}},{"t":"Assertion–Reason","q":"Assertion (A): Indian secularism differs from the dominant understanding of secularism in the USA.\nReason (R): Unlike strict separation in the USA, in Indian secularism the State can intervene in religious affairs.","o":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, but R is false","A is false, but R is true"],"a":0,"e":"This is precisely the difference stated in the textbook. R explains A.","n":"India maintains a ‘principled distance’ vis-à-vis religion.","te":{"q":"నిశ్చితవాక్యం (A): భారత లౌకికవాదం అమెరికాలోని ప్రధాన లౌకికవాద భావన నుండి భిన్నమైనది.\nకారణం (R): అమెరికాలోని కఠిన విభజనకు భిన్నంగా భారత లౌకికవాదంలో రాజ్యం మత వ్యవహారాల్లో జోక్యం చేసుకోవచ్చు.","o":["A మరియు R రెండూ సరైనవి, R అనేది A కు సరైన వివరణ","A మరియు R రెండూ సరైనవి, కానీ R అనేది A కు సరైన వివరణ కాదు","A సరైనది, కానీ R తప్పు","A తప్పు, కానీ R సరైనది"],"e":"పాఠ్యపుస్తకం చెప్పిన తేడా ఖచ్చితంగా ఇదే. R అనేది A ను వివరిస్తుంది.","n":"భారతదేశం మతం పట్ల ‘సూత్రబద్ధ దూరం’ పాటిస్తుంది."}},{"t":"MCQ","q":"‘Principled distance’ in Indian secularism means —","o":["The State never deals with religion","The State supports only majority religion","Religion controls the State","Any interference in religion by the State has to be based on the ideals laid out in the Constitution"],"a":3,"e":"These constitutional ideals are the standard to judge whether the State is behaving according to secular principles.","n":"The term is explained in the Teacher’s Note and main text.","te":{"q":"భారత లౌకికవాదంలో ‘సూత్రబద్ధ దూరం’ అంటే —","o":["రాజ్యం ఎప్పుడూ మతంతో వ్యవహరించదు","రాజ్యం మెజారిటీ మతాన్ని మాత్రమే సమర్థిస్తుంది","మతం రాజ్యాన్ని నియంత్రిస్తుంది","మతంలో రాజ్యం చేసే ఏ జోక్యమైనా రాజ్యాంగంలో నిర్దేశించిన ఆదర్శాల ఆధారంగానే ఉండాలి"],"e":"రాజ్యం లౌకిక సూత్రాల ప్రకారం వ్యవహరిస్తోందో లేదో నిర్ణయించడానికి ఈ రాజ్యాంగ ఆదర్శాలే ప్రమాణం.","n":"ఈ పదం ఉపాధ్యాయ గమనిక, పాఠంలో వివరించబడింది."}},{"t":"MCQ","q":"In US government schools, the ‘Pledge of Allegiance’ has been challenged because it includes the words —","o":["‘In God we trust’","‘Under God’","‘One nation’","‘Liberty and justice’"],"a":1,"e":"There have been legal challenges objecting to the phrase ‘under God’ as violating the separation between church and State.","n":"Students are not required to recite it if it conflicts with their beliefs.","te":{"q":"అమెరికా ప్రభుత్వ పాఠశాలల్లో ‘ప్లెడ్జ్ ఆఫ్ అలీజియన్స్’ (విధేయతా ప్రతిజ్ఞ)ను సవాలు చేయడానికి కారణం అందులోని పదాలు —","o":["‘ఇన్ గాడ్ వి ట్రస్ట్’","‘అండర్ గాడ్’ (దేవుని కింద)","‘వన్ నేషన్’","‘లిబర్టీ అండ్ జస్టిస్’"],"e":"‘అండర్ గాడ్’ అనే పదబంధం చర్చి-రాజ్య విభజనను ఉల్లంఘిస్తోందని పలు న్యాయ సవాళ్లు వచ్చాయి.","n":"తమ విశ్వాసాలకు విరుద్ధమైతే విద్యార్థులు దానిని పఠించనవసరం లేదు."}},{"t":"MCQ","q":"In February 2004, France passed a law banning students from wearing —","o":["Conspicuous religious or political signs or symbols","School uniforms","Western clothes","Shoes in class"],"a":0,"e":"The law banned symbols such as the Islamic headscarf, Jewish skullcap or large Christian crosses.","n":"It faced resistance from immigrants from former colonies Algeria, Tunisia and Morocco.","te":{"q":"2004 ఫిబ్రవరిలో ఫ్రాన్స్ చేసిన చట్టం విద్యార్థులు దేనిని ధరించడాన్ని నిషేధించింది?","o":["స్పష్టంగా కనిపించే మత లేదా రాజకీయ చిహ్నాలు","పాఠశాల యూనిఫారాలు","పాశ్చాత్య దుస్తులు","తరగతిలో బూట్లు"],"e":"ఇస్లామిక్ తలకప్పు, యూదుల టోపీ, పెద్ద క్రైస్తవ శిలువల వంటి చిహ్నాలను ఈ చట్టం నిషేధించింది.","n":"మాజీ వలస దేశాలైన అల్జీరియా, ట్యునీషియా, మొరాకో నుండి వచ్చిన వలసదారుల నుండి దీనికి ప్రతిఘటన ఎదురైంది."}},{"t":"MCQ","q":"The French law of 2004 faced resistance mainly from immigrants from —","o":["India, Pakistan and Bangladesh","Algeria, Tunisia and Morocco","Turkey and Iran","Spain and Portugal"],"a":1,"e":"These immigrants had come in the 1960s when France faced a shortage of workers.","n":"Their daughters were expelled for wearing headscarves.","te":{"q":"ఫ్రాన్స్ 2004 చట్టాన్ని ప్రధానంగా ఏ దేశాల నుండి వచ్చిన వలసదారులు వ్యతిరేకించారు?","o":["భారత్, పాకిస్తాన్, బంగ్లాదేశ్","అల్జీరియా, ట్యునీషియా, మొరాకో","టర్కీ, ఇరాన్","స్పెయిన్, పోర్చుగల్"],"e":"1960లలో ఫ్రాన్స్‌లో కార్మికుల కొరత ఉన్నప్పుడు ఈ వలసదారులు వచ్చారు.","n":"తలకప్పు ధరించినందుకు వారి కుమార్తెలను పాఠశాల నుండి బహిష్కరించారు."}},{"t":"Statements","q":"Consider the following statements about Indian secularism:\nI. The Indian State both keeps away from religion and intervenes in religion.\nII. Because rights exist, violations never take place in Indian society.","o":["I only","II only","Both I and II","Neither I nor II"],"a":0,"e":"Statement I is correct. The textbook says violations do happen frequently, which is precisely why a constitutional mechanism is needed. So II is wrong.","n":"Knowledge of rights makes us sensitive to violations.","te":{"q":"భారత లౌకికవాదం గురించి కింది వాక్యాలను పరిశీలించండి:\nI. భారత రాజ్యం మతానికి దూరంగా ఉంటుంది, మతంలో జోక్యం కూడా చేసుకుంటుంది.\nII. హక్కులు ఉన్నందున భారత సమాజంలో ఉల్లంఘనలు ఎప్పుడూ జరగవు.","o":["I మాత్రమే","II మాత్రమే","I మరియు II రెండూ","I, II రెండూ కావు"],"e":"వాక్యం I సరైనది. ఉల్లంఘనలు తరచూ జరుగుతుంటాయని, అందుకే రాజ్యాంగ యంత్రాంగం అవసరమని పాఠ్యపుస్తకం చెబుతుంది. కాబట్టి II తప్పు.","n":"హక్కుల గురించిన అవగాహన ఉల్లంఘనల పట్ల మనల్ని అప్రమత్తం చేస్తుంది."}},{"t":"MCQ","q":"Will the government intervene if a religious group says their religion allows them to practise infanticide?","o":["No, because of religious freedom","Yes, because it violates the Right to Life and the State intervenes based on constitutional ideals","Only if the majority agrees","No, it is a private matter"],"a":1,"e":"Indian secularism permits intervention, based on constitutional principles, to stop practices that violate Fundamental Rights. Infanticide violates the right to life.","n":"This is a textbook exercise question.","te":{"q":"తమ మతం శిశుహత్యను అనుమతిస్తుందని ఒక మత సమూహం చెబితే ప్రభుత్వం జోక్యం చేసుకుంటుందా?","o":["లేదు, మత స్వేచ్ఛ కారణంగా","అవును, అది జీవించే హక్కును ఉల్లంఘిస్తుంది; రాజ్యాంగ ఆదర్శాల ఆధారంగా రాజ్యం జోక్యం చేసుకుంటుంది","మెజారిటీ అంగీకరిస్తే మాత్రమే","లేదు, అది వ్యక్తిగత విషయం"],"e":"ప్రాథమిక హక్కులను ఉల్లంఘించే ఆచారాలను ఆపడానికి రాజ్యాంగ సూత్రాల ఆధారంగా జోక్యాన్ని భారత లౌకికవాదం అనుమతిస్తుంది. శిశుహత్య జీవించే హక్కును ఉల్లంఘిస్తుంది.","n":"ఇది పాఠ్యపుస్తక అభ్యాస ప్రశ్న."}},{"t":"MCQ","q":"‘Coercion’, in the context of this chapter, refers to —","o":["Freedom to interpret","Celebrating festivals","A religious ritual","The force used by a legal authority like the State"],"a":3,"e":"Glossary: Coercion — to force someone to do something; here, force used by a legal authority like the State.","n":"Intervene: the State’s efforts to influence a matter according to constitutional principles.","te":{"q":"ఈ అధ్యాయం సందర్భంలో ‘బలవంతం’ (కోయర్షన్) అంటే —","o":["అర్థం చేసుకునే స్వేచ్ఛ","పండుగలు జరుపుకోవడం","ఒక మత కర్మ","రాజ్యం వంటి చట్టబద్ధ అధికారం ఉపయోగించే బలం"],"e":"పదకోశం: బలవంతం — ఎవరినైనా ఏదైనా చేయమని ఒత్తిడి చేయడం; ఇక్కడ రాజ్యం వంటి చట్టబద్ధ అధికారం ఉపయోగించే బలం.","n":"జోక్యం: రాజ్యాంగ సూత్రాల ప్రకారం ఒక విషయాన్ని ప్రభావితం చేయడానికి రాజ్యం చేసే ప్రయత్నాలు."}},{"t":"MCQ","q":"Government spaces that are NOT supposed to display or promote any one religion include —","o":["Private homes","Law courts, police stations, government schools and offices","Private schools","Religious trusts"],"a":1,"e":"In India, government spaces like law courts, police stations, government schools and offices are not supposed to display or promote any one religion.","n":"This is the distancing strategy.","te":{"q":"ఏ ఒక్క మతాన్నీ ప్రదర్శించకూడని, ప్రోత్సహించకూడని ప్రభుత్వ ప్రదేశాల్లో ఉన్నవి —","o":["ప్రైవేట్ ఇళ్లు","న్యాయస్థానాలు, పోలీస్ స్టేషన్లు, ప్రభుత్వ పాఠశాలలు, కార్యాలయాలు","ప్రైవేట్ పాఠశాలలు","మత ట్రస్టులు"],"e":"భారతదేశంలో న్యాయస్థానాలు, పోలీస్ స్టేషన్లు, ప్రభుత్వ పాఠశాలలు, కార్యాలయాల వంటి ప్రభుత్వ ప్రదేశాలు ఏ ఒక్క మతాన్నీ ప్రదర్శించకూడదు, ప్రోత్సహించకూడదు.","n":"ఇది దూరంగా ఉండే వ్యూహం."}},{"t":"MCQ","q":"Why is retaliation not the proper response to religious discrimination, according to the chapter?","o":["It is too slow","It is illegal in the USA","It would continue the cycle of domination rather than ensure justice for all","It needs money"],"a":2,"e":"The chapter contrasts retaliation with the view that there should be justice for all and that all religious domination should end.","n":"Secularism rests on justice for all, not revenge.","te":{"q":"అధ్యాయం ప్రకారం మత వివక్షకు ప్రతీకారం సరైన ప్రతిస్పందన ఎందుకు కాదు?","o":["అది చాలా నెమ్మదిగా ఉంటుంది","అది అమెరికాలో చట్టవిరుద్ధం","అది అందరికీ న్యాయం కాకుండా ఆధిపత్య చక్రాన్ని కొనసాగిస్తుంది","దానికి డబ్బు కావాలి"],"e":"అధ్యాయం ప్రతీకారాన్ని ‘అందరికీ న్యాయం జరగాలి, మతపరమైన అన్ని ఆధిపత్యాలు అంతం కావాలి’ అనే భావనతో పోలుస్తుంది.","n":"లౌకికవాదం ప్రతీకారంపై కాకుండా అందరికీ న్యాయంపై ఆధారపడి ఉంది."}}]},{"id":"civ3","subject":"Civics","unit":"Social and Political Life","no":3,"title":"Parliament and the Making of Laws","te":{"subject":"పౌరశాస్త్రం","unit":"సామాజిక మరియు రాజకీయ జీవనం","title":"పార్లమెంటు మరియు చట్టాల రూపకల్పన"},"questions":[{"t":"MCQ","q":"As far back as 1885, the Indian National Congress demanded —","o":["Complete independence","Elected members in the legislature with a right to discuss the budget and ask questions","Universal adult franchise","A separate Constituent Assembly"],"a":1,"e":"In 1885 the Congress demanded elected members in the legislature with the right to discuss the budget and ask questions.","n":"The Government of India Act 1909 allowed for some elected representation.","te":{"q":"1885లోనే భారత జాతీయ కాంగ్రెస్ డిమాండ్ చేసినది —","o":["సంపూర్ణ స్వాతంత్ర్యం","బడ్జెట్‌పై చర్చించే, ప్రశ్నలు అడిగే హక్కుతో శాసనసభలో ఎన్నికైన సభ్యులు","సార్వజనీన వయోజన ఓటుహక్కు","ప్రత్యేక రాజ్యాంగ పరిషత్తు"],"e":"1885లో కాంగ్రెస్ బడ్జెట్‌పై చర్చించే, ప్రశ్నలు అడిగే హక్కుతో శాసనసభలో ఎన్నికైన సభ్యులను డిమాండ్ చేసింది.","n":"భారత ప్రభుత్వ చట్టం 1909 కొంత ఎన్నికైన ప్రాతినిధ్యాన్ని అనుమతించింది."}},{"t":"MCQ","q":"Which Act allowed for some elected representation under British rule?","o":["Regulating Act 1773","Indian Independence Act 1947","Government of India Act 1909","Pitt’s India Act 1784"],"a":2,"e":"The Government of India Act 1909 allowed some elected representation, but did not allow all adults to vote.","n":"Early legislatures were a response to nationalist demands.","te":{"q":"బ్రిటిష్ పాలనలో కొంత ఎన్నికైన ప్రాతినిధ్యాన్ని అనుమతించిన చట్టం ఏది?","o":["రెగ్యులేటింగ్ చట్టం 1773","భారత స్వాతంత్ర్య చట్టం 1947","భారత ప్రభుత్వ చట్టం 1909","పిట్స్ ఇండియా చట్టం 1784"],"e":"భారత ప్రభుత్వ చట్టం 1909 కొంత ఎన్నికైన ప్రాతినిధ్యాన్ని అనుమతించింది, కానీ వయోజనులందరికీ ఓటుహక్కు ఇవ్వలేదు.","n":"తొలి శాసనసభలు జాతీయవాదుల డిమాండ్లకు ప్రతిస్పందనగా వచ్చాయి."}},{"t":"MCQ","q":"‘Universal adult franchise’ means —","o":["Only educated adults can vote","Only taxpayers can vote","Only men can vote","All adult citizens of the country have the right to vote"],"a":3,"e":"The Constitution laid down the principle of universal adult franchise: all adult citizens have the right to vote.","n":"These days a government cannot call itself democratic without it.","te":{"q":"‘సార్వజనీన వయోజన ఓటుహక్కు’ అంటే —","o":["విద్యావంతులైన వయోజనులు మాత్రమే ఓటు వేయగలరు","పన్ను చెల్లించేవారు మాత్రమే ఓటు వేయగలరు","పురుషులు మాత్రమే ఓటు వేయగలరు","దేశంలోని వయోజన పౌరులందరికీ ఓటుహక్కు ఉంది"],"e":"రాజ్యాంగం సార్వజనీన వయోజన ఓటుహక్కు సూత్రాన్ని నిర్దేశించింది: వయోజన పౌరులందరికీ ఓటుహక్కు ఉంది.","n":"నేడు ఇది లేకుండా ఏ ప్రభుత్వమూ తనను ప్రజాస్వామ్యం అని చెప్పుకోలేదు."}},{"t":"MCQ","q":"EVMs were used throughout the country for the first time in the general elections of —","o":["1999","2004","2009","2014"],"a":1,"e":"EVMs were used throughout the country for the first time in the 2004 general elections.","n":"This saved around 1,50,000 trees and about 8,000 tons of paper.","te":{"q":"దేశవ్యాప్తంగా మొదటిసారి EVMలు (ఎలక్ట్రానిక్ ఓటింగ్ యంత్రాలు) వాడిన సార్వత్రిక ఎన్నికలు —","o":["1999","2004","2009","2014"],"e":"2004 సార్వత్రిక ఎన్నికల్లో మొదటిసారి దేశవ్యాప్తంగా EVMలు వాడారు.","n":"దీంతో సుమారు 1,50,000 చెట్లు, సుమారు 8,000 టన్నుల కాగితం ఆదా అయ్యాయి."}},{"t":"MCQ","q":"The use of EVMs in 2004 saved around how many trees?","o":["1,50,000","15,000","8,000","15,00,000"],"a":0,"e":"The use of EVMs saved around 1,50,000 trees that would have been cut to produce about 8,000 tons of paper for ballot papers.","n":"Photo caption, Chapter 3.","te":{"q":"2004లో EVMల వినియోగం సుమారు ఎన్ని చెట్లను కాపాడింది?","o":["1,50,000","15,000","8,000","15,00,000"],"e":"బ్యాలెట్ పత్రాల ముద్రణకు సుమారు 8,000 టన్నుల కాగితం తయారీకి నరకవలసిన సుమారు 1,50,000 చెట్లను EVMలు కాపాడాయి.","n":"ఫోటో వ్యాఖ్య, అధ్యాయం 3."}},{"t":"MCQ","q":"The take-off point for a democracy is the idea of —","o":["Coercion","Consent","Coalition","Sedition"],"a":1,"e":"The take-off point for a democracy is consent, i.e. the desire, approval and participation of people.","n":"The individual citizen is the most important person in a democracy.","te":{"q":"ప్రజాస్వామ్యానికి ప్రారంభ బిందువు —","o":["బలవంతం","సమ్మతి","సంకీర్ణం","రాజద్రోహం"],"e":"ప్రజాస్వామ్యానికి ప్రారంభ బిందువు సమ్మతి — అంటే ప్రజల కోరిక, ఆమోదం, భాగస్వామ్యం.","n":"ప్రజాస్వామ్యంలో వ్యక్తి లేదా పౌరుడే అత్యంత ముఖ్యమైన వ్యక్తి."}},{"t":"MCQ","q":"The Rajya Sabha (Council of States) is chaired by —","o":["The President","The Speaker","The Vice-President of India","The Prime Minister"],"a":2,"e":"Rajya Sabha, with a total strength of 250 members, is chaired by the Vice-President of India.","n":"Lok Sabha (543 members) is presided over by the Speaker.","te":{"q":"రాజ్యసభ (రాష్ట్రాల మండలి)కి అధ్యక్షత వహించేది —","o":["రాష్ట్రపతి","స్పీకర్","భారత ఉపరాష్ట్రపతి","ప్రధానమంత్రి"],"e":"మొత్తం 250 మంది సభ్యులు గల రాజ్యసభకు భారత ఉపరాష్ట్రపతి అధ్యక్షత వహిస్తారు.","n":"లోక్‌సభ (543 మంది సభ్యులు)కు స్పీకర్ అధ్యక్షత వహిస్తారు."}},{"t":"MCQ","q":"The Lok Sabha (House of the People) is presided over by —","o":["The Speaker","The Vice-President","The President","The Chief Justice"],"a":0,"e":"Lok Sabha, with a total membership of 543, is presided over by the Speaker.","n":"The Lok Sabha is usually elected once every five years.","te":{"q":"లోక్‌సభ (ప్రజల సభ)కు అధ్యక్షత వహించేది —","o":["స్పీకర్","ఉపరాష్ట్రపతి","రాష్ట్రపతి","ప్రధాన న్యాయమూర్తి"],"e":"మొత్తం 543 మంది సభ్యులు గల లోక్‌సభకు స్పీకర్ అధ్యక్షత వహిస్తారు.","n":"లోక్‌సభ సాధారణంగా ఐదేళ్లకొకసారి ఎన్నికవుతుంది."}},{"t":"Statements","q":"Consider the following statements about the Parliament of India:\nI. Parliament consists of the President, the Rajya Sabha and the Lok Sabha.\nII. It is the supreme law-making institution of the country.","o":["I only","II only","Both I and II","Neither I nor II"],"a":2,"e":"Both are correct as per the textbook.","n":"Parliament (Sansad) has two Houses.","te":{"q":"భారత పార్లమెంటు గురించి కింది వాక్యాలను పరిశీలించండి:\nI. పార్లమెంటులో రాష్ట్రపతి, రాజ్యసభ, లోక్‌సభ ఉంటాయి.\nII. అది దేశంలో అత్యున్నత శాసన నిర్మాణ సంస్థ.","o":["I మాత్రమే","II మాత్రమే","I మరియు II రెండూ","I, II రెండూ కావు"],"e":"పాఠ్యపుస్తకం ప్రకారం రెండూ సరైనవి.","n":"పార్లమెంటు (సంసద్)కు రెండు సభలు ఉన్నాయి."}},{"t":"MCQ","q":"To have a majority in the Lok Sabha of 543 elected members, a party should have at least —","o":["250 members","272 members","300 members","543 members"],"a":1,"e":"For a majority, a party should have at least half, i.e. 272 members or more.","n":"The Opposition is formed by parties not part of the majority party/coalition.","te":{"q":"543 మంది ఎన్నికైన సభ్యులు గల లోక్‌సభలో మెజారిటీ పొందడానికి ఒక పార్టీకి కనీసం ఎంత మంది సభ్యులు ఉండాలి?","o":["250","272","300","543"],"e":"మెజారిటీ కోసం ఒక పార్టీకి కనీసం సగం, అంటే 272 లేదా అంతకంటే ఎక్కువ సభ్యులు ఉండాలి.","n":"మెజారిటీ పార్టీ/సంకీర్ణంలో భాగం కాని పార్టీలన్నీ ప్రతిపక్షం."}},{"t":"MCQ","q":"A temporary alliance of political parties formed after elections when no party has a clear majority is called a —","o":["Opposition","Cabinet","Constituency","Coalition"],"a":3,"e":"Glossary: Coalition — a temporary alliance of groups or parties formed when no party has adequate seats for a clear majority.","n":"Example: UPA formed after the 2009 elections.","te":{"q":"ఎన్నికల తర్వాత ఏ పార్టీకీ స్పష్టమైన మెజారిటీ రానప్పుడు రాజకీయ పార్టీలు ఏర్పరచుకునే తాత్కాలిక కూటమిని ఏమంటారు?","o":["ప్రతిపక్షం","మంత్రివర్గం","నియోజకవర్గం","సంకీర్ణం"],"e":"పదకోశం: సంకీర్ణం — స్పష్టమైన మెజారిటీకి సరిపడా స్థానాలు ఏ పార్టీకీ రానప్పుడు ఏర్పడే పార్టీల తాత్కాలిక కూటమి.","n":"ఉదాహరణ: 2009 ఎన్నికల తర్వాత ఏర్పడిన UPA."}},{"t":"MCQ","q":"After the 15th Lok Sabha elections (2009), the INC formed which coalition?","o":["NDA","United Progressive Alliance (UPA)","United Front","Janata Front"],"a":1,"e":"The INC (206 seats) did not have a majority on its own, so it formed the UPA with its allies.","n":"Coalition governments have become common in the recent past.","te":{"q":"15వ లోక్‌సభ ఎన్నికల (2009) తర్వాత కాంగ్రెస్ ఏర్పరచిన సంకీర్ణం —","o":["NDA","యునైటెడ్ ప్రోగ్రెసివ్ అలయన్స్ (UPA)","యునైటెడ్ ఫ్రంట్","జనతా ఫ్రంట్"],"e":"కాంగ్రెస్‌కు (206 స్థానాలు) సొంతంగా మెజారిటీ లేనందున మిత్రపక్షాలతో కలిసి UPA ఏర్పరచింది.","n":"ఇటీవలి కాలంలో సంకీర్ణ ప్రభుత్వాలు సాధారణమయ్యాయి."}},{"t":"MCQ","q":"According to the textbook table, how many seats did the BJP win in the 17th Lok Sabha elections (May 2019)?","o":["206","303","272","352"],"a":1,"e":"The 2019 results table shows BJP 303, INC 52, DMK 24, AITC 22, YSRCP 22 out of 543.","n":"The party with a majority forms the government.","te":{"q":"పాఠ్యపుస్తక పట్టిక ప్రకారం 17వ లోక్‌సభ ఎన్నికల్లో (మే 2019) BJP గెలిచిన స్థానాలు —","o":["206","303","272","352"],"e":"2019 ఫలితాల పట్టిక: 543 స్థానాల్లో BJP 303, INC 52, DMK 24, AITC 22, YSRCP 22.","n":"మెజారిటీ ఉన్న పార్టీ ప్రభుత్వాన్ని ఏర్పాటు చేస్తుంది."}},{"t":"MCQ","q":"In the 2019 Lok Sabha results table, which party from Andhra Pradesh won 22 seats?","o":["Telugu Desam Party","Telangana Rashtra Samithi","Jana Sena","Yuvajana Sramika Rythu Congress Party (YSRCP)"],"a":3,"e":"YSRCP won 22 seats, equal to AITC; TDP won 3.","n":"Source: www.eci.nic.in.","te":{"q":"2019 లోక్‌సభ ఫలితాల పట్టికలో 22 స్థానాలు గెలిచిన ఆంధ్రప్రదేశ్ పార్టీ ఏది?","o":["తెలుగుదేశం పార్టీ","తెలంగాణ రాష్ట్ర సమితి","జనసేన","యువజన శ్రామిక రైతు కాంగ్రెస్ పార్టీ (YSRCP)"],"e":"YSRCP 22 స్థానాలు గెలిచింది (AITCతో సమానం); TDP 3 స్థానాలు గెలిచింది.","n":"ఆధారం: www.eci.nic.in."}},{"t":"MCQ","q":"The Prime Minister of India is —","o":["Elected by the Rajya Sabha","Appointed by the Chief Justice","The senior-most MP","The leader of the ruling party in the Lok Sabha"],"a":3,"e":"‘The Prime Minister of India is the leader of the ruling party in the Lok Sabha.’ The PM selects ministers from MPs of the party.","n":"Ministers take charge of areas like health, education and finance.","te":{"q":"భారత ప్రధానమంత్రి —","o":["రాజ్యసభ ద్వారా ఎన్నికవుతారు","ప్రధాన న్యాయమూర్తి నియమిస్తారు","అత్యంత సీనియర్ ఎంపీ","లోక్‌సభలో అధికార పార్టీ నాయకుడు"],"e":"‘భారత ప్రధానమంత్రి లోక్‌సభలో అధికార పార్టీ నాయకుడు.’ ప్రధానమంత్రి తన పార్టీ ఎంపీల నుండి మంత్రులను ఎంపిక చేస్తారు.","n":"మంత్రులు ఆరోగ్యం, విద్య, ఆర్థికం వంటి శాఖల బాధ్యతలు చేపడతారు."}},{"t":"MCQ","q":"One of the most important functions of the Lok Sabha is to —","o":["Select the executive","Appoint judges","Elect the President alone","Conduct elections"],"a":0,"e":"One of the most important functions of the Lok Sabha is to select the executive, the group that implements laws made by Parliament.","n":"The executive is often what we mean by ‘government’.","te":{"q":"లోక్‌సభ అతి ముఖ్యమైన విధుల్లో ఒకటి —","o":["కార్యనిర్వాహక వర్గాన్ని ఎంపిక చేయడం","న్యాయమూర్తులను నియమించడం","రాష్ట్రపతిని ఒంటరిగా ఎన్నుకోవడం","ఎన్నికలు నిర్వహించడం"],"e":"పార్లమెంటు చేసిన చట్టాలను అమలు చేసే కార్యనిర్వాహక వర్గాన్ని ఎంపిక చేయడం లోక్‌సభ అతి ముఖ్యమైన విధుల్లో ఒకటి.","n":"‘ప్రభుత్వం’ అంటే మనం సాధారణంగా ఉద్దేశించేది కార్యనిర్వాహక వర్గాన్నే."}},{"t":"Match","q":"Match the building/office (List-I) with what it houses (List-II):\n(a) South Block   —   (i) Ministry of Finance and Ministry of Home Affairs\n(b) North Block   —   (ii) PMO, Ministry of Defence and Ministry of External Affairs","o":["a-i, b-ii","a-ii, b-ii","a-i, b-i","a-ii, b-i"],"a":3,"e":"South Block houses the PMO, Defence and External Affairs; North Block houses Finance and Home Affairs. Both were built in the 1930s.","n":"Other ministries are in various buildings in New Delhi.","te":{"q":"భవనాన్ని (జాబితా-I) అందులో ఉన్న కార్యాలయాలతో (జాబితా-II) జతపరచండి:\n(a) సౌత్ బ్లాక్   —   (i) ఆర్థిక మంత్రిత్వ శాఖ, హోం మంత్రిత్వ శాఖ\n(b) నార్త్ బ్లాక్   —   (ii) ప్రధానమంత్రి కార్యాలయం, రక్షణ మంత్రిత్వ శాఖ, విదేశాంగ మంత్రిత్వ శాఖ","o":["a-i, b-ii","a-ii, b-ii","a-i, b-i","a-ii, b-i"],"e":"సౌత్ బ్లాక్‌లో PMO, రక్షణ, విదేశాంగ శాఖలు; నార్త్ బ్లాక్‌లో ఆర్థిక, హోం శాఖలు ఉన్నాయి. రెండూ 1930లలో నిర్మించబడ్డాయి.","n":"ఇతర మంత్రిత్వ శాఖలు న్యూఢిల్లీలోని వివిధ భవనాల్లో ఉన్నాయి."}},{"t":"Statements","q":"Consider the following about the Rajya Sabha:\nI. It functions primarily as the representative of the states of India in Parliament.\nII. Its members are elected by the elected members of the Legislative Assemblies of the states.","o":["I only","II only","Both I and II","Neither I nor II"],"a":2,"e":"Both are correct. It has 233 elected members plus 12 nominated by the President.","n":"A bill must pass the Rajya Sabha too to become law.","te":{"q":"రాజ్యసభ గురించి కింది వాక్యాలను పరిశీలించండి:\nI. ఇది పార్లమెంటులో ప్రధానంగా భారత రాష్ట్రాల ప్రతినిధిగా పనిచేస్తుంది.\nII. దీని సభ్యులను రాష్ట్రాల శాసనసభల ఎన్నికైన సభ్యులు ఎన్నుకుంటారు.","o":["I మాత్రమే","II మాత్రమే","I మరియు II రెండూ","I, II రెండూ కావు"],"e":"రెండూ సరైనవి. ఇందులో 233 మంది ఎన్నికైన సభ్యులు, రాష్ట్రపతి నామినేట్ చేసిన 12 మంది ఉంటారు.","n":"చట్టం కావాలంటే బిల్లు రాజ్యసభలో కూడా ఆమోదం పొందాలి."}},{"t":"MCQ","q":"How many members of the Rajya Sabha are nominated by the President?","o":["2","233","250","12"],"a":3,"e":"There are 233 elected members plus 12 members nominated by the President.","n":"Total strength: 250.","te":{"q":"రాజ్యసభకు రాష్ట్రపతి ఎంత మంది సభ్యులను నామినేట్ చేస్తారు?","o":["2","233","250","12"],"e":"233 మంది ఎన్నికైన సభ్యులు, రాష్ట్రపతి నామినేట్ చేసిన 12 మంది సభ్యులు ఉంటారు.","n":"మొత్తం బలం: 250."}},{"t":"MCQ","q":"The Parliament, while in session, begins with —","o":["Zero hour","Question hour","Budget speech","Oath taking"],"a":1,"e":"The Parliament begins with a question hour, an important mechanism through which MPs elicit information about the working of the government.","n":"It is a very important way for Parliament to control the executive.","te":{"q":"సమావేశాల సమయంలో పార్లమెంటు దేనితో ప్రారంభమవుతుంది?","o":["జీరో అవర్","ప్రశ్నోత్తరాల సమయం","బడ్జెట్ ప్రసంగం","ప్రమాణ స్వీకారం"],"e":"పార్లమెంటు ప్రశ్నోత్తరాల సమయంతో ప్రారంభమవుతుంది; ప్రభుత్వ పనితీరు గురించి ఎంపీలు సమాచారం పొందడానికి ఇది ముఖ్యమైన యంత్రాంగం.","n":"కార్యనిర్వాహక వర్గాన్ని పార్లమెంటు నియంత్రించే ముఖ్య మార్గం ఇది."}},{"t":"Assertion–Reason","q":"Assertion (A): The Opposition parties play a critical role in the healthy functioning of a democracy.\nReason (R): They highlight drawbacks in government policies and mobilise popular support for their own policies.","o":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, but R is false","A is false, but R is true"],"a":0,"e":"The textbook explains the Opposition’s role exactly this way. R explains A.","n":"The largest of the opposition parties is called the Opposition party.","te":{"q":"నిశ్చితవాక్యం (A): ప్రజాస్వామ్యం ఆరోగ్యంగా పనిచేయడంలో ప్రతిపక్ష పార్టీలు కీలక పాత్ర పోషిస్తాయి.\nకారణం (R): అవి ప్రభుత్వ విధానాల్లోని లోపాలను ఎత్తిచూపి, తమ విధానాలకు ప్రజా మద్దతు కూడగడతాయి.","o":["A మరియు R రెండూ సరైనవి, R అనేది A కు సరైన వివరణ","A మరియు R రెండూ సరైనవి, కానీ R అనేది A కు సరైన వివరణ కాదు","A సరైనది, కానీ R తప్పు","A తప్పు, కానీ R సరైనది"],"e":"పాఠ్యపుస్తకం ప్రతిపక్ష పాత్రను సరిగ్గా ఇలాగే వివరిస్తుంది. R అనేది A ను వివరిస్తుంది.","n":"ప్రతిపక్ష పార్టీల్లో అతి పెద్దదానిని ప్రతిపక్ష పార్టీ అంటారు."}},{"t":"MCQ","q":"The Lok Sabha Unstarred Question No. 48 (15.12.2017) quoted in the textbook was about —","o":["Railways","Convergence of schemes for children","Defence purchases","Farm loans"],"a":1,"e":"It asked the Minister of Women and Child Development about converging schemes and policies for children; the answer referred to the National Plan of Action for Children 2016.","n":"The plan has four priority areas: survival/health/nutrition, education, protection, participation.","te":{"q":"పాఠ్యపుస్తకంలో ఉదహరించిన లోక్‌సభ నక్షత్ర రహిత ప్రశ్న సంఖ్య 48 (15.12.2017) దేని గురించి?","o":["రైల్వేలు","పిల్లల పథకాల సమన్వయం (కన్వర్జెన్స్)","రక్షణ కొనుగోళ్లు","వ్యవసాయ రుణాలు"],"e":"పిల్లల పథకాలు, విధానాల సమన్వయం గురించి మహిళా, శిశు అభివృద్ధి మంత్రిని అడిగారు; సమాధానం జాతీయ బాలల కార్యాచరణ ప్రణాళిక 2016 గురించి చెప్పింది.","n":"ప్రణాళికలో నాలుగు ప్రాధాన్య రంగాలు: మనుగడ/ఆరోగ్యం/పోషణ, విద్య, రక్షణ, భాగస్వామ్యం."}},{"t":"MCQ","q":"Domestic violence generally refers to injury or harm, or threat of it, caused usually by —","o":["A stranger","The police","Children","An adult male, usually the husband, against his wife"],"a":3,"e":"The textbook defines it as harm caused by an adult male, usually the husband, against his wife — physical, emotional, verbal, sexual or economic abuse.","n":"The 2005 Act extends ‘domestic’ to all women who live or have lived in a shared household.","te":{"q":"గృహహింస అంటే సాధారణంగా ఎవరు కలిగించే గాయం లేదా హాని, లేదా దాని బెదిరింపు?","o":["ఒక అపరిచితుడు","పోలీసులు","పిల్లలు","ఒక వయోజన పురుషుడు, సాధారణంగా భర్త, తన భార్యపై"],"e":"సాధారణంగా భర్త అయిన వయోజన పురుషుడు భార్యపై కలిగించే హానిగా పాఠ్యపుస్తకం నిర్వచిస్తుంది — శారీరక, భావోద్వేగ, మాటల, లైంగిక లేదా ఆర్థిక వేధింపు.","n":"2005 చట్టం ‘గృహ’ పరిధిని ఉమ్మడి ఇంట్లో నివసిస్తున్న లేదా నివసించిన మహిళలందరికీ విస్తరిస్తుంది."}},{"t":"MCQ","q":"Who took the lead in drafting the Domestic Violence (Prevention and Protection) Bill in 1999?","o":["Lawyers Collective","National Commission for Women","Parliamentary Standing Committee","Supreme Court"],"a":0,"e":"In 1999 Lawyers Collective, a group of lawyers, law students and activists, drafted the bill after nation-wide consultations.","n":"The draft bill was widely circulated.","te":{"q":"1999లో గృహహింస (నివారణ, రక్షణ) బిల్లు ముసాయిదా తయారీలో ముందుండినది ఎవరు?","o":["లాయర్స్ కలెక్టివ్","జాతీయ మహిళా కమిషన్","పార్లమెంటరీ స్థాయీ సంఘం","సుప్రీం కోర్టు"],"e":"1999లో న్యాయవాదులు, న్యాయ విద్యార్థులు, కార్యకర్తల బృందమైన లాయర్స్ కలెక్టివ్ దేశవ్యాప్త సంప్రదింపుల తర్వాత బిల్లు ముసాయిదా తయారు చేసింది.","n":"ముసాయిదా బిల్లును విస్తృతంగా పంపిణీ చేశారు."}},{"t":"Chronology","q":"Arrange the steps in the making of the Domestic Violence law in chronological order:\n1. Lawyers Collective drafts the bill\n2. The law comes into effect\n3. Bill introduced in Parliament\n4. A new bill is reintroduced in Parliament","o":["3, 1, 4, 2","1, 4, 3, 2","1, 3, 4, 2","1, 3, 2, 4"],"a":2,"e":"Drafted by Lawyers Collective (1999) → introduced (2002) → reintroduced (2005) → came into effect (2006).","n":"Standing Committee submitted recommendations in December 2002.","te":{"q":"గృహహింస చట్టం రూపకల్పనలోని దశలను కాలక్రమంలో అమర్చండి:\n1. లాయర్స్ కలెక్టివ్ బిల్లు ముసాయిదా తయారీ\n2. చట్టం అమల్లోకి రావడం\n3. పార్లమెంటులో బిల్లు ప్రవేశపెట్టడం\n4. పార్లమెంటులో కొత్త బిల్లు తిరిగి ప్రవేశపెట్టడం","o":["3, 1, 4, 2","1, 4, 3, 2","1, 3, 4, 2","1, 3, 2, 4"],"e":"లాయర్స్ కలెక్టివ్ ముసాయిదా (1999) → ప్రవేశపెట్టడం (2002) → తిరిగి ప్రవేశపెట్టడం (2005) → అమల్లోకి (2006).","n":"స్థాయీ సంఘం డిసెంబరు 2002లో సిఫార్సులు సమర్పించింది."}},{"t":"MCQ","q":"The Protection of Women from Domestic Violence Act came into effect in —","o":["2002","2005","2006","2009"],"a":2,"e":"After passing both Houses and receiving the President’s assent, the Act came into effect in 2006.","n":"It is a civil law and the first to recognise a woman’s right to a violence-free home.","te":{"q":"గృహహింస నుండి మహిళల రక్షణ చట్టం అమల్లోకి వచ్చిన సంవత్సరం —","o":["2002","2005","2006","2009"],"e":"రెండు సభల ఆమోదం, రాష్ట్రపతి సమ్మతి తర్వాత ఈ చట్టం 2006లో అమల్లోకి వచ్చింది.","n":"ఇది ఒక పౌర చట్టం; హింస లేని ఇంటిపై మహిళ హక్కును గుర్తించిన మొదటి చట్టం."}},{"t":"Statements","q":"The Protection of Women from Domestic Violence Act recognises:\nI. The right of women to live in a shared household.\nII. That women can get a protection order and monetary relief, including medical costs.","o":["I only","II only","Both I and II","Neither I nor II"],"a":2,"e":"Both are recognised by the law, as given in the storyboard.","n":"It is more accurate to call women who face violence ‘survivors’ rather than victims.","te":{"q":"గృహహింస నుండి మహిళల రక్షణ చట్టం గుర్తించేవి:\nI. ఉమ్మడి ఇంట్లో నివసించే మహిళల హక్కు.\nII. మహిళలు రక్షణ ఉత్తర్వు, వైద్య ఖర్చులతో సహా ఆర్థిక ఉపశమనం పొందవచ్చు.","o":["I మాత్రమే","II మాత్రమే","I మరియు II రెండూ","I, II రెండూ కావు"],"e":"కథాచిత్రంలో చెప్పినట్లు రెండూ చట్టం గుర్తించింది.","n":"హింసను ఎదుర్కొనే మహిళలను బాధితులు అనడం కంటే ‘మనుగడ సాగించినవారు’ అనడం సరైనది."}},{"t":"MCQ","q":"Under municipal laws, hawking and street vending are often made illegal. Such a law may be controversial because —","o":["It favours one group and disregards the livelihood of hawkers who provide cheap services","Hawkers pay no taxes","Hawkers are always criminals","Pavements are private"],"a":0,"e":"If a law favours one group and disregards another it becomes controversial. People can approach the court, which can modify or cancel laws not adhering to the Constitution.","n":"Citizens can protest unpopular laws in a democracy.","te":{"q":"మున్సిపల్ చట్టాలు తరచూ వీధి వ్యాపారాన్ని చట్టవిరుద్ధం చేస్తాయి. అలాంటి చట్టం వివాదాస్పదం కావడానికి కారణం —","o":["అది ఒక వర్గానికి అనుకూలంగా ఉంటూ, చౌకగా సేవలందించే వీధి వ్యాపారుల జీవనోపాధిని విస్మరిస్తుంది","వీధి వ్యాపారులు పన్నులు చెల్లించరు","వీధి వ్యాపారులు ఎప్పుడూ నేరస్థులు","పాదచారి మార్గాలు ప్రైవేట్ ఆస్తి"],"e":"చట్టం ఒక వర్గానికి అనుకూలంగా ఉంటూ మరో వర్గాన్ని విస్మరిస్తే వివాదాస్పదమవుతుంది. ప్రజలు న్యాయస్థానాన్ని ఆశ్రయించవచ్చు; రాజ్యాంగానికి అనుగుణంగా లేని చట్టాలను న్యాయస్థానం సవరించగలదు లేదా రద్దు చేయగలదు.","n":"ప్రజాస్వామ్యంలో పౌరులు జనాదరణ లేని చట్టాలను నిరసించవచ్చు."}},{"t":"MCQ","q":"Rosa Parks refused to give up her seat on a bus to a white man on —","o":["1 December 1955","4 July 1964","15 August 1947","26 January 1950"],"a":0,"e":"Rosa Parks, an African-American woman, refused on 1 December 1955, marking the start of the Civil Rights Movement.","n":"It led to the Civil Rights Act of 1964 in the USA.","te":{"q":"రోసా పార్క్స్ ఒక శ్వేతజాతీయుడికి బస్సులో తన సీటు ఇవ్వడానికి నిరాకరించిన తేదీ —","o":["1 డిసెంబరు 1955","4 జూలై 1964","15 ఆగస్టు 1947","26 జనవరి 1950"],"e":"ఆఫ్రికన్-అమెరికన్ మహిళ రోసా పార్క్స్ 1955 డిసెంబరు 1న నిరాకరించడం పౌర హక్కుల ఉద్యమానికి నాంది పలికింది.","n":"ఇది అమెరికాలో 1964 పౌర హక్కుల చట్టానికి దారితీసింది."}},{"t":"MCQ","q":"Under the Sedition Act of 1870, the nationalists considered the law arbitrary because —","o":["It gave everyone the right to vote","It reduced taxes","Persons were arrested for unclear reasons and often kept in jail without trial","It created courts"],"a":2,"e":"Glossary: the British had a broad interpretation of sedition and could arrest and detain anyone; those arrested were often jailed without trial.","n":"Repressive laws prevent people from exercising rights like speech and assembly.","te":{"q":"1870 రాజద్రోహ చట్టాన్ని జాతీయవాదులు ఏకపక్షమని భావించడానికి కారణం —","o":["అది అందరికీ ఓటుహక్కు ఇచ్చింది","అది పన్నులు తగ్గించింది","అస్పష్ట కారణాలతో ప్రజలను అరెస్టు చేసి తరచూ విచారణ లేకుండా జైలులో ఉంచారు","అది న్యాయస్థానాలను సృష్టించింది"],"e":"పదకోశం: బ్రిటిష్ వారు రాజద్రోహానికి విస్తృత అర్థం ఇచ్చి ఎవరినైనా అరెస్టు చేసి నిర్బంధించగలిగారు; అరెస్టయినవారిని తరచూ విచారణ లేకుండా జైలులో ఉంచారు.","n":"అణచివేత చట్టాలు ప్రజలు వాక్ స్వాతంత్ర్యం, సమావేశ హక్కుల వంటివి వినియోగించకుండా అడ్డుకుంటాయి."}}]},{"id":"civ4","subject":"Civics","unit":"Social and Political Life","no":4,"title":"Judiciary","te":{"subject":"పౌరశాస్త్రం","unit":"సామాజిక మరియు రాజకీయ జీవనం","title":"న్యాయవ్యవస్థ"},"questions":[{"t":"MCQ","q":"Laws apply equally to all persons and a fixed set of procedures must be followed when a law is violated. This is called —","o":["Judicial review","Separation of powers","Federalism","Rule of law"],"a":3,"e":"‘In India we have the rule of law… laws apply equally to all persons.’ The judicial system enforces it.","n":"The judiciary can play its role only because it is independent.","te":{"q":"చట్టాలు అందరికీ సమానంగా వర్తిస్తాయి, చట్టం ఉల్లంఘించినప్పుడు నిర్దిష్ట విధానాలు పాటించాలి. దీనిని ఏమంటారు?","o":["న్యాయ సమీక్ష","అధికార విభజన","సమాఖ్య విధానం","చట్టబద్ధ పాలన (రూల్ ఆఫ్ లా)"],"e":"‘భారతదేశంలో చట్టబద్ధ పాలన ఉంది… చట్టాలు అందరికీ సమానంగా వర్తిస్తాయి.’ న్యాయవ్యవస్థ దీనిని అమలు చేస్తుంది.","n":"న్యాయవ్యవస్థ స్వతంత్రంగా ఉండటం వల్లే తన పాత్ర పోషించగలదు."}},{"t":"Match","q":"Match the role of the judiciary (List-I) with its description (List-II):\n(a) Dispute resolution   —   (i) Citizens can approach SC or HC if their Fundamental Rights are violated\n(b) Judicial review   —   (ii) Resolving disputes between citizens, governments and states\n(c) Upholding the law and enforcing Fundamental Rights   —   (iii) Striking down laws that violate the basic structure of the Constitution","o":["a-i, b-ii, c-iii","a-iii, b-i, c-ii","a-ii, b-iii, c-i","a-ii, b-i, c-iii"],"a":2,"e":"Dispute resolution → disputes between citizens, citizens and government, states, and centre and states; Judicial review → striking down laws; Upholding law → enforcing Fundamental Rights.","n":"These are the three broad areas of the judiciary’s work.","te":{"q":"న్యాయవ్యవస్థ పాత్రను (జాబితా-I) దాని వివరణతో (జాబితా-II) జతపరచండి:\n(a) వివాద పరిష్కారం   —   (i) ప్రాథమిక హక్కులు ఉల్లంఘించబడితే పౌరులు సుప్రీం కోర్టు లేదా హైకోర్టును ఆశ్రయించవచ్చు\n(b) న్యాయ సమీక్ష   —   (ii) పౌరులు, ప్రభుత్వాలు, రాష్ట్రాల మధ్య వివాదాల పరిష్కారం\n(c) చట్టాన్ని కాపాడటం, ప్రాథమిక హక్కులను అమలు చేయడం   —   (iii) రాజ్యాంగ మౌలిక నిర్మాణాన్ని ఉల్లంఘించే చట్టాలను కొట్టివేయడం","o":["a-i, b-ii, c-iii","a-iii, b-i, c-ii","a-ii, b-iii, c-i","a-ii, b-i, c-iii"],"e":"వివాద పరిష్కారం → పౌరుల మధ్య, పౌరులు-ప్రభుత్వం మధ్య, రాష్ట్రాల మధ్య, కేంద్రం-రాష్ట్రాల మధ్య వివాదాలు; న్యాయ సమీక్ష → చట్టాలను కొట్టివేయడం; చట్టాన్ని కాపాడటం → ప్రాథమిక హక్కుల అమలు.","n":"న్యాయవ్యవస్థ పని ఈ మూడు విస్తృత రంగాల్లో ఉంటుంది."}},{"t":"MCQ","q":"The power of the judiciary to strike down laws passed by Parliament that violate the basic structure of the Constitution is called —","o":["Judicial activism","Public Interest Litigation","Appellate jurisdiction","Judicial review"],"a":3,"e":"As the final interpreter of the Constitution, the judiciary can strike down such laws — this is judicial review.","n":"The Right to Constitutional Remedies connects to judicial review.","te":{"q":"రాజ్యాంగ మౌలిక నిర్మాణాన్ని ఉల్లంఘించే పార్లమెంటు చట్టాలను కొట్టివేసే న్యాయవ్యవస్థ అధికారాన్ని ఏమంటారు?","o":["న్యాయ క్రియాశీలత","ప్రజా ప్రయోజన వ్యాజ్యం","అప్పీలు అధికార పరిధి","న్యాయ సమీక్ష"],"e":"రాజ్యాంగానికి అంతిమ వ్యాఖ్యాతగా న్యాయవ్యవస్థ అలాంటి చట్టాలను కొట్టివేయగలదు — ఇదే న్యాయ సమీక్ష.","n":"రాజ్యాంగ పరిహారపు హక్కు న్యాయ సమీక్షతో ముడిపడి ఉంది."}},{"t":"MCQ","q":"The Supreme Court of India was established on —","o":["15 August 1947","26 November 1949","1 January 1958","26 January 1950"],"a":3,"e":"The Supreme Court was established on 26 January 1950, the day India became a Republic.","n":"It moved to its present building on Mathura Road, New Delhi, in 1958.","te":{"q":"భారత సుప్రీం కోర్టు స్థాపించబడిన తేదీ —","o":["15 ఆగస్టు 1947","26 నవంబరు 1949","1 జనవరి 1958","26 జనవరి 1950"],"e":"భారతదేశం గణతంత్రమైన రోజు, 1950 జనవరి 26న సుప్రీం కోర్టు స్థాపించబడింది.","n":"1958లో అది న్యూఢిల్లీ మధుర రోడ్డులోని ప్రస్తుత భవనానికి మారింది."}},{"t":"MCQ","q":"The predecessor of the Supreme Court of India was —","o":["The Privy Council","The Federal Court of India (1937–1949)","The Sadar Diwani Adalat","The Calcutta High Court"],"a":1,"e":"Like its predecessor, the Federal Court of India (1937–1949), the Supreme Court was earlier located in the Chamber of Princes in Parliament House.","n":"It moved to its present building in 1958.","te":{"q":"భారత సుప్రీం కోర్టుకు ముందున్న న్యాయస్థానం —","o":["ప్రివీ కౌన్సిల్","భారత ఫెడరల్ కోర్టు (1937–1949)","సదర్ దివానీ అదాలత్","కలకత్తా హైకోర్టు"],"e":"దానికి ముందున్న భారత ఫెడరల్ కోర్టు (1937–1949) లాగే సుప్రీం కోర్టు మొదట పార్లమెంటు భవనంలోని ఛాంబర్ ఆఫ్ ప్రిన్సెస్‌లో ఉండేది.","n":"1958లో ప్రస్తుత భవనానికి మారింది."}},{"t":"Assertion–Reason","q":"Assertion (A): The Indian Constitution provides for the independence of the judiciary.\nReason (R): If a politician could appoint and dismiss judges, the judge could not take an independent decision.","o":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, but R is false","A is false, but R is true"],"a":0,"e":"The textbook’s example of a politician controlling a judge shows why independence is necessary. R explains A.","n":"Legislature and executive cannot interfere in the work of the judiciary.","te":{"q":"నిశ్చితవాక్యం (A): భారత రాజ్యాంగం న్యాయవ్యవస్థ స్వాతంత్ర్యాన్ని కల్పిస్తుంది.\nకారణం (R): ఒక రాజకీయ నాయకుడు న్యాయమూర్తులను నియమించి తొలగించగలిగితే, న్యాయమూర్తి స్వతంత్ర నిర్ణయం తీసుకోలేడు.","o":["A మరియు R రెండూ సరైనవి, R అనేది A కు సరైన వివరణ","A మరియు R రెండూ సరైనవి, కానీ R అనేది A కు సరైన వివరణ కాదు","A సరైనది, కానీ R తప్పు","A తప్పు, కానీ R సరైనది"],"e":"న్యాయమూర్తిని నియంత్రించే రాజకీయ నాయకుడి ఉదాహరణ స్వాతంత్ర్యం ఎందుకు అవసరమో చూపిస్తుంది. R అనేది A ను వివరిస్తుంది.","n":"శాసన, కార్యనిర్వాహక వ్యవస్థలు న్యాయవ్యవస్థ పనిలో జోక్యం చేసుకోలేవు."}},{"t":"Statements","q":"Which of the following ensure the independence of the judiciary?\nI. Judges of High Courts and the Supreme Court are appointed with very little interference from other branches of government.\nII. Once appointed, it is very difficult to remove a judge.","o":["I only","II only","Both I and II","Neither I nor II"],"a":2,"e":"Both are given in the textbook as aspects of independence, along with separation of powers.","n":"Independence allows courts to check misuse of power by legislature and executive.","te":{"q":"కింది వాటిలో న్యాయవ్యవస్థ స్వాతంత్ర్యాన్ని నిర్ధారించేవి ఏవి?\nI. హైకోర్టు, సుప్రీం కోర్టు న్యాయమూర్తులను ఇతర ప్రభుత్వ శాఖల జోక్యం చాలా తక్కువగా ఉండేలా నియమిస్తారు.\nII. ఒకసారి నియమితులైన న్యాయమూర్తిని తొలగించడం చాలా కష్టం.","o":["I మాత్రమే","II మాత్రమే","I మరియు II రెండూ","I, II రెండూ కావు"],"e":"అధికార విభజనతో పాటు ఈ రెండూ స్వాతంత్ర్య అంశాలుగా పాఠ్యపుస్తకంలో ఉన్నాయి.","n":"స్వాతంత్ర్యం వల్ల న్యాయస్థానాలు శాసన, కార్యనిర్వాహక వ్యవస్థల అధికార దుర్వినియోగాన్ని నియంత్రించగలవు."}},{"t":"MCQ","q":"The structure of courts in India, from the lower to the highest level, resembles a —","o":["Circle","Pyramid","Ladder of equal steps","Triangle turned upside down"],"a":1,"e":"There are several courts at the lower level and only one at the apex, so the structure resembles a pyramid.","n":"Three levels: subordinate/district courts, High Courts, Supreme Court.","te":{"q":"భారతదేశంలో దిగువ నుండి అత్యున్నత స్థాయి వరకు న్యాయస్థానాల నిర్మాణం దేనిని పోలి ఉంటుంది?","o":["వృత్తం","పిరమిడ్","సమాన మెట్ల నిచ్చెన","తలకిందుల త్రిభుజం"],"e":"దిగువ స్థాయిలో అనేక న్యాయస్థానాలు, శిఖరాగ్రంలో ఒక్కటే ఉండటంతో నిర్మాణం పిరమిడ్‌ను పోలి ఉంటుంది.","n":"మూడు స్థాయిలు: అధీన/జిల్లా న్యాయస్థానాలు, హైకోర్టులు, సుప్రీం కోర్టు."}},{"t":"Chronology","q":"Arrange the courts from the LOWEST to the HIGHEST level:\n1. High Court\n2. Supreme Court\n3. District / Subordinate Court","o":["1, 3, 2","3, 2, 1","2, 1, 3","3, 1, 2"],"a":3,"e":"District (subordinate) courts → High Court (highest court of the state) → Supreme Court (apex).","n":"Decisions of the Supreme Court are binding on all other courts in India.","te":{"q":"న్యాయస్థానాలను దిగువ నుండి అత్యున్నత స్థాయికి అమర్చండి:\n1. హైకోర్టు\n2. సుప్రీం కోర్టు\n3. జిల్లా / అధీన న్యాయస్థానం","o":["1, 3, 2","3, 2, 1","2, 1, 3","3, 1, 2"],"e":"జిల్లా (అధీన) న్యాయస్థానాలు → హైకోర్టు (రాష్ట్ర అత్యున్నత న్యాయస్థానం) → సుప్రీం కోర్టు (శిఖరాగ్రం).","n":"సుప్రీం కోర్టు నిర్ణయాలు భారతదేశంలోని అన్ని న్యాయస్థానాలకు కట్టుబడి ఉంటాయి."}},{"t":"MCQ","q":"The Supreme Court is presided over by —","o":["The President of India","The Attorney General","The Chief Justice of India","The Law Minister"],"a":2,"e":"The Supreme Court, located in New Delhi, is presided over by the Chief Justice of India.","n":"Each district is presided over by a District Judge.","te":{"q":"సుప్రీం కోర్టుకు అధ్యక్షత వహించేది —","o":["భారత రాష్ట్రపతి","అటార్నీ జనరల్","భారత ప్రధాన న్యాయమూర్తి","న్యాయ శాఖ మంత్రి"],"e":"న్యూఢిల్లీలోని సుప్రీం కోర్టుకు భారత ప్రధాన న్యాయమూర్తి అధ్యక్షత వహిస్తారు.","n":"ప్రతి జిల్లాకు జిల్లా న్యాయమూర్తి అధ్యక్షత వహిస్తారు."}},{"t":"MCQ","q":"High Courts were first established in 1862 in the three Presidency cities of —","o":["Delhi, Agra and Lahore","Calcutta, Bombay and Madras","Patna, Allahabad and Lucknow","Hyderabad, Mysore and Madras"],"a":1,"e":"High Courts were first established in Calcutta, Bombay and Madras in 1862. The High Court of Delhi came up in 1966.","n":"Currently there are 25 High Courts.","te":{"q":"1862లో హైకోర్టులు మొదట ఏ మూడు ప్రెసిడెన్సీ నగరాల్లో స్థాపించబడ్డాయి?","o":["ఢిల్లీ, ఆగ్రా, లాహోర్","కలకత్తా, బొంబాయి, మద్రాసు","పాట్నా, అలహాబాద్, లక్నో","హైదరాబాద్, మైసూరు, మద్రాసు"],"e":"1862లో కలకత్తా, బొంబాయి, మద్రాసుల్లో మొదట హైకోర్టులు స్థాపించబడ్డాయి. ఢిల్లీ హైకోర్టు 1966లో వచ్చింది.","n":"ప్రస్తుతం 25 హైకోర్టులు ఉన్నాయి."}},{"t":"MCQ","q":"Andhra Pradesh and Telangana have had separate High Courts from —","o":["2 June 2014","26 January 2020","1 April 2010","1 January 2019"],"a":3,"e":"Andhra Pradesh (Amaravati) and Telangana (Hyderabad) have separate High Courts from 1 January 2019.","n":"Punjab and Haryana share a High Court at Chandigarh.","te":{"q":"ఆంధ్రప్రదేశ్, తెలంగాణలకు వేర్వేరు హైకోర్టులు ఏర్పడిన తేదీ —","o":["2 జూన్ 2014","26 జనవరి 2020","1 ఏప్రిల్ 2010","1 జనవరి 2019"],"e":"ఆంధ్రప్రదేశ్ (అమరావతి), తెలంగాణ (హైదరాబాద్)లకు 2019 జనవరి 1 నుండి వేర్వేరు హైకోర్టులు ఉన్నాయి.","n":"పంజాబ్, హర్యానాలకు చండీగఢ్‌లో ఉమ్మడి హైకోర్టు ఉంది."}},{"t":"MCQ","q":"Which four North-Eastern states have a common High Court at Guwahati?","o":["Assam, Nagaland, Mizoram and Arunachal Pradesh","Assam, Meghalaya, Tripura and Manipur","Sikkim, Assam, Nagaland and Manipur","Mizoram, Tripura, Meghalaya and Arunachal Pradesh"],"a":0,"e":"The textbook says Assam, Nagaland, Mizoram and Arunachal Pradesh share a common High Court at Guwahati.","n":"Some High Courts have benches elsewhere, e.g. Aizawl bench of the Gauhati High Court.","te":{"q":"గువాహటిలో ఉమ్మడి హైకోర్టు కలిగిన నాలుగు ఈశాన్య రాష్ట్రాలు —","o":["అస్సాం, నాగాలాండ్, మిజోరం, అరుణాచల్ ప్రదేశ్","అస్సాం, మేఘాలయ, త్రిపుర, మణిపూర్","సిక్కిం, అస్సాం, నాగాలాండ్, మణిపూర్","మిజోరం, త్రిపుర, మేఘాలయ, అరుణాచల్ ప్రదేశ్"],"e":"అస్సాం, నాగాలాండ్, మిజోరం, అరుణాచల్ ప్రదేశ్‌లకు గువాహటిలో ఉమ్మడి హైకోర్టు ఉందని పాఠ్యపుస్తకం చెబుతుంది.","n":"కొన్ని హైకోర్టులకు ఇతర చోట్ల బెంచీలు ఉన్నాయి, ఉదా. గువాహటి హైకోర్టు ఐజ్వాల్ బెంచ్."}},{"t":"MCQ","q":"‘Integrated judicial system’ means —","o":["Decisions made by higher courts are binding on lower courts","Each court is independent of others","Only the Supreme Court decides cases","Courts are part of the government"],"a":0,"e":"In India decisions of higher courts are binding on lower courts; a person can also appeal to a higher court — the appellate system.","n":"Example: State (Delhi Administration) vs Laxman Kumar (1985).","te":{"q":"‘సమీకృత న్యాయవ్యవస్థ’ అంటే —","o":["ఉన్నత న్యాయస్థానాల నిర్ణయాలు దిగువ న్యాయస్థానాలకు కట్టుబడి ఉంటాయి","ప్రతి న్యాయస్థానం ఇతరుల నుండి స్వతంత్రం","సుప్రీం కోర్టు మాత్రమే కేసులు నిర్ణయిస్తుంది","న్యాయస్థానాలు ప్రభుత్వంలో భాగం"],"e":"భారతదేశంలో ఉన్నత న్యాయస్థానాల నిర్ణయాలు దిగువ న్యాయస్థానాలకు కట్టుబడి ఉంటాయి; ఒక వ్యక్తి ఉన్నత న్యాయస్థానానికి అప్పీలు కూడా చేయవచ్చు — ఇదే అప్పీలు వ్యవస్థ.","n":"ఉదాహరణ: రాష్ట్రం (ఢిల్లీ పరిపాలన) vs లక్ష్మణ్ కుమార్ (1985)."}},{"t":"MCQ","q":"In the Sudha Goel case, the Trial Court —","o":["Convicted Laxman, his mother Shakuntala and brother-in-law Subash Chandra and sentenced them to death","Acquitted all the accused","Sent the case to the High Court","Convicted only Laxman"],"a":0,"e":"On the basis of evidence, the Trial Court convicted all three and sentenced them to death.","n":"In November 1983 the accused appealed to the High Court.","te":{"q":"సుధా గోయల్ కేసులో విచారణ న్యాయస్థానం (ట్రయల్ కోర్టు) —","o":["లక్ష్మణ్, అతని తల్లి శకుంతల, బావమరిది సుభాష్ చంద్రలను దోషులుగా తేల్చి మరణశిక్ష విధించింది","నిందితులందరినీ నిర్దోషులుగా విడుదల చేసింది","కేసును హైకోర్టుకు పంపింది","లక్ష్మణ్‌ను మాత్రమే దోషిగా తేల్చింది"],"e":"సాక్ష్యాధారాల ఆధారంగా విచారణ న్యాయస్థానం ముగ్గురినీ దోషులుగా తేల్చి మరణశిక్ష విధించింది.","n":"1983 నవంబరులో నిందితులు హైకోర్టుకు అప్పీలు చేశారు."}},{"t":"MCQ","q":"In the Sudha Goel case, the High Court —","o":["Confirmed the death sentence","Acquitted Laxman, Shakuntala and Subash Chandra, holding the death was accidental","Ordered a new investigation","Sentenced them to life imprisonment"],"a":1,"e":"The High Court decided Sudha had died due to an accidental fire from a kerosene stove and acquitted all three.","n":"Women’s groups protested and appealed through the Indian Federation of Women Lawyers.","te":{"q":"సుధా గోయల్ కేసులో హైకోర్టు —","o":["మరణశిక్షను ధ్రువీకరించింది","మరణం ప్రమాదవశాత్తు జరిగిందని తేల్చి లక్ష్మణ్, శకుంతల, సుభాష్ చంద్రలను నిర్దోషులుగా విడుదల చేసింది","కొత్త దర్యాప్తుకు ఆదేశించింది","వారికి యావజ్జీవ శిక్ష విధించింది"],"e":"కిరోసిన్ స్టవ్ వల్ల ప్రమాదవశాత్తు జరిగిన అగ్ని ప్రమాదంలో సుధ మరణించిందని హైకోర్టు నిర్ణయించి ముగ్గురినీ విడుదల చేసింది.","n":"మహిళా సంఘాలు నిరసించి ఇండియన్ ఫెడరేషన్ ఆఫ్ విమెన్ లాయర్స్ ద్వారా అప్పీలు చేశాయి."}},{"t":"MCQ","q":"In 1985, the Supreme Court in the Sudha Goel case —","o":["Acquitted all three accused","Confirmed the High Court verdict","Found Laxman and his mother guilty, acquitted Subash, and sentenced them to life imprisonment","Sentenced all three to death"],"a":2,"e":"The Supreme Court found Laxman and his mother guilty but acquitted the brother-in-law for lack of evidence, sending them to prison for life.","n":"This case illustrates the appellate system.","te":{"q":"1985లో సుధా గోయల్ కేసులో సుప్రీం కోర్టు —","o":["ముగ్గురు నిందితులనూ విడుదల చేసింది","హైకోర్టు తీర్పును ధ్రువీకరించింది","లక్ష్మణ్, అతని తల్లిని దోషులుగా తేల్చి, సుభాష్‌ను విడుదల చేసి, యావజ్జీవ శిక్ష విధించింది","ముగ్గురికీ మరణశిక్ష విధించింది"],"e":"సుప్రీం కోర్టు లక్ష్మణ్, అతని తల్లిని దోషులుగా తేల్చింది; తగిన సాక్ష్యం లేనందున బావమరిదిని విడుదల చేసి, వారికి యావజ్జీవ కారాగార శిక్ష విధించింది.","n":"ఈ కేసు అప్పీలు వ్యవస్థను వివరిస్తుంది."}},{"t":"MCQ","q":"The appeal against the High Court’s acquittal in the Sudha Goel case was filed in the Supreme Court through —","o":["The CBI","The National Commission for Women","The Indian Federation of Women Lawyers","The Delhi Police"],"a":2,"e":"Women’s groups held demonstrations and filed a separate appeal through the Indian Federation of Women Lawyers.","n":"In the 1980s women’s groups spoke out against ‘dowry deaths’.","te":{"q":"సుధా గోయల్ కేసులో హైకోర్టు విడుదల తీర్పుకు వ్యతిరేకంగా సుప్రీం కోర్టులో అప్పీలు ఎవరి ద్వారా దాఖలైంది?","o":["CBI","జాతీయ మహిళా కమిషన్","ఇండియన్ ఫెడరేషన్ ఆఫ్ విమెన్ లాయర్స్","ఢిల్లీ పోలీసులు"],"e":"మహిళా సంఘాలు ప్రదర్శనలు చేసి ఇండియన్ ఫెడరేషన్ ఆఫ్ విమెన్ లాయర్స్ ద్వారా ప్రత్యేక అప్పీలు దాఖలు చేశాయి.","n":"1980లలో మహిళా సంఘాలు ‘వరకట్న మరణాలకు’ వ్యతిరేకంగా గళమెత్తాయి."}},{"t":"Statements","q":"Regarding the Sudha Goel case, which statements are correct?\nI. The accused took the case to the High Court because they were unhappy with the Trial Court’s decision.\nII. If they do not like the Supreme Court verdict, the accused can go back again to the Trial Court.","o":["I only","II only","Both I and II","Neither I nor II"],"a":0,"e":"Statement I is correct. Statement II is wrong: the Supreme Court’s decision is final and binding on all courts.","n":"This is the textbook exercise (Q.4).","te":{"q":"సుధా గోయల్ కేసుకు సంబంధించి సరైన వాక్యాలు ఏవి?\nI. విచారణ న్యాయస్థానం తీర్పుతో అసంతృప్తి చెందినందున నిందితులు హైకోర్టుకు వెళ్లారు.\nII. సుప్రీం కోర్టు తీర్పు నచ్చకపోతే నిందితులు మళ్లీ విచారణ న్యాయస్థానానికి వెళ్లవచ్చు.","o":["I మాత్రమే","II మాత్రమే","I మరియు II రెండూ","I, II రెండూ కావు"],"e":"వాక్యం I సరైనది. వాక్యం II తప్పు: సుప్రీం కోర్టు నిర్ణయం అంతిమం, అన్ని న్యాయస్థానాలకు కట్టుబడి ఉంటుంది.","n":"ఇది పాఠ్యపుస్తక అభ్యాసం (ప్ర.4)."}},{"t":"Match","q":"Match the branch of law (List-I) with its feature (List-II):\n(a) Criminal law   —   (i) A petition is filed before the court by the affected party\n(b) Civil law   —   (ii) Begins with an FIR lodged with the police\n(c) Criminal law   —   (iii) The court gives the specific relief asked for\n(d) Civil law   —   (iv) The accused, if guilty, can be jailed and fined","o":["a-i, b-ii, c-iii, d-iv","a-ii, b-iii, c-iv, d-i","a-ii, b-i, c-iv, d-iii","a-iv, b-i, c-ii, d-iii"],"a":2,"e":"Criminal law: FIR, police investigation, jail and fine. Civil law: petition by affected party, specific relief (e.g. vacate flat, pay rent).","n":"Dowry harassment, theft and murder are criminal; land sale, rent and divorce disputes are civil.","te":{"q":"న్యాయ శాఖను (జాబితా-I) దాని లక్షణంతో (జాబితా-II) జతపరచండి:\n(a) నేర చట్టం   —   (i) బాధిత పక్షం న్యాయస్థానంలో పిటిషన్ దాఖలు చేస్తుంది\n(b) పౌర చట్టం   —   (ii) పోలీసుల వద్ద FIR నమోదుతో ప్రారంభమవుతుంది\n(c) నేర చట్టం   —   (iii) కోరిన నిర్దిష్ట ఉపశమనాన్ని న్యాయస్థానం ఇస్తుంది\n(d) పౌర చట్టం   —   (iv) నిందితుడు దోషి అయితే జైలు శిక్ష, జరిమానా విధించవచ్చు","o":["a-i, b-ii, c-iii, d-iv","a-ii, b-iii, c-iv, d-i","a-ii, b-i, c-iv, d-iii","a-iv, b-i, c-ii, d-iii"],"e":"నేర చట్టం: FIR, పోలీసు దర్యాప్తు, జైలు, జరిమానా. పౌర చట్టం: బాధిత పక్షం పిటిషన్, నిర్దిష్ట ఉపశమనం (ఉదా. ఫ్లాట్ ఖాళీ చేయడం, అద్దె చెల్లించడం).","n":"వరకట్న వేధింపు, దొంగతనం, హత్య నేరపూరితం; భూమి అమ్మకం, అద్దె, విడాకుల వివాదాలు పౌర వివాదాలు."}},{"t":"MCQ","q":"A tenant who is being forced to move out files a case against the landlord. This falls under —","o":["Criminal law","Constitutional law","Civil law","Military law"],"a":2,"e":"Disputes relating to rent matters are civil law cases, handled by a petition before the relevant court.","n":"Girls being harassed by boys on the way to school is a criminal law matter.","te":{"q":"బలవంతంగా ఖాళీ చేయించబడుతున్న అద్దెదారు యజమానిపై కేసు దాఖలు చేస్తే అది దేని కిందకు వస్తుంది?","o":["నేర చట్టం","రాజ్యాంగ చట్టం","పౌర చట్టం","సైనిక చట్టం"],"e":"అద్దె వ్యవహారాలకు సంబంధించిన వివాదాలు పౌర చట్ట కేసులు; సంబంధిత న్యాయస్థానంలో పిటిషన్ ద్వారా పరిష్కరిస్తారు.","n":"బడికి వెళ్తున్న బాలికలను బాలురు వేధించడం నేర చట్ట విషయం."}},{"t":"MCQ","q":"Public Interest Litigation (PIL) was devised by the Supreme Court in the —","o":["Early 1980s","Early 1950s","Early 1970s","Early 2000s"],"a":0,"e":"In the early 1980s the Supreme Court devised PIL to increase access to justice for the poor.","n":"Any individual or organisation can file a PIL in the High Court or Supreme Court on behalf of those whose rights are violated.","te":{"q":"ప్రజా ప్రయోజన వ్యాజ్యం (PIL)ను సుప్రీం కోర్టు రూపొందించిన కాలం —","o":["1980ల ప్రారంభం","1950ల ప్రారంభం","1970ల ప్రారంభం","2000ల ప్రారంభం"],"e":"పేదలకు న్యాయం అందుబాటులోకి తేవడానికి సుప్రీం కోర్టు 1980ల ప్రారంభంలో PILను రూపొందించింది.","n":"హక్కులు ఉల్లంఘించబడినవారి తరఫున ఏ వ్యక్తి లేదా సంస్థ అయినా హైకోర్టు లేదా సుప్రీం కోర్టులో PIL దాఖలు చేయవచ్చు."}},{"t":"Assertion–Reason","q":"Assertion (A): Under PIL, even a letter or telegram addressed to the Supreme Court or High Court could be treated as a petition.\nReason (R): The legal process was greatly simplified to increase access to justice.","o":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, but R is false","A is false, but R is true"],"a":0,"e":"PIL simplified the process so that the poor could reach the courts. R explains A.","n":"Early PILs rescued bonded labourers and freed prisoners in Bihar kept beyond their term.","te":{"q":"నిశ్చితవాక్యం (A): PIL కింద సుప్రీం కోర్టు లేదా హైకోర్టుకు రాసిన ఒక లేఖ లేదా టెలిగ్రామ్‌ను కూడా పిటిషన్‌గా పరిగణించవచ్చు.\nకారణం (R): న్యాయం అందుబాటులోకి తేవడానికి న్యాయ ప్రక్రియను బాగా సరళీకరించారు.","o":["A మరియు R రెండూ సరైనవి, R అనేది A కు సరైన వివరణ","A మరియు R రెండూ సరైనవి, కానీ R అనేది A కు సరైన వివరణ కాదు","A సరైనది, కానీ R తప్పు","A తప్పు, కానీ R సరైనది"],"e":"పేదలు న్యాయస్థానాలను చేరుకునేలా PIL ప్రక్రియను సరళం చేసింది. R అనేది A ను వివరిస్తుంది.","n":"తొలి PILలు వెట్టి కార్మికులను విముక్తి చేశాయి, శిక్షాకాలం దాటినా జైలులో ఉన్న బీహార్ ఖైదీలను విడుదల చేయించాయి."}},{"t":"MCQ","q":"The mid-day meal scheme in government schools came about because of a PIL filed by —","o":["The Indian Federation of Women Lawyers","People’s Union of Civil Liberties (PUCL)","Lawyers Collective","National Human Rights Commission"],"a":1,"e":"In 2001, during drought in Rajasthan and Orissa while godowns overflowed, PUCL filed a PIL saying the Right to Life included the Right to Food.","n":"The Supreme Court ordered more employment, cheaper food in ration shops and mid-day meals.","te":{"q":"ప్రభుత్వ పాఠశాలల్లో మధ్యాహ్న భోజన పథకం ఎవరు దాఖలు చేసిన PIL వల్ల వచ్చింది?","o":["ఇండియన్ ఫెడరేషన్ ఆఫ్ విమెన్ లాయర్స్","పీపుల్స్ యూనియన్ ఫర్ సివిల్ లిబర్టీస్ (PUCL)","లాయర్స్ కలెక్టివ్","జాతీయ మానవ హక్కుల కమిషన్"],"e":"2001లో రాజస్థాన్, ఒడిశాలో కరువు ఉండగా గోదాములు నిండిపొర్లుతున్నప్పుడు, జీవించే హక్కులో ఆహార హక్కు ఉందంటూ PUCL PIL దాఖలు చేసింది.","n":"సుప్రీం కోర్టు మరింత ఉపాధి, రేషన్ దుకాణాల్లో చౌక ఆహారం, మధ్యాహ్న భోజనం అందించమని ఆదేశించింది."}},{"t":"MCQ","q":"The PUCL petition argued that the Right to Food was part of the Right to Life guaranteed under —","o":["Article 14","Article 19","Article 32","Article 21"],"a":3,"e":"It stated that the fundamental Right to Life guaranteed in Article 21 included the Right to Food.","n":"The Supreme Court also appointed two Food Commissioners.","te":{"q":"ఆహార హక్కు రాజ్యాంగంలోని ఏ అధికరణం హామీ ఇచ్చిన జీవించే హక్కులో భాగమని PUCL పిటిషన్ వాదించింది?","o":["అధికరణం 14","అధికరణం 19","అధికరణం 32","అధికరణం 21"],"e":"అధికరణం 21 హామీ ఇచ్చిన ప్రాథమిక జీవించే హక్కులో ఆహార హక్కు ఉందని పిటిషన్ పేర్కొంది.","n":"సుప్రీం కోర్టు ఇద్దరు ఆహార కమిషనర్లను కూడా నియమించింది."}},{"t":"MCQ","q":"The Olga Tellis vs Bombay Municipal Corporation (1985) judgment established the —","o":["Right to Food as part of Right to Life","Right to Livelihood as part of the Right to Life","Right to Education","Right to Vote"],"a":1,"e":"The judgment held that evicting pavement and slum dwellers deprives them of their livelihood and hence of life; the Right to Livelihood is part of the Right to Life.","n":"‘Life means something more than mere animal existence.’","te":{"q":"ఓల్గా టెల్లిస్ vs బొంబాయి మున్సిపల్ కార్పొరేషన్ (1985) తీర్పు స్థాపించినది —","o":["జీవించే హక్కులో ఆహార హక్కు భాగం","జీవించే హక్కులో జీవనోపాధి హక్కు భాగం","విద్యా హక్కు","ఓటుహక్కు"],"e":"పాదచారి మార్గాలు, మురికివాడల నివాసులను ఖాళీ చేయించడం వారి జీవనోపాధిని, తద్వారా జీవితాన్ని హరిస్తుందని; జీవనోపాధి హక్కు జీవించే హక్కులో భాగమని తీర్పు చెప్పింది.","n":"‘జీవితం అంటే కేవలం జంతు మనుగడ కంటే ఎక్కువ.’"}},{"t":"MCQ","q":"The phrase used to characterise the long time courts take to hear cases is —","o":["Justice for all","Equal before law","Justice delayed is justice denied","Rule of law"],"a":2,"e":"‘Justice delayed is justice denied’ characterises the extended time courts take.","n":"The Hashimpura case took over 31 years.","te":{"q":"న్యాయస్థానాలు కేసుల విచారణకు తీసుకునే సుదీర్ఘ సమయాన్ని వర్ణించడానికి వాడే నానుడి —","o":["అందరికీ న్యాయం","చట్టం ముందు అందరూ సమానం","ఆలస్యమైన న్యాయం అన్యాయమే (జస్టిస్ డిలేడ్ ఈజ్ జస్టిస్ డినైడ్)","చట్టబద్ధ పాలన"],"e":"‘ఆలస్యమైన న్యాయం అన్యాయమే’ అనే నానుడి న్యాయస్థానాలు తీసుకునే సుదీర్ఘ సమయాన్ని వర్ణిస్తుంది.","n":"హాషింపురా కేసు 31 ఏళ్లకు పైగా పట్టింది."}},{"t":"MCQ","q":"According to the textbook data (December 2022), how many vacancies existed in the High Courts?","o":["0","333","775","5,850"],"a":1,"e":"High Courts: sanctioned 1,108, working 775, vacancies 333. District and subordinate courts had 5,850 vacancies.","n":"The Supreme Court had 34 sanctioned and 34 working judges.","te":{"q":"పాఠ్యపుస్తక గణాంకాల ప్రకారం (డిసెంబరు 2022) హైకోర్టుల్లో ఎన్ని ఖాళీలు ఉన్నాయి?","o":["0","333","775","5,850"],"e":"హైకోర్టులు: మంజూరైనవి 1,108, పనిచేస్తున్నవి 775, ఖాళీలు 333. జిల్లా, అధీన న్యాయస్థానాల్లో 5,850 ఖాళీలు ఉన్నాయి.","n":"సుప్రీం కోర్టులో 34 మంజూరైన, 34 పనిచేస్తున్న న్యాయమూర్తులు ఉన్నారు."}},{"t":"MCQ","q":"‘Acquit’ means —","o":["A petition to a higher court","The court declaring a person not guilty of the crime","Money given to make amends","Removal from land"],"a":1,"e":"Glossary: Acquit — the court declares that a person is not guilty of the crime for which they were tried.","n":"Appeal = petition to a higher court; Compensation = money for injury/loss; Eviction = removal from land/homes.","te":{"q":"‘నిర్దోషిగా విడుదల’ (అక్విట్) అంటే —","o":["ఉన్నత న్యాయస్థానానికి పిటిషన్","విచారించిన నేరంలో వ్యక్తి దోషి కాదని న్యాయస్థానం ప్రకటించడం","నష్టానికి పరిహారంగా ఇచ్చే డబ్బు","భూమి నుండి తొలగించడం"],"e":"పదకోశం: నిర్దోషిగా విడుదల — విచారించిన నేరంలో వ్యక్తి దోషి కాదని న్యాయస్థానం ప్రకటించడం.","n":"అప్పీలు = ఉన్నత న్యాయస్థానానికి పిటిషన్; పరిహారం = గాయం/నష్టానికి డబ్బు; తొలగింపు = భూమి/ఇళ్ల నుండి ఖాళీ చేయించడం."}},{"t":"MCQ","q":"The subordinate court is also known by many names. Which of these is one of them?","o":["Federal Court","Supreme Court","Privy Council","Court of the District Judge / Trial Court"],"a":3,"e":"Subordinate courts are known as Trial Court, Court of the District Judge, Additional Sessions Judge, Chief Judicial Magistrate, Metropolitan Magistrate or Civil Judge.","n":"These are the courts most people interact with.","te":{"q":"అధీన న్యాయస్థానాన్ని అనేక పేర్లతో పిలుస్తారు. కింది వాటిలో అందులో ఒకటి ఏది?","o":["ఫెడరల్ కోర్టు","సుప్రీం కోర్టు","ప్రివీ కౌన్సిల్","జిల్లా న్యాయమూర్తి న్యాయస్థానం / విచారణ న్యాయస్థానం"],"e":"అధీన న్యాయస్థానాలను విచారణ న్యాయస్థానం, జిల్లా న్యాయమూర్తి న్యాయస్థానం, అదనపు సెషన్స్ జడ్జి, చీఫ్ జ్యుడీషియల్ మేజిస్ట్రేట్, మెట్రోపాలిటన్ మేజిస్ట్రేట్ లేదా సివిల్ జడ్జి అని పిలుస్తారు.","n":"ఎక్కువ మంది ప్రజలు సంప్రదించే న్యాయస్థానాలు ఇవే."}}]}]};

const IDB=(()=>{let dbp=null;const mem=new Map();
  function open(){if(dbp)return dbp;dbp=new Promise(res=>{try{const r=indexedDB.open("dsc-exam-hall",1);r.onupgradeneeded=()=>r.result.createObjectStore("books",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});return dbp}
  async function tx(mode,fn){const db=await open();if(!db)return null;return new Promise(res=>{try{const t=db.transaction("books",mode);const s=t.objectStore("books");const r=fn(s);t.oncomplete=()=>res(r&&r.result!==undefined?r.result:true);t.onerror=()=>res(null)}catch(e){res(null)}})}
  return{async all(){const r=await tx("readonly",s=>s.getAll());return r||[...mem.values()]},async put(b){mem.set(b.id,b);await tx("readwrite",s=>s.put(b))},async del(id){mem.delete(id);await tx("readwrite",s=>s.delete(id))}}})();

/* ========== EXAM ENGINE ========== */
let timerId=null;
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function startExam(mode,chIds,count){
  const b=book();const chs=b.chapters.filter(c=>chIds.includes(c.id));
  const wrap=(c,q,i)=>({...q,ch:c.id,chTitle:c.title,chTitleTe:c.te&&c.te.title,chNo:c.no,src:i});
  let qs=[];
  if(mode==="full"){chs.forEach(c=>c.questions.forEach((q,i)=>qs.push(wrap(c,q,i))));if(settings.shuffleFull)qs=shuffle(qs)}
  else if(mode==="quick"){const c=chs[0];qs=shuffle(c.questions.map((q,i)=>wrap(c,q,i))).slice(0,count)}
  else{const total=chs.reduce((s,c)=>s+c.questions.length,0);let picked=[];
    chs.forEach(c=>{const k=Math.max(1,Math.round(count*c.questions.length/total));picked.push(...shuffle(c.questions.map((q,i)=>wrap(c,q,i))).slice(0,k))});
    picked=shuffle(picked).slice(0,count);const order=chs.map(c=>c.id);qs=picked.sort((x,y)=>order.indexOf(x.ch)-order.indexOf(y.ch))}
  if(!qs.length)return toast(t("noQs"));
  const c0=chs[0],teT=c0.te&&c0.te.title;
  const title=mode==="grand"?`${tr("grandT",null,"en")} · ${b.title}`:`${tr(mode==="quick"?"quickT":"fullT",null,"en")} · Ch ${c0.no??""} ${c0.title}`;
  const titleTe=mode==="grand"?`${tr("grandT",null,"te")} · ${(b.te&&b.te.title)||b.title}`:`${tr(mode==="quick"?"quickT":"fullT",null,"te")} · అధ్యా ${c0.no??""} ${teT||c0.title}`;
  state.exam={id:uid(),bookId:b.id,bookTitle:b.title,bookTitleTe:b.te&&b.te.title,title,titleTe,mode,chapters:chIds,qs,ans:qs.map(()=>-1),mark:qs.map(()=>false),cur:0,
    start:Date.now(),dur:settings.timer?qs.length*settings.secPerQ:0,marks:settings.marks,neg:settings.neg};
  go("exam");
}
function examTitleHTML(x){const lang=LANG();if(lang==="te"&&x.titleTe)return `<span lang="te">${esc(x.titleTe)}</span>`;if(lang==="both"&&x.titleTe)return `${esc(x.title)}<span class="sub-te" lang="te">${esc(x.titleTe)}</span>`;return esc(x.title)}

function chLabel(q){if(LANG()==="te"&&q.chTitleTe)return `<span lang="te">${esc(q.chTitleTe)}</span>`;return esc(q.chTitle||"")}

document.addEventListener("keydown",e=>{
  if(state.view!=="exam"||!$("#modal").hidden||/input|select|textarea/i.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toUpperCase();
  if("ABCD".includes(k)&&k.length===1){choose("ABCD".indexOf(k));e.preventDefault()}
  else if(["1","2","3","4"].includes(e.key)){choose(+e.key-1);e.preventDefault()}
  else if(e.key==="ArrowRight"){move(1);e.preventDefault()}
  else if(e.key==="ArrowLeft"){move(-1);e.preventDefault()}
  else if(k==="M"){toggleMark()}
});

function score(qs,ans,marks,neg){let c=0,w=0,s=0;qs.forEach((q,i)=>{if(ans[i]<0)s++;else if(ans[i]===q.a)c++;else w++});const sc=Math.round((c*marks-w*neg)*100)/100;return{c,w,s,sc,max:qs.length*marks}}

    qs:ex.qs.map(q=>({t:q.t,q:q.q,o:q.o,a:q.a,e:q.e,n:q.n,te:q.te,ch:q.ch,chTitle:q.chTitle,chTitleTe:q.chTitleTe,chNo:q.chNo})),ans:ex.ans,marks:ex.marks,neg:ex.neg,
    n:ex.qs.length,correct:r.c,wrong:r.w,skipped:r.s,score:r.sc,max:r.max,pct:Math.round(100*r.c/ex.qs.length),name:settings.name};

function explBlock(q){const lang=LANG(),te=q.te||{};

const NON_LATIN=/[^\u0000-ɏ‐-‧‰-⁞←-↙− ]/;
function ascii(s){return String(s??"").replace(/[‘’‚′]/g,"'").replace(/[“”„″]/g,'"').replace(/[–—−]/g,"-").replace(/…/g,"...").replace(/[·•]/g,"-").replace(/→/g,"->").replace(/←/g,"<-").replace(/×/g,"x").replace(/ /g," ").replace(/[^\x00-\xFF]/g,"")}
async function bankPdf(b,chId,lang){
  const chs=chId?b.chapters.filter(c=>c.id===chId):b.chapters;
  const qs=[];chs.forEach(c=>c.questions.forEach(q=>qs.push({...q,chTitle:c.title,chTitleTe:c.te&&c.te.title,chNo:c.no})));

  await buildPdf({kind:"bank",title,titleTe,sub:b.title,subTe:(b.te&&b.te.title)||b.title,qs,ans:null,lang,file:slug(b.title)+(chId?"-ch"+(c0.no??"")+"-"+slug(c0.title):"-full")+"-QA"+(lang==="en"?"":"-"+lang)+".pdf"});

async function resultPdf(a,lang){

async function buildPdf(o){
  if(!window.jspdf){toast(t("pdfLoading"));return}
  toast(t("preparing"),8000);
  await new Promise(r=>setTimeout(r,30));
  let blob;
  try{
    const texts=[o.title,o.sub,...o.qs.flatMap(q=>[q.q,...q.o,q.e,q.n])];
    blob=(o.lang==="en"&&!texts.some(x=>NON_LATIN.test(String(x||""))))?pdfText(o):await pdfImage(o);
  }catch(e){console.error(e);toast(t("pdfFail",{e:e.message||e}));return}
  await saveFile(o.file,blob);

function pdfText(o){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4",compress:true});
  const W=210,H=297,M=16,CW=W-2*M;let y=M;
  const C={ink:[20,27,51],muted:[90,98,125],omr:[181,25,90],ok:[23,120,74],bad:[192,53,43],line:[205,210,225],soft:[245,246,250],okSoft:[226,243,234],badSoft:[252,235,233]};
  const lh=sz=>sz*0.3528*1.38;
  const set=(sz,st="normal",col=C.ink)=>{doc.setFont("helvetica",st);doc.setFontSize(sz);doc.setTextColor(...col)};
  const lines=(t,sz,st,w)=>{set(sz,st);return doc.splitTextToSize(ascii(t),w)};
  const runHead=()=>{set(8,"normal",C.muted);doc.text(ascii("DSC Exam Hall  |  "+o.sub),M,9);doc.text(ascii(o.title).slice(0,90),W-M,9,{align:"right"});doc.setDrawColor(...C.line);doc.setLineWidth(.2);doc.line(M,11,W-M,11)};
  const newPage=()=>{doc.addPage();runHead();y=M+2};
  const need=h=>{if(y+h>H-M){newPage();return true}return false};
  const write=(t,sz,st,col,x=M,w=CW)=>{const ls=lines(t,sz,st,w);set(sz,st,col);for(const l of ls){need(lh(sz));doc.text(l,x,y+lh(sz)*0.75);y+=lh(sz)}};
  // cover header
  doc.setFillColor(...C.ink);doc.rect(0,0,W,40,"F");

async function readPdf(file){

  try{
