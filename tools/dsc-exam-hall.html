","n":"Physical inputs: rainfall, sunshine, temperature, soil, slope.","te":{"q":"సాగుభూమి వ్యవసాయ క్షేత్ర వ్యవస్థలో:\nI. విత్తనాలు, ఎరువులు, యంత్రాలు, శ్రమ ఉత్పాదకాలు (ఇన్‌పుట్స్).\nII. పంటలు, ఉన్ని, పాల ఉత్పత్తులు, కోళ్ల ఉత్పత్తులు ఉత్పత్తులు (అవుట్‌పుట్స్).","o":["I మాత్రమే","II మాత్రమే","I మరియు II రెండూ","I, II రెండూ కావు"],"e":"వ్యవసాయ క్షేత్ర వ్యవస్థ (పటం 3.2) ప్రకారం రెండూ సరైనవి. దున్నడం, విత్తడం, నీటిపారుదల, కలుపు తీయడం, కోత ప్రక్రియలు.","n":"భౌతిక ఉత్పాదకాలు: వర్షపాతం, సూర్యరశ్మి, ఉష్ణోగ్రత, నేల, వాలు."}},{"t":"MCQ","q":"In which type of farming are organic manure and natural pesticides used instead of chemicals, with no genetic modification?","o":["Commercial farming","Mixed farming","Organic farming","Plantation farming"],"a":2,"e":"The ‘Interesting Fact’ box describes organic farming: organic manure and natural pesticides, no genetic modification to increase yield.","n":"Peter’s family in New Zealand practises organic farming.","te":{"q":"రసాయనాలకు బదులు సేంద్రియ ఎరువు, సహజ క్రిమిసంహారకాలు వాడుతూ, జన్యు మార్పిడి చేయని వ్యవసాయం ఏది?","o":["వాణిజ్య వ్యవసాయం","మిశ్రమ వ్యవసాయం","సేంద్రియ వ్యవసాయం","తోటల వ్యవసాయం"],"e":"‘ఆసక్తికర విషయం’ పెట్టె సేంద్రియ వ్యవసాయాన్ని వివరిస్తుంది: సేంద్రియ ఎరువు, సహజ క్రిమిసంహారకాలు; దిగుబడి పెంచడానికి జన్యు మార్పిడి ఉండదు.","n":"న్యూజిలాండ్‌లో పీటర్ కుటుంబం సేంద్రియ వ్యవసాయం చేస్తుంది."}},{"t":"MCQ","q":"Farming practised to meet the needs of the farmer’s family is called —","o":["Commercial farming","Subsistence farming","Plantation agriculture","Mixed farming"],"a":1,"e":"Subsistence farming meets the needs of the farmer’s family, traditionally with low technology and household labour.","n":"It is divided into intensive subsistence and primitive subsistence farming.","te":{"q":"రైతు కుటుంబ అవసరాలు తీర్చడానికి చేసే వ్యవసాయాన్ని ఏమంటారు?","o":["వాణిజ్య వ్యవసాయం","జీవనాధార వ్యవసాయం","తోటల వ్యవసాయం","మిశ్రమ వ్యవసాయం"],"e":"జీవనాధార వ్యవసాయం రైతు కుటుంబ అవసరాలను తీరుస్తుంది; సాంప్రదాయంగా తక్కువ సాంకేతికత, కుటుంబ శ్రమతో జరుగుతుంది.","n":"ఇది సాంద్ర జీవనాధార, ఆదిమ జీవనాధార వ్యవసాయాలుగా విభజించబడింది."}},{"t":"MCQ","q":"Intensive subsistence agriculture is prevalent in —","o":["Temperate grasslands of North America","Sahara desert","Thickly populated monsoon regions of south, southeast and east Asia","Amazon basin"],"a":2,"e":"Intensive subsistence agriculture is found in thickly populated areas of the monsoon regions of south, southeast and east Asia. Rice is the main crop.","n":"Farmer cultivates a small plot with simple tools and more labour; more than one crop a year.","te":{"q":"సాంద్ర జీవనాధార వ్యవసాయం ఎక్కడ ప్రబలంగా ఉంది?","o":["ఉత్తర అమెరికా సమశీతోష్ణ గడ్డి భూములు","సహారా ఎడారి","దక్షిణ, ఆగ్నేయ, తూర్పు ఆసియాలోని జనసాంద్రత గల రుతుపవన ప్రాంతాలు","అమెజాన్ బేసిన్"],"e":"దక్షిణ, ఆగ్నేయ, తూర్పు ఆసియాలోని జనసాంద్రత గల రుతుపవన ప్రాంతాల్లో సాంద్ర జీవనాధార వ్యవసాయం ఉంది. వరి ప్రధాన పంట.","n":"రైతు చిన్న భూమిలో సాధారణ పనిముట్లు, ఎక్కువ శ్రమతో సాగు చేస్తాడు; ఏడాదికి ఒకటి కంటే ఎక్కువ పంటలు."}},{"t":"MCQ","q":"Primitive subsistence agriculture includes —","o":["Mixed farming and plantation","Commercial grain farming","Dairy farming and horticulture","Shifting cultivation and nomadic herding"],"a":3,"e":"Primitive subsistence agriculture includes shifting cultivation and nomadic herding.","n":"Shifting cultivation is also called ‘slash and burn’ agriculture.","te":{"q":"ఆదిమ జీవనాధార వ్యవసాయంలో ఉండేవి —","o":["మిశ్రమ వ్యవసాయం, తోటల పెంపకం","వాణిజ్య ధాన్య వ్యవసాయం","పాడి పరిశ్రమ, ఉద్యానవన సాగు","విస్థాపన (పోడు) వ్యవసాయం, సంచార పశుపోషణ"],"e":"ఆదిమ జీవనాధార వ్యవసాయంలో విస్థాపన వ్యవసాయం, సంచార పశుపోషణ ఉన్నాయి.","n":"విస్థాపన వ్యవసాయాన్ని ‘నరికి కాల్చే’ (స్లాష్ అండ్ బర్న్) వ్యవసాయం అని కూడా అంటారు."}},{"t":"Match","q":"Match the name of shifting cultivation (List-I) with the region (List-II):\n(a) Jhumming   —   (i) Brazil\n(b) Milpa   —   (ii) Malaysia\n(c) Roca   —   (iii) North-East India\n(d) Ladang   —   (iv) Mexico","o":["a-iii, b-iv, c-i, d-ii","a-iii, b-i, c-iv, d-ii","a-i, b-ii, c-iii, d-iv","a-iv, b-iii, c-ii, d-i"],"a":0,"e":"Jhumming → North-East India; Milpa → Mexico; Roca → Brazil; Ladang → Malaysia.","n":"Shifting cultivation is practised in heavy rainfall areas with quick regeneration of vegetation.","te":{"q":"విస్థాపన వ్యవసాయం పేరును (జాబితా-I) ప్రాంతంతో (జాబితా-II) జతపరచండి:\n(a) ఝూమింగ్   —   (i) బ్రెజిల్\n(b) మిల్పా   —   (ii) మలేషియా\n(c) రోకా   —   (iii) ఈశాన్య భారతదేశం\n(d) లడాంగ్   —   (iv) మెక్సికో","o":["a-iii, b-iv, c-i, d-ii","a-iii, b-i, c-iv, d-ii","a-i, b-ii, c-iii, d-iv","a-iv, b-iii, c-ii, d-i"],"e":"ఝూమింగ్ → ఈశాన్య భారతదేశం; మిల్పా → మెక్సికో; రోకా → బ్రెజిల్; లడాంగ్ → మలేషియా.","n":"అధిక వర్షపాతం, వృక్షసంపద త్వరగా పునరుత్పత్తి అయ్యే ప్రాంతాల్లో విస్థాపన వ్యవసాయం జరుగుతుంది."}},{"t":"MCQ","q":"Which crops are grown in shifting cultivation after mixing ashes with soil?","o":["Wheat, barley and oats","Maize, yam, potatoes and cassava","Tea and coffee","Cotton and jute"],"a":1,"e":"A plot is cleared by felling and burning trees; ashes are mixed with the soil and crops like maize, yam, potatoes and cassava are grown.","n":"When soil loses fertility the land is abandoned and the cultivator moves on.","te":{"q":"విస్థాపన వ్యవసాయంలో బూడిదను నేలలో కలిపిన తర్వాత పండించే పంటలు ఏవి?","o":["గోధుమ, బార్లీ, ఓట్స్","మొక్కజొన్న, కంద (యామ్), బంగాళదుంపలు, కర్రపెండలం","తేయాకు, కాఫీ","పత్తి, జనుము"],"e":"చెట్లను నరికి కాల్చి ఒక భూమిని శుభ్రం చేస్తారు; బూడిదను నేలలో కలిపి మొక్కజొన్న, కంద, బంగాళదుంపలు, కర్రపెండలం వంటి పంటలు పండిస్తారు.","n":"నేల సారం కోల్పోగానే ఆ భూమిని వదిలి సాగుదారు మరో చోటికి వెళ్తాడు."}},{"t":"MCQ","q":"Nomadic herding is practised in —","o":["Temperate grasslands of Europe","Monsoon regions of southeast Asia","Tropical rainforests","Semi-arid and arid regions of Sahara, Central Asia, Rajasthan and Jammu & Kashmir"],"a":3,"e":"Nomadic herding is practised in semi-arid and arid regions of Sahara, Central Asia and parts of India like Rajasthan and Jammu and Kashmir.","n":"Herdsmen move along defined routes with sheep, camel, yak and goats.","te":{"q":"సంచార పశుపోషణ ఎక్కడ జరుగుతుంది?","o":["ఐరోపా సమశీతోష్ణ గడ్డి భూములు","ఆగ్నేయ ఆసియా రుతుపవన ప్రాంతాలు","ఉష్ణమండల వర్షారణ్యాలు","సహారా, మధ్య ఆసియా, రాజస్థాన్, జమ్మూ కశ్మీర్‌లోని అర్ధశుష్క, శుష్క ప్రాంతాలు"],"e":"సహారా, మధ్య ఆసియాలోని అర్ధశుష్క, శుష్క ప్రాంతాలు, భారతదేశంలోని రాజస్థాన్, జమ్మూ కశ్మీర్ వంటి ప్రాంతాల్లో సంచార పశుపోషణ జరుగుతుంది.","n":"పశుపోషకులు గొర్రెలు, ఒంటెలు, యాక్‌లు, మేకలతో నిర్దిష్ట మార్గాల్లో సంచరిస్తారు."}},{"t":"Assertion–Reason","q":"Assertion (A): In commercial grain farming in temperate grasslands, only a single crop can be grown in a year.\nReason (R): Severe winters restrict the growing season.","o":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, but R is false","A is false, but R is true"],"a":0,"e":"The textbook says severe winters restrict the growing season and only a single crop can be grown, so R explains A.","n":"Wheat and maize are common commercially grown grains.","te":{"q":"నిశ్చితవాక్యం (A): సమశీతోష్ణ గడ్డి భూముల్లో వాణిజ్య ధాన్య వ్యవసాయంలో ఏడాదికి ఒక్క పంట మాత్రమే పండించగలరు.\nకారణం (R): తీవ్రమైన శీతాకాలాలు పంట కాలాన్ని పరిమితం చేస్తాయి.","o":["A మరియు R రెండూ సరైనవి, R అనేది A కు సరైన వివరణ","A మరియు R రెండూ సరైనవి, కానీ R అనేది A కు సరైన వివరణ కాదు","A సరైనది, కానీ R తప్పు","A తప్పు, కానీ R సరైనది"],"e":"తీవ్రమైన శీతాకాలాలు పంట కాలాన్ని పరిమితం చేయడం వల్ల ఒక్క పంట మాత్రమే పండించగలరని పాఠ్యపుస్తకం చెబుతుంది; కాబట్టి R అనేది A ను వివరిస్తుంది.","n":"గోధుమ, మొక్కజొన్న సాధారణంగా వాణిజ్యపరంగా పండించే ధాన్యాలు."}},{"t":"MCQ","q":"Mixed farming — where land is used for growing food and fodder crops and rearing livestock — is practised in —","o":["Europe, eastern USA, Argentina, southeast Australia, New Zealand and South Africa","Amazon basin and tropical Africa","Sahara and Central Asia","Only in India"],"a":0,"e":"This list is given in the textbook for mixed farming.","n":"Mixed farming is a type of commercial farming.","te":{"q":"ఆహార, పశుగ్రాస పంటలు పండిస్తూ పశువులను పెంచే మిశ్రమ వ్యవసాయం ఎక్కడ జరుగుతుంది?","o":["ఐరోపా, తూర్పు అమెరికా, అర్జెంటీనా, ఆగ్నేయ ఆస్ట్రేలియా, న్యూజిలాండ్, దక్షిణాఫ్రికా","అమెజాన్ బేసిన్, ఉష్ణమండల ఆఫ్రికా","సహారా, మధ్య ఆసియా","భారతదేశంలో మాత్రమే"],"e":"మిశ్రమ వ్యవసాయానికి పాఠ్యపుస్తకం ఈ జాబితాను ఇస్తుంది.","n":"మిశ్రమ వ్యవసాయం ఒక రకమైన వాణిజ్య వ్యవసాయం."}},{"t":"MCQ","q":"Plantations require large amounts of —","o":["Labour and capital","Land only","Rainfall only","Machinery only"],"a":0,"e":"Plantations are commercial farming where a single crop is grown; large amounts of labour and capital are required.","n":"Transport network is essential since produce is processed on the farm or in nearby factories.","te":{"q":"తోటల పెంపకానికి (ప్లాంటేషన్) పెద్ద మొత్తంలో అవసరమైనవి —","o":["శ్రమ మరియు మూలధనం","భూమి మాత్రమే","వర్షపాతం మాత్రమే","యంత్రాలు మాత్రమే"],"e":"తోటల పెంపకం ఒకే పంట పండించే వాణిజ్య వ్యవసాయం; పెద్ద మొత్తంలో శ్రమ, మూలధనం అవసరం.","n":"ఉత్పత్తిని క్షేత్రంలోనే లేదా సమీప కర్మాగారాల్లో ప్రాసెస్ చేస్తారు కాబట్టి రవాణా వ్యవస్థ తప్పనిసరి."}},{"t":"Match","q":"Match the plantation crop (List-I) with the country given as example (List-II):\n(a) Rubber   —   (i) Brazil\n(b) Coffee   —   (ii) India and Sri Lanka\n(c) Tea   —   (iii) Malaysia","o":["a-i, b-ii, c-iii","a-ii, b-iii, c-i","a-iii, b-i, c-ii","a-iii, b-ii, c-i"],"a":2,"e":"Rubber in Malaysia, coffee in Brazil, tea in India and Sri Lanka are the textbook’s examples of plantations.","n":"Major plantations are found in the tropical regions of the world.","te":{"q":"తోట పంటను (జాబితా-I) ఉదాహరణగా ఇచ్చిన దేశంతో (జాబితా-II) జతపరచండి:\n(a) రబ్బరు   —   (i) బ్రెజిల్\n(b) కాఫీ   —   (ii) భారతదేశం, శ్రీలంక\n(c) తేయాకు   —   (iii) మలేషియా","o":["a-i, b-ii, c-iii","a-ii, b-iii, c-i","a-iii, b-i, c-ii","a-iii, b-ii, c-i"],"e":"మలేషియాలో రబ్బరు, బ్రెజిల్‌లో కాఫీ, భారతదేశం-శ్రీలంకలో తేయాకు తోటలు పాఠ్యపుస్తకంలోని ఉదాహరణలు.","n":"ప్రధాన తోటలు ప్రపంచంలోని ఉష్ణమండల ప్రాంతాల్లో ఉన్నాయి."}},{"t":"MCQ","q":"Which crop needs high temperature, high humidity and rainfall, and grows best in alluvial clayey soil that can retain water?","o":["Wheat","Millets","Cotton","Rice"],"a":3,"e":"Rice is the major food crop of the world and the staple diet of tropical and sub-tropical regions. It needs high temperature, humidity and rainfall and alluvial clayey soil.","n":"China leads in rice production, followed by India, Japan, Sri Lanka and Egypt.","te":{"q":"అధిక ఉష్ణోగ్రత, అధిక తేమ, వర్షపాతం అవసరమై, నీటిని నిలుపుకునే ఒండ్రు బంకమట్టి నేలలో బాగా పెరిగే పంట ఏది?","o":["గోధుమ","చిరుధాన్యాలు","పత్తి","వరి"],"e":"వరి ప్రపంచంలో ప్రధాన ఆహార పంట; ఉష్ణమండల, ఉపఉష్ణమండల ప్రాంతాల ప్రధాన ఆహారం. దీనికి అధిక ఉష్ణోగ్రత, తేమ, వర్షపాతం, ఒండ్రు బంకమట్టి నేల అవసరం.","n":"వరి ఉత్పత్తిలో చైనా ప్రథమం, తర్వాత భారతదేశం, జపాన్, శ్రీలంక, ఈజిప్ట్."}},{"t":"MCQ","q":"Which country leads in the production of rice?","o":["India","China","Japan","Egypt"],"a":1,"e":"‘China leads in the production of rice followed by India, Japan, Sri Lanka and Egypt.’","n":"In West Bengal and Bangladesh two to three rice crops are grown in a year.","te":{"q":"వరి ఉత్పత్తిలో ప్రథమ స్థానంలో ఉన్న దేశం ఏది?","o":["భారతదేశం","చైనా","జపాన్","ఈజిప్ట్"],"e":"‘వరి ఉత్పత్తిలో చైనా ప్రథమ స్థానంలో ఉంది, తర్వాత భారతదేశం, జపాన్, శ్రీలంక, ఈజిప్ట్.’","n":"పశ్చిమ బెంగాల్, బంగ్లాదేశ్‌లో ఏడాదికి రెండు మూడు వరి పంటలు పండిస్తారు."}},{"t":"MCQ","q":"Wheat requires —","o":["High temperature and heavy rainfall","Moderate temperature and rainfall during growing season and bright sunshine at harvest","Cool climate and rainfall throughout the year","Low rainfall and sandy soil"],"a":1,"e":"Wheat requires moderate temperature and rainfall during the growing season and bright sunshine at harvest; it thrives in well-drained loamy soil.","n":"In India wheat is grown in winter.","te":{"q":"గోధుమకు అవసరమైనవి —","o":["అధిక ఉష్ణోగ్రత, భారీ వర్షపాతం","పెరిగే కాలంలో మితమైన ఉష్ణోగ్రత, వర్షపాతం మరియు కోత సమయంలో ప్రకాశవంతమైన సూర్యరశ్మి","చల్లని వాతావరణం, ఏడాది పొడవునా వర్షం","తక్కువ వర్షపాతం, ఇసుక నేల"],"e":"గోధుమకు పెరిగే కాలంలో మితమైన ఉష్ణోగ్రత, వర్షపాతం, కోత సమయంలో ప్రకాశవంతమైన సూర్యరశ్మి అవసరం; నీరు బాగా ఇంకే లోమీ నేలలో బాగా పెరుగుతుంది.","n":"భారతదేశంలో గోధుమను శీతాకాలంలో పండిస్తారు."}},{"t":"MCQ","q":"Millets are also known as —","o":["Golden fibre","Coarse grains","Cash crops","Beverage crops"],"a":1,"e":"Millets are also known as coarse grains and can be grown on less fertile and sandy soils.","n":"Jowar, bajra and ragi are millets grown in India.","te":{"q":"చిరుధాన్యాలను ఇలా కూడా అంటారు —","o":["బంగారు నార","ముతక ధాన్యాలు","వాణిజ్య పంటలు","పానీయ పంటలు"],"e":"చిరుధాన్యాలను ముతక ధాన్యాలు అని కూడా అంటారు; ఇవి తక్కువ సారవంతమైన, ఇసుక నేలల్లో పండుతాయి.","n":"జొన్న, సజ్జ, రాగి భారతదేశంలో పండించే చిరుధాన్యాలు."}},{"t":"MCQ","q":"Which crop is also known as corn?","o":["Maize","Wheat","Jowar","Rice"],"a":0,"e":"The ‘Do you know?’ box: maize is also known as corn.","n":"Maize needs moderate temperature, rainfall, lots of sunshine and well-drained fertile soils.","te":{"q":"‘కార్న్’ అని కూడా పిలువబడే పంట ఏది?","o":["మొక్కజొన్న","గోధుమ","జొన్న","వరి"],"e":"‘మీకు తెలుసా?’ పెట్టె: మొక్కజొన్నను కార్న్ అని కూడా అంటారు.","n":"మొక్కజొన్నకు మితమైన ఉష్ణోగ్రత, వర్షపాతం, ఎక్కువ సూర్యరశ్మి, నీరు బాగా ఇంకే సారవంతమైన నేలలు అవసరం."}},{"t":"MCQ","q":"‘Golden Fibre’ refers to —","o":["Tea","Cotton","Silk","Jute"],"a":3,"e":"Textbook exercise answer: jute was known as the ‘Golden Fibre’.","n":"Jute grows on alluvial soil with high temperature, heavy rainfall and humid climate; India and Bangladesh lead.","te":{"q":"‘బంగారు నార’ అని దేనిని అంటారు?","o":["తేయాకు","పత్తి","పట్టు","జనుము (గోగు)"],"e":"పాఠ్యపుస్తక అభ్యాస సమాధానం: జనుమును ‘బంగారు నార’ అంటారు.","n":"జనుము అధిక ఉష్ణోగ్రత, భారీ వర్షపాతం, తేమతో కూడిన వాతావరణంలో ఒండ్రు నేలలో పెరుగుతుంది; భారతదేశం, బంగ్లాదేశ్ ప్రధాన ఉత్పత్తిదారులు."}},{"t":"MCQ","q":"Cotton requires how many frost-free days for its growth?","o":["120","180","210","300"],"a":2,"e":"Cotton requires high temperature, light rainfall, 210 frost-free days and bright sunshine.","n":"It grows best on black and alluvial soils.","te":{"q":"పత్తి పెరుగుదలకు ఎన్ని మంచులేని రోజులు అవసరం?","o":["120","180","210","300"],"e":"పత్తికి అధిక ఉష్ణోగ్రత, తక్కువ వర్షపాతం, 210 మంచులేని రోజులు, ప్రకాశవంతమైన సూర్యరశ్మి అవసరం.","n":"ఇది నల్లరేగడి, ఒండ్రు నేలల్లో బాగా పెరుగుతుంది."}},{"t":"MCQ","q":"Who are the leading producers of coffee as per the textbook?","o":["India, followed by China","Russia","Kenya and Sri Lanka","Brazil, followed by Colombia and India"],"a":3,"e":"‘Brazil is the leading producer followed by Columbia and India.’","n":"Coffee needs warm, wet climate and well-drained loamy soil; hill slopes suit it.","te":{"q":"పాఠ్యపుస్తకం ప్రకారం కాఫీ ప్రధాన ఉత్పత్తిదారులు ఎవరు?","o":["భారతదేశం, తర్వాత చైనా","రష్యా","కెన్యా, శ్రీలంక","బ్రెజిల్, తర్వాత కొలంబియా, భారతదేశం"],"e":"‘బ్రెజిల్ ప్రధాన ఉత్పత్తిదారు, తర్వాత కొలంబియా, భారతదేశం.’","n":"కాఫీకి వెచ్చని, తేమతో కూడిన వాతావరణం, నీరు బాగా ఇంకే లోమీ నేల అవసరం; కొండ వాలులు అనుకూలం."}},{"t":"MCQ","q":"According to one version, the coffee plant was discovered in about AD 850 by —","o":["An Arab goat-herder named Kaldi","A Portuguese sailor","A Chinese monk","An Ethiopian king"],"a":0,"e":"Kaldi, an Arab goat-herder, tasted the berries his goats were feeding on and felt exhilarated.","n":"This is the ‘Interesting Fact’ box.","te":{"q":"ఒక కథనం ప్రకారం క్రీ.శ. 850 ప్రాంతంలో కాఫీ మొక్కను కనుగొన్నది —","o":["కాల్డీ అనే అరబ్ మేకల కాపరి","ఒక పోర్చుగీసు నావికుడు","ఒక చైనా సన్యాసి","ఒక ఇథియోపియా రాజు"],"e":"అరబ్ మేకల కాపరి కాల్డీ తన మేకలు తింటున్న పండ్లను రుచి చూసి ఉత్సాహాన్ని అనుభవించాడు.","n":"ఇది ‘ఆసక్తికర విషయం’ పెట్టెలోనిది."}},{"t":"MCQ","q":"Which beverage crop requires a cool climate and well-distributed high rainfall throughout the year for the growth of its tender leaves?","o":["Tea","Coffee","Cocoa","Sugarcane"],"a":0,"e":"Tea needs cool climate, well-distributed high rainfall throughout the year, well-drained loamy soils and gentle slopes.","n":"Labour in large numbers is needed to pick the leaves; Kenya, India, China and Sri Lanka produce the best tea.","te":{"q":"లేత ఆకుల పెరుగుదలకు చల్లని వాతావరణం, ఏడాది పొడవునా సమంగా పంపిణీ అయిన అధిక వర్షపాతం అవసరమైన పానీయ పంట ఏది?","o":["తేయాకు","కాఫీ","కోకో","చెరకు"],"e":"తేయాకుకు చల్లని వాతావరణం, ఏడాది పొడవునా సమంగా అధిక వర్షపాతం, నీరు బాగా ఇంకే లోమీ నేలలు, మెల్లని వాలులు అవసరం.","n":"ఆకులు కోయడానికి పెద్ద సంఖ్యలో కూలీలు అవసరం; కెన్యా, భారత్, చైనా, శ్రీలంక ఉత్తమ తేయాకు ఉత్పత్తి చేస్తాయి."}},{"t":"MCQ","q":"The ultimate aim of agricultural development is to —","o":["Increase exports","Reduce farm labour","Increase the area under forests","Increase food security"],"a":3,"e":"‘The ultimate aim of agricultural development is to increase food security.’","n":"Food security: all people, at all times, have access to sufficient, safe and nutritious food.","te":{"q":"వ్యవసాయ అభివృద్ధి అంతిమ లక్ష్యం —","o":["ఎగుమతులు పెంచడం","వ్యవసాయ కూలీలను తగ్గించడం","అటవీ విస్తీర్ణం పెంచడం","ఆహార భద్రతను పెంచడం"],"e":"‘వ్యవసాయ అభివృద్ధి అంతిమ లక్ష్యం ఆహార భద్రతను పెంచడం.’","n":"ఆహార భద్రత: ప్రజలందరికీ అన్ని వేళలా తగినంత, సురక్షితమైన, పోషకాహారం అందుబాటులో ఉండటం."}},{"t":"Statements","q":"Agricultural development can be achieved by:\nI. Increasing the cropped area and the number of crops grown.\nII. Improving irrigation, using fertilisers and high yielding variety (HYV) seeds.","o":["I only","II only","Both I and II","Neither I nor II"],"a":2,"e":"Both are mentioned. Mechanisation of agriculture is another aspect of agricultural development.","n":"Agricultural development = efforts to increase farm production to meet growing demand.","te":{"q":"వ్యవసాయ అభివృద్ధిని సాధించే మార్గాలు:\nI. సాగు విస్తీర్ణాన్ని, పండించే పంటల సంఖ్యను పెంచడం.\nII. నీటిపారుదల సౌకర్యాలు మెరుగుపరచడం, ఎరువులు, అధిక దిగుబడి వంగడాలు (HYV) వాడటం.","o":["I మాత్రమే","II మాత్రమే","I మరియు II రెండూ","I, II రెండూ కావు"],"e":"రెండూ పేర్కొనబడ్డాయి. వ్యవసాయ యాంత్రీకరణ కూడా వ్యవసాయ అభివృద్ధిలో ఒక అంశం.","n":"వ్యవసాయ అభివృద్ధి = పెరుగుతున్న డిమాండ్‌ను తీర్చడానికి వ్యవసాయ ఉత్పత్తిని పెంచే ప్రయత్నాలు."}},{"t":"MCQ","q":"Munna Lal, the small farmer in the case study, lives in village Adilabad of which district?","o":["Adilabad, Telangana","Patna, Bihar","Ghazipur, Uttar Pradesh","Iowa, USA"],"a":2,"e":"Munna Lal lives in Adilabad village in Ghazipur district of Uttar Pradesh and has about 1.5 hectares of farmland.","n":"He rents a tractor and a tubewell and sells milk to a cooperative.","te":{"q":"కేస్ స్టడీలోని చిన్న రైతు మున్నా లాల్ ఏ జిల్లాలోని అదిలాబాద్ గ్రామంలో నివసిస్తాడు?","o":["అదిలాబాద్, తెలంగాణ","పాట్నా, బీహార్","ఘాజీపూర్, ఉత్తరప్రదేశ్","అయోవా, అమెరికా"],"e":"మున్నా లాల్ ఉత్తరప్రదేశ్‌లోని ఘాజీపూర్ జిల్లా అదిలాబాద్ గ్రామంలో నివసిస్తాడు; అతనికి సుమారు 1.5 హెక్టార్ల భూమి ఉంది.","n":"అతను ట్రాక్టర్, బోరుబావిని అద్దెకు తీసుకుంటాడు; పాలను సహకార సంఘానికి అమ్ముతాడు."}},{"t":"MCQ","q":"A typical farm size in the USA is about —","o":["1.5 hectares","250 hectares","25 hectares","2,500 hectares"],"a":1,"e":"‘A typical farm size in the USA is about 250 hectares.’ Joe Horan in Iowa owns about 300 hectares.","n":"The US farmer works like a businessman and not like a peasant farmer.","te":{"q":"అమెరికాలో సాధారణ వ్యవసాయ క్షేత్రం పరిమాణం సుమారు —","o":["1.5 హెక్టార్లు","250 హెక్టార్లు","25 హెక్టార్లు","2,500 హెక్టార్లు"],"e":"‘అమెరికాలో సాధారణ వ్యవసాయ క్షేత్రం పరిమాణం సుమారు 250 హెక్టార్లు.’ అయోవాలో జో హోరాన్‌కు సుమారు 300 హెక్టార్లు ఉన్నాయి.","n":"అమెరికా రైతు ఒక రైతు కూలీలా కాక వ్యాపారవేత్తలా పనిచేస్తాడు."}},{"t":"Assertion–Reason","q":"Assertion (A): Joe Horan, a farmer in Iowa, uses chemical fertilisers and pesticides only wherever required.\nReason (R): His computer is linked to a satellite which gives him a precise picture of his field.","o":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, but R is false","A is false, but R is true"],"a":0,"e":"The satellite picture helps him use chemical fertilisers and pesticides only where required, so R explains A.","n":"He also sends soil samples to a soil testing laboratory to plan a scientific fertiliser programme.","te":{"q":"నిశ్చితవాక్యం (A): అయోవా రైతు జో హోరాన్ రసాయన ఎరువులు, క్రిమిసంహారకాలను అవసరమైన చోట మాత్రమే వాడుతాడు.\nకారణం (R): అతని కంప్యూటర్ ఉపగ్రహంతో అనుసంధానమై అతని పొలం ఖచ్చితమైన చిత్రాన్ని ఇస్తుంది.","o":["A మరియు R రెండూ సరైనవి, R అనేది A కు సరైన వివరణ","A మరియు R రెండూ సరైనవి, కానీ R అనేది A కు సరైన వివరణ కాదు","A సరైనది, కానీ R తప్పు","A తప్పు, కానీ R సరైనది"],"e":"ఉపగ్రహ చిత్రం సహాయంతో అతను రసాయన ఎరువులు, క్రిమిసంహారకాలను అవసరమైన చోట మాత్రమే వాడుతాడు; కాబట్టి R అనేది A ను వివరిస్తుంది.","n":"శాస్త్రీయ ఎరువుల ప్రణాళిక కోసం అతను నేల నమూనాలను భూసార పరీక్షా కేంద్రానికి పంపుతాడు."}},{"t":"Assertion–Reason","q":"Assertion (A): Majority of small farmers in India are forced to sell their produce even when the market is not favourable.\nReason (R): They lack storage facilities.","o":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, but R is false","A is false, but R is true"],"a":0,"e":"The textbook says since most farmers lack storage facilities they are forced to sell even when the market is unfavourable. R explains A.","n":"In recent years the government has taken steps to develop storage facilities.","te":{"q":"నిశ్చితవాక్యం (A): భారతదేశంలో చాలామంది చిన్న రైతులు మార్కెట్ అనుకూలంగా లేనప్పుడు కూడా తమ ఉత్పత్తిని అమ్మవలసి వస్తుంది.\nకారణం (R): వారికి నిల్వ సౌకర్యాలు లేవు.","o":["A మరియు R రెండూ సరైనవి, R అనేది A కు సరైన వివరణ","A మరియు R రెండూ సరైనవి, కానీ R అనేది A కు సరైన వివరణ కాదు","A సరైనది, కానీ R తప్పు","A తప్పు, కానీ R సరైనది"],"e":"చాలామంది రైతులకు నిల్వ సౌకర్యాలు లేకపోవడం వల్ల మార్కెట్ అనుకూలంగా లేకపోయినా అమ్మవలసి వస్తుందని పాఠ్యపుస్తకం చెబుతుంది. R అనేది A ను వివరిస్తుంది.","n":"ఇటీవలి సంవత్సరాల్లో ప్రభుత్వం నిల్వ సౌకర్యాల అభివృద్ధికి చర్యలు చేపట్టింది."}}]},{"id":"his1","subject":"History","unit":"Our Pasts","no":1,"title":"How, When and Where","te":{"subject":"చరిత్ర","unit":"మన గతం","title":"ఎలా, ఎప్పుడు, ఎక్కడ"},"questions":[{"t":"MCQ","q":"Who published ‘A History of British India’ in 1817?","o":["James Rennel","James Mill","James Prinsep","Edmund Burke"],"a":1,"e":"In 1817 James Mill, a Scottish economist and political philosopher, published a massive three-volume work, A History of British India.","n":"He divided Indian history into Hindu, Muslim and British periods.","te":{"q":"1817లో ‘ఎ హిస్టరీ ఆఫ్ బ్రిటిష్ ఇండియా’ (బ్రిటిష్ భారతదేశ చరిత్ర) ప్రచురించినది ఎవరు?","o":["జేమ్స్ రెన్నెల్","జేమ్స్ మిల్","జేమ్స్ ప్రిన్సెప్","ఎడ్మండ్ బర్క్"],"e":"1817లో స్కాటిష్ ఆర్థికవేత్త, రాజకీయ తత్వవేత్త జేమ్స్ మిల్ మూడు సంపుటాల బృహత్ గ్రంథం ‘ఎ హిస్టరీ ఆఫ్ బ్రిటిష్ ఇండియా’ ప్రచురించాడు.","n":"అతను భారత చరిత్రను హిందూ, ముస్లిం, బ్రిటిష్ యుగాలుగా విభజించాడు."}},{"t":"MCQ","q":"James Mill divided Indian history into which three periods?","o":["Ancient, Medieval and Modern","Hindu, Muslim and Christian","Hindu, Muslim and British","Vedic, Mughal and Colonial"],"a":2,"e":"Mill’s periodisation was Hindu, Muslim and British. The textbook’s true/false exercise says ‘Hindu, Muslim, Christian’ is false.","n":"This periodisation came to be widely accepted, but it has serious problems.","te":{"q":"జేమ్స్ మిల్ భారత చరిత్రను ఏ మూడు యుగాలుగా విభజించాడు?","o":["ప్రాచీన, మధ్యయుగ, ఆధునిక","హిందూ, ముస్లిం, క్రైస్తవ","హిందూ, ముస్లిం, బ్రిటిష్","వైదిక, మొఘల్, వలస"],"e":"మిల్ కాలవిభజన హిందూ, ముస్లిం, బ్రిటిష్. ‘హిందూ, ముస్లిం, క్రైస్తవ’ అనేది తప్పని పాఠ్యపుస్తక సత్యాసత్య అభ్యాసం చెబుతుంది.","n":"ఈ కాలవిభజన విస్తృతంగా ఆమోదం పొందింది, కానీ దీనిలో తీవ్రమైన సమస్యలు ఉన్నాయి."}},{"t":"Assertion–Reason","q":"Assertion (A): Historians criticise James Mill’s periodisation of Indian history.\nReason (R): It characterises an age only through the religion of the rulers, ignoring the variety of faiths that existed simultaneously.","o":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, but R is false","A is false, but R is true"],"a":0,"e":"The textbook asks: why characterise an age only through the religion of the rulers? Doing so suggests the lives and practices of others do not matter. R explains A.","n":"Even rulers in ancient India did not all share the same faith.","te":{"q":"నిశ్చితవాక్యం (A): జేమ్స్ మిల్ భారత చరిత్ర కాలవిభజనను చరిత్రకారులు విమర్శిస్తారు.\nకారణం (R): అది ఒక యుగాన్ని పాలకుల మతం ఆధారంగా మాత్రమే వర్ణిస్తూ, అదే సమయంలో ఉన్న వివిధ మతాలను విస్మరిస్తుంది.","o":["A మరియు R రెండూ సరైనవి, R అనేది A కు సరైన వివరణ","A మరియు R రెండూ సరైనవి, కానీ R అనేది A కు సరైన వివరణ కాదు","A సరైనది, కానీ R తప్పు","A తప్పు, కానీ R సరైనది"],"e":"ఒక యుగాన్ని పాలకుల మతం ఆధారంగానే ఎందుకు వర్ణించాలని పాఠ్యపుస్తకం ప్రశ్నిస్తుంది; అలా చేస్తే ఇతరుల జీవితాలు, ఆచారాలు ముఖ్యం కాదని అర్థం వస్తుంది. R అనేది A ను వివరిస్తుంది.","n":"ప్రాచీన భారతదేశంలో కూడా పాలకులందరూ ఒకే మతాన్ని అనుసరించలేదు."}},{"t":"Statements","q":"Consider the following statements about James Mill’s views:\nI. He thought all Asian societies were at a lower level of civilisation than Europe.\nII. He suggested that the British should conquer all territories in India for the ‘enlightenment’ of Indians.","o":["I only","II only","Both I and II","Neither I nor II"],"a":2,"e":"Both are given in the textbook. Mill felt British rule could civilise India by introducing European manners, arts, institutions and laws.","n":"In Mill’s view, the period before British rule was one of ‘darkness’.","te":{"q":"జేమ్స్ మిల్ అభిప్రాయాల గురించి కింది వాక్యాలను పరిశీలించండి:\nI. ఆసియా సమాజాలన్నీ ఐరోపా కంటే తక్కువ నాగరికత స్థాయిలో ఉన్నాయని అతను భావించాడు.\nII. భారతీయుల ‘జ్ఞానోదయం’ కోసం బ్రిటిష్ వారు భారతదేశంలోని అన్ని ప్రాంతాలను జయించాలని అతను సూచించాడు.","o":["I మాత్రమే","II మాత్రమే","I మరియు II రెండూ","I, II రెండూ కావు"],"e":"రెండూ పాఠ్యపుస్తకంలో ఉన్నాయి. యూరోపియన్ ఆచారాలు, కళలు, సంస్థలు, చట్టాలను ప్రవేశపెట్టడం ద్వారా బ్రిటిష్ పాలన భారతదేశాన్ని నాగరికం చేయగలదని మిల్ భావించాడు.","n":"మిల్ దృష్టిలో బ్రిటిష్ పాలనకు ముందు కాలం ‘చీకటి యుగం’."}},{"t":"MCQ","q":"Many historians refer to the period of British rule in India as —","o":["Modern","Medieval","Colonial","Enlightened"],"a":2,"e":"Since under British rule people did not have equality, freedom or liberty, and it was not a period of economic growth, many historians call it ‘colonial’.","n":"The ancient–medieval–modern division was borrowed from the West.","te":{"q":"చాలామంది చరిత్రకారులు భారతదేశంలో బ్రిటిష్ పాలనా కాలాన్ని ఏమని పిలుస్తారు?","o":["ఆధునిక","మధ్యయుగ","వలస (కలోనియల్)","జ్ఞానోదయ"],"e":"బ్రిటిష్ పాలనలో ప్రజలకు సమానత్వం, స్వేచ్ఛ లేవు, ఆర్థిక వృద్ధి కాలం కూడా కాదు; కాబట్టి చాలామంది చరిత్రకారులు దీనిని ‘వలస’ కాలం అంటారు.","n":"ప్రాచీన-మధ్యయుగ-ఆధునిక విభజన పాశ్చాత్య దేశాల నుండి తీసుకున్నది."}},{"t":"MCQ","q":"When the subjugation of one country by another leads to political, economic, social and cultural changes, the process is called —","o":["Industrialisation","Modernisation","Globalisation","Colonisation"],"a":3,"e":"The textbook defines this process as colonisation.","n":"The book is called ‘Our Pasts’ (plural) because different groups experienced these changes differently.","te":{"q":"ఒక దేశాన్ని మరొక దేశం లోబరుచుకోవడం రాజకీయ, ఆర్థిక, సామాజిక, సాంస్కృతిక మార్పులకు దారితీస్తే ఆ ప్రక్రియను ఏమంటారు?","o":["పారిశ్రామికీకరణ","ఆధునికీకరణ","ప్రపంచీకరణ","వలసీకరణ"],"e":"పాఠ్యపుస్తకం ఈ ప్రక్రియను వలసీకరణ (కలోనైజేషన్)గా నిర్వచిస్తుంది.","n":"వివిధ వర్గాలు ఈ మార్పులను వేర్వేరుగా అనుభవించినందున పుస్తకానికి ‘మన గతం’ (బహువచనం – Our Pasts) అని పేరు పెట్టారు."}},{"t":"MCQ","q":"Who was asked by Robert Clive to produce maps of Hindustan?","o":["James Mill","James Prinsep","Warren Hastings","James Rennel"],"a":3,"e":"James Rennel was asked by Robert Clive to produce maps of Hindustan. He saw map-making as essential to the process of domination.","n":"Fig. 1: ‘Brahmans offering the Shastras to Britannia’, frontispiece to Rennel’s first map, 1782.","te":{"q":"హిందుస్థాన్ పటాలను తయారు చేయమని రాబర్ట్ క్లైవ్ ఎవరిని కోరాడు?","o":["జేమ్స్ మిల్","జేమ్స్ ప్రిన్సెప్","వారెన్ హేస్టింగ్స్","జేమ్స్ రెన్నెల్"],"e":"హిందుస్థాన్ పటాలు తయారు చేయమని రాబర్ట్ క్లైవ్ జేమ్స్ రెన్నెల్‌ను కోరాడు. పటాల తయారీని ఆధిపత్య ప్రక్రియలో తప్పనిసరి భాగంగా అతను భావించాడు.","n":"పటం 1: ‘బ్రిటానియాకు శాస్త్రాలను సమర్పిస్తున్న బ్రాహ్మణులు’, రెన్నెల్ మొదటి పటానికి ముఖచిత్రం, 1782."}},{"t":"MCQ","q":"The frontispiece to James Rennel’s first map (1782) shows —","o":["The Battle of Plassey","Tipu Sultan’s toy tiger","The trial of Warren Hastings","Brahmans offering the Shastras to Britannia"],"a":3,"e":"The picture suggests Indians willingly gave their ancient texts to Britannia, the symbol of British power, as if asking her to protect Indian culture.","n":"It projects an imperial perception.","te":{"q":"జేమ్స్ రెన్నెల్ మొదటి పటం (1782) ముఖచిత్రం చూపించేది —","o":["ప్లాసీ యుద్ధం","టిప్పు సుల్తాన్ బొమ్మ పులి","వారెన్ హేస్టింగ్స్ విచారణ","బ్రిటానియాకు శాస్త్రాలను సమర్పిస్తున్న బ్రాహ్మణులు"],"e":"బ్రిటిష్ అధికార చిహ్నమైన బ్రిటానియాకు భారతీయులు తమ ప్రాచీన గ్రంథాలను స్వచ్ఛందంగా అప్పగించి, భారత సంస్కృతికి రక్షకురాలిగా ఉండమని కోరుతున్నట్లు ఈ చిత్రం సూచిస్తుంది.","n":"ఇది సామ్రాజ్యవాద దృక్పథాన్ని ప్రతిబింబిస్తుంది."}},{"t":"MCQ","q":"The 1922 Lipton tea advertisement shows on horseback —","o":["Prince Arthur, Duke of Connaught","Robert Clive","Lord Mountbatten","Lord Dalhousie"],"a":0,"e":"The seated rider is Prince Arthur, the third son of Queen Victoria, who was given the title Duke of Connaught.","n":"Old advertisements help us understand how markets for new products and new tastes were created.","te":{"q":"1922 లిప్టన్ టీ ప్రకటనలో గుర్రంపై కూర్చున్నది —","o":["ప్రిన్స్ ఆర్థర్, డ్యూక్ ఆఫ్ కన్నాట్","రాబర్ట్ క్లైవ్","లార్డ్ మౌంట్‌బాటెన్","లార్డ్ డల్హౌసీ"],"e":"గుర్రంపై కూర్చున్నది విక్టోరియా రాణి మూడవ కుమారుడు ప్రిన్స్ ఆర్థర్; అతనికి డ్యూక్ ఆఫ్ కన్నాట్ బిరుదు ఉంది.","n":"కొత్త ఉత్పత్తులకు మార్కెట్లు, కొత్త అభిరుచులు ఎలా సృష్టించబడ్డాయో పాత ప్రకటనలు తెలియజేస్తాయి."}},{"t":"MCQ","q":"Histories written by British historians began with the first Governor-General and ended with the last Viceroy. Who were they?","o":["Robert Clive and Lord Curzon","Warren Hastings and Lord Mountbatten","Lord Cornwallis and Lord Irwin","Lord Wellesley and Lord Dalhousie"],"a":1,"e":"These histories began with Warren Hastings, the first Governor-General, and ended with Lord Mountbatten, the last Viceroy.","n":"Warren Hastings became the first Governor-General of India in 1773.","te":{"q":"బ్రిటిష్ చరిత్రకారులు రాసిన చరిత్రలు మొదటి గవర్నర్ జనరల్‌తో మొదలై చివరి వైస్రాయ్‌తో ముగిశాయి. వారు ఎవరు?","o":["రాబర్ట్ క్లైవ్, లార్డ్ కర్జన్","వారెన్ హేస్టింగ్స్, లార్డ్ మౌంట్‌బాటెన్","లార్డ్ కారన్‌వాలిస్, లార్డ్ ఇర్విన్","లార్డ్ వెల్లస్లీ, లార్డ్ డల్హౌసీ"],"e":"ఈ చరిత్రలు మొదటి గవర్నర్ జనరల్ వారెన్ హేస్టింగ్స్‌తో మొదలై చివరి వైస్రాయ్ లార్డ్ మౌంట్‌బాటెన్‌తో ముగిశాయి.","n":"వారెన్ హేస్టింగ్స్ 1773లో భారతదేశ మొదటి గవర్నర్ జనరల్ అయ్యాడు."}},{"t":"MCQ","q":"Warren Hastings became the first Governor-General of India in —","o":["1773","1757","1765","1793"],"a":0,"e":"Fig. 3 caption: Warren Hastings became the first Governor-General of India in 1773.","n":"Biographies glorified Governor-Generals and paintings projected them as powerful figures.","te":{"q":"వారెన్ హేస్టింగ్స్ భారతదేశ మొదటి గవర్నర్ జనరల్ అయిన సంవత్సరం —","o":["1773","1757","1765","1793"],"e":"పటం 3 వ్యాఖ్య: వారెన్ హేస్టింగ్స్ 1773లో భారతదేశ మొదటి గవర్నర్ జనరల్ అయ్యాడు.","n":"జీవిత చరిత్రలు గవర్నర్ జనరల్‌లను కీర్తించగా, చిత్రాలు వారిని శక్తిమంతులుగా చూపించాయి."}},{"t":"Assertion–Reason","q":"Assertion (A): The British set up record rooms attached to all administrative institutions.\nReason (R): The British believed that all important documents and letters needed to be carefully preserved.","o":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, but R is false","A is false, but R is true"],"a":0,"e":"Because they believed in preserving documents, they set up record rooms in the tahsildar’s office, collectorate, commissioner’s office, provincial secretariats and law courts.","n":"Archives and museums were also established to preserve important records.","te":{"q":"నిశ్చితవాక్యం (A): బ్రిటిష్ వారు అన్ని పరిపాలనా సంస్థలకు అనుబంధంగా రికార్డు గదులను ఏర్పాటు చేశారు.\nకారణం (R): ముఖ్యమైన పత్రాలు, లేఖలన్నింటినీ జాగ్రత్తగా భద్రపరచాలని బ్రిటిష్ వారు విశ్వసించారు.","o":["A మరియు R రెండూ సరైనవి, R అనేది A కు సరైన వివరణ","A మరియు R రెండూ సరైనవి, కానీ R అనేది A కు సరైన వివరణ కాదు","A సరైనది, కానీ R తప్పు","A తప్పు, కానీ R సరైనది"],"e":"పత్రాల భద్రతపై నమ్మకం వల్ల తహసీల్దారు కార్యాలయం, కలెక్టరేట్, కమిషనర్ కార్యాలయం, ప్రాంతీయ సచివాలయాలు, న్యాయస్థానాల్లో రికార్డు గదులు ఏర్పాటు చేశారు.","n":"ముఖ్యమైన రికార్డులను భద్రపరచడానికి ఆర్కైవ్‌లు, మ్యూజియంలు కూడా స్థాపించారు."}},{"t":"MCQ","q":"In the early 19th century, official documents were carefully copied out by —","o":["Printers","Clerks using typewriters","Calligraphists","Translators"],"a":2,"e":"Documents were copied and beautifully written by calligraphists — those who specialised in the art of beautiful writing.","n":"By the mid-19th century, with the spread of printing, multiple copies were printed as proceedings.","te":{"q":"19వ శతాబ్దం ప్రారంభంలో అధికారిక పత్రాలను జాగ్రత్తగా నకలు రాసినవారు —","o":["ముద్రణాకారులు","టైప్‌రైటర్ వాడే గుమాస్తాలు","కాలిగ్రాఫిస్టులు (అందమైన చేతిరాత నిపుణులు)","అనువాదకులు"],"e":"అందమైన చేతిరాత కళలో నిపుణులైన కాలిగ్రాఫిస్టులు పత్రాలను నకలు రాసి అందంగా రాశారు.","n":"19వ శతాబ్దం మధ్య నాటికి ముద్రణ వ్యాప్తితో అనేక ప్రతులు ముద్రించబడ్డాయి."}},{"t":"MCQ","q":"The National Archives of India came up in the —","o":["1850s","1920s","1880s","1950s"],"a":1,"e":"Fig. 4 caption: The National Archives of India came up in the 1920s.","n":"When New Delhi was built, the National Museum and National Archives were located close to the Viceregal Palace.","te":{"q":"భారత జాతీయ అభిలేఖాగారం (నేషనల్ ఆర్కైవ్స్) ఏర్పడిన కాలం —","o":["1850లు","1920లు","1880లు","1950లు"],"e":"పటం 4 వ్యాఖ్య: భారత జాతీయ అభిలేఖాగారం 1920లలో ఏర్పడింది.","n":"న్యూఢిల్లీ నిర్మించినప్పుడు జాతీయ మ్యూజియం, జాతీయ అభిలేఖాగారం వైస్రాయ్ భవనానికి దగ్గరగా ఏర్పాటు చేశారు."}},{"t":"MCQ","q":"The location of the National Museum and National Archives close to the Viceregal Palace reflects —","o":["Lack of space in Delhi","Their importance in British imagination","Their use as military stores","Their link with Parliament"],"a":1,"e":"The textbook says this location reflects the importance these institutions had in British imagination.","n":"Official records were central to British administration.","te":{"q":"జాతీయ మ్యూజియం, జాతీయ అభిలేఖాగారం వైస్రాయ్ భవనానికి దగ్గరగా ఉండటం దేనిని ప్రతిబింబిస్తుంది?","o":["ఢిల్లీలో స్థలం కొరత","బ్రిటిష్ వారి ఊహల్లో వాటికున్న ప్రాముఖ్యత","సైనిక గిడ్డంగులుగా వాటి వినియోగం","పార్లమెంటుతో వాటి సంబంధం"],"e":"ఈ స్థానం బ్రిటిష్ వారి ఊహల్లో ఈ సంస్థలకున్న ప్రాముఖ్యతను ప్రతిబింబిస్తుందని పాఠ్యపుస్తకం చెబుతుంది.","n":"బ్రిటిష్ పరిపాలనలో అధికారిక రికార్డులు కేంద్ర స్థానం పొందాయి."}},{"t":"MCQ","q":"In 1946, the colonial government was trying to put down a mutiny that broke out on the ships of the —","o":["Royal Indian Air Force","Royal Indian Navy","Indian National Army","Bengal Army"],"a":1,"e":"The Home Department received reports from dockyards about the mutiny on ships of the Royal Indian Navy in 1946.","n":"Karachi reported 301 mutineers under arrest.","te":{"q":"1946లో వలస ప్రభుత్వం ఏ నౌకల్లో చెలరేగిన తిరుగుబాటును అణచడానికి ప్రయత్నించింది?","o":["రాయల్ ఇండియన్ ఎయిర్ ఫోర్స్","రాయల్ ఇండియన్ నేవీ","ఇండియన్ నేషనల్ ఆర్మీ","బెంగాల్ ఆర్మీ"],"e":"1946లో రాయల్ ఇండియన్ నేవీ నౌకల్లో తిరుగుబాటు గురించి హోం శాఖకు రేవుల నుండి నివేదికలు అందాయి.","n":"కరాచీలో 301 మంది తిరుగుబాటుదారులు అరెస్టయ్యారని నివేదిక."}},{"t":"Statements","q":"Consider the following about surveys under colonial rule:\nI. The British believed a country had to be properly known before it could be effectively administered.\nII. From the end of the nineteenth century, Census operations were held every ten years.","o":["I only","II only","Both I and II","Neither I nor II"],"a":2,"e":"Both are given in the textbook. Census recorded the number of people, castes, religions and occupations.","n":"Other surveys: botanical, zoological, archaeological, anthropological and forest surveys.","te":{"q":"వలస పాలనలో సర్వేల గురించి కింది వాక్యాలను పరిశీలించండి:\nI. ఒక దేశాన్ని సమర్థంగా పరిపాలించాలంటే ముందు దానిని సరిగ్గా తెలుసుకోవాలని బ్రిటిష్ వారు విశ్వసించారు.\nII. 19వ శతాబ్దం చివరి నుండి ప్రతి పది సంవత్సరాలకు జనాభా లెక్కలు (సెన్సస్) నిర్వహించారు.","o":["I మాత్రమే","II మాత్రమే","I మరియు II రెండూ","I, II రెండూ కావు"],"e":"రెండూ పాఠ్యపుస్తకంలో ఉన్నాయి. జనాభా లెక్కలు ప్రజల సంఖ్య, కులాలు, మతాలు, వృత్తులను నమోదు చేశాయి.","n":"ఇతర సర్వేలు: వృక్ష, జంతు, పురావస్తు, మానవశాస్త్ర, అటవీ సర్వేలు."}},{"t":"MCQ","q":"Revenue surveys in villages tried to know the —","o":["Only the population","Only the number of temples","Only the names of zamindars","Topography, soil quality, flora, fauna, local histories and cropping pattern"],"a":3,"e":"Revenue surveys tried to record all facts seen as necessary to administer a region.","n":"The British thought surveys were important for effective administration (true).","te":{"q":"గ్రామాల్లో రెవెన్యూ సర్వేలు తెలుసుకోవడానికి ప్రయత్నించినవి —","o":["జనాభా మాత్రమే","దేవాలయాల సంఖ్య మాత్రమే","జమీందారుల పేర్లు మాత్రమే","భూస్వరూపం, నేల నాణ్యత, వృక్షజాలం, జంతుజాలం, స్థానిక చరిత్రలు, పంటల సరళి"],"e":"ఒక ప్రాంతాన్ని పరిపాలించడానికి అవసరమని భావించిన అన్ని వాస్తవాలను రెవెన్యూ సర్వేలు నమోదు చేయడానికి ప్రయత్నించాయి.","n":"సమర్థ పరిపాలనకు సర్వేలు ముఖ్యమని బ్రిటిష్ వారు భావించారు (సరైనది)."}},{"t":"MCQ","q":"The drawing of mapping and survey operations in progress in Bengal (1832) was made by —","o":["James Rennel","William Simpson","Tilly Kettle","James Prinsep"],"a":3,"e":"Fig. 6: a drawing by James Prinsep, 1832. Instruments are placed in the foreground to emphasise the scientific nature of the project.","n":"Images project the viewpoint of those who create them.","te":{"q":"బెంగాల్‌లో జరుగుతున్న పటాల తయారీ, సర్వే కార్యకలాపాల చిత్రం (1832) గీసినది —","o":["జేమ్స్ రెన్నెల్","విలియం సింప్సన్","టిల్లీ కెటిల్","జేమ్స్ ప్రిన్సెప్"],"e":"పటం 6: జేమ్స్ ప్రిన్సెప్ గీసిన చిత్రం, 1832. ప్రాజెక్టు శాస్త్రీయ స్వభావాన్ని నొక్కి చెప్పడానికి సర్వే పరికరాలను ముందు భాగంలో ఉంచారు.","n":"చిత్రాలు వాటిని గీసినవారి దృక్కోణాన్ని ప్రతిబింబిస్తాయి."}},{"t":"MCQ","q":"Which of the following is a limitation of official records?","o":["They are always inaccurate","They are written in Persian","They are not preserved","They tell us what officials thought, not what other people in the country felt"],"a":3,"e":"Official records tell us what officials thought and wished to preserve, but not always what other people felt and what lay behind their actions.","n":"The textbook exercise: ‘Official documents help us understand what the people of the country think’ is FALSE.","te":{"q":"కింది వాటిలో అధికారిక రికార్డుల పరిమితి ఏది?","o":["అవి ఎప్పుడూ తప్పుగా ఉంటాయి","అవి పర్షియన్‌లో రాయబడ్డాయి","అవి భద్రపరచబడలేదు","అధికారులు ఏమనుకున్నారో చెబుతాయి కానీ దేశంలోని ఇతర ప్రజలు ఏమనుకున్నారో చెప్పవు"],"e":"అధికారిక రికార్డులు అధికారులు ఏమనుకున్నారో, ఏమి భద్రపరచాలనుకున్నారో చెబుతాయి కానీ ఇతర ప్రజల భావాలను, వారి చర్యల వెనుక కారణాలను ఎప్పుడూ చెప్పవు.","n":"‘అధికారిక పత్రాలు దేశ ప్రజల ఆలోచనలను అర్థం చేసుకోవడానికి సహాయపడతాయి’ అనేది తప్పు."}},{"t":"MCQ","q":"Which of the following sources is NOT produced by the literate alone?","o":["Diaries","Autobiographies","Newspapers","None — all these were produced by the literate"],"a":3,"e":"The textbook says diaries, travellers’ accounts, autobiographies, booklets and newspapers were all produced by the literate, so they do not tell us how tribals, peasants and the poor lived.","n":"Getting to know the lives of the poor is a more difficult task.","te":{"q":"కింది ఆధారాల్లో అక్షరాస్యులు మాత్రమే రూపొందించనిది ఏది?","o":["డైరీలు","ఆత్మకథలు","వార్తాపత్రికలు","ఏదీ కాదు — ఇవన్నీ అక్షరాస్యులే రూపొందించారు"],"e":"డైరీలు, యాత్రికుల కథనాలు, ఆత్మకథలు, కరపత్రాలు, వార్తాపత్రికలు అన్నీ అక్షరాస్యులే రూపొందించారని, కాబట్టి గిరిజనులు, రైతులు, పేదల జీవితాలు వీటి ద్వారా తెలియవని పాఠ్యపుస్తకం చెబుతుంది.","n":"పేదల జీవితాలను తెలుసుకోవడం మరింత కష్టమైన పని."}},{"t":"MCQ","q":"The 1946 report ‘Not fit for human consumption’ was about a strike by —","o":["Mill workers in Bombay","Navy sailors in Karachi","Policemen in Delhi","Railway workers in Madras"],"a":2,"e":"More than 2000 policemen in Delhi refused to take their food as a protest against low salaries and bad quality of food from the Police Lines kitchen.","n":"Source: Hindustan Times, 22 March 1946.","te":{"q":"1946 నాటి ‘మనుషులు తినడానికి పనికిరాదు’ నివేదిక ఎవరి సమ్మె గురించి?","o":["బొంబాయి మిల్లు కార్మికులు","కరాచీ నౌకాదళ నావికులు","ఢిల్లీ పోలీసులు","మద్రాసు రైల్వే కార్మికులు"],"e":"తక్కువ జీతాలు, పోలీస్ లైన్స్ వంటశాల నుండి వచ్చే నాసిరకం ఆహారానికి నిరసనగా ఢిల్లీలో 2000 మందికి పైగా పోలీసులు ఆహారం తీసుకోవడానికి నిరాకరించారు.","n":"ఆధారం: హిందుస్తాన్ టైమ్స్, 22 మార్చి 1946."}},{"t":"MCQ","q":"The image ‘Mutinous sepoys share the loot’ shows how British representations portrayed the rebels of 1857 as —","o":["Brave and patriotic","Greedy, vicious and brutal","Peaceful farmers","Loyal soldiers"],"a":1,"e":"In British representations, the rebels appear as greedy, vicious and brutal (Fig. 7).","n":"Images must be carefully studied since they project the creator’s viewpoint.","te":{"q":"‘తిరుగుబాటు సిపాయిలు దోపిడీ సొమ్ము పంచుకుంటున్నారు’ అనే చిత్రం 1857 తిరుగుబాటుదారులను బ్రిటిష్ వారు ఎలా చిత్రించారో చూపిస్తుంది. వారిని ఎలా చూపించారు?","o":["ధైర్యవంతులు, దేశభక్తులుగా","అత్యాశాపరులు, దుష్టులు, క్రూరులుగా","శాంతియుత రైతులుగా","విధేయ సైనికులుగా"],"e":"బ్రిటిష్ చిత్రణల్లో తిరుగుబాటుదారులు అత్యాశాపరులు, దుష్టులు, క్రూరులుగా కనిపిస్తారు (పటం 7).","n":"చిత్రాలు వాటిని రూపొందించినవారి దృక్కోణాన్ని చూపిస్తాయి కాబట్టి జాగ్రత్తగా అధ్యయనం చేయాలి."}},{"t":"Assertion–Reason","q":"Assertion (A): We cannot fix one single date on which British rule was established.\nReason (R): Processes like the establishment of British rule happened over a stretch of time.","o":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, but R is false","A is false, but R is true"],"a":0,"e":"The textbook says such changes happened over a span of time, so precise dates cannot be fixed. R explains A.","n":"Similarly, people did not begin drinking tea one fine day.","te":{"q":"నిశ్చితవాక్యం (A): బ్రిటిష్ పాలన స్థాపించబడిన ఒకే ఒక్క తేదీని మనం నిర్ణయించలేము.\nకారణం (R): బ్రిటిష్ పాలన స్థాపన వంటి ప్రక్రియలు సుదీర్ఘ కాలవ్యవధిలో జరిగాయి.","o":["A మరియు R రెండూ సరైనవి, R అనేది A కు సరైన వివరణ","A మరియు R రెండూ సరైనవి, కానీ R అనేది A కు సరైన వివరణ కాదు","A సరైనది, కానీ R తప్పు","A తప్పు, కానీ R సరైనది"],"e":"ఇలాంటి మార్పులు ఒక కాలవ్యవధిలో జరిగాయి కాబట్టి ఖచ్చితమైన తేదీలు నిర్ణయించలేమని పాఠ్యపుస్తకం చెబుతుంది. R అనేది A ను వివరిస్తుంది.","n":"అదే విధంగా, ప్రజలు ఒకే రోజు టీ తాగడం మొదలుపెట్టలేదు."}},{"t":"MCQ","q":"Why do historians try to divide history into different periods?","o":["To capture the characteristics of a time and its central features","To make history shorter","To glorify rulers","To avoid dates"],"a":0,"e":"The textbook says we periodise in an attempt to capture the characteristics of a time, its central features as they appear to us.","n":"The terms we use to periodise reflect our ideas about the past.","te":{"q":"చరిత్రకారులు చరిత్రను వివిధ కాలాలుగా ఎందుకు విభజిస్తారు?","o":["ఒక కాలపు లక్షణాలను, ప్రధాన అంశాలను పట్టుకోవడానికి","చరిత్రను చిన్నదిగా చేయడానికి","పాలకులను కీర్తించడానికి","తేదీలను తప్పించుకోవడానికి"],"e":"ఒక కాలపు లక్షణాలను, మనకు కనిపించే దాని ప్రధాన అంశాలను పట్టుకునే ప్రయత్నంలో కాలవిభజన చేస్తామని పాఠ్యపుస్తకం చెబుతుంది.","n":"కాలవిభజనకు మనం వాడే పదాలు గతం గురించిన మన ఆలోచనలను ప్రతిబింబిస్తాయి."}},{"t":"MCQ","q":"The modern period, in the Western sense, was associated with the growth of —","o":["Science, reason, democracy, liberty and equality","Feudalism and monarchy","Religious intolerance","Colonial rule"],"a":0,"e":"The ancient–medieval–modern division was borrowed from the West, where ‘modern’ meant the forces of science, reason, democracy, liberty and equality.","n":"Under British rule Indians did not have equality, freedom or liberty, so the term is problematic for India.","te":{"q":"పాశ్చాత్య అర్థంలో ఆధునిక కాలం దేని వృద్ధితో ముడిపడి ఉంది?","o":["విజ్ఞానశాస్త్రం, హేతువాదం, ప్రజాస్వామ్యం, స్వేచ్ఛ, సమానత్వం","భూస్వామ్య వ్యవస్థ, రాచరికం","మత అసహనం","వలస పాలన"],"e":"ప్రాచీన-మధ్యయుగ-ఆధునిక విభజన పాశ్చాత్య దేశాల నుండి తీసుకున్నది; అక్కడ ‘ఆధునిక’ అంటే విజ్ఞానశాస్త్రం, హేతువాదం, ప్రజాస్వామ్యం, స్వేచ్ఛ, సమానత్వ శక్తులు.","n":"బ్రిటిష్ పాలనలో భారతీయులకు సమానత్వం, స్వేచ్ఛ లేవు, కాబట్టి భారతదేశానికి ఈ పదం సమస్యాత్మకం."}}]},{"id":"his2","subject":"History","unit":"Our Pasts","no":2,"title":"From Trade to Territory: The Company Establishes Power","te":{"subject":"చరిత్ర","unit":"మన గతం","title":"వ్యాపారం నుండి సామ్రాజ్యం వరకు: కంపెనీ అధికార స్థాపన"},"questions":[{"t":"MCQ","q":"Aurangzeb, the last of the powerful Mughal rulers, died in —","o":["1657","1707","1757","1764"],"a":1,"e":"After Aurangzeb’s death in 1707, many Mughal governors (subadars) and big zamindars began establishing regional kingdoms.","n":"Delhi could no longer function as an effective centre.","te":{"q":"శక్తిమంతమైన మొఘల్ పాలకుల్లో చివరివాడైన ఔరంగజేబు మరణించిన సంవత్సరం —","o":["1657","1707","1757","1764"],"e":"1707లో ఔరంగజేబు మరణం తర్వాత చాలామంది మొఘల్ గవర్నర్లు (సుబేదార్లు), పెద్ద జమీందారులు ప్రాంతీయ రాజ్యాలు స్థాపించడం మొదలుపెట్టారు.","n":"ఢిల్లీ ఇక సమర్థవంతమైన కేంద్రంగా పనిచేయలేకపోయింది."}},{"t":"MCQ","q":"Which Mughal emperor was seen as the natural leader of the 1857 revolt?","o":["Bahadur Shah Zafar","Akbar II","Shah Alam II","Farrukhsiyar"],"a":0,"e":"Bahadur Shah Zafar was seen as the natural leader. After the revolt was put down he was forced to leave the kingdom and his sons were shot.","n":"Fig. 1: Bahadur Shah Zafar and his sons arrested by Captain Hodson.","te":{"q":"1857 తిరుగుబాటుకు సహజ నాయకుడిగా భావించబడిన మొఘల్ చక్రవర్తి ఎవరు?","o":["బహదూర్ షా జఫర్","అక్బర్ II","షా ఆలం II","ఫరూఖ్‌సియర్"],"e":"బహదూర్ షా జఫర్‌ను సహజ నాయకుడిగా భావించారు. తిరుగుబాటు అణచివేత తర్వాత అతన్ని రాజ్యం వదిలి వెళ్లమన్నారు, అతని కుమారులను కాల్చి చంపారు.","n":"పటం 1: కెప్టెన్ హాడ్సన్ బహదూర్ షా జఫర్‌ను, అతని కుమారులను అరెస్టు చేయడం."}},{"t":"MCQ","q":"In 1600, the East India Company acquired a charter granting it the sole right to trade with the East from —","o":["King James I","Queen Victoria","Queen Elizabeth I","King George III"],"a":2,"e":"In 1600 the Company got a charter from Queen Elizabeth I, so no other trading group in England could compete with it.","n":"Mercantile = a business that makes profit by buying cheap and selling dear.","te":{"q":"1600లో తూర్పు దేశాలతో వ్యాపారం చేసే ఏకైక హక్కును ఈస్ట్ ఇండియా కంపెనీకి ఇస్తూ చార్టర్ (అనుమతి పత్రం) ఇచ్చినది —","o":["మొదటి జేమ్స్ రాజు","విక్టోరియా రాణి","మొదటి ఎలిజబెత్ రాణి","మూడవ జార్జ్ రాజు"],"e":"1600లో కంపెనీకి మొదటి ఎలిజబెత్ రాణి నుండి చార్టర్ లభించింది; దీంతో ఇంగ్లాండ్‌లోని మరే వ్యాపార సమూహం దానితో పోటీ పడలేకపోయింది.","n":"మర్కంటైల్ = చౌకగా కొని ఎక్కువ ధరకు అమ్మి లాభం పొందే వ్యాపార సంస్థ."}},{"t":"MCQ","q":"Who discovered the sea route to India in 1498?","o":["Christopher Columbus","Vasco da Gama","Bartholomew Dias","Ferdinand Magellan"],"a":1,"e":"Vasco da Gama, a Portuguese explorer, discovered the sea route to India in 1498.","n":"The Portuguese had their base in Goa.","te":{"q":"1498లో భారతదేశానికి సముద్ర మార్గాన్ని కనుగొన్నది ఎవరు?","o":["క్రిస్టోఫర్ కొలంబస్","వాస్కో డ గామా","బార్తలోమ్యూ డయాస్","ఫెర్డినాండ్ మాగెల్లాన్"],"e":"పోర్చుగీసు అన్వేషకుడు వాస్కో డ గామా 1498లో భారతదేశానికి సముద్ర మార్గాన్ని కనుగొన్నాడు.","n":"పోర్చుగీసు వారి స్థావరం గోవాలో ఉంది."}},{"t":"MCQ","q":"The first English factory in Bengal was set up on the banks of the river Hugli in —","o":["1600","1696","1757","1651"],"a":3,"e":"The first English factory was set up on the banks of the Hugli in 1651. The Company’s traders were known as ‘factors’.","n":"By 1696 the Company began building a fort around the settlement.","te":{"q":"బెంగాల్‌లో మొదటి ఇంగ్లీషు ఫ్యాక్టరీ (వ్యాపార కేంద్రం) హుగ్లీ నది ఒడ్డున ఏర్పాటైన సంవత్సరం —","o":["1600","1696","1757","1651"],"e":"మొదటి ఇంగ్లీషు ఫ్యాక్టరీ 1651లో హుగ్లీ నది ఒడ్డున ఏర్పాటైంది. కంపెనీ వ్యాపారులను ‘ఫ్యాక్టర్లు’ అనేవారు.","n":"1696 నాటికి కంపెనీ ఆ నివాసం చుట్టూ కోట నిర్మించడం మొదలుపెట్టింది."}},{"t":"MCQ","q":"Kalikata, which later grew into the city of Calcutta (Kolkata), was one of the three villages over which the Company got —","o":["Diwani rights","Farman rights","Subsidiary rights","Zamindari rights"],"a":3,"e":"Two years after 1696, the Company bribed Mughal officials into giving it zamindari rights over three villages, including Kalikata.","n":"Aurangzeb also issued a farman for duty-free trade.","te":{"q":"తర్వాత కలకత్తా (కోల్‌కతా) నగరంగా ఎదిగిన కాలికాట, కంపెనీ ఏ హక్కులు పొందిన మూడు గ్రామాల్లో ఒకటి?","o":["దివానీ హక్కులు","ఫర్మానా హక్కులు","సైన్య సహకార హక్కులు","జమీందారీ హక్కులు"],"e":"1696 తర్వాత రెండేళ్లకు కంపెనీ మొఘల్ అధికారులకు లంచం ఇచ్చి కాలికాటతో సహా మూడు గ్రామాలపై జమీందారీ హక్కులు పొందింది.","n":"సుంకం లేని వ్యాపారం కోసం ఔరంగజేబు ఫర్మానా కూడా జారీ చేశాడు."}},{"t":"MCQ","q":"A ‘farman’ is —","o":["A tax","A royal edict or order","A trading post","A revenue estate"],"a":1,"e":"Farman = a royal edict, a royal order. Aurangzeb’s farman granted the Company the right to trade duty free.","n":"Company officials carrying on private trade refused to pay duty, causing revenue loss to Bengal.","te":{"q":"‘ఫర్మానా’ అంటే —","o":["ఒక పన్ను","రాజాజ్ఞ లేదా రాజ ఉత్తర్వు","ఒక వ్యాపార కేంద్రం","ఒక రెవెన్యూ ఎస్టేట్"],"e":"ఫర్మానా = రాజాజ్ఞ, రాజ ఉత్తర్వు. ఔరంగజేబు ఫర్మానా కంపెనీకి సుంకం లేకుండా వ్యాపారం చేసే హక్కును ఇచ్చింది.","n":"ప్రైవేట్ వ్యాపారం చేసే కంపెనీ అధికారులు సుంకం చెల్లించడానికి నిరాకరించడంతో బెంగాల్ ఆదాయం నష్టపోయింది."}},{"t":"MCQ","q":"Which Nawab of Bengal protested when Company officials refused to pay duty on private trade?","o":["Sirajuddaulah","Mir Qasim","Mir Jafar","Murshid Quli Khan"],"a":3,"e":"The textbook asks: ‘How could the Nawab of Bengal, Murshid Quli Khan, not protest?’","n":"He was followed by Alivardi Khan and then Sirajuddaulah.","te":{"q":"ప్రైవేట్ వ్యాపారంపై కంపెనీ అధికారులు సుంకం చెల్లించడానికి నిరాకరించినప్పుడు నిరసన తెలిపిన బెంగాల్ నవాబు ఎవరు?","o":["సిరాజుద్దౌలా","మీర్ ఖాసిం","మీర్ జాఫర్","ముర్షిద్ కులీ ఖాన్"],"e":"‘బెంగాల్ నవాబు ముర్షిద్ కులీ ఖాన్ నిరసన తెలపకుండా ఎలా ఉండగలడు?’ అని పాఠ్యపుస్తకం ప్రశ్నిస్తుంది.","n":"అతని తర్వాత అలీవర్ది ఖాన్, తర్వాత సిరాజుద్దౌలా నవాబులయ్యారు."}},{"t":"Chronology","q":"Arrange the Nawabs of Bengal in the correct order of succession:\n1. Alivardi Khan\n2. Sirajuddaulah\n3. Murshid Quli Khan","o":["3, 1, 2","1, 3, 2","3, 2, 1","2, 1, 3"],"a":0,"e":"Murshid Quli Khan was followed by Alivardi Khan and then Sirajuddaulah.","n":"Each of them was a strong ruler who refused concessions to the Company.","te":{"q":"బెంగాల్ నవాబులను వారి వారసత్వ క్రమంలో అమర్చండి:\n1. అలీవర్ది ఖాన్\n2. సిరాజుద్దౌలా\n3. ముర్షిద్ కులీ ఖాన్","o":["3, 1, 2","1, 3, 2","3, 2, 1","2, 1, 3"],"e":"ముర్షిద్ కులీ ఖాన్ తర్వాత అలీవర్ది ఖాన్, ఆ తర్వాత సిరాజుద్దౌలా.","n":"వీరందరూ కంపెనీకి రాయితీలు ఇవ్వడానికి నిరాకరించిన బలమైన పాలకులు."}},{"t":"Statements","q":"Which of the following were areas of conflict between the Bengal nawabs and the Company?\nI. The nawabs denied the Company the right to mint coins and stopped it from extending fortifications.\nII. The Company refused to pay taxes and wrote disrespectful letters to the nawab.","o":["I only","II only","Both I and II","Neither I nor II"],"a":2,"e":"Both are listed. The nawabs also demanded large tributes for the right to trade.","n":"The Company claimed unjust demands of local officials were ruining its trade.","te":{"q":"కింది వాటిలో బెంగాల్ నవాబులకు, కంపెనీకి మధ్య వివాదాంశాలు ఏవి?\nI. నవాబులు కంపెనీకి నాణేలు ముద్రించే హక్కును నిరాకరించి, కోటల విస్తరణను ఆపారు.\nII. కంపెనీ పన్నులు చెల్లించడానికి నిరాకరించి, నవాబుకు అగౌరవకరమైన లేఖలు రాసింది.","o":["I మాత్రమే","II మాత్రమే","I మరియు II రెండూ","I, II రెండూ కావు"],"e":"రెండూ పేర్కొనబడ్డాయి. వ్యాపార హక్కు కోసం నవాబులు పెద్ద మొత్తంలో కప్పం కూడా డిమాండ్ చేశారు.","n":"స్థానిక అధికారుల అన్యాయమైన డిమాండ్లు తన వ్యాపారాన్ని నాశనం చేస్తున్నాయని కంపెనీ వాదించింది."}},{"t":"MCQ","q":"The Battle of Plassey was fought in —","o":["1764","1765","1757","1799"],"a":2,"e":"In 1757 Robert Clive led the Company’s army against Sirajuddaulah at Plassey.","n":"It was the first major victory the Company won in India.","te":{"q":"ప్లాసీ యుద్ధం జరిగిన సంవత్సరం —","o":["1764","1765","1757","1799"],"e":"1757లో రాబర్ట్ క్లైవ్ ప్లాసీ వద్ద సిరాజుద్దౌలాకు వ్యతిరేకంగా కంపెనీ సైన్యాన్ని నడిపించాడు.","n":"భారతదేశంలో కంపెనీ సాధించిన మొదటి ప్రధాన విజయం ఇదే."}},{"t":"MCQ","q":"One of the main reasons for Sirajuddaulah’s defeat at Plassey was that —","o":["Mir Jafar’s forces never fought the battle","He had no army","The French attacked him","He fell ill"],"a":0,"e":"Forces led by Mir Jafar, one of Sirajuddaulah’s commanders, never fought. Clive had promised to make Mir Jafar nawab.","n":"After the defeat Sirajuddaulah was assassinated and Mir Jafar was made nawab.","te":{"q":"ప్లాసీలో సిరాజుద్దౌలా ఓటమికి ప్రధాన కారణాల్లో ఒకటి —","o":["మీర్ జాఫర్ సేనలు యుద్ధంలో పోరాడలేదు","అతనికి సైన్యమే లేదు","ఫ్రెంచివారు అతనిపై దాడి చేశారు","అతను అనారోగ్యానికి గురయ్యాడు"],"e":"సిరాజుద్దౌలా సేనాధిపతుల్లో ఒకరైన మీర్ జాఫర్ నేతృత్వంలోని సేనలు యుద్ధం చేయలేదు. మీర్ జాఫర్‌ను నవాబును చేస్తానని క్లైవ్ వాగ్దానం చేశాడు.","n":"ఓటమి తర్వాత సిరాజుద్దౌలా హత్యకు గురయ్యాడు, మీర్ జాఫర్ నవాబయ్యాడు."}},{"t":"MCQ","q":"‘Plassey’ is an anglicised pronunciation of —","o":["Palasi","Palashi","Pallavi","Pilibhit"],"a":1,"e":"Plassey is an anglicised form of Palashi, named after the palash tree whose red flowers yield gulal used in Holi.","n":"‘Did you know?’ box, Chapter 2.","te":{"q":"‘ప్లాసీ’ అనేది దేని ఆంగ్లీకృత ఉచ్చారణ?","o":["పలాసి","పలాశి","పల్లవి","పిలిభిత్"],"e":"ప్లాసీ అనేది పలాశి ఆంగ్లీకృత రూపం; హోలీ పండుగలో వాడే గులాల్ ఇచ్చే ఎర్రని పూలున్న పలాశ (మోదుగ) చెట్టు పేరు మీద వచ్చింది.","n":"‘మీకు తెలుసా?’ పెట్టె, అధ్యాయం 2."}},{"t":"MCQ","q":"Sirajuddaulah marched with 30,000 soldiers to the English factory at —","o":["Calcutta","Kassimbazar","Madras","Murshidabad"],"a":1,"e":"He marched to the English factory at Kassimbazar, captured Company officials, locked the warehouse and blockaded English ships, then marched to Calcutta.","n":"Company officials in Madras then sent forces under Robert Clive.","te":{"q":"సిరాజుద్దౌలా 30,000 మంది సైనికులతో ఏ ఇంగ్లీషు ఫ్యాక్టరీపైకి దండెత్తాడు?","o":["కలకత్తా","కాసింబజార్","మద్రాసు","ముర్షిదాబాద్"],"e":"అతను కాసింబజార్‌లోని ఇంగ్లీషు ఫ్యాక్టరీపైకి వెళ్లి కంపెనీ అధికారులను బంధించి, గిడ్డంగికి తాళం వేసి, ఇంగ్లీషు నౌకలను దిగ్బంధించి, తర్వాత కలకత్తాకు వెళ్లాడు.","n":"తర్వాత మద్రాసులోని కంపెనీ అధికారులు రాబర్ట్ క్లైవ్ నేతృత్వంలో సైన్యాన్ని పంపారు."}},{"t":"MCQ","q":"Mir Qasim was defeated by the Company in the Battle of —","o":["Buxar (1764)","Plassey (1757)","Seringapatam (1799)","Panipat (1761)"],"a":0,"e":"When Mir Qasim complained, he was defeated at Buxar (1764), driven out of Bengal, and Mir Jafar was reinstalled.","n":"Mir Jafar had to pay Rs 5,00,000 every month.","te":{"q":"మీర్ ఖాసింను కంపెనీ ఓడించిన యుద్ధం —","o":["బక్సార్ (1764)","ప్లాసీ (1757)","శ్రీరంగపట్నం (1799)","పానిపట్ (1761)"],"e":"మీర్ ఖాసిం ఫిర్యాదు చేయగా బక్సార్ (1764) యుద్ధంలో ఓడించి బెంగాల్ నుండి వెళ్లగొట్టారు; మీర్ జాఫర్‌ను తిరిగి నవాబును చేశారు.","n":"మీర్ జాఫర్ ప్రతి నెలా రూ. 5,00,000 చెల్లించవలసి వచ్చింది."}},{"t":"Chronology","q":"Arrange the following events in chronological order:\n1. Battle of Buxar\n2. Battle of Plassey\n3. Company appointed Diwan of Bengal\n4. Permanent Settlement","o":["1, 2, 3, 4","2, 1, 3, 4","2, 3, 1, 4","2, 1, 4, 3"],"a":1,"e":"Plassey (1757) → Buxar (1764) → Diwani (1765) → Permanent Settlement (1793).","n":"These steps transformed the Company from trader to territorial power.","te":{"q":"కింది సంఘటనలను కాలక్రమంలో అమర్చండి:\n1. బక్సార్ యుద్ధం\n2. ప్లాసీ యుద్ధం\n3. కంపెనీ బెంగాల్ దివాన్‌గా నియామకం\n4. శాశ్వత శిస్తు నిర్ణయం","o":["1, 2, 3, 4","2, 1, 3, 4","2, 3, 1, 4","2, 1, 4, 3"],"e":"ప్లాసీ (1757) → బక్సార్ (1764) → దివానీ (1765) → శాశ్వత శిస్తు నిర్ణయం (1793).","n":"ఈ దశలు కంపెనీని వ్యాపారి నుండి ప్రాదేశిక శక్తిగా మార్చాయి."}},{"t":"MCQ","q":"Who declared, ‘We must indeed become nawabs ourselves’?","o":["Warren Hastings","Lord Wellesley","Robert Clive","Lord Dalhousie"],"a":2,"e":"Having failed to work with puppet nawabs, Clive declared this. In 1765 the Mughal emperor appointed the Company as Diwan of Bengal.","n":"‘Puppet’ = a person controlled by someone else.","te":{"q":"‘మనమే నిజంగా నవాబులం కావాలి’ అని ప్రకటించినది ఎవరు?","o":["వారెన్ హేస్టింగ్స్","లార్డ్ వెల్లస్లీ","రాబర్ట్ క్లైవ్","లార్డ్ డల్హౌసీ"],"e":"తోలుబొమ్మ నవాబులతో పనిచేయడంలో విఫలమైన తర్వాత క్లైవ్ ఈ ప్రకటన చేశాడు. 1765లో మొఘల్ చక్రవర్తి కంపెనీని బెంగాల్ దివాన్‌గా నియమించాడు.","n":"‘తోలుబొమ్మ’ = ఇతరుల నియంత్రణలో ఉండే వ్యక్తి."}},{"t":"Assertion–Reason","q":"Assertion (A): After the assumption of Diwani, the outflow of gold from Britain to India entirely stopped.\nReason (R): Revenues from India could now finance the Company’s purchases of cotton and silk textiles.","o":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, but R is false","A is false, but R is true"],"a":0,"e":"Earlier the Company bought goods with gold and silver from Britain. The Diwani let it use Bengal’s revenue, so the outflow stopped. R explains A.","n":"Revenue also maintained Company troops and built the fort and offices at Calcutta.","te":{"q":"నిశ్చితవాక్యం (A): దివానీ పొందిన తర్వాత బ్రిటన్ నుండి భారతదేశానికి బంగారం తరలింపు పూర్తిగా ఆగిపోయింది.\nకారణం (R): భారతదేశ ఆదాయాలతోనే ఇప్పుడు కంపెనీ నూలు, పట్టు వస్త్రాల కొనుగోళ్లకు నిధులు సమకూర్చుకోగలిగింది.","o":["A మరియు R రెండూ సరైనవి, R అనేది A కు సరైన వివరణ","A మరియు R రెండూ సరైనవి, కానీ R అనేది A కు సరైన వివరణ కాదు","A సరైనది, కానీ R తప్పు","A తప్పు, కానీ R సరైనది"],"e":"గతంలో కంపెనీ బ్రిటన్ నుండి తెచ్చిన బంగారం, వెండితో సరుకులు కొనేది. దివానీ వల్ల బెంగాల్ ఆదాయాన్ని వాడుకోగలగడంతో ఆ తరలింపు ఆగింది. R అనేది A ను వివరిస్తుంది.","n":"ఆదాయం కంపెనీ సైన్యాల నిర్వహణకు, కలకత్తాలో కోట, కార్యాలయాల నిర్మాణానికి కూడా ఉపయోగపడింది."}},{"t":"MCQ","q":"Company officials who returned to Britain with wealth and led flashy lives were called —","o":["Nabobs","Factors","Residents","Gomasthas"],"a":0,"e":"They were called ‘nabobs’, an anglicised version of the Indian word nawab. They were ridiculed as upstarts in plays and cartoons.","n":"Not all officials were corrupt; many died early from disease and war.","te":{"q":"సంపదతో బ్రిటన్‌కు తిరిగి వెళ్లి ఆడంబర జీవితం గడిపిన కంపెనీ అధికారులను ఏమనేవారు?","o":["నబాబులు","ఫ్యాక్టర్లు","రెసిడెంట్లు","గుమాస్తాలు"],"e":"వారిని ‘నబాబులు’ అనేవారు — భారతీయ పదం నవాబుకు ఆంగ్లీకృత రూపం. నాటకాలు, కార్టూన్లలో వారిని హఠాత్తుగా ఎదిగినవారిగా ఎగతాళి చేశారు.","n":"అధికారులందరూ అవినీతిపరులు కారు; చాలామంది వ్యాధులు, యుద్ధాల వల్ల త్వరగా మరణించారు."}},{"t":"Statements","q":"Consider the following statements about Robert Clive:\nI. He came to Madras from England in 1743 at the age of 18.\nII. He was cross-examined by the British Parliament in 1772 and committed suicide in 1774.","o":["I only","II only","Both I and II","Neither I nor II"],"a":2,"e":"Both are correct. Though he was acquitted, he committed suicide in 1774. His Indian fortune in 1767 was worth £401,102.","n":"He was asked to remove corruption when appointed Governor of Bengal in 1764.","te":{"q":"రాబర్ట్ క్లైవ్ గురించి కింది వాక్యాలను పరిశీలించండి:\nI. అతను 18 ఏళ్ల వయసులో 1743లో ఇంగ్లాండ్ నుండి మద్రాసుకు వచ్చాడు.\nII. 1772లో బ్రిటిష్ పార్లమెంటు అతన్ని విచారించింది; 1774లో అతను ఆత్మహత్య చేసుకున్నాడు.","o":["I మాత్రమే","II మాత్రమే","I మరియు II రెండూ","I, II రెండూ కావు"],"e":"రెండూ సరైనవి. నిర్దోషిగా విడుదలైనప్పటికీ అతను 1774లో ఆత్మహత్య చేసుకున్నాడు. 1767లో అతని భారతీయ సంపద విలువ £401,102.","n":"1764లో బెంగాల్ గవర్నర్‌గా నియమించినప్పుడు అవినీతిని తొలగించమని అతన్ని కోరారు."}},{"t":"MCQ","q":"After the Battle of Buxar, the Company appointed political or commercial agents in Indian states called —","o":["Collectors","Residents","Diwans","Peshwas"],"a":1,"e":"Residents served Company interests and began interfering in internal affairs, deciding successors and administrative appointments.","n":"James Mill: the Resident ‘really is king of the country’.","te":{"q":"బక్సార్ యుద్ధం తర్వాత కంపెనీ భారతీయ రాజ్యాల్లో నియమించిన రాజకీయ లేదా వాణిజ్య ప్రతినిధులను ఏమనేవారు?","o":["కలెక్టర్లు","రెసిడెంట్లు","దివాన్లు","పీష్వాలు"],"e":"రెసిడెంట్లు కంపెనీ ప్రయోజనాల కోసం పనిచేస్తూ వారసులను, పరిపాలనా నియామకాలను నిర్ణయిస్తూ రాజ్యాల అంతర్గత వ్యవహారాల్లో జోక్యం చేసుకున్నారు.","n":"జేమ్స్ మిల్: రెసిడెంటే ‘నిజంగా ఆ దేశానికి రాజు’."}},{"t":"Statements","q":"Under the Subsidiary Alliance:\nI. Indian rulers were not allowed to have their independent armed forces.\nII. Indian rulers had to pay for the ‘subsidiary forces’ maintained by the Company, failing which part of their territory was taken away.","o":["I only","II only","Both I and II","Neither I nor II"],"a":2,"e":"Both are terms of the subsidiary alliance as given in the textbook.","n":"Example: Nawab of Awadh gave over half his territory in 1801; Hyderabad also ceded territories.","te":{"q":"సైన్య సహకార పద్ధతి (సబ్సిడియరీ అలయన్స్) ప్రకారం:\nI. భారతీయ పాలకులు స్వతంత్ర సైన్యాలను కలిగి ఉండకూడదు.\nII. కంపెనీ నిర్వహించే ‘సహాయక సేనల’ ఖర్చును భారతీయ పాలకులు చెల్లించాలి; చెల్లించకపోతే వారి భూభాగంలో కొంత భాగాన్ని తీసుకుంటారు.","o":["I మాత్రమే","II మాత్రమే","I మరియు II రెండూ","I, II రెండూ కావు"],"e":"రెండూ పాఠ్యపుస్తకం ప్రకారం సైన్య సహకార పద్ధతి షరతులు.","n":"ఉదాహరణ: 1801లో అవధ్ నవాబు సగానికి పైగా భూభాగం ఇచ్చాడు; హైదరాబాద్ కూడా భూభాగాలు ఇచ్చింది."}},{"t":"MCQ","q":"When Richard Wellesley was Governor-General, the Nawab of Awadh was forced to give over half of his territory to the Company in —","o":["1765","1801","1793","1856"],"a":1,"e":"In 1801 the Nawab of Awadh was forced to give over half his territory as he failed to pay for subsidiary forces. Wellesley was Governor-General from 1798 to 1805.","n":"Hyderabad was also forced to cede territories.","te":{"q":"రిచర్డ్ వెల్లస్లీ గవర్నర్ జనరల్‌గా ఉన్నప్పుడు అవధ్ నవాబు తన భూభాగంలో సగానికి పైగా కంపెనీకి ఇవ్వవలసి వచ్చిన సంవత్సరం —","o":["1765","1801","1793","1856"],"e":"సహాయక సేనల ఖర్చు చెల్లించలేకపోవడంతో 1801లో అవధ్ నవాబు సగానికి పైగా భూభాగాన్ని ఇవ్వవలసి వచ్చింది. వెల్లస్లీ 1798 నుండి 1805 వరకు గవర్నర్ జనరల్.","n":"హైదరాబాద్ కూడా భూభాగాలు ఇవ్వవలసి వచ్చింది."}},{"t":"MCQ","q":"Haidar Ali ruled Mysore from —","o":["1782 to 1799","1761 to 1782","1757 to 1764","1799 to 1831"],"a":1,"e":"Haidar Ali ruled from 1761 to 1782 and his son Tipu Sultan from 1782 to 1799.","n":"Mysore controlled the profitable trade of the Malabar coast.","te":{"q":"హైదర్ అలీ మైసూరును పాలించిన కాలం —","o":["1782 నుండి 1799","1761 నుండి 1782","1757 నుండి 1764","1799 నుండి 1831"],"e":"హైదర్ అలీ 1761 నుండి 1782 వరకు, అతని కుమారుడు టిప్పు సుల్తాన్ 1782 నుండి 1799 వరకు పాలించారు.","n":"మలబార్ తీర లాభదాయక వ్యాపారం మైసూరు నియంత్రణలో ఉండేది."}},{"t":"MCQ","q":"In 1785, Tipu Sultan stopped the export of which goods through the ports of his kingdom?","o":["Sandalwood, pepper and cardamom","Cotton, silk and indigo","Tea, coffee and rubber","Opium, salt and saltpetre"],"a":0,"e":"In 1785 Tipu stopped the export of sandalwood, pepper and cardamom and disallowed local merchants from trading with the Company.","n":"He also built close ties with the French and modernised his army with their help.","te":{"q":"1785లో టిప్పు సుల్తాన్ తన రాజ్య రేవుల ద్వారా ఏ వస్తువుల ఎగుమతిని ఆపాడు?","o":["గంధం, మిరియాలు, యాలకులు","పత్తి, పట్టు, నీలిమందు","తేయాకు, కాఫీ, రబ్బరు","నల్లమందు, ఉప్పు, సురేకారం"],"e":"1785లో టిప్పు గంధం, మిరియాలు, యాలకుల ఎగుమతిని ఆపి, స్థానిక వ్యాపారులు కంపెనీతో వ్యాపారం చేయకుండా నిషేధించాడు.","n":"అతను ఫ్రెంచివారితో సన్నిహిత సంబంధాలు ఏర్పరచుకొని, వారి సహాయంతో సైన్యాన్ని ఆధునీకరించాడు."}},{"t":"MCQ","q":"Tipu Sultan was killed defending his capital Seringapatam in the year —","o":["1792","1782","1799","1803"],"a":2,"e":"Four Anglo-Mysore wars were fought (1767–69, 1780–84, 1790–92 and 1799). In the last, the Battle of Seringapatam, Tipu was killed on 4 May 1799.","n":"Mysore was placed under the Wodeyars and a subsidiary alliance was imposed.","te":{"q":"తన రాజధాని శ్రీరంగపట్నాన్ని రక్షిస్తూ టిప్పు సుల్తాన్ మరణించిన సంవత్సరం —","o":["1792","1782","1799","1803"],"e":"నాలుగు ఆంగ్లో-మైసూరు యుద్ధాలు జరిగాయి (1767–69, 1780–84, 1790–92, 1799). చివరిదైన శ్రీరంగపట్నం యుద్ధంలో 1799 మే 4న టిప్పు మరణించాడు.","n":"మైసూరును వడయార్ల పాలనలో ఉంచి సైన్య సహకార పద్ధతిని విధించారు."}},{"t":"MCQ","q":"Tipu Sultan’s mechanical toy tiger, showing a tiger mauling a European soldier, is now kept in —","o":["The National Museum, New Delhi","The Louvre, Paris","The Mysore Palace","The Victoria and Albert Museum, London"],"a":3,"e":"The British took it away when Tipu died; it is now in the Victoria and Albert Museum in London.","n":"Tipu was known as the ‘Tiger of Mysore’ and had the tiger image on his flag.","te":{"q":"యూరోపియన్ సైనికుడిని పులి చీల్చుతున్నట్లు చూపే టిప్పు సుల్తాన్ యాంత్రిక బొమ్మ పులి ప్రస్తుతం ఎక్కడ ఉంది?","o":["జాతీయ మ్యూజియం, న్యూఢిల్లీ","లూవ్రే, పారిస్","మైసూరు ప్యాలెస్","విక్టోరియా అండ్ ఆల్బర్ట్ మ్యూజియం, లండన్"],"e":"టిప్పు మరణించినప్పుడు బ్రిటిష్ వారు దానిని తీసుకెళ్లారు; ఇప్పుడు అది లండన్‌లోని విక్టోరియా అండ్ ఆల్బర్ట్ మ్యూజియంలో ఉంది.","n":"టిప్పును ‘మైసూరు పులి’ అనేవారు; అతని జెండాపై పులి బొమ్మ ఉండేది."}},{"t":"MCQ","q":"In 1792, after Tipu was defeated by the combined forces of the Marathas, the Nizam and the Company, he had to —","o":["Give up Seringapatam","Accept the Doctrine of Lapse","Abolish his army","Send two of his sons as hostages"],"a":3,"e":"By the 1792 treaty, two of his sons were taken away as hostages. Fig. 9: Cornwallis receiving Tipu’s sons, painted by Daniel Orme, 1793.","n":"British painters liked painting scenes of British triumph.","te":{"q":"1792లో మరాఠాలు, నిజాం, కంపెనీ సంయుక్త సేనల చేతిలో ఓడిపోయిన టిప్పు ఏమి చేయవలసి వచ్చింది?","o":["శ్రీరంగపట్నాన్ని వదులుకోవడం","రాజ్య సంక్రమణ సిద్ధాంతాన్ని అంగీకరించడం","సైన్యాన్ని రద్దు చేయడం","తన ఇద్దరు కుమారులను బందీలుగా పంపడం"],"e":"1792 ఒప్పందం ప్రకారం అతని ఇద్దరు కుమారులను బందీలుగా తీసుకెళ్లారు. పటం 9: టిప్పు కుమారులను కారన్‌వాలిస్ స్వీకరించడం, డేనియల్ ఓర్మ్ చిత్రం, 1793.","n":"బ్రిటిష్ చిత్రకారులు బ్రిటిష్ విజయ దృశ్యాలను చిత్రించడానికి ఇష్టపడేవారు."}},{"t":"MCQ","q":"The First Anglo-Maratha War ended in 1782 with the —","o":["Treaty of Salbai","Treaty of Bassein","Treaty of Seringapatam","Treaty of Allahabad"],"a":0,"e":"The first war ended in 1782 with the Treaty of Salbai, with no clear victor.","n":"Second war (1803–05): British gained Orissa and territories north of the Yamuna including Agra and Delhi.","te":{"q":"మొదటి ఆంగ్లో-మరాఠా యుద్ధం 1782లో ఏ ఒప్పందంతో ముగిసింది?","o":["సాల్బాయి ఒప్పందం","బసీన్ ఒప్పందం","శ్రీరంగపట్నం ఒప్పందం","అలహాబాద్ ఒప్పందం"],"e":"మొదటి యుద్ధం స్పష్టమైన విజేత లేకుండా 1782లో సాల్బాయి ఒప్పందంతో ముగిసింది.","n":"రెండవ యుద్ధం (1803–05): బ్రిటిష్ వారికి ఒడిశా, ఆగ్రా-ఢిల్లీతో సహా యమునకు ఉత్తరాన ఉన్న ప్రాంతాలు లభించాయి."}},{"t":"MCQ","q":"After the Third Anglo-Maratha War (1817–19), the Peshwa was sent away with a pension to —","o":["Pune","Satara","Gwalior","Bithur near Kanpur"],"a":3,"e":"The Third war crushed Maratha power; the Peshwa was removed and sent to Bithur near Kanpur with a pension.","n":"The Company then controlled territories south of the Vindhyas.","te":{"q":"మూడవ ఆంగ్లో-మరాఠా యుద్ధం (1817–19) తర్వాత పీష్వాను పింఛనుతో ఎక్కడికి పంపారు?","o":["పూణే","సతారా","గ్వాలియర్","కాన్పూర్ సమీపంలోని బిఠూర్"],"e":"మూడవ యుద్ధం మరాఠా శక్తిని అణచివేసింది; పీష్వాను తొలగించి పింఛనుతో కాన్పూర్ సమీపంలోని బిఠూర్‌కు పంపారు.","n":"కంపెనీకి వింధ్య పర్వతాలకు దక్షిణాన ఉన్న భూభాగాలపై పూర్తి నియంత్రణ లభించింది."}},{"t":"MCQ","q":"The Maratha dream of ruling from Delhi was shattered after their defeat in —","o":["The Battle of Plassey","The Battle of Buxar","The Battle of Seringapatam","The Third Battle of Panipat (1761)"],"a":3,"e":"With their defeat in the Third Battle of Panipat in 1761, the Marathas’ dream of ruling from Delhi was shattered.","n":"Maratha chiefs: Sindhia, Holkar, Gaikwad and Bhonsle, held in a confederacy under the Peshwa at Pune.","te":{"q":"ఢిల్లీ నుండి పాలించాలనే మరాఠాల కల ఏ ఓటమితో భగ్నమైంది?","o":["ప్లాసీ యుద్ధం","బక్సార్ యుద్ధం","శ్రీరంగపట్నం యుద్ధం","మూడవ పానిపట్ యుద్ధం (1761)"],"e":"1761 మూడవ పానిపట్ యుద్ధంలో ఓటమితో ఢిల్లీ నుండి పాలించాలనే మరాఠాల కల భగ్నమైంది.","n":"మరాఠా అధిపతులు: సింధియా, హోల్కర్, గైక్వాడ్, భోంస్లే — పూణేలోని పీష్వా నేతృత్వంలో సమాఖ్యగా ఉండేవారు."}},{"t":"MCQ","q":"The policy of ‘paramountcy’ was initiated under —","o":["Lord Wellesley","Lord Hastings","Lord Dalhousie","Lord Cornwallis"],"a":1,"e":"Under Lord Hastings (Governor-General 1813–1823), the Company claimed its authority was paramount or supreme over Indian states.","n":"It claimed it was justified in annexing any Indian kingdom to protect its interests.","te":{"q":"‘సర్వాధిపత్యం’ (పారామౌంట్సీ) విధానాన్ని ప్రారంభించినది —","o":["లార్డ్ వెల్లస్లీ","లార్డ్ హేస్టింగ్స్","లార్డ్ డల్హౌసీ","లార్డ్ కారన్‌వాలిస్"],"e":"లార్డ్ హేస్టింగ్స్ (గవర్నర్ జనరల్ 1813–1823) కాలంలో కంపెనీ తన అధికారం భారతీయ రాజ్యాల కంటే సర్వోన్నతమని ప్రకటించింది.","n":"తన ప్రయోజనాల రక్షణ కోసం ఏ భారతీయ రాజ్యాన్నైనా విలీనం చేసుకోవడం న్యాయమేనని కంపెనీ వాదించింది."}},{"t":"MCQ","q":"Who led an anti-British resistance movement when the British tried to annex Kitoor?","o":["Rani Lakshmibai","Rani Channamma","Begum Hazrat Mahal","Rani Durgavati"],"a":1,"e":"Rani Channamma of Kitoor (Karnataka) took up arms. She was arrested in 1824 and died in prison in 1829.","n":"Rayanna, a poor chowkidar of Sangoli, carried on the resistance and was hanged in 1830.","te":{"q":"బ్రిటిష్ వారు కిత్తూరును విలీనం చేసుకోవడానికి ప్రయత్నించినప్పుడు బ్రిటిష్ వ్యతిరేక ప్రతిఘటనకు నాయకత్వం వహించినది ఎవరు?","o":["రాణి లక్ష్మీబాయి","రాణి చెన్నమ్మ","బేగం హజ్రత్ మహల్","రాణి దుర్గావతి"],"e":"కిత్తూరు (కర్ణాటక) రాణి చెన్నమ్మ ఆయుధాలు చేపట్టింది. 1824లో అరెస్టై 1829లో జైలులో మరణించింది.","n":"సంగోళికి చెందిన పేద కావలివాడు రాయన్న ప్రతిఘటనను కొనసాగించాడు; 1830లో అతన్ని ఉరితీశారు."}},{"t":"Match","q":"Match the following (Let’s recall, Chapter 2):\n(a) Diwani   —   (i) Criminal court\n(b) Tiger of Mysore   —   (ii) Led anti-British movement in Kitoor\n(c) faujdari adalat   —   (iii) Right to collect land revenue\n(d) Rani Channamma   —   (iv) Tipu Sultan","o":["a-i, b-ii, c-iii, d-iv","a-iii, b-i, c-iv, d-ii","a-iv, b-iii, c-ii, d-i","a-iii, b-iv, c-i, d-ii"],"a":3,"e":"Diwani → right to collect land revenue; Tiger of Mysore → Tipu Sultan; faujdari adalat → criminal court; Rani Channamma → movement in Kitoor.","n":"Sepoy → sipahi (soldier).","te":{"q":"కింది వాటిని జతపరచండి (అధ్యాయం 2 పునశ్చరణ):\n(a) దివానీ   —   (i) నేర న్యాయస్థానం\n(b) మైసూరు పులి   —   (ii) కిత్తూరులో బ్రిటిష్ వ్యతిరేక ఉద్యమానికి నాయకత్వం\n(c) ఫౌజ్‌దారీ అదాలత్   —   (iii) భూమి శిస్తు వసూలు హక్కు\n(d) రాణి చెన్నమ్మ   —   (iv) టిప్పు సుల్తాన్","o":["a-i, b-ii, c-iii, d-iv","a-iii, b-i, c-iv, d-ii","a-iv, b-iii, c-ii, d-i","a-iii, b-iv, c-i, d-ii"],"e":"దివానీ → భూమి శిస్తు వసూలు హక్కు; మైసూరు పులి → టిప్పు సుల్తాన్; ఫౌజ్‌దారీ అదాలత్ → నేర న్యాయస్థానం; రాణి చెన్నమ్మ → కిత్తూరు ఉద్యమం.","n":"సిపాయి → సిపాహీ (సైనికుడు)."}},{"t":"MCQ","q":"Punjab was annexed by the British in —","o":["1839","1843","1849","1856"],"a":2,"e":"After Maharaja Ranjit Singh died in 1839, two wars were fought with the Sikh kingdom and Punjab was annexed in 1849.","n":"Sind was taken over in 1843.","te":{"q":"బ్రిటిష్ వారు పంజాబ్‌ను విలీనం చేసుకున్న సంవత్సరం —","o":["1839","1843","1849","1856"],"e":"1839లో మహారాజా రంజిత్ సింగ్ మరణం తర్వాత సిక్కు రాజ్యంతో రెండు యుద్ధాలు జరిగి 1849లో పంజాబ్ విలీనమైంది.","n":"1843లో సింధ్‌ను స్వాధీనం చేసుకున్నారు."}},{"t":"MCQ","q":"The Doctrine of Lapse was devised by —","o":["Lord Wellesley","Lord Hastings","Lord Dalhousie","Lord Canning"],"a":2,"e":"Lord Dalhousie (Governor-General 1848–1856) devised the Doctrine of Lapse: if a ruler died without a male heir, his kingdom would ‘lapse’ to the Company.","n":"Annexed: Satara 1848, Sambalpur 1850, Udaipur 1852, Nagpur 1853, Jhansi 1854.","te":{"q":"రాజ్య సంక్రమణ సిద్ధాంతాన్ని (డాక్ట్రిన్ ఆఫ్ లాప్స్) రూపొందించినది —","o":["లార్డ్ వెల్లస్లీ","లార్డ్ హేస్టింగ్స్","లార్డ్ డల్హౌసీ","లార్డ్ కానింగ్"],"e":"లార్డ్ డల్హౌసీ (గవర్నర్ జనరల్ 1848–1856) రాజ్య సంక్రమణ సిద్ధాంతాన్ని రూపొందించాడు: పురుష వారసుడు లేకుండా పాలకుడు మరణిస్తే ఆ రాజ్యం కంపెనీకి సంక్రమిస్తుంది.","n":"విలీనమైనవి: సతారా 1848, సంబల్‌పూర్ 1850, ఉదయ్‌పూర్ 1852, నాగ్‌పూర్ 1853, ఝాన్సీ 1854."}},{"t":"Chronology","q":"Arrange the kingdoms annexed under the Doctrine of Lapse in chronological order:\n1. Nagpur\n2. Satara\n3. Jhansi\n4. Sambalpur","o":["4, 2, 3, 1","2, 1, 4, 3","1, 2, 4, 3","2, 4, 1, 3"],"a":3,"e":"Satara (1848) → Sambalpur (1850) → Nagpur (1853) → Jhansi (1854).","n":"Udaipur (1852) was also annexed.","te":{"q":"రాజ్య సంక్రమణ సిద్ధాంతం కింద విలీనమైన రాజ్యాలను కాలక్రమంలో అమర్చండి:\n1. నాగ్‌పూర్\n2. సతారా\n3. ఝాన్సీ\n4. సంబల్‌పూర్","o":["4, 2, 3, 1","2, 1, 4, 3","1, 2, 4, 3","2, 4, 1, 3"],"e":"సతారా (1848) → సంబల్‌పూర్ (1850) → నాగ్‌పూర్ (1853) → ఝాన్సీ (1854).","n":"ఉదయ్‌పూర్ (1852) కూడా విలీనమైంది."}},{"t":"Assertion–Reason","q":"Assertion (A): The British annexed Awadh in 1856.\nReason (R): Awadh had no male heir and lapsed under the Doctrine of Lapse.","o":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, but R is false","A is false, but R is true"],"a":2,"e":"Awadh was annexed in 1856, but the British claimed they were ‘obliged by duty’ to free people from the ‘misgovernment’ of the Nawab — not because of lapse. So A is true, R is false.","n":"Enraged people of Awadh joined the great revolt of 1857.","te":{"q":"నిశ్చితవాక్యం (A): బ్రిటిష్ వారు 1856లో అవధ్‌ను విలీనం చేసుకున్నారు.\nకారణం (R): అవధ్‌కు పురుష వారసుడు లేనందున రాజ్య సంక్రమణ సిద్ధాంతం కింద అది సంక్రమించింది.","o":["A మరియు R రెండూ సరైనవి, R అనేది A కు సరైన వివరణ","A మరియు R రెండూ సరైనవి, కానీ R అనేది A కు సరైన వివరణ కాదు","A సరైనది, కానీ R తప్పు","A తప్పు, కానీ R సరైనది"],"e":"అవధ్ 1856లో విలీనమైంది, కానీ నవాబు ‘దుష్పరిపాలన’ నుండి ప్రజలను విముక్తి చేయడం తమ ‘కర్తవ్యం’ అని బ్రిటిష్ వారు చెప్పారు — సంక్రమణ వల్ల కాదు. కాబట్టి A సరైనది, R తప్పు.","n":"ఆగ్రహించిన అవధ్ ప్రజలు 1857 మహా తిరుగుబాటులో చేరారు."}},{"t":"MCQ","q":"Fearing Russian expansion, the British fought a prolonged war with Afghanistan between —","o":["1838 and 1842","1818 and 1822","1848 and 1852","1857 and 1859"],"a":0,"e":"In the late 1830s the Company feared Russia might enter India from the north-west; it fought Afghanistan from 1838 to 1842.","n":"It established indirect Company rule there.","te":{"q":"రష్యా విస్తరణ భయంతో బ్రిటిష్ వారు ఆఫ్ఘనిస్తాన్‌తో సుదీర్ఘ యుద్ధం చేసిన కాలం —","o":["1838 నుండి 1842","1818 నుండి 1822","1848 నుండి 1852","1857 నుండి 1859"],"e":"1830ల చివరలో రష్యా వాయువ్యం నుండి భారతదేశంలోకి ప్రవేశించవచ్చని కంపెనీ భయపడి 1838 నుండి 1842 వరకు ఆఫ్ఘనిస్తాన్‌తో యుద్ధం చేసింది.","n":"అక్కడ పరోక్ష కంపెనీ పాలనను స్థాపించింది."}},{"t":"MCQ","q":"Under Warren Hastings, each district was to have two courts from 1772. The civil court was called —","o":["Diwani adalat","Faujdari adalat","Sadar Nizamat Adalat","Supreme Court"],"a":0,"e":"Each district got a criminal court (faujdari adalat) and a civil court (diwani adalat).","n":"European district collectors presided over civil courts; maulvis and pandits interpreted Indian laws.","te":{"q":"వారెన్ హేస్టింగ్స్ కాలంలో 1772 నుండి ప్రతి జిల్లాకు రెండు న్యాయస్థానాలు ఏర్పాటయ్యాయి. సివిల్ (పౌర) న్యాయస్థానాన్ని ఏమనేవారు?","o":["దివానీ అదాలత్","ఫౌజ్‌దారీ అదాలత్","సదర్ నిజామత్ అదాలత్","సుప్రీం కోర్టు"],"e":"ప్రతి జిల్లాకు ఒక నేర న్యాయస్థానం (ఫౌజ్‌దారీ అదాలత్), ఒక పౌర న్యాయస్థానం (దివానీ అదాలత్) ఏర్పాటయ్యాయి.","n":"పౌర న్యాయస్థానాలకు యూరోపియన్ జిల్లా కలెక్టర్లు అధ్యక్షత వహించారు; మౌల్వీలు, పండితులు భారతీయ చట్టాలను వివరించారు."}},{"t":"MCQ","q":"In 1775, eleven pandits were asked to compile a digest of Hindu laws. Who translated it into English?","o":["William Jones","Edmund Burke","N.B. Halhed","H.T. Colebrook"],"a":2,"e":"N.B. Halhed translated the digest into English. By 1778 a code of Muslim laws was also compiled.","n":"The aim was uniformity, since pandits gave different interpretations of dharmashastra.","te":{"q":"1775లో హిందూ చట్టాల సంకలనం తయారు చేయమని పదకొండు మంది పండితులను కోరారు. దానిని ఆంగ్లంలోకి అనువదించినది ఎవరు?","o":["విలియం జోన్స్","ఎడ్మండ్ బర్క్","ఎన్.బి. హాల్‌హెడ్","హెచ్.టి. కోల్‌బ్రూక్"],"e":"ఎన్.బి. హాల్‌హెడ్ ఈ సంకలనాన్ని ఆంగ్లంలోకి అనువదించాడు. 1778 నాటికి ముస్లిం చట్టాల సంహిత కూడా తయారైంది.","n":"పండితులు ధర్మశాస్త్రానికి వేర్వేరు వివరణలు ఇస్తుండటంతో ఏకరూపత కోసం ఇది చేశారు."}},{"t":"MCQ","q":"Under the Regulating Act of 1773 —","o":["The Permanent Settlement was introduced","The Doctrine of Lapse was introduced","The Diwani was granted","A new Supreme Court was established"],"a":3,"e":"Under the Regulating Act of 1773 a new Supreme Court was established, and a court of appeal, the Sadar Nizamat Adalat, was set up at Calcutta.","n":"The Collector became the principal figure in an Indian district.","te":{"q":"1773 రెగ్యులేటింగ్ చట్టం ప్రకారం —","o":["శాశ్వత శిస్తు నిర్ణయం ప్రవేశపెట్టారు","రాజ్య సంక్రమణ సిద్ధాంతం ప్రవేశపెట్టారు","దివానీ మంజూరు చేశారు","కొత్త సుప్రీం కోర్టు స్థాపించారు"],"e":"1773 రెగ్యులేటింగ్ చట్టం కింద కొత్త సుప్రీం కోర్టు స్థాపించబడింది; కలకత్తాలో అప్పీలు న్యాయస్థానం సదర్ నిజామత్ అదాలత్ కూడా ఏర్పాటైంది.","n":"జిల్లాలో ప్రధాన అధికారి కలెక్టర్ అయ్యాడు."}},{"t":"MCQ","q":"Who accused Warren Hastings of being personally responsible for the misgovernment of Bengal, leading to an impeachment that lasted seven years?","o":["William Pitt","Edmund Burke","James Mill","Lord Cornwallis"],"a":1,"e":"When Hastings returned to England in 1785, Edmund Burke accused him; the impeachment in the British Parliament lasted seven years.","n":"Burke: ‘I impeach the common enemy and oppressor of all.’","te":{"q":"బెంగాల్ దుష్పరిపాలనకు వ్యక్తిగతంగా వారెన్ హేస్టింగ్స్ బాధ్యుడని ఆరోపించి, ఏడేళ్లు సాగిన అభిశంసనకు కారణమైనది ఎవరు?","o":["విలియం పిట్","ఎడ్మండ్ బర్క్","జేమ్స్ మిల్","లార్డ్ కారన్‌వాలిస్"],"e":"1785లో హేస్టింగ్స్ ఇంగ్లాండ్‌కు తిరిగి వెళ్లినప్పుడు ఎడ్మండ్ బర్క్ ఆరోపించాడు; బ్రిటిష్ పార్లమెంటులో అభిశంసన ఏడేళ్లు సాగింది.","n":"బర్క్: ‘అందరికీ ఉమ్మడి శత్రువు, అణచివేతదారుడిని నేను అభిశంసిస్తున్నాను.’"}},{"t":"MCQ","q":"The word ‘sepoy’ comes from the Indian word —","o":["Sawar","Paidal","Sipahi","Lathiyal"],"a":2,"e":"The Company’s army came to be known as the sepoy army, from the Indian word sipahi, meaning soldier.","n":"Sawar = men on horses (cavalry); paidal = foot soldiers (infantry).","te":{"q":"‘సిపాయి’ అనే పదం ఏ భారతీయ పదం నుండి వచ్చింది?","o":["సవార్","పైదల్","సిపాహీ","లాఠియాల్"],"e":"కంపెనీ సైన్యాన్ని సిపాయి సైన్యం అనేవారు; ఇది సైనికుడు అనే అర్థం గల భారతీయ పదం సిపాహీ నుండి వచ్చింది.","n":"సవార్ = గుర్రపు సైనికులు (అశ్వికదళం); పైదల్ = పదాతి సైనికులు."}},{"t":"Assertion–Reason","q":"Assertion (A): From the 1820s, the cavalry requirements of the Company’s army declined.\nReason (R): The British empire was fighting in Burma, Afghanistan and Egypt where soldiers were armed with muskets and matchlocks.","o":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, but R is false","A is false, but R is true"],"a":0,"e":"As warfare technology changed, infantry regiments became more important, so cavalry needs declined. R explains A.","n":"Musket = a heavy gun used by infantry; matchlock = early gun ignited by a match.","te":{"q":"నిశ్చితవాక్యం (A): 1820ల నుండి కంపెనీ సైన్యానికి అశ్వికదళ అవసరాలు తగ్గాయి.\nకారణం (R): బ్రిటిష్ సామ్రాజ్యం బర్మా, ఆఫ్ఘనిస్తాన్, ఈజిప్ట్‌లలో యుద్ధాలు చేసింది; అక్కడ సైనికులు మస్కెట్లు, మ్యాచ్‌లాక్‌లు ధరించారు.","o":["A మరియు R రెండూ సరైనవి, R అనేది A కు సరైన వివరణ","A మరియు R రెండూ సరైనవి, కానీ R అనేది A కు సరైన వివరణ కాదు","A సరైనది, కానీ R తప్పు","A తప్
