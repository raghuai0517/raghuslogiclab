<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DSC Exam Hall · RaghusLogicLab</title>
<meta name="description" content="Bilingual (English / Telugu) chapter-wise DSC-format mock tests from textbook PDFs, with scoring, explanations and A4 PDF answer sheets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout concept: an exam hall — a question-booklet header, OMR answer bubbles, a CBT-style question palette. Bilingual: Telugu sits under English in the same block. */
:root{
  --paper:#F5F6FA; --card:#FFFFFF; --ink:#141B33; --muted:#59617D; --line:#DADEEA; --line-strong:#B9BFD3;
  --omr:#B5195A; --omr-ink:#FFFFFF; --omr-soft:#FBE7EF; --ink-soft:#E9ECF6; --te:#2E3A66;
  --ok:#17784A; --ok-soft:#E2F3EA; --bad:#C0352B; --bad-soft:#FCEBE9; --mark:#6A3FB0; --mark-soft:#EFE8FA; --warn:#9A5B00;
  --f-display:"Archivo","Noto Sans Telugu","Noto Sans",system-ui,sans-serif;
  --f-body:"Noto Sans","Noto Sans Telugu",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-te:"Noto Sans Telugu","Noto Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px; --gut:max(16px, env(safe-area-inset-left, 0px)); --gutr:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1120; --card:#151A2C; --ink:#E8EBF6; --muted:#9CA4C2; --line:#283050; --line-strong:#3A4470;
  --omr:#F0679B; --omr-ink:#1A0B12; --omr-soft:#3A1528; --ink-soft:#1E2540; --te:#C3CBEA;
  --ok:#5FD39A; --ok-soft:#10301F; --bad:#FF8A80; --bad-soft:#3A1715; --mark:#B79AF0; --mark-soft:#2A2045; --warn:#E3A84B; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1120; --card:#151A2C; --ink:#E8EBF6; --muted:#9CA4C2; --line:#283050; --line-strong:#3A4470;
  --omr:#F0679B; --omr-ink:#1A0B12; --omr-soft:#3A1528; --ink-soft:#1E2540; --te:#C3CBEA;
  --ok:#5FD39A; --ok-soft:#10301F; --bad:#FF8A80; --bad-soft:#3A1715; --mark:#B79AF0; --mark-soft:#2A2045; --warn:#E3A84B; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
a{color:var(--omr)}
:focus-visible{outline:2px solid var(--omr);outline-offset:2px}
[lang="te"]{font-family:var(--f-te);line-height:1.7}
.wrap{max-width:1180px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gutr)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-display);font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
:root[lang="te"] .eyebrow{letter-spacing:.02em;font-size:12.5px}
.sub-te{display:block;font-family:var(--f-te);font-weight:500;color:var(--te);font-size:.86em;margin-top:2px;line-height:1.6}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;border:0;background:none;padding:0}
.brand-mark{width:32px;height:32px;border-radius:50%;border:2px solid var(--omr);display:grid;place-items:center;flex:none}
.brand-mark::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--omr)}
.brand>span:last-child{text-align:left}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:800;letter-spacing:-.01em;display:block}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:-1px}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lang{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.lang button{border:0;background:var(--card);padding:5px 10px;font-size:13px;font-weight:600;cursor:pointer;min-height:32px}
.lang button+button{border-left:1px solid var(--line-strong)}
.lang button.on{background:var(--ink);color:var(--paper)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:var(--card);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;min-height:38px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--omr);border-color:var(--omr);color:var(--omr-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--ink-soft)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
main{padding-block:22px 60px}

/* home */
.booklet{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;grid-template-columns:1fr auto;gap:18px 28px;align-items:end}
.booklet h1{font-size:clamp(24px,3.4vw,34px);font-weight:800;letter-spacing:-.015em}
.booklet h1 .sub-te{font-size:.62em;font-weight:600;letter-spacing:0}
.booklet .pub{margin-top:6px;color:var(--muted);font-size:14px}
.facts{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap}
.fact b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:600}
.fact span{font-size:12px;color:var(--muted)}
.grand{border-left:1px dashed var(--line-strong);padding-left:24px;display:grid;gap:10px;min-width:0;max-width:340px}
.grand label{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=text],input[type=number],textarea{background:var(--card);border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;min-height:38px;min-width:0}
.pattern{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.chip b{color:var(--ink);font-weight:600}
.subject{margin-top:30px}
.subject-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.subject-head h2{font-size:20px;font-weight:700}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.chap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.chap-top{display:flex;gap:12px;align-items:flex-start}
.chap-no{flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--omr);color:var(--omr);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600}
.chap h3{font-size:16px;font-weight:700}
.chap .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.chap .best{font-size:12.5px;display:flex;gap:8px;align-items:center}
.bar{height:6px;background:var(--ink-soft);border-radius:4px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--ok)}
.chap-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.side-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:30px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-size:17px;font-weight:700;margin-bottom:10px}
.book-list{display:grid;gap:8px}
.book-item{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;flex-wrap:wrap}
.book-item.active{border-color:var(--omr);background:var(--omr-soft)}
.book-item .t{flex:1;min-width:160px}
.book-item .t b{display:block;font-size:14px}
.book-item .t span{font-size:12px;color:var(--muted)}
.hist{display:grid;gap:6px;max-height:340px;overflow:auto}
.hist-item{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:none;text-align:left;width:100%}
.hist-item:hover{border-color:var(--ink)}
.hist-item .t{flex:1;min-width:0}
.hist-item .t b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-item .t span{font-size:12px;color:var(--muted)}
.pct{font-family:var(--f-mono);font-weight:600;font-size:14px;padding:2px 8px;border-radius:6px}
.pct.g{background:var(--ok-soft);color:var(--ok)}.pct.m{background:var(--ink-soft);color:var(--warn)}.pct.b{background:var(--bad-soft);color:var(--bad)}
.empty{color:var(--muted);font-size:13.5px;padding:10px 0}

/* exam */
.exam-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.exam-head h1{font-size:19px;font-weight:700;flex:1;min-width:200px}
.timer{font-family:var(--f-mono);font-size:20px;font-weight:600;border:1.5px solid var(--ink);border-radius:8px;padding:4px 12px;min-width:104px;text-align:center}
.timer.low{border-color:var(--bad);color:var(--bad)}
.exam-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.qno{font-family:var(--f-mono);font-weight:600;font-size:13px;background:var(--ink);color:var(--paper);border-radius:6px;padding:2px 8px}
.qtype{font-size:12px;font-weight:600;color:var(--omr);border:1px solid var(--omr);border-radius:999px;padding:1px 9px}
.qtext{font-size:17px;line-height:1.6;white-space:pre-line;font-weight:500;overflow-wrap:anywhere}
.qtext.te{font-family:var(--f-te);color:var(--te);font-size:16.5px;line-height:1.8;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.qtext.only-te{margin-top:0;padding-top:0;border-top:0;color:var(--ink)}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;background:var(--card);text-align:left;width:100%;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--line-strong);background:var(--paper)}
.bub{flex:none;width:30px;height:30px;border-radius:50%;border:1.6px solid var(--omr);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--omr);transition:background .12s,color .12s}
.opt.sel{border-color:var(--omr);background:var(--omr-soft)}
.opt.sel .bub{background:var(--omr);color:var(--omr-ink)}
.opt .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.opt .tx .sub-te{font-size:.95em}
.qnav{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
.qnav .sp{flex:1}
.palette{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.pal-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0;max-height:46vh;overflow:auto;padding:2px}
.pal{aspect-ratio:1;border-radius:7px;border:1px solid var(--line-strong);background:var(--card);font-family:var(--f-mono);font-size:12px;font-weight:600;cursor:pointer;padding:0;max-width:100%}
.pal.ans{background:var(--ok);border-color:var(--ok);color:var(--card)}
.pal.mk{background:var(--mark);border-color:var(--mark);color:var(--card)}
.pal.mk.ans{box-shadow:inset 0 -4px 0 var(--ok)}
.pal.cur{outline:2px solid var(--omr);outline-offset:1px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line-strong)}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px;text-align:center}
.counts div{border:1px solid var(--line);border-radius:8px;padding:6px 2px}
.counts b{display:block;font-family:var(--f-mono);font-size:17px}
.counts span{font-size:11px;color:var(--muted)}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-strong);border-radius:4px;padding:0 4px}

/* result */
.res-head{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font-family:var(--f-mono);font-size:28px;font-weight:600;display:block;line-height:1}
.ring .v span{font-size:11.5px;color:var(--muted)}
.res-head h1{font-size:22px;font-weight:800}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:92px}
.stat b{display:block;font-family:var(--f-mono);font-size:19px}
.stat span{font-size:11.5px;color:var(--muted)}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}
.res-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tablewrap{overflow-x:auto;margin-top:6px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-display);font-size:12px;letter-spacing:.04em;color:var(--muted)}
td.num{font-family:var(--f-mono);text-align:right}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 12px}
.filters button{border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rv{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px;border-left:4px solid var(--line-strong)}
.rv.c{border-left-color:var(--ok)}.rv.w{border-left-color:var(--bad)}.rv.s{border-left-color:var(--warn)}
.rv .qtext{font-size:15.5px}
.rv .qtext.te{font-size:15px}
.rv .opts{gap:6px;margin-top:12px}
.rv .opt{cursor:default;padding:8px 12px}
.rv .opt:hover{background:var(--card);border-color:var(--line)}
.rv .opt.right{border-color:var(--ok);background:var(--ok-soft)}
.rv .opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--card)}
.rv .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.rv .opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--card)}
.tag-ok{color:var(--ok);font-weight:700;white-space:nowrap}.tag-bad{color:var(--bad);font-weight:700;white-space:nowrap}
.verdict{font-size:12.5px;font-weight:700;padding:1px 9px;border-radius:999px}
.verdict.c{background:var(--ok-soft);color:var(--ok)}.verdict.w{background:var(--bad-soft);color:var(--bad)}.verdict.s{background:var(--ink-soft);color:var(--warn)}
.expl{margin-top:12px;background:var(--paper);border-radius:8px;padding:12px 14px;font-size:14px;display:grid;gap:8px}
.expl p{margin:0}
.expl .note{padding-top:8px;border-top:1px dashed var(--line-strong)}
.expl b.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.04em;margin-right:6px}
.expl .te{font-family:var(--f-te);color:var(--te);line-height:1.75}

/* upload */
.steps{display:grid;gap:14px}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.step h2{font-size:17px;font-weight:700;display:flex;gap:10px;align-items:center}
.step h2 .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);font-family:var(--f-mono);font-size:13px;display:grid;place-items:center;flex:none}
.drop{margin-top:12px;border:2px dashed var(--line-strong);border-radius:12px;padding:28px 16px;text-align:center;cursor:pointer;background:var(--paper);display:grid;gap:4px}
.drop.over{border-color:var(--omr);background:var(--omr-soft)}
.drop b{font-size:16px}
.progress{height:8px;background:var(--ink-soft);border-radius:6px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--omr);width:0;transition:width .2s}
.chrows{display:grid;gap:8px;margin-top:12px}
.chrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) 80px 80px 70px 36px;gap:8px;align-items:center}
.chrow.h{font-size:12px;color:var(--muted);font-weight:600}
.chrow input{width:100%}
.radio-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.rc{border:1px solid var(--line-strong);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.rc input{margin-top:4px;accent-color:var(--omr)}
.rc.on{border-color:var(--omr);background:var(--omr-soft)}
.rc b{display:block}
.rc span{font-size:13px;color:var(--muted)}
.log{font-family:var(--f-mono);font-size:12.5px;background:var(--paper);border-radius:8px;padding:10px;margin-top:10px;max-height:180px;overflow:auto;white-space:pre-wrap}
.preview{font-size:12.5px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
.inline-check{display:inline-flex;gap:8px;align-items:center;font-size:14px}
.inline-check input{accent-color:var(--omr);width:18px;height:18px}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,30,.55);display:grid;place-items:center;padding:20px}
.modal .box{background:var(--card);border-radius:12px;max-width:520px;width:100%;padding:22px;border:1px solid var(--line);max-height:90vh;overflow:auto}
.modal h2{font-size:19px;font-weight:700;margin-bottom:8px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.form{display:grid;gap:12px;margin-top:12px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form label.inline{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}
.form label.inline input{accent-color:var(--omr);width:18px;height:18px}
.choice{display:grid;gap:8px;margin-top:12px}
.choice button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line-strong);background:var(--card);border-radius:10px;padding:12px 14px;cursor:pointer}
.choice button:hover{border-color:var(--omr);background:var(--omr-soft)}
.choice button b{font-size:15px}
.choice button span{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}

@media (max-width:900px){
  .exam-grid{grid-template-columns:1fr}
  .palette{position:static}
  .side-grid{grid-template-columns:1fr}
  .booklet{grid-template-columns:1fr}
  .grand{border-left:0;padding-left:0;border-top:1px dashed var(--line-strong);padding-top:16px;max-width:none}
}
@media (max-width:620px){
  .qcard{padding:16px}
  .qtext{font-size:16px}
  .res-head{grid-template-columns:1fr;justify-items:start}

<script>
/* ---------- Built-in question bank (English + Telugu) ---------- */
const BUILTIN = {"id":"ap8-ss-sem1","builtin":true,"title":"Social Science · Class 8 · Semester 1","publisher":"SCERT Andhra Pradesh · Samagra Shiksha (2025 impression)","te":{"title":"సాంఘిక శాస్త్రం · 8వ తరగతి · సెమిస్టర్ 1","publisher":"ఎస్‌సిఇఆర్‌టి ఆంధ్రప్రదేశ్ · సమగ్ర శిక్ష (2025 ముద్రణ)"},"chapters":[{"id":"geo1","subject":"Geography","unit":"Resources and Development","no":1,"title":"Resources","te":{"subject":"భూగోళశాస్త్రం","unit":"వనరులు మరియు అభివృద్ధి","title":"వనరులు"},"questions":[{"t":"MCQ","q":"According to the textbook, what makes an object or substance a resource?","o":["Its colour and shape","Its utility or usability","Its rarity alone","Its weight"],"a":1,"e":"Water, electricity, a rickshaw and a textbook are all resources because they have been used to satisfy a need. Utility (usability) is what makes something a resource.","n":"Resource = anything that can be used to satisfy a need. Utility gives it value.","te":{"q":"పాఠ్యపుస్తకం ప్రకారం ఒక వస్తువు లేదా పదార్థాన్ని వనరుగా మార్చేది ఏది?","o":["దాని రంగు, ఆకారం","దాని ఉపయోగం లేదా ఉపయోగ యోగ్యత","దాని అరుదుదనం మాత్రమే","దాని బరువు"],"e":"నీరు, విద్యుత్తు, రిక్షా, పాఠ్యపుస్తకం అన్నీ ఒక అవసరాన్ని తీర్చడానికి ఉపయోగపడుతున్నాయి కాబట్టి అవి వనరులు. ఉపయోగం (ఉపయోగ యోగ్యత) ఒక వస్తువును వనరుగా మారుస్తుంది.","n":"వనరు = ఒక అవసరాన్ని తీర్చడానికి ఉపయోగపడే ఏదైనా. ఉపయోగమే దానికి విలువను ఇస్తుంది."}},{"t":"MCQ","q":"‘Value’ of a resource means its —","o":["Worth","Weight","Quantity","Location"],"a":0,"e":"Amma explains that things become resources only when they have value, and value means worth. Its use or utility gives it value.","n":"Some resources have economic value (metals); some do not (a beautiful landscape), but both satisfy human needs.","te":{"q":"ఒక వనరు యొక్క ‘విలువ’ అంటే —","o":["దాని యోగ్యత (విలువ/ప్రాముఖ్యత)","దాని బరువు","దాని పరిమాణం","దాని స్థానం"],"e":"విలువ ఉన్నప్పుడే వస్తువులు వనరులవుతాయని, విలువ అంటే యోగ్యత అని అమ్మ వివరిస్తుంది. దాని ఉపయోగమే దానికి విలువనిస్తుంది.","n":"కొన్ని వనరులకు ఆర్థిక విలువ ఉంటుంది (లోహాలు); కొన్నింటికి ఉండదు (అందమైన ప్రకృతి దృశ్యం), కానీ రెండూ మానవ అవసరాలను తీరుస్తాయి."}},{"t":"MCQ","q":"Which of the following is an example of a resource that has value but NO economic value?","o":["Iron ore","A beautiful landscape","Coal","Petroleum"],"a":1,"e":"The textbook contrasts metals (economic value) with a beautiful landscape, which may not have economic value but still satisfies human needs.","n":"Economic value is not the only kind of value a resource can have.","te":{"q":"కింది వాటిలో విలువ ఉన్నప్పటికీ ఆర్థిక విలువ లేని వనరుకు ఉదాహరణ ఏది?","o":["ఇనుప ఖనిజం","అందమైన ప్రకృతి దృశ్యం","బొగ్గు","పెట్రోలియం"],"e":"పాఠ్యపుస్తకం లోహాలను (ఆర్థిక విలువ ఉన్నవి) అందమైన ప్రకృతి దృశ్యంతో పోలుస్తుంది; ప్రకృతి దృశ్యానికి ఆర్థిక విలువ లేకపోయినా అది మానవ అవసరాలను తీరుస్తుంది.","n":"ఆర్థిక విలువ ఒక్కటే వనరుకు ఉండే విలువ కాదు."}},{"t":"MCQ","q":"Grandmother’s home remedies have no commercial value today. They could become economically valuable if they are —","o":["Forgotten","Written in a diary","Exported as raw herbs","Patented and sold by a medical firm"],"a":3,"e":"The book says that if the remedies are patented and sold by a medical firm tomorrow, they could become economically valuable. Resources can gain economic value with time.","n":"Patent: the exclusive right over any idea or invention.","te":{"q":"అమ్మమ్మ ఇంటి వైద్యానికి నేడు వాణిజ్య విలువ లేదు. ఇది ఎప్పుడు ఆర్థిక విలువ పొందవచ్చు?","o":["మర్చిపోయినప్పుడు","డైరీలో రాసుకున్నప్పుడు","ముడి మూలికలుగా ఎగుమతి చేసినప్పుడు","ఒక ఔషధ సంస్థ పేటెంట్ పొంది అమ్మినప్పుడు"],"e":"రేపు ఒక ఔషధ సంస్థ వాటికి పేటెంట్ పొంది అమ్మితే అవి ఆర్థికంగా విలువైనవి కావచ్చని పుస్తకం చెబుతుంది. కాలక్రమేణా వనరులు ఆర్థిక విలువను పొందగలవు.","n":"పేటెంట్: ఏదైనా ఆలోచన లేదా ఆవిష్కరణపై ప్రత్యేక హక్కు."}},{"t":"MCQ","q":"Which two factors are described as being able to change substances into resources?","o":["Money and labour","Rainfall and soil","Trade and transport","Time and technology"],"a":3,"e":"‘Time and technology are two important factors that can change substances into resources. Both are related to the needs of the people.’","n":"Technology = the application of the latest knowledge and skill in doing or making things.","te":{"q":"పదార్థాలను వనరులుగా మార్చగలిగే రెండు కారకాలుగా వేటిని పేర్కొన్నారు?","o":["డబ్బు మరియు శ్రమ","వర్షపాతం మరియు నేల","వ్యాపారం మరియు రవాణా","కాలం మరియు సాంకేతికత"],"e":"‘కాలం మరియు సాంకేతికత పదార్థాలను వనరులుగా మార్చగల రెండు ముఖ్యమైన కారకాలు. ఈ రెండూ ప్రజల అవసరాలకు సంబంధించినవి.’","n":"సాంకేతికత = పనులు చేయడంలో లేదా వస్తువులు తయారు చేయడంలో తాజా జ్ఞానం, నైపుణ్యాన్ని ఉపయోగించడం."}},{"t":"MCQ","q":"Which is considered the MOST important resource?","o":["People","Minerals","Forests","Water"],"a":0,"e":"The textbook states that people themselves are the most important resource, because their ideas, knowledge, inventions and discoveries lead to the creation of more resources.","n":"Fire → cooking; wheel → newer modes of transport: each discovery leads to many others.","te":{"q":"అత్యంత ముఖ్యమైన వనరుగా దేనిని పరిగణిస్తారు?","o":["ప్రజలు","ఖనిజాలు","అడవులు","నీరు"],"e":"ప్రజలే అత్యంత ముఖ్యమైన వనరు అని పాఠ్యపుస్తకం చెబుతుంది; వారి ఆలోచనలు, జ్ఞానం, ఆవిష్కరణలు, కనుగొనడాలు మరిన్ని వనరుల సృష్టికి దారితీస్తాయి.","n":"నిప్పు → వంట; చక్రం → కొత్త రవాణా సాధనాలు: ప్రతి ఆవిష్కరణ మరెన్నింటికో దారి తీస్తుంది."}},{"t":"MCQ","q":"Which technology turned fast-flowing water into an important resource?","o":["Irrigation canals","Hydroelectricity","Steam engines","Water mills only"],"a":1,"e":"‘The technology to create hydroelectricity has turned energy in fast flowing water into an important resource.’","n":"Technology converts natural substances into usable resources.","te":{"q":"వేగంగా ప్రవహించే నీటిని ఒక ముఖ్యమైన వనరుగా మార్చిన సాంకేతికత ఏది?","o":["నీటిపారుదల కాలువలు","జలవిద్యుత్తు","ఆవిరి యంత్రాలు","నీటి మరలు మాత్రమే"],"e":"‘జలవిద్యుత్తు ఉత్పత్తి చేసే సాంకేతికత వేగంగా ప్రవహించే నీటిలోని శక్తిని ఒక ముఖ్యమైన వనరుగా మార్చింది.’","n":"సాంకేతికత సహజ పదార్థాలను ఉపయోగకరమైన వనరులుగా మారుస్తుంది."}},{"t":"MCQ","q":"Resources are generally classified into —","o":["Renewable and human made only","Biotic and abiotic only","Local, national and international","Natural, human made and human"],"a":3,"e":"The textbook classifies resources into three groups: natural, human made and human.","n":"Natural → drawn from nature; Human made → changed by people; Human → people’s knowledge and skills.","te":{"q":"వనరులను సాధారణంగా ఏ విధంగా వర్గీకరిస్తారు?","o":["పునరుత్పాదక మరియు మానవ నిర్మిత మాత్రమే","జీవ మరియు నిర్జీవ మాత్రమే","స్థానిక, జాతీయ మరియు అంతర్జాతీయ","సహజ, మానవ నిర్మిత మరియు మానవ వనరులు"],"e":"పాఠ్యపుస్తకం వనరులను మూడు రకాలుగా వర్గీకరిస్తుంది: సహజ, మానవ నిర్మిత మరియు మానవ వనరులు.","n":"సహజ → ప్రకృతి నుండి; మానవ నిర్మిత → ప్రజలు మార్చినవి; మానవ → ప్రజల జ్ఞానం, నైపుణ్యాలు."}},{"t":"MCQ","q":"Resources drawn from nature and used without much modification are called —","o":["Natural resources","Human made resources","Human resources","Potential resources"],"a":0,"e":"Air, water in rivers and lakes, soils and minerals are natural resources: drawn from nature and used without much modification.","n":"Many natural resources are free gifts of nature; some need tools and technology to be used best.","te":{"q":"ప్రకృతి నుండి లభించి, పెద్దగా మార్పు చేయకుండానే ఉపయోగించే వనరులను ఏమంటారు?","o":["సహజ వనరులు","మానవ నిర్మిత వనరులు","మానవ వనరులు","సంభావ్య వనరులు"],"e":"గాలి, నదులు-సరస్సులలోని నీరు, నేలలు, ఖనిజాలు సహజ వనరులు: ప్రకృతి నుండి లభించి పెద్దగా మార్పు లేకుండా వాడబడతాయి.","n":"అనేక సహజ వనరులు ప్రకృతి ఇచ్చిన ఉచిత కానుకలు; కొన్నింటిని సక్రమంగా వాడటానికి పనిముట్లు, సాంకేతికత అవసరం."}},{"t":"Statements","q":"Consider the following statements about renewable resources:\nI. Solar and wind energy are renewable resources not affected by human activities.\nII. Careless use of water, soil and forests can affect their stock.","o":["I only","II only","Both I and II","Neither I nor II"],"a":2,"e":"Both are given in the textbook. Some renewable resources like solar and wind energy are unlimited; yet careless use of water, soil and forest can affect their stock.","n":"Renewable resources are those that get renewed or replenished quickly.","te":{"q":"పునరుత్పాదక వనరుల గురించి కింది వాక్యాలను పరిశీలించండి:\nI. సౌర, పవన శక్తి మానవ కార్యకలాపాల ప్రభావానికి లోనుకాని పునరుత్పాదక వనరులు.\nII. నీరు, నేల, అడవులను అజాగ్రత్తగా వాడితే వాటి నిల్వలు ప్రభావితమవుతాయి.","o":["I మాత్రమే","II మాత్రమే","I మరియు II రెండూ","I, II రెండూ కావు"],"e":"రెండూ పాఠ్యపుస్తకంలో ఉన్నాయి. సౌర, పవన శక్తి వంటి కొన్ని పునరుత్పాదక వనరులు అపరిమితం; అయినా నీరు, నేల, అడవులను అజాగ్రత్తగా వాడితే వాటి నిల్వ దెబ్బతింటుంది.","n":"పునరుత్పాదక వనరులు = త్వరగా పునరుద్ధరించబడేవి లేదా తిరిగి నిండేవి."}},{"t":"MCQ","q":"Which one of the following is a NON-renewable resource?","o":["Wind energy","Natural gas","Solar energy","Forests"],"a":1,"e":"Coal, petroleum and natural gas are examples of non-renewable resources, which have a limited stock.","n":"Once exhausted, they may take thousands of years to be replenished — far longer than human life spans.","te":{"q":"కింది వాటిలో పునరుత్పాదకం కాని వనరు ఏది?","o":["పవన శక్తి","సహజ వాయువు","సౌర శక్తి","అడవులు"],"e":"బొగ్గు, పెట్రోలియం, సహజ వాయువు పునరుత్పాదకం కాని వనరులకు ఉదాహరణలు; వీటి నిల్వ పరిమితం.","n":"నిల్వలు అయిపోతే తిరిగి నిండడానికి వేల సంవత్సరాలు పట్టవచ్చు — ఇది మానవ జీవితకాలం కంటే చాలా ఎక్కువ."}},{"t":"MCQ","q":"Non-renewable resources are those which —","o":["Are made by human beings","Have a limited stock","Are derived from non-living things","Are always free gifts of nature"],"a":1,"e":"This is the textbook exercise answer: non-renewable resources are those which have a limited stock.","n":"Stock of resource = the amount of resources available for use.","te":{"q":"పునరుత్పాదకం కాని వనరులు అంటే —","o":["మానవులు తయారు చేసినవి","పరిమిత నిల్వ కలిగినవి","నిర్జీవ పదార్థాల నుండి లభించేవి","ఎప్పుడూ ప్రకృతి ఇచ్చిన ఉచిత కానుకలు"],"e":"ఇది పాఠ్యపుస్తక అభ్యాస ప్రశ్న సమాధానం: పునరుత్పాదకం కాని వనరులు పరిమిత నిల్వ కలిగినవి.","n":"వనరుల నిల్వ = వినియోగానికి అందుబాటులో ఉన్న వనరుల పరిమాణం."}},{"t":"Assertion–Reason","q":"Assertion (A): The distribution of natural resources over the earth is unequal.\nReason (R): Physical factors like terrain, climate and altitude differ greatly over the earth.","o":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, but R is false","A is false, but R is true"],"a":0,"e":"The distribution of natural resources depends on terrain, climate and altitude; since these factors differ so much over the earth, the distribution is unequal. R explains A.","n":"Unequal distribution of resources is due to physical factors.","te":{"q":"నిశ్చితవాక్యం (A): భూమిపై సహజ వనరుల పంపిణీ అసమానంగా ఉంది.\nకారణం (R): భూస్వరూపం, శీతోష్ణస్థితి, ఎత్తు వంటి భౌతిక కారకాలు భూమిపై చాలా భిన్నంగా ఉంటాయి.","o":["A మరియు R రెండూ సరైనవి, R అనేది A కు సరైన వివరణ","A మరియు R రెండూ సరైనవి, కానీ R అనేది A కు సరైన వివరణ కాదు","A సరైనది, కానీ R తప్పు","A తప్పు, కానీ R సరైనది"],"e":"సహజ వనరుల పంపిణీ భూస్వరూపం, శీతోష్ణస్థితి, ఎత్తుపై ఆధారపడుతుంది; ఈ కారకాలు భూమిపై చాలా భిన్నంగా ఉండటం వల్ల పంపిణీ అసమానంగా ఉంది. R అనేది A ను వివరిస్తుంది.","n":"వనరుల అసమాన పంపిణీకి కారణం భౌతిక కారకాలు."}},{"t":"MCQ","q":"Iron ore became a resource only when —","o":["It was found underground","It was exported","People learnt to extract iron from it","It rusted"],"a":2,"e":"‘Iron ore was not a resource until people learnt to extract iron from it.’ Natural substances sometimes become resources only when their original form is changed.","n":"This explains the idea of human made resources.","te":{"q":"ఇనుప ఖనిజం ఎప్పుడు వనరుగా మారింది?","o":["భూగర్భంలో కనుగొన్నప్పుడు","ఎగుమతి చేసినప్పుడు","దాని నుండి ఇనుమును వెలికితీయడం ప్రజలు నేర్చుకున్నప్పుడు","తుప్పు పట్టినప్పుడు"],"e":"‘దాని నుండి ఇనుమును వెలికితీయడం ప్రజలు నేర్చుకునే వరకు ఇనుప ఖనిజం వనరు కాదు.’ కొన్నిసార్లు సహజ పదార్థాల అసలు రూపం మారినప్పుడే అవి వనరులవుతాయి.","n":"ఇది మానవ నిర్మిత వనరుల భావనను వివరిస్తుంది."}},{"t":"MCQ","q":"Buildings, bridges, roads, machinery and vehicles are examples of —","o":["Natural resources","Human resources","Renewable resources","Human made resources"],"a":3,"e":"People use natural resources to make buildings, bridges, roads, machinery and vehicles; these are known as human made resources.","n":"Technology is also a human made resource.","te":{"q":"భవనాలు, వంతెనలు, రోడ్లు, యంత్రాలు, వాహనాలు వీటికి ఉదాహరణలు —","o":["సహజ వనరులు","మానవ వనరులు","పునరుత్పాదక వనరులు","మానవ నిర్మిత వనరులు"],"e":"ప్రజలు సహజ వనరులను ఉపయోగించి భవనాలు, వంతెనలు, రోడ్లు, యంత్రాలు, వాహనాలు తయారు చేస్తారు; వీటిని మానవ నిర్మిత వనరులు అంటారు.","n":"సాంకేతికత కూడా ఒక మానవ నిర్మిత వనరు."}},{"t":"MCQ","q":"Which one of the following is a human made resource?","o":["Medicines to treat cancer","Spring water","Tropical forests","Coal deposits"],"a":0,"e":"This is the textbook exercise answer. Medicines are made by people from natural substances using knowledge and technology.","n":"Spring water and forests are natural resources.","te":{"q":"కింది వాటిలో మానవ నిర్మిత వనరు ఏది?","o":["క్యాన్సర్ చికిత్సకు మందులు","ఊట నీరు","ఉష్ణమండల అడవులు","బొగ్గు నిక్షేపాలు"],"e":"ఇది పాఠ్యపుస్తక అభ్యాస సమాధానం. మందులను ప్రజలు జ్ఞానం, సాంకేతికత ఉపయోగించి సహజ పదార్థాల నుండి తయారు చేస్తారు.","n":"ఊట నీరు, అడవులు సహజ వనరులు."}},{"t":"MCQ","q":"Improving the quality of people’s skills so that they are able to create more resources is known as —","o":["Resource conservation","Human resource development","Sustainable development","Resource planning"],"a":1,"e":"The textbook defines human resource development as improving the quality of people’s skills so that they can create more resources.","n":"Education and health help in making people a valuable resource.","te":{"q":"మరిన్ని వనరులను సృష్టించగలిగేలా ప్రజల నైపుణ్యాల నాణ్యతను మెరుగుపరచడాన్ని ఏమంటారు?","o":["వనరుల సంరక్షణ","మానవ వనరుల అభివృద్ధి","సుస్థిర అభివృద్ధి","వనరుల ప్రణాళిక"],"e":"మరిన్ని వనరులను సృష్టించేలా ప్రజల నైపుణ్యాల నాణ్యతను మెరుగుపరచడమే మానవ వనరుల అభివృద్ధి అని పాఠ్యపుస్తకం నిర్వచిస్తుంది.","n":"విద్య, ఆరోగ్యం ప్రజలను విలువైన వనరుగా మారుస్తాయి."}},{"t":"MCQ","q":"‘Human Resource’ refers to —","o":["Only the number of people","Only the physical abilities of people","Only educated people","The number (quantity) and abilities (mental and physical) of the people"],"a":3,"e":"The ‘Do you know?’ box says human resource refers to the number (quantity) and abilities (mental and physical) of the people.","n":"It is human skills that transform physical material into a valuable resource.","te":{"q":"‘మానవ వనరు’ అంటే —","o":["ప్రజల సంఖ్య మాత్రమే","ప్రజల శారీరక సామర్థ్యాలు మాత్రమే","విద్యావంతులు మాత్రమే","ప్రజల సంఖ్య (పరిమాణం) మరియు సామర్థ్యాలు (మానసిక, శారీరక)"],"e":"‘మీకు తెలుసా?’ పెట్టె ప్రకారం మానవ వనరు అంటే ప్రజల సంఖ్య (పరిమాణం) మరియు వారి సామర్థ్యాలు (మానసిక, శారీరక).","n":"భౌతిక పదార్థాన్ని విలువైన వనరుగా మార్చేది మానవ నైపుణ్యాలే."}},{"t":"MCQ","q":"Using resources carefully and giving them time to get renewed is called —","o":["Resource conservation","Resource exploitation","Resource distribution","Resource extraction"],"a":0,"e":"Amma tells the children: ‘Using resources carefully and giving them time to get renewed is called resource conservation.’","n":"Each person can help by reducing consumption, recycling and reusing things.","te":{"q":"వనరులను జాగ్రత్తగా ఉపయోగిస్తూ, అవి పునరుద్ధరించబడటానికి సమయం ఇవ్వడాన్ని ఏమంటారు?","o":["వనరుల సంరక్షణ","వనరుల దోపిడీ","వనరుల పంపిణీ","వనరుల వెలికితీత"],"e":"అమ్మ పిల్లలకు చెబుతుంది: ‘వనరులను జాగ్రత్తగా వాడుతూ అవి పునరుద్ధరించబడటానికి సమయం ఇవ్వడాన్ని వనరుల సంరక్షణ అంటారు.’","n":"వినియోగాన్ని తగ్గించడం, పునర్వినియోగం, రీసైక్లింగ్ ద్వారా ప్రతి వ్యక్తి సహాయపడవచ్చు."}},{"t":"MCQ","q":"Balancing the need to use resources and also conserve them for the future is called —","o":["Resource conservation","Human resource development","Sustainable development","Afforestation"],"a":2,"e":"Sustainable development means carefully utilising resources so that besides meeting present needs, the requirements of future generations are also taken care of.","n":"Glossary: Sustainable Development — meet present needs while caring for future generations.","te":{"q":"వనరులను ఉపయోగించుకునే అవసరాన్ని, భవిష్యత్తు కోసం వాటిని సంరక్షించడాన్ని సమతుల్యం చేయడాన్ని ఏమంటారు?","o":["వనరుల సంరక్షణ","మానవ వనరుల అభివృద్ధి","సుస్థిర అభివృద్ధి","అడవుల పెంపకం"],"e":"ప్రస్తుత అవసరాలు తీర్చడంతో పాటు భవిష్యత్ తరాల అవసరాలను కూడా దృష్టిలో ఉంచుకొని వనరులను జాగ్రత్తగా ఉపయోగించడమే సుస్థిర అభివృద్ధి.","n":"పదకోశం: సుస్థిర అభివృద్ధి — ప్రస్తుత అవసరాలు తీరుస్తూ భవిష్యత్ తరాల గురించి శ్రద్ధ వహించడం."}},{"t":"Statements","q":"Which of the following are principles of sustainable development given in the textbook?\nI. All uses of renewable resources must be sustainable.\nII. The damage to the natural environmental system must be minimised.","o":["I only","II only","Both I and II","Neither I nor II"],"a":2,"e":"Both are listed. The textbook also lists conserving the diversity of life on the earth.","n":"Other principles: respect all life, improve quality of human life, minimise depletion, change personal attitudes, enable communities to care for their environment.","te":{"q":"కింది వాటిలో పాఠ్యపుస్తకంలో ఇచ్చిన సుస్థిర అభివృద్ధి సూత్రాలు ఏవి?\nI. పునరుత్పాదక వనరుల వినియోగం అంతా సుస్థిరంగా ఉండాలి.\nII. సహజ పర్యావరణ వ్యవస్థకు జరిగే నష్టాన్ని కనిష్ఠం చేయాలి.","o":["I మాత్రమే","II మాత్రమే","I మరియు II రెండూ","I, II రెండూ కావు"],"e":"రెండూ పేర్కొనబడ్డాయి. భూమిపై జీవ వైవిధ్యాన్ని సంరక్షించాలని కూడా పుస్తకం చెబుతుంది.","n":"ఇతర సూత్రాలు: అన్ని జీవులను గౌరవించడం, మానవ జీవన నాణ్యత మెరుగుపరచడం, వనరుల క్షీణతను తగ్గించడం, వ్యక్తిగత దృక్పథాలు మార్చుకోవడం, సమాజాలు తమ పర్యావరణాన్ని కాపాడుకునేలా చేయడం."}},{"t":"MCQ","q":"The lines ‘Rahiman paani raakhiye, Bin paani sab soon…’ were written by —","o":["Kabir","Tulsidas","Abdur Rahim Khankhana","Amir Khusrau"],"a":2,"e":"The textbook says these lines were written by Abdur Rahim Khankhana, one of the nine gems of Akbar’s court.","n":"The poet refers to water as a precious resource.","te":{"q":"‘రహిమన్ పానీ రాఖియే, బిన్ పానీ సబ్ సూన్…’ అనే పంక్తులు రాసింది —","o":["కబీర్","తులసీదాస్","అబ్దుర్ రహీం ఖాన్‌ఖానా","అమీర్ ఖుస్రో"],"e":"ఈ పంక్తులను అక్బర్ ఆస్థానంలోని నవరత్నాలలో ఒకరైన అబ్దుర్ రహీం ఖాన్‌ఖానా రాశారని పాఠ్యపుస్తకం చెబుతుంది.","n":"కవి నీటిని విలువైన వనరుగా పేర్కొంటున్నారు."}},{"t":"MCQ","q":"Abdur Rahim Khankhana, who wrote about the importance of water, was associated with the court of —","o":["Babur","Shah Jahan","Aurangzeb","Akbar"],"a":3,"e":"He was one of the nine gems (navaratnas) of Akbar’s court.","n":"‘Without water pearl, swan and dough cannot exist.’","te":{"q":"నీటి ప్రాముఖ్యత గురించి రాసిన అబ్దుర్ రహీం ఖాన్‌ఖానా ఎవరి ఆస్థానానికి చెందినవారు?","o":["బాబర్","షాజహాన్","ఔరంగజేబు","అక్బర్"],"e":"ఆయన అక్బర్ ఆస్థానంలోని నవరత్నాలలో ఒకరు.","n":"‘నీరు లేకపోతే ముత్యం, హంస, పిండి ఉండవు.’"}},{"t":"MCQ","q":"Which one of the following does NOT make a substance a resource?","o":["Utility","Value","Quantity","Usability"],"a":2,"e":"This is the textbook exercise answer. Utility and value make a substance a resource; mere quantity does not.","n":"Utility = usability; Value = worth.","te":{"q":"కింది వాటిలో ఒక పదార్థాన్ని వనరుగా మార్చనిది ఏది?","o":["ఉపయోగం","విలువ","పరిమాణం","ఉపయోగ యోగ్యత"],"e":"ఇది పాఠ్యపుస్తక అభ్యాస సమాధానం. ఉపయోగం, విలువ పదార్థాన్ని వనరుగా మారుస్తాయి; కేవలం పరిమాణం మార్చదు.","n":"ఉపయోగం = ఉపయోగ యోగ్యత; విలువ = యోగ్యత."}},{"t":"Assertion–Reason","q":"Assertion (A): Jessy says she will be careful not to waste paper.\nReason (R): Many trees are cut down to make paper.","o":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, but R is false","A is false, but R is true"],"a":0,"e":"Jessy explains her decision by saying many trees are cut down to make paper. Saving paper conserves forests, so R explains A.","n":"Mustafa: ‘Electricity comes from water and coal’, so saving electricity conserves resources too.","te":{"q":"నిశ్చితవాక్యం (A): తాను కాగితాన్ని వృథా చేయకుండా జాగ్రత్తగా ఉంటానని జెస్సీ చెబుతుంది.\nకారణం (R): కాగితం తయారీకి చాలా చెట్లను నరుకుతారు.","o":["A మరియు R రెండూ సరైనవి, R అనేది A కు సరైన వివరణ","A మరియు R రెండూ సరైనవి, కానీ R అనేది A కు సరైన వివరణ కాదు","A సరైనది, కానీ R తప్పు","A తప్పు, కానీ R సరైనది"],"e":"కాగితం కోసం చాలా చెట్లు నరుకుతారని జెస్సీ తన నిర్ణయాన్ని వివరిస్తుంది. కాగితం పొదుపు అడవులను కాపాడుతుంది, కాబట్టి R అనేది A ను వివరిస్తుంది.","n":"ముస్తఫా: ‘విద్యుత్తు నీరు, బొగ్గు నుండి వస్తుంది’ — విద్యుత్తు పొదుపు కూడా వనరులను కాపాడుతుంది."}},{"t":"MCQ","q":"Which of the following is regarded as having NO commercial value in Amma’s list?","o":["Iron ore","Coal deposits","Cotton cloth","Affection from friends and family"],"a":3,"e":"Affection from family and friends satisfies a human need but cannot be bought or sold, so it has no commercial value.","n":"Other non-commercial items in the list include old folk songs, good weather and beautiful scenery.","te":{"q":"అమ్మ జాబితాలో వాణిజ్య విలువ లేనిదిగా భావించేది ఏది?","o":["ఇనుప ఖనిజం","బొగ్గు నిక్షేపాలు","నూలు వస్త్రం","స్నేహితులు, కుటుంబం నుండి లభించే ఆప్యాయత"],"e":"కుటుంబం, స్నేహితుల ఆప్యాయత మానవ అవసరాన్ని తీరుస్తుంది కానీ కొనడం లేదా అమ్మడం సాధ్యం కాదు, కాబట్టి దానికి వాణిజ్య విలువ లేదు.","n":"జాబితాలో వాణిజ్య విలువ లేని ఇతరాలు: పాత జానపద గీతాలు, మంచి వాతావరణం, అందమైన దృశ్యం."}}]},{"id":"geo2","subject":"Geography","unit":"Resources and Development","no":2,"title":"Land, Soil, Water, Natural Vegetation and Wildlife Resources","te":{"subject":"భూగోళశాస్త్రం","unit":"వనరులు మరియు అభివృద్ధి","title":"భూమి, మృత్తిక, జలం, సహజ వృక్షసంపద మరియు వన్యప్రాణి వనరులు"},"questions":[{"t":"MCQ","q":"Land covers about what per cent of the total area of the earth’s surface?","o":["About 50 per cent","About 70 per cent","About 30 per cent","About 10 per cent"],"a":2,"e":"Land is among the most important natural resources and covers only about thirty per cent of the earth’s surface.","n":"Not all parts of this small percentage are habitable.","te":{"q":"భూమి ఉపరితల మొత్తం వైశాల్యంలో భూభాగం సుమారు ఎంత శాతం ఉంది?","o":["సుమారు 50 శాతం","సుమారు 70 శాతం","సుమారు 30 శాతం","సుమారు 10 శాతం"],"e":"భూమి అత్యంత ముఖ్యమైన సహజ వనరులలో ఒకటి; ఇది భూ ఉపరితలంలో సుమారు ముప్పై శాతం మాత్రమే ఆక్రమిస్తుంది.","n":"ఈ చిన్న శాతంలోని అన్ని భాగాలు నివాసయోగ్యం కావు."}},{"t":"MCQ","q":"Ninety per cent of the world population occupies only about —","o":["Ten per cent of land area","Thirty per cent of land area","Fifty per cent of land area","Seventy per cent of land area"],"a":1,"e":"‘Ninety per cent of the world population occupies only thirty per cent of land area. The remaining seventy per cent is sparsely populated or uninhabited.’","n":"Uneven distribution of population is mainly due to varied land and climate.","te":{"q":"ప్రపంచ జనాభాలో తొంభై శాతం కేవలం ఎంత భూభాగంలో నివసిస్తున్నారు?","o":["భూభాగంలో పది శాతం","భూభాగంలో ముప్పై శాతం","భూభాగంలో యాభై శాతం","భూభాగంలో డెబ్బై శాతం"],"e":"‘ప్రపంచ జనాభాలో తొంభై శాతం భూభాగంలోని ముప్పై శాతంలోనే నివసిస్తున్నారు. మిగిలిన డెబ్బై శాతం పలుచని జనాభాతో లేదా నిర్జనంగా ఉంది.’","n":"జనాభా అసమాన పంపిణీకి ప్రధాన కారణం భూమి, శీతోష్ణస్థితుల్లోని వైవిధ్యం."}},{"t":"MCQ","q":"Which of the following areas are normally densely populated?","o":["Plains and river valleys","Desert areas","Steep mountain slopes","Thick forests"],"a":0,"e":"Plains and river valleys offer suitable land for agriculture and hence are the densely populated areas of the world.","n":"Rugged topography, steep slopes, low-lying flood areas, deserts and thick forests are sparsely populated.","te":{"q":"కింది వాటిలో సాధారణంగా జనసాంద్రత ఎక్కువగా ఉండే ప్రాంతాలు ఏవి?","o":["మైదానాలు, నదీ లోయలు","ఎడారి ప్రాంతాలు","నిటారు కొండ వాలులు","దట్టమైన అడవులు"],"e":"మైదానాలు, నదీ లోయలు వ్యవసాయానికి అనుకూలమైన భూమిని అందిస్తాయి; కాబట్టి ఇవి ప్రపంచంలో జనసాంద్రత ఎక్కువగా ఉండే ప్రాంతాలు.","n":"ఎగుడుదిగుడు భూస్వరూపం, నిటారు వాలులు, వరద ప్రాంతాలు, ఎడారులు, దట్టమైన అడవుల్లో జనాభా పలుచగా ఉంటుంది."}},{"t":"MCQ","q":"Mamba lives in a small village in —","o":["Kenya","Tanzania","New Zealand","Australia"],"a":1,"e":"Mamba lives in a small village in Tanzania, Africa, and walks a long way to fetch water.","n":"Peter lives in the sheep-rearing region of New Zealand.","te":{"q":"మాంబా ఏ దేశంలోని ఒక చిన్న గ్రామంలో నివసిస్తుంది?","o":["కెన్యా","టాంజానియా","న్యూజిలాండ్","ఆస్ట్రేలియా"],"e":"మాంబా ఆఫ్రికాలోని టాంజానియాలో ఒక చిన్న గ్రామంలో నివసిస్తూ నీటి కోసం చాలా దూరం నడుస్తుంది.","n":"పీటర్ న్యూజిలాండ్‌లోని గొర్రెల పెంపకం ప్రాంతంలో నివసిస్తాడు."}},{"t":"MCQ","q":"Peter’s family in New Zealand runs a —","o":["Wool processing factory","Tea estate","Fish farm","Coffee plantation"],"a":0,"e":"Peter lives in the sheep-rearing region of New Zealand, where his family runs a wool processing factory and also grows vegetables through organic farming.","n":"The difference between Mamba and Peter is due to land, soil, water, vegetation, animals and technology.","te":{"q":"న్యూజిలాండ్‌లో పీటర్ కుటుంబం నడుపుతున్నది —","o":["ఉన్ని శుద్ధి కర్మాగారం","తేయాకు తోట","చేపల క్షేత్రం","కాఫీ తోట"],"e":"పీటర్ న్యూజిలాండ్‌లోని గొర్రెల పెంపకం ప్రాంతంలో నివసిస్తాడు; అతని కుటుంబం ఉన్ని శుద్ధి కర్మాగారం నడుపుతూ, సేంద్రియ వ్యవసాయంతో కూరగాయలు కూడా పండిస్తుంది.","n":"మాంబా, పీటర్ జీవితాల్లోని తేడాకు కారణం భూమి, నేల, నీరు, వృక్షసంపద, జంతువులు, సాంకేతికతలోని తేడాలు."}},{"t":"Statements","q":"The use of land is determined by:\nI. Physical factors such as topography, soil, climate, minerals and availability of water.\nII. Human factors such as population and technology.","o":["I only","II only","Both I and II","Neither I nor II"],"a":2,"e":"Both physical factors and human factors (population and technology) determine the land use pattern.","n":"Land use = use of land for agriculture, forestry, mining, houses, roads and industries.","te":{"q":"భూమి వినియోగాన్ని నిర్ణయించేవి:\nI. భూస్వరూపం, నేల, శీతోష్ణస్థితి, ఖనిజాలు, నీటి లభ్యత వంటి భౌతిక కారకాలు.\nII. జనాభా, సాంకేతికత వంటి మానవ కారకాలు.","o":["I మాత్రమే","II మాత్రమే","I మరియు II రెండూ","I, II రెండూ కావు"],"e":"భౌతిక కారకాలు, మానవ కారకాలు (జనాభా, సాంకేతికత) రెండూ భూ వినియోగ విధానాన్ని నిర్ణయిస్తాయి.","n":"భూ వినియోగం = వ్యవసాయం, అడవులు, గనులు, ఇళ్లు, రోడ్లు, పరిశ్రమల కోసం భూమిని ఉపయోగించడం."}},{"t":"MCQ","q":"Community lands are also called —","o":["Private property resources","Common property resources","Reserved lands","Wastelands"],"a":1,"e":"Community land is owned by the community for common uses like collection of fodder, fruits, nuts or medicinal herbs; these are also called common property resources.","n":"Private land is owned by individuals.","te":{"q":"సామాజిక భూములను ఇలా కూడా అంటారు —","o":["ప్రైవేట్ ఆస్తి వనరులు","ఉమ్మడి ఆస్తి వనరులు","రిజర్వు భూములు","బంజరు భూములు"],"e":"పశుగ్రాసం, పండ్లు, గింజలు, ఔషధ మూలికల సేకరణ వంటి ఉమ్మడి అవసరాల కోసం సమాజానికి చెందిన భూమిని సామాజిక భూమి అంటారు; వీటినే ఉమ్మడి ఆస్తి వనరులు అంటారు.","n":"ప్రైవేట్ భూమి వ్యక్తులకు చెందుతుంది."}},{"t":"MCQ","q":"Which of the following is NOT listed as a method of conserving land resources?","o":["Afforestation","Land reclamation","Checks on overgrazing","Unregulated use of chemical fertilisers"],"a":3,"e":"The book lists afforestation, land reclamation, regulated use of chemical pesticides and fertilisers, and checks on overgrazing. Unregulated use harms land.","n":"Growing population and demand have caused large-scale destruction of forest cover and arable land.","te":{"q":"కింది వాటిలో భూ వనరుల సంరక్షణ పద్ధతిగా పేర్కొననిది ఏది?","o":["అడవుల పెంపకం","భూ పునరుద్ధరణ","అతిగా మేపడాన్ని అరికట్టడం","రసాయన ఎరువులను నియంత్రణ లేకుండా వాడటం"],"e":"అడవుల పెంపకం, భూ పునరుద్ధరణ, రసాయన క్రిమిసంహారకాలు-ఎరువుల నియంత్రిత వినియోగం, అతిగా మేపడాన్ని అరికట్టడం పుస్తకంలో ఉన్నాయి. నియంత్రణ లేని వినియోగం భూమికి హాని చేస్తుంది.","n":"పెరుగుతున్న జనాభా, డిమాండ్ వల్ల అటవీ విస్తీర్ణం, సాగుభూమి పెద్ద ఎత్తున నాశనమవుతోంది."}},{"t":"MCQ","q":"The mass movement of rock, debris or earth down a slope is called —","o":["Weathering","Soil erosion","Desertification","Landslide"],"a":3,"e":"Landslides are defined as the mass movement of rock, debris or earth down a slope. They often occur with earthquakes, floods and volcanoes.","n":"A prolonged spell of rainfall can cause a heavy landslide that blocks a river.","te":{"q":"రాళ్లు, శిథిలాలు లేదా మట్టి వాలు వెంబడి కిందికి పెద్ద ఎత్తున జారిపోవడాన్ని ఏమంటారు?","o":["శైథిల్యం","నేల కోత","ఎడారీకరణ","కొండచరియలు విరిగిపడటం"],"e":"రాళ్లు, శిథిలాలు లేదా మట్టి వాలు వెంబడి సామూహికంగా కిందికి కదలడాన్ని కొండచరియలు విరిగిపడటం అంటారు. ఇవి తరచూ భూకంపాలు, వరదలు, అగ్నిపర్వతాలతో పాటు సంభవిస్తాయి.","n":"ఎడతెరిపి లేని వర్షం భారీ కొండచరియలు విరిగిపడి నదిని అడ్డుకునేలా చేయవచ్చు."}},{"t":"MCQ","q":"The massive landslide at Pangi village near Reckong Peo occurred in which district?","o":["Kullu","Chamba","Shimla","Kinnaur"],"a":3,"e":"The case study: a landslide hit Pangi village near Reckong Peo in Kinnaur district of Himachal Pradesh, damaging a 200-metre stretch of NH-22.","n":"It was triggered by intense blasting at Pangi village.","te":{"q":"రెకాంగ్ పియో సమీపంలోని పాంగీ గ్రామంలో భారీ కొండచరియలు విరిగిపడిన ఘటన ఏ జిల్లాలో జరిగింది?","o":["కుల్లు","చంబా","సిమ్లా","కిన్నౌర్"],"e":"కేస్ స్టడీ: హిమాచల్ ప్రదేశ్‌లోని కిన్నౌర్ జిల్లా రెకాంగ్ పియో సమీపంలోని పాంగీ గ్రామంలో కొండచరియలు విరిగిపడి జాతీయ రహదారి-22లో 200 మీటర్ల భాగం దెబ్బతింది.","n":"పాంగీ గ్రామంలో తీవ్రమైన పేలుళ్ల వల్ల ఇది జరిగింది."}},{"t":"MCQ","q":"The Pangi landslide was triggered mainly by —","o":["Heavy snowfall","An earthquake","A cloudburst","Intense blasting"],"a":3,"e":"The textbook says the landslide was triggered by intense blasting, which caused the weak zone of the slope to collapse.","n":"The old Hindustan-Tibet road (National Highway-22) was damaged.","te":{"q":"పాంగీ కొండచరియలు విరిగిపడటానికి ప్రధాన కారణం —","o":["భారీ హిమపాతం","భూకంపం","మేఘ విస్ఫోటనం","తీవ్రమైన పేలుళ్లు (బ్లాస్టింగ్)"],"e":"తీవ్రమైన పేలుళ్ల వల్ల వాలులోని బలహీన భాగం కూలిపోయి కొండచరియలు విరిగిపడ్డాయని పాఠ్యపుస్తకం చెబుతుంది.","n":"పాత హిందుస్తాన్-టిబెట్ రహదారి (జాతీయ రహదారి-22) దెబ్బతింది."}},{"t":"MCQ","q":"Which of the following is a mitigation technique for landslides?","o":["Removal of vegetation","Blasting of hill slopes","Building settlements on steep slopes","Construction of retention walls"],"a":3,"e":"Retention walls stop land from slipping. Other techniques: hazard mapping, increasing vegetation cover and surface drainage control.","n":"Hazard mapping locates landslide-prone areas so settlements can avoid them.","te":{"q":"కింది వాటిలో కొండచరియలు విరిగిపడటాన్ని తగ్గించే పద్ధతి ఏది?","o":["వృక్షసంపదను తొలగించడం","కొండ వాలులను పేల్చడం","నిటారు వాలులపై నివాసాలు నిర్మించడం","ప్రతిధారణ గోడల (రిటెన్షన్ వాల్) నిర్మాణం"],"e":"ప్రతిధారణ గోడలు నేల జారకుండా ఆపుతాయి. ఇతర పద్ధతులు: ప్రమాద పటాల తయారీ, వృక్షసంపద పెంపు, ఉపరితల నీటి పారుదల నియంత్రణ.","n":"ప్రమాద పటాల తయారీ కొండచరియలు విరిగే ప్రాంతాలను గుర్తించి అక్కడ నివాసాలు రాకుండా చేస్తుంది."}},{"t":"MCQ","q":"The breaking up and decay of exposed rocks by temperature changes, frost action, plants, animals and human activity is called —","o":["Weathering","Erosion","Deposition","Leaching"],"a":0,"e":"This is the glossary definition of weathering. Soil is formed from organic matter, minerals and weathered rocks through weathering.","n":"The right mix of minerals and organic matter makes soil fertile.","te":{"q":"ఉష్ణోగ్రత మార్పులు, మంచు చర్య, మొక్కలు, జంతువులు, మానవ కార్యకలాపాల వల్ల బహిర్గత శిలలు విరిగి క్షీణించడాన్ని ఏమంటారు?","o":["శైథిల్యం","క్రమక్షయం","నిక్షేపణ","నిక్షాళనం"],"e":"ఇది శైథిల్యానికి పదకోశ నిర్వచనం. సేంద్రియ పదార్థం, ఖనిజాలు, శైథిల్యమైన శిలల నుండి శైథిల్య ప్రక్రియ ద్వారా నేల ఏర్పడుతుంది.","n":"ఖనిజాలు, సేంద్రియ పదార్థాల సరైన మిశ్రమం నేలను సారవంతం చేస్తుంది."}},{"t":"MCQ","q":"How long does it take to make just one centimetre of soil?","o":["A few days","A few years","A million years","Hundreds of years"],"a":3,"e":"The ‘Do you know?’ box says it takes hundreds of years to make just one centimetre of soil.","n":"This is why soil conservation is very important.","te":{"q":"కేవలం ఒక సెంటీమీటరు నేల ఏర్పడటానికి ఎంత కాలం పడుతుంది?","o":["కొన్ని రోజులు","కొన్ని సంవత్సరాలు","పది లక్షల సంవత్సరాలు","వందల సంవత్సరాలు"],"e":"‘మీకు తెలుసా?’ పెట్టె ప్రకారం కేవలం ఒక సెంటీమీటరు నేల ఏర్పడటానికి వందల సంవత్సరాలు పడుతుంది.","n":"అందుకే నేల సంరక్షణ చాలా ముఖ్యం."}},{"t":"Chronology","q":"Arrange the layers of the soil profile from TOP to BOTTOM:\n1. Parent rock\n2. Sub soil with sand, silt and clay\n3. Top soil with humus and vegetation\n4. Weathered rock material","o":["3, 4, 2, 1","2, 3, 4, 1","3, 2, 4, 1","1, 4, 2, 3"],"a":2,"e":"Fig. 2.3 shows: top soil with humus and vegetation → sub soil with sand, silt and clay → weathered rock material → parent rock.","n":"Humus is in the top soil, which is why it is the most fertile layer.","te":{"q":"నేల పరిచ్ఛేదం (సాయిల్ ప్రొఫైల్)లోని పొరలను పై నుండి కిందికి అమర్చండి:\n1. మాతృశిల\n2. ఇసుక, ఒండ్రు, బంకమట్టితో కూడిన అంతర్ మృత్తిక\n3. హ్యూమస్, వృక్షసంపదతో కూడిన పై మట్టి\n4. శైథిల్యమైన శిలా పదార్థం","o":["3, 4, 2, 1","2, 3, 4, 1","3, 2, 4, 1","1, 4, 2, 3"],"e":"పటం 2.3: హ్యూమస్, వృక్షసంపదతో పై మట్టి → ఇసుక, ఒండ్రు, బంకమట్టితో అంతర్ మృత్తిక → శైథిల్యమైన శిలా పదార్థం → మాతృశిల.","n":"హ్యూమస్ పై మట్టిలో ఉంటుంది, అందుకే అది అత్యంత సారవంతమైన పొర."}},{"t":"MCQ","q":"The two major factors of soil formation are —","o":["Time and relief","Flora and fauna","Parent rock and climate","Slope and altitude"],"a":2,"e":"‘The major factors of soil formation are the nature of the parent rock and climatic factors.’ Others are topography, organic material and time.","n":"Climatic factors = temperature and rainfall.","te":{"q":"నేల ఏర్పడటానికి ప్రధానమైన రెండు కారకాలు —","o":["కాలం మరియు నిమ్నోన్నతం","వృక్షజాలం మరియు జంతుజాలం","మాతృశిల మరియు శీతోష్ణస్థితి","వాలు మరియు ఎత్తు"],"e":"‘నేల ఏర్పడటానికి ప్రధాన కారకాలు మాతృశిల స్వభావం మరియు శీతోష్ణస్థితి కారకాలు.’ ఇతరాలు భూస్వరూపం, సేంద్రియ పదార్థం, కాలం.","n":"శీతోష్ణస్థితి కారకాలు = ఉష్ణోగ్రత మరియు వర్షపాతం."}},{"t":"Match","q":"Match the factor of soil formation (List-I) with what it determines (List-II):\n(a) Parent rock   —   (i) Thickness of soil profile\n(b) Relief   —   (ii) Colour, texture, chemical properties, permeability\n(c) Time   —   (iii) Rate of weathering and humus formation\n(d) Climate   —   (iv) Accumulation of soil (altitude and slope)","o":["a-i, b-ii, c-iii, d-iv","a-ii, b-iv, c-i, d-iii","a-iii, b-i, c-iv, d-ii","a-ii, b-iii, c-i, d-iv"],"a":1,"e":"Fig. 2.4: Parent rock → colour, texture, chemical properties, minerals, permeability; Relief → accumulation of soil; Time → thickness of soil profile; Climate → rate of weathering and humus formation.","n":"Flora, fauna and micro-organisms affect the rate of humus formation.","te":{"q":"నేల ఏర్పడే కారకాన్ని (జాబితా-I) అది నిర్ణయించే దానితో (జాబితా-II) జతపరచండి:\n(a) మాతృశిల   —   (i) నేల పరిచ్ఛేదం మందం\n(b) నిమ్నోన్నతం   —   (ii) రంగు, ఆకృతి, రసాయన లక్షణాలు, పారగమ్యత\n(c) కాలం   —   (iii) శైథిల్య రేటు, హ్యూమస్ ఏర్పడే రేటు\n(d) శీతోష్ణస్థితి   —   (iv) నేల పోగుపడటం (ఎత్తు, వాలు)","o":["a-i, b-ii, c-iii, d-iv","a-ii, b-iv, c-i, d-iii","a-iii, b-i, c-iv, d-ii","a-ii, b-iii, c-i, d-iv"],"e":"పటం 2.4: మాతృశిల → రంగు, ఆకృతి, రసాయన లక్షణాలు, ఖనిజాలు, పారగమ్యత; నిమ్నోన్నతం → నేల పోగుపడటం; కాలం → నేల పరిచ్ఛేదం మందం; శీతోష్ణస్థితి → శైథిల్యం, హ్యూమస్ ఏర్పడే రేటు.","n":"వృక్షజాలం, జంతుజాలం, సూక్ష్మజీవులు హ్యూమస్ ఏర్పడే రేటును ప్రభావితం చేస్తాయి."}},{"t":"MCQ","q":"Which one of the following is NOT a factor of soil formation?","o":["Soil texture","Time","Organic matter","Parent rock"],"a":0,"e":"This is the textbook exercise answer. Soil texture is a property of soil, determined by the parent rock; it is not a factor of formation.","n":"Factors: parent rock, climate, relief, organic material (flora/fauna), time.","te":{"q":"కింది వాటిలో నేల ఏర్పడే కారకం కానిది ఏది?","o":["నేల ఆకృతి","కాలం","సేంద్రియ పదార్థం","మాతృశిల"],"e":"ఇది పాఠ్యపుస్తక అభ్యాస సమాధానం. నేల ఆకృతి మాతృశిల ద్వారా నిర్ణయించబడే నేల లక్షణం; అది నేల ఏర్పడే కారకం కాదు.","n":"కారకాలు: మాతృశిల, శీతోష్ణస్థితి, నిమ్నోన్నతం, సేంద్రియ పదార్థం (వృక్ష/జంతుజాలం), కాలం."}},{"t":"MCQ","q":"Covering the bare ground between plants with a layer of organic matter like straw to retain soil moisture is called —","o":["Mulching","Intercropping","Terrace farming","Shelter belts"],"a":0,"e":"Mulching: the bare ground between plants is covered with organic matter like straw. It helps to retain soil moisture.","n":"A soil conservation method.","te":{"q":"మొక్కల మధ్య ఖాళీ నేలను గడ్డి వంటి సేంద్రియ పదార్థపు పొరతో కప్పి నేల తేమను నిలుపుకోవడాన్ని ఏమంటారు?","o":["మల్చింగ్ (పలుచని కప్పు)","అంతర పంటలు","సోపాన వ్యవసాయం","రక్షక మేఖలలు"],"e":"మల్చింగ్: మొక్కల మధ్య ఖాళీ నేలను గడ్డి వంటి సేంద్రియ పదార్థంతో కప్పుతారు. ఇది నేల తేమను నిలుపుకోవడానికి సహాయపడుతుంది.","n":"ఇది ఒక నేల సంరక్షణ పద్ధతి."}},{"t":"MCQ","q":"Which method is most appropriate to check soil erosion on STEEP slopes?","o":["Shelter belts","Terrace cultivation","Mulching","Rock dams"],"a":1,"e":"Textbook exercise answer: terrace farming makes broad flat steps on steep slopes, giving flat surfaces to grow crops and reducing surface runoff and soil erosion.","n":"See Fig. 2.5 Terrace Farming.","te":{"q":"నిటారు వాలులపై నేల కోతను అరికట్టడానికి అత్యంత తగిన పద్ధతి ఏది?","o":["రక్షక మేఖలలు","సోపాన వ్యవసాయం","మల్చింగ్","రాతి ఆనకట్టలు"],"e":"పాఠ్యపుస్తక అభ్యాస సమాధానం: సోపాన వ్యవసాయంలో నిటారు వాలులపై వెడల్పాటి చదునైన మెట్లు నిర్మించి పంటలు పండిస్తారు; ఇది ఉపరితల ప్రవాహాన్ని, నేల కోతను తగ్గిస్తుంది.","n":"పటం 2.5 సోపాన వ్యవసాయం చూడండి."}},{"t":"MCQ","q":"Rows of trees planted in coastal and dry regions to check wind movement and protect soil cover are called —","o":["Intercropping","Contour barriers","Contour ploughing","Shelter belts"],"a":3,"e":"Shelter belts are rows of trees planted in coastal and dry regions to check wind movement. The textbook’s true/false exercise says calling this ‘intercropping’ is false.","n":"Fig. 2.7 Shelter Belts.","te":{"q":"తీర ప్రాంతాలు, పొడి ప్రాంతాల్లో గాలి కదలికను అడ్డుకొని నేలను రక్షించడానికి వరుసలుగా నాటిన చెట్లను ఏమంటారు?","o":["అంతర పంటలు","కాంటూరు అడ్డుకట్టలు","కాంటూరు దున్నకం","రక్షక మేఖలలు (షెల్టర్ బెల్ట్స్)"],"e":"తీర, పొడి ప్రాంతాల్లో గాలి కదలికను అడ్డుకోవడానికి వరుసలుగా నాటిన చెట్లే రక్షక మేఖలలు. దీనిని ‘అంతర పంటలు’ అనడం తప్పు అని పాఠ్యపుస్తక సత్యాసత్య అభ్యాసం చెబుతుంది.","n":"పటం 2.7 రక్షక మేఖలలు."}},{"t":"Match","q":"Match the soil conservation method (List-I) with its description (List-II):\n(a) Rock dam   —   (i) Ploughing parallel to the contours of a hill slope\n(b) Contour ploughing   —   (ii) Rocks piled up to slow down the flow of water\n(c) Intercropping   —   (iii) Stones, grass, soil built along contours with trenches in front\n(d) Contour barriers   —   (iv) Different crops grown in alternate rows at different times","o":["a-i, b-ii, c-iii, d-iv","a-ii, b-i, c-iv, d-iii","a-ii, b-iv, c-i, d-iii","a-iii, b-i, c-iv, d-ii"],"a":1,"e":"Rock dam → rocks piled to slow water (prevents gullies); Contour ploughing → parallel to contours; Intercropping → alternate rows sown at different times; Contour barriers → stones, grass, soil along contours.","n":"Intercropping protects the soil from rain wash.","te":{"q":"నేల సంరక్షణ పద్ధతిని (జాబితా-I) దాని వివరణతో (జాబితా-II) జతపరచండి:\n(a) రాతి ఆనకట్ట   —   (i) కొండ వాలు కాంటూరు రేఖలకు సమాంతరంగా దున్నడం\n(b) కాంటూరు దున్నకం   —   (ii) నీటి ప్రవాహ వేగం తగ్గించడానికి రాళ్లను పోగు చేయడం\n(c) అంతర పంటలు   —   (iii) కాంటూరుల వెంట రాళ్లు, గడ్డి, మట్టితో అడ్డుకట్టలు, ముందు కందకాలు\n(d) కాంటూరు అడ్డుకట్టలు   —   (iv) వేర్వేరు పంటలను ప్రత్యామ్నాయ వరుసల్లో వేర్వేరు సమయాల్లో విత్తడం","o":["a-i, b-ii, c-iii, d-iv","a-ii, b-i, c-iv, d-iii","a-ii, b-iv, c-i, d-iii","a-iii, b-i, c-iv, d-ii"],"e":"రాతి ఆనకట్ట → నీటి వేగం తగ్గించడానికి రాళ్లు పోగు (గల్లీలను నివారిస్తుంది); కాంటూరు దున్నకం → కాంటూరులకు సమాంతరంగా; అంతర పంటలు → ప్రత్యామ్నాయ వరుసలు, వేర్వేరు సమయాల్లో; కాంటూరు అడ్డుకట్టలు → కాంటూరుల వెంట రాళ్లు, గడ్డి, మట్టి.","n":"అంతర పంటలు వర్షపు నీటి కోత నుండి నేలను కాపాడతాయి."}},{"t":"MCQ","q":"The earth is called the ‘water planet’ because —","o":["Water is found in all planets","It rains every day","It has the largest rivers","Three-fourth of its surface is covered with water"],"a":3,"e":"Three-fourth of the earth’s surface is covered with water, so it is appropriately called the ‘water planet’.","n":"Life began in the primitive oceans almost 3.5 billion years back.","te":{"q":"భూమిని ‘జల గ్రహం’ అని ఎందుకు అంటారు?","o":["అన్ని గ్రహాలపై నీరు ఉంది కాబట్టి","ప్రతిరోజూ వర్షం పడుతుంది కాబట్టి","అతి పెద్ద నదులు ఉన్నాయి కాబట్టి","దాని ఉపరితలంలో మూడొంతులు నీటితో కప్పబడి ఉంది కాబట్టి"],"e":"భూ ఉపరితలంలో మూడొంతులు నీటితో కప్పబడి ఉంది, కాబట్టి దీనిని సముచితంగా ‘జల గ్రహం’ అంటారు.","n":"సుమారు 350 కోట్ల సంవత్సరాల క్రితం ఆదిమ సముద్రాల్లో జీవం మొదలైంది."}},{"t":"MCQ","q":"Fresh water accounts for only about what per cent of the total water on earth?","o":["1 per cent","2.7 per cent","10 per cent","27 per cent"],"a":1,"e":"Fresh water accounts for only about 2.7 per cent. Nearly 70 per cent of this occurs as ice sheets and glaciers.","n":"Only 1 per cent of fresh water is available and fit for human use.","te":{"q":"భూమిపై ఉన్న మొత్తం నీటిలో మంచినీరు సుమారు ఎంత శాతం మాత్రమే?","o":["1 శాతం","2.7 శాతం","10 శాతం","27 శాతం"],"e":"మంచినీరు కేవలం సుమారు 2.7 శాతం. అందులో దాదాపు 70 శాతం మంచు పలకలు, హిమానీనదాల రూపంలో ఉంది.","n":"మంచినీటిలో కేవలం 1 శాతం మాత్రమే మానవ వినియోగానికి అందుబాటులో, యోగ్యంగా ఉంది."}},{"t":"Statements","q":"Consider the following statements about water:\nI. The total volume of water on earth remains constant.\nII. Water can be added to or subtracted from the earth by human activity.","o":["I only","II only","Both I and II","Neither I nor II"],"a":0,"e":"The textbook says water can neither be added nor subtracted from the earth; its total volume remains constant. It only seems to vary because it is in constant motion through the water cycle.","n":"Water cycle: evaporation, precipitation and run-off.","te":{"q":"నీటి గురించి కింది వాక్యాలను పరిశీలించండి:\nI. భూమిపై నీటి మొత్తం పరిమాణం స్థిరంగా ఉంటుంది.\nII. మానవ కార్యకలాపాల ద్వారా భూమికి నీటిని కలపవచ్చు లేదా తీసివేయవచ్చు.","o":["I మాత్రమే","II మాత్రమే","I మరియు II రెండూ","I, II రెండూ కావు"],"e":"భూమికి నీటిని కలపడం గానీ తీసివేయడం గానీ సాధ్యం కాదని, దాని మొత్తం పరిమాణం స్థిరమని పాఠ్యపుస్తకం చెబుతుంది. నీటి చక్రంలో నిరంతరం కదులుతుండటం వల్లే అది మారుతున్నట్లు కనిపిస్తుంది.","n":"నీటి చక్రం: బాష్పీభవనం, అవపాతం, ఉపరితల ప్రవాహం."}},{"t":"MCQ","q":"According to the textbook, an average urban Indian uses about how many litres of water every day?","o":["50 litres","100 litres","150 litres","250 litres"],"a":2,"e":"The activity table shows an average urban Indian uses about 150 litres per day — the largest uses being flushing (40) and washing clothes (40).","n":"Drinking 3, cooking 4, bathing 20, utensils 20, gardening 23 litres.","te":{"q":"పాఠ్యపుస్తకం ప్రకారం ఒక సగటు పట్టణ భారతీయుడు రోజుకు సుమారు ఎన్ని లీటర్ల నీరు వాడుతాడు?","o":["50 లీటర్లు","100 లీటర్లు","150 లీటర్లు","250 లీటర్లు"],"e":"కృత్య పట్టిక ప్రకారం సగటు పట్టణ భారతీయుడు రోజుకు సుమారు 150 లీటర్లు వాడుతాడు — అత్యధికం ఫ్లషింగ్ (40), బట్టలు ఉతకడం (40).","n":"తాగడానికి 3, వంటకు 4, స్నానానికి 20, పాత్రలకు 20, తోటపనికి 23 లీటర్లు."}},{"t":"MCQ","q":"A dripping tap wastes about how much water in a year?","o":["1200 litres","120 litres","12,000 litres","500 litres"],"a":0,"e":"The ‘Do you know?’ box says a dripping tap wastes 1200 litres of water in a year.","n":"Consumption of water rose from 3850 cu km/year (1975) to over 6000 cu km/year (2000).","te":{"q":"కారుతున్న ఒక కుళాయి సంవత్సరంలో సుమారు ఎంత నీటిని వృథా చేస్తుంది?","o":["1200 లీటర్లు","120 లీటర్లు","12,000 లీటర్లు","500 లీటర్లు"],"e":"‘మీకు తెలుసా?’ పెట్టె ప్రకారం కారుతున్న కుళాయి సంవత్సరంలో 1200 లీటర్ల నీటిని వృథా చేస్తుంది.","n":"నీటి వినియోగం 3850 ఘ.కి.మీ/సం (1975) నుండి 6000 ఘ.కి.మీ/సం పైకి (2000) పెరిగింది."}},{"t":"MCQ","q":"In dry regions with high rates of evaporation, which method of irrigation is very useful?","o":["Flood irrigation","Drip or trickle irrigation","Canal irrigation","Tank irrigation"],"a":1,"e":"The textbook says drip or trickle irrigation is very useful in dry regions with high evaporation. Sprinklers also check losses through seepage and evaporation.","n":"Canals should be lined to minimise seepage losses.","te":{"q":"బాష్పీభవన రేటు ఎక్కువగా ఉండే పొడి ప్రాంతాల్లో ఏ నీటిపారుదల పద్ధతి చాలా ఉపయోగకరం?","o":["వరద నీటిపారుదల","బిందు సేద్యం (డ్రిప్/ట్రికిల్)","కాలువ నీటిపారుదల","చెరువు నీటిపారుదల"],"e":"బాష్పీభవనం ఎక్కువగా ఉండే పొడి ప్రాంతాల్లో బిందు సేద్యం చాలా ఉపయోగకరమని పాఠ్యపుస్తకం చెబుతుంది. స్ప్రింక్లర్లు కూడా ఇంకుడు, బాష్పీభవన నష్టాలను తగ్గిస్తాయి.","n":"ఇంకుడు నష్టాలు తగ్గించడానికి కాలువలకు లైనింగ్ చేయాలి."}},{"t":"MCQ","q":"Rain water harvesting: one spell of rain for two hours is enough to save about —","o":["8,000 litres","800 litres","80,000 litres","1,200 litres"],"a":0,"e":"The ‘Do you know?’ box: on an average, one spell of rain for two hours is enough to save 8,000 litres of water.","n":"Rain water harvesting collects rain water from roof tops and stores it for future use.","te":{"q":"వర్షపు నీటి సేకరణ: రెండు గంటల ఒక వర్షపు జల్లు సుమారు ఎంత నీటిని ఆదా చేయడానికి సరిపోతుంది?","o":["8,000 లీటర్లు","800 లీటర్లు","80,000 లీటర్లు","1,200 లీటర్లు"],"e":"‘మీకు తెలుసా?’ పెట్టె: సగటున రెండు గంటల ఒక వర్షపు జల్లు 8,000 లీటర్ల నీటిని ఆదా చేయడానికి సరిపోతుంది.","n":"వర్షపు నీటి సేకరణ అంటే పైకప్పుల నుండి వర్షపు నీటిని సేకరించి భవిష్యత్ వినియోగానికి నిల్వ చేయడం."}},{"t":"MCQ","q":"The narrow zone of contact between the lithosphere, hydrosphere and atmosphere is called —","o":["Ecosystem","Troposphere","Biosphere","Habitat"],"a":2,"e":"Natural vegetation and wildlife exist only in the narrow zone of contact between lithosphere, hydrosphere and atmosphere, called the biosphere.","n":"The life supporting system of inter-related living beings is called the ecosystem.","te":{"q":"శిలావరణం, జలావరణం, వాతావరణం కలిసే సన్నని ప్రాంతాన్ని ఏమంటారు?","o":["పర్యావరణ వ్యవస్థ","ట్రోపోస్ఫియర్","జీవావరణం","ఆవాసం"],"e":"సహజ వృక్షసంపద, వన్యప్రాణులు శిలావరణం, జలావరణం, వాతావరణం కలిసే సన్నని ప్రాంతంలో మాత్రమే ఉంటాయి; దీనిని జీవావరణం అంటారు.","n":"పరస్పర సంబంధం గల జీవుల జీవనాధార వ్యవస్థను పర్యావరణ వ్యవస్థ అంటారు."}},{"t":"MCQ","q":"Vultures in the Indian subcontinent were dying of kidney failure after scavenging livestock treated with —","o":["Aspirin","Diclofenac","DDT","Penicillin"],"a":1,"e":"Vultures were dying of kidney failure after eating livestock treated with diclofenac, a painkiller similar to aspirin or ibuprofen.","n":"Vultures are scavengers — vital cleansers of the environment.","te":{"q":"భారత ఉపఖండంలో రాబందులు ఏ మందుతో చికిత్స పొందిన పశువుల కళేబరాలను తిన్న తర్వాత మూత్రపిండాల వైఫల్యంతో చనిపోయాయి?","o":["ఆస్పిరిన్","డైక్లోఫెనాక్","డీడీటీ","పెన్సిలిన్"],"e":"ఆస్పిరిన్ లేదా ఐబుప్రోఫెన్ లాంటి నొప్పి నివారిణి డైక్లోఫెనాక్‌తో చికిత్స పొందిన పశువులను తిన్న రాబందులు మూత్రపిండాల వైఫల్యంతో చనిపోయాయి.","n":"రాబందులు కళేబర భక్షకాలు — పర్యావరణానికి ముఖ్యమైన శుద్ధికారులు."}},{"t":"MCQ","q":"The growth of natural vegetation depends primarily on —","o":["Soil and slope","Altitude and wind","Latitude and longitude","Temperature and moisture"],"a":3,"e":"‘The growth of vegetation depends primarily on temperature and moisture.’","n":"Major vegetation types: forests, grasslands, scrubs and tundra.","te":{"q":"సహజ వృక్షసంపద పెరుగుదల ప్రధానంగా వేటిపై ఆధారపడుతుంది?","o":["నేల మరియు వాలు","ఎత్తు మరియు గాలి","అక్షాంశం మరియు రేఖాంశం","ఉష్ణోగ్రత మరియు తేమ"],"e":"‘వృక్షసంపద పెరుగుదల ప్రధానంగా ఉష్ణోగ్రత, తేమపై ఆధారపడుతుంది.’","n":"ప్రధాన వృక్షసంపద రకాలు: అడవులు, గడ్డి భూములు, పొదలు, టండ్రా."}},{"t":"MCQ","q":"Tundra vegetation of the cold polar regions comprises —","o":["Thorny shrubs","Tall evergreen trees","Mosses and lichens","Tall grasses"],"a":2,"e":"Tundra vegetation of cold Polar Regions comprises mosses and lichens.","n":"Scrubs grow in dry areas; plants there have deep roots and thorny, waxy leaves.","te":{"q":"శీతల ధ్రువ ప్రాంతాల టండ్రా వృక్షసంపదలో ఉండేవి —","o":["ముళ్ల పొదలు","ఎత్తైన సతత హరిత చెట్లు","నాచు మరియు లైకెన్లు","పొడవైన గడ్డి"],"e":"శీతల ధ్రువ ప్రాంతాల టండ్రా వృక్షసంపదలో నాచు, లైకెన్లు ఉంటాయి.","n":"పొదలు పొడి ప్రాంతాల్లో పెరుగుతాయి; అక్కడి మొక్కలకు లోతైన వేర్లు, ముళ్లు-మైనపు పూత ఉన్న ఆకులు ఉంటాయి."}},{"t":"Assertion–Reason","q":"Assertion (A): In dry areas of low rainfall, plants have deep roots and leaves with thorny and waxy surfaces.\nReason (R): These features reduce loss of moisture through transpiration.","o":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, but R is false","A is false, but R is true"],"a":0,"e":"The textbook explains that thorny and waxy surfaces reduce moisture loss through transpiration, which helps plants survive in low rainfall areas.","n":"Short stunted trees and grasses grow in moderate rainfall regions (grasslands).","te":{"q":"నిశ్చితవాక్యం (A): తక్కువ వర్షపాతం ఉండే పొడి ప్రాంతాల్లో మొక్కలకు లోతైన వేర్లు, ముళ్లు మరియు మైనపు ఉపరితలం గల ఆకులు ఉంటాయి.\nకారణం (R): ఈ లక్షణాలు బాష్పోత్సేకం ద్వారా తేమ కోల్పోవడాన్ని తగ్గిస్తాయి.","o":["A మరియు R రెండూ సరైనవి, R అనేది A కు సరైన వివరణ","A మరియు R రెండూ సరైనవి, కానీ R అనేది A కు సరైన వివరణ కాదు","A సరైనది, కానీ R తప్పు","A తప్పు, కానీ R సరైనది"],"e":"ముళ్లు, మైనపు ఉపరితలాలు బాష్పోత్సేకం ద్వారా తేమ నష్టాన్ని తగ్గిస్తాయని పాఠ్యపుస్తకం వివరిస్తుంది; ఇది తక్కువ వర్షపాత ప్రాంతాల్లో మొక్కలు మనుగడ సాగించడానికి సహాయపడుతుంది.","n":"మధ్యస్థ వర్షపాత ప్రాంతాల్లో పొట్టి చెట్లు, గడ్డి పెరుగుతాయి (గడ్డి భూములు)."}},{"t":"MCQ","q":"CITES is an international agreement related to —","o":["Climate change","Ozone layer protection","Trade in endangered species of wild fauna and flora","Ocean pollution"],"a":2,"e":"CITES = Convention on International Trade in Endangered Species of Wild Fauna and Flora. It aims to ensure that international trade does not threaten the survival of species.","n":"About 5,000 species of animals and 28,000 species of plants are protected.","te":{"q":"CITES అనేది దేనికి సంబంధించిన అంతర్జాతీయ ఒప్పందం?","o":["వాతావరణ మార్పు","ఓజోన్ పొర రక్షణ","అంతరించిపోతున్న వన్య జంతు, వృక్ష జాతుల అంతర్జాతీయ వ్యాపారం","సముద్ర కాలుష్యం"],"e":"CITES = అంతరించిపోతున్న వన్య జంతుజాల, వృక్షజాల జాతుల అంతర్జాతీయ వ్యాపార ఒప్పందం. అంతర్జాతీయ వ్యాపారం జాతుల మనుగడకు ముప్పు కాకుండా చూడటం దీని లక్ష్యం.","n":"సుమారు 5,000 జంతు జాతులు, 28,000 వృక్ష జాతులు రక్షించబడుతున్నాయి."}},{"t":"MCQ","q":"Under CITES, roughly how many species of plants are protected?","o":["5,000","50,000","2,800","28,000"],"a":3,"e":"Roughly 5,000 species of animals and 28,000 species of plants are protected under CITES.","n":"Examples: bears, dolphins, cacti, corals, orchids and aloes.","te":{"q":"CITES కింద సుమారు ఎన్ని వృక్ష జాతులు రక్షించబడుతున్నాయి?","o":["5,000","50,000","2,800","28,000"],"e":"CITES కింద సుమారు 5,000 జంతు జాతులు, 28,000 వృక్ష జాతులు రక్షించబడుతున్నాయి.","n":"ఉదాహరణలు: ఎలుగుబంట్లు, డాల్ఫిన్లు, కాక్టస్‌లు, పగడాలు, ఆర్కిడ్లు, కలబంద."}},{"t":"MCQ","q":"A series of protected areas linked through a global network, intended to demonstrate the relationship between conservation and development, is called a —","o":["National Park","Biosphere reserve","Wildlife Sanctuary","Reserved forest"],"a":1,"e":"This is the glossary definition of biosphere reserves.","n":"National Park: a natural area designated to protect the ecological integrity of one or more ecosystems.","te":{"q":"సంరక్షణ, అభివృద్ధి మధ్య సంబంధాన్ని ప్రదర్శించే ఉద్దేశంతో ప్రపంచవ్యాప్త నెట్‌వర్క్ ద్వారా అనుసంధానమైన రక్షిత ప్రాంతాల శ్రేణిని ఏమంటారు?","o":["జాతీయ ఉద్యానవనం","జీవావరణ రిజర్వు (బయోస్ఫియర్ రిజర్వు)","వన్యప్రాణి అభయారణ్యం","రిజర్వు అడవి"],"e":"ఇది జీవావరణ రిజర్వులకు పదకోశ నిర్వచనం.","n":"జాతీయ ఉద్యానవనం: ఒకటి లేదా అంతకంటే ఎక్కువ పర్యావరణ వ్యవస్థల సమగ్రతను కాపాడటానికి నిర్దేశించిన సహజ ప్రాంతం."}},{"t":"MCQ","q":"Which awareness programme for tree planting is mentioned in the textbook?","o":["Chipko","Project Tiger","Van Mahotsav","Green Revolution"],"a":2,"e":"Awareness programmes like social forestry and Vanamahotsava should be encouraged at regional and community level.","n":"School children should be encouraged to bird-watch and visit nature camps.","te":{"q":"పాఠ్యపుస్తకంలో పేర్కొన్న మొక్కలు నాటే అవగాహన కార్యక్రమం ఏది?","o":["చిప్కో","ప్రాజెక్ట్ టైగర్","వన మహోత్సవం","హరిత విప్లవం"],"e":"సామాజిక అడవుల పెంపకం, వనమహోత్సవం వంటి అవగాహన కార్యక్రమాలను ప్రాంతీయ, సామాజిక స్థాయిల్లో ప్రోత్సహించాలి.","n":"పాఠశాల పిల్లలను పక్షుల పరిశీలనకు, ప్రకృతి శిబిరాలకు ప్రోత్సహించాలి."}},{"t":"Statements","q":"Which of the following statements are TRUE as per the textbook exercises?\nI. The Ganga–Brahmaputra plain of India is an overpopulated region.\nII. Water availability per person in India is declining.","o":["I only","II only","Both I and II","Neither I nor II"],"a":2,"e":"Both statements are true. Plains and river valleys are densely populated, and rising population and demand reduce per-person water availability.","n":"‘Human interference and changes of climate can maintain the ecosystem’ is FALSE.","te":{"q":"పాఠ్యపుస్తక అభ్యాసాల ప్రకారం కింది వాటిలో సరైన వాక్యాలు ఏవి?\nI. భారతదేశంలోని గంగా-బ్రహ్మపుత్ర మైదానం అధిక జనాభా గల ప్రాంతం.\nII. భారతదేశంలో తలసరి నీటి లభ్యత తగ్గుతోంది.","o":["I మాత్రమే","II మాత్రమే","I మరియు II రెండూ","I, II రెండూ కావు"],"e":"రెండు వాక్యాలూ సరైనవి. మైదానాలు, నదీ లోయల్లో జనసాంద్రత ఎక్కువ; పెరుగుతున్న జనాభా, డిమాండ్ తలసరి నీటి లభ్యతను తగ్గిస్తున్నాయి.","n":"‘మానవ జోక్యం, శీతోష్ణస్థితి మార్పులు పర్యావరణ వ్యవస్థను కాపాడగలవు’ అనేది తప్పు."}},{"t":"MCQ","q":"The textbook photograph showing a herd of elephants is from —","o":["Kaziranga National Park","Gir National Park","Jim Corbett National Park","Sunderbans"],"a":0,"e":"Fig. 2.19 shows a herd of elephants in Kaziranga National Park.","n":"Fig. 2.16 shows the loss of rainforest in Great Nicobar after the tsunami.","te":{"q":"పాఠ్యపుస్తకంలో ఏనుగుల గుంపును చూపించే చిత్రం ఏ ప్రాంతానికి చెందినది?","o":["కజిరంగా జాతీయ ఉద్యానవనం","గిర్ జాతీయ ఉద్యానవనం","జిమ్ కార్బెట్ జాతీయ ఉద్యానవనం","సుందర్‌బన్స్"],"e":"పటం 2.19 కజిరంగా జాతీయ ఉద్యానవనంలోని ఏనుగుల గుంపును చూపిస్తుంది.","n":"పటం 2.16 సునామీ తర్వాత గ్రేట్ నికోబార్‌లో వర్షారణ్య నష్టాన్ని చూపిస్తుంది."}}]},{"id":"geo3","subject":"Geography","unit":"Resources and Development","no":3,"title":"Agriculture","te":{"subject":"భూగోళశాస్త్రం","unit":"వనరులు మరియు అభివృద్ధి","title":"వ్యవసాయం"},"questions":[{"t":"MCQ","q":"The word ‘agriculture’ is derived from Latin words ‘ager’ or ‘agri’ meaning —","o":["Crop","Field","Farmer","Soil"],"a":3,"e":"‘Ager’ or ‘agri’ means soil and ‘culture’ means cultivation.","n":"Agriculture = the science and art of cultivation on the soil, raising crops and rearing livestock.","te":{"q":"‘అగ్రికల్చర్’ అనే పదం ‘ఏజర్’ లేదా ‘అగ్రి’ అనే లాటిన్ పదాల నుండి వచ్చింది. వాటి అర్థం —","o":["పంట","పొలం","రైతు","నేల"],"e":"‘ఏజర్’ లేదా ‘అగ్రి’ అంటే నేల, ‘కల్చర్’ అంటే సాగు.","n":"వ్యవసాయం = నేలను సాగు చేయడం, పంటలు పండించడం, పశువులను పెంచడం అనే శాస్త్రం మరియు కళ."}},{"t":"Match","q":"Match the economic activity (List-I) with its example (List-II):\n(a) Primary   —   (i) Baking of bread\n(b) Secondary   —   (ii) Banking\n(c) Tertiary   —   (iii) Fishing\n(d) Primary   —   (iv) Gathering","o":["a-i, b-ii, c-iii, d-iv","a-iii, b-i, c-ii, d-iv","a-iv, b-ii, c-i, d-iii","a-iii, b-ii, c-i, d-iv"],"a":1,"e":"Primary → extraction and production (fishing, gathering); Secondary → processing (baking bread); Tertiary → services (banking).","n":"Tertiary: transport, trade, banking, insurance, advertising.","te":{"q":"ఆర్థిక కార్యకలాపాన్ని (జాబితా-I) దాని ఉదాహరణతో (జాబితా-II) జతపరచండి:\n(a) ప్రాథమిక   —   (i) బ్రెడ్ తయారీ (బేకింగ్)\n(b) ద్వితీయ   —   (ii) బ్యాంకింగ్\n(c) తృతీయ   —   (iii) చేపలు పట్టడం\n(d) ప్రాథమిక   —   (iv) సేకరణ","o":["a-i, b-ii, c-iii, d-iv","a-iii, b-i, c-ii, d-iv","a-iv, b-ii, c-i, d-iii","a-iii, b-ii, c-i, d-iv"],"e":"ప్రాథమిక → వెలికితీత, ఉత్పత్తి (చేపలు పట్టడం, సేకరణ); ద్వితీయ → ప్రాసెసింగ్ (బ్రెడ్ తయారీ); తృతీయ → సేవలు (బ్యాంకింగ్).","n":"తృతీయ: రవాణా, వ్యాపారం, బ్యాంకింగ్, బీమా, ప్రకటనలు."}},{"t":"MCQ","q":"Manufacturing of steel, baking of bread and weaving of cloth are examples of —","o":["Primary activities","Tertiary activities","Quaternary activities","Secondary activities"],"a":3,"e":"Secondary activities are concerned with the processing of natural resources.","n":"Primary activities include agriculture, fishing and gathering.","te":{"q":"ఉక్కు తయారీ, బ్రెడ్ తయారీ, వస్త్రాల నేత వీటికి ఉదాహరణలు —","o":["ప్రాథమిక కార్యకలాపాలు","తృతీయ కార్యకలాపాలు","చతుర్థ కార్యకలాపాలు","ద్వితీయ కార్యకలాపాలు"],"e":"సహజ వనరుల ప్రాసెసింగ్‌కు సంబంధించినవి ద్వితీయ కార్యకలాపాలు.","n":"ప్రాథమిక కార్యకలాపాల్లో వ్యవసాయం, చేపలు పట్టడం, సేకరణ ఉన్నాయి."}},{"t":"MCQ","q":"Transport, trade, banking, insurance and advertising are examples of —","o":["Primary activities","Secondary activities","Tertiary activities","Allied activities"],"a":2,"e":"Tertiary activities provide support to the primary and secondary sectors through services.","n":"Agriculture is a primary activity.","te":{"q":"రవాణా, వ్యాపారం, బ్యాంకింగ్, బీమా, ప్రకటనలు వీటికి ఉదాహరణలు —","o":["ప్రాథమిక కార్యకలాపాలు","ద్వితీయ కార్యకలాపాలు","తృతీయ కార్యకలాపాలు","అనుబంధ కార్యకలాపాలు"],"e":"తృతీయ కార్యకలాపాలు సేవల ద్వారా ప్రాథమిక, ద్వితీయ రంగాలకు మద్దతు ఇస్తాయి.","n":"వ్యవసాయం ఒక ప్రాథమిక కార్యకలాపం."}},{"t":"MCQ","q":"In India, approximately what proportion of the population is still dependent on agriculture?","o":["One-fourth","One-third","Two-thirds","Half"],"a":2,"e":"‘Two-thirds of India’s population is still dependent on agriculture.’ In the world, 50 per cent of persons are engaged in agriculture.","n":"The land on which crops are grown is called arable land.","te":{"q":"భారతదేశంలో జనాభాలో సుమారు ఎంత భాగం ఇప్పటికీ వ్యవసాయంపై ఆధారపడి ఉంది?","o":["నాలుగో వంతు","మూడో వంతు","మూడింట రెండు వంతులు","సగం"],"e":"‘భారత జనాభాలో మూడింట రెండు వంతులు ఇప్పటికీ వ్యవసాయంపై ఆధారపడి ఉన్నారు.’ ప్రపంచంలో 50 శాతం మంది వ్యవసాయంలో ఉన్నారు.","n":"పంటలు పండించే భూమిని సాగుభూమి (అరేబుల్ ల్యాండ్) అంటారు."}},{"t":"Match","q":"Match the term (List-I) with its meaning (List-II):\n(a) Sericulture   —   (i) Breeding of fish in tanks and ponds\n(b) Pisciculture   —   (ii) Commercial rearing of silk worms\n(c) Viticulture   —   (iii) Growing vegetables, flowers and fruits for commercial use\n(d) Horticulture   —   (iv) Cultivation of grapes","o":["a-i, b-ii, c-iii, d-iv","a-ii, b-i, c-iv, d-iii","a-ii, b-iii, c-iv, d-i","a-iv, b-i, c-ii, d-iii"],"a":1,"e":"Sericulture → silk worms; Pisciculture → fish; Viticulture → grapes; Horticulture → vegetables, flowers and fruits for commercial use.","n":"Sericulture may supplement the income of the farmer.","te":{"q":"పదాన్ని (జాబితా-I) దాని అర్థంతో (జాబితా-II) జతపరచండి:\n(a) సెరికల్చర్   —   (i) ట్యాంకులు, చెరువుల్లో చేపల పెంపకం\n(b) పిసికల్చర్   —   (ii) వాణిజ్యపరంగా పట్టు పురుగుల పెంపకం\n(c) విటికల్చర్   —   (iii) వాణిజ్య అవసరాల కోసం కూరగాయలు, పూలు, పండ్ల సాగు\n(d) హార్టికల్చర్   —   (iv) ద్రాక్ష సాగు","o":["a-i, b-ii, c-iii, d-iv","a-ii, b-i, c-iv, d-iii","a-ii, b-iii, c-iv, d-i","a-iv, b-i, c-ii, d-iii"],"e":"సెరికల్చర్ → పట్టు పురుగులు; పిసికల్చర్ → చేపలు; విటికల్చర్ → ద్రాక్ష; హార్టికల్చర్ → వాణిజ్య అవసరాల కోసం కూరగాయలు, పూలు, పండ్లు.","n":"పట్టు పురుగుల పెంపకం రైతు ఆదాయాన్ని పెంచవచ్చు."}},{"t":"MCQ","q":"Horticulture means —","o":["Primitive farming","Growing of wheat","Rearing of cattle","Growing of fruits and vegetables"],"a":3,"e":"Textbook exercise answer: horticulture is growing vegetables, flowers and fruits for commercial use.","n":"Floriculture is the growing of flowers.","te":{"q":"హార్టికల్చర్ (ఉద్యానవన సాగు) అంటే —","o":["ఆదిమ వ్యవసాయం","గోధుమ సాగు","పశువుల పెంపకం","పండ్లు, కూరగాయల సాగు"],"e":"పాఠ్యపుస్తక అభ్యాస సమాధానం: వాణిజ్య అవసరాల కోసం కూరగాయలు, పూలు, పండ్లు పండించడమే హార్టికల్చర్.","n":"పూల సాగును ఫ్లోరికల్చర్ అంటారు."}},{"t":"Statements","q":"In the farm system of an arable farm:\nI. Seeds, fertilisers, machinery and labour are inputs.\nII. Crops, wool, dairy and poultry products are outputs.","o":["I only","II only","Both I and II","Neither I nor II"],"a":2,"e":"Both are correct as per the farm system (Fig. 3.2). Ploughing, sowing, irrigation, weeding and harvesting are the processes.
