    for(let p=1;p<=pdf.numPages;p++){
      const page=await pdf.getPage(p);const tc=await page.getTextContent();
      let s="";for(const it of tc.items){s+=it.str;s+=it.hasEOL?"\n":" "}
      u.pages.push({n:p,text:cleanText(s)});page.cleanup&&page.cleanup();
      u.progress=Math.round(100*p/pdf.numPages);const bar=$("#readBar");bar&&(bar.style.width=u.progress+"%");
      if(p%5===0)await new Promise(r=>setTimeout(r,0));
    }
    try{const md=await pdf.getMetadata();const tt=md&&md.info&&md.info.Title;if(tt&&tt.length>3&&!/untitled|\.pdf$/i.test(tt))u.title=tt}catch(e){}
    u.chapters=detectChapters(u.pages);u.busy=false;renderUpload();toast(t("readDone",{n:u.pages.length,c:u.chapters.length}));
  }catch(e){console.error(e);u.busy=false;u.file=null;renderUpload();toast(t("readFail",{e:e.message||"error"}),5000)}
}
function cleanText(t){
  t=t.replace(/[\u0000-\u0008\u000B-\u001F]/g,"").split("\n").filter(l=>{const x=l.replace(/\s+/g,"");if(!x)return true;if(/^[.·•]+$/.test(x))return false;const letters=(x.match(/[A-Za-zఀ-౿ऀ-ॿ0-9]/g)||[]).length;return letters/x.length>0.55||x.length<4}).join("\n");
  return t.replace(/­/g,"").replace(/-\n(?=[a-z])/g,"").replace(/(\w)-\s*\n\s*(?=[A-Z])/g,"$1-").replace(/(\w)- (?=[A-Z][a-z])/g,"$1-").replace(/[ \t]+/g," ").replace(/(\. ){3,}/g," ").replace(/\n{3,}/g,"\n\n").trim();
}
function detectChapters(pages){
  const re=/(?:^|\n)\s*(?:chapter|lesson|unit|part)\s*[-–:.]?\s*(\d{1,2}|[ivx]{1,5})\b[\s:.\-–]*([^\n]{0,80})/i;
  const found=[];
  pages.forEach(p=>{const head=p.text.slice(0,400);const all=(p.text.match(/\b(?:chapter|lesson|unit)\s*\d{1,2}\b/gi)||[]).length;if(all>3)return; // contents page
    const m=head.match(re);if(m){let title=(m[2]||"").replace(/\s+/g," ").trim();if(title.length<3){const nx=head.slice(m.index+m[0].length).split("\n").map(s=>s.trim()).find(s=>s.length>3);title=nx||""}
      const num=m[1];if(found.length&&found[found.length-1].num.toLowerCase()===num.toLowerCase())return;
      found.push({num,from:p.n,title:title.slice(0,70)})}});
  if(found.length<2){ // fallback: running page headers/footers that name the chapter (common in textbooks)
    const norm=l=>l.replace(/\d+/g,"").replace(/\s+/g," ").replace(/\s+,/g,",").trim();
    const headOf=p=>{const ls=p.text.split("\n").map(x=>x.trim()).filter(Boolean);return [ls[0],ls[ls.length-1]].filter(Boolean).map(norm).filter(h=>h.length>=6&&h.length<=90&&/[A-Za-z]{3}/.test(h))};
    const freq=new Map();pages.forEach(p=>new Set(headOf(p)).forEach(h=>freq.set(h,(freq.get(h)||0)+1)));
    const heads=new Set([...freq].filter(([h,c])=>c>=3&&c<pages.length*0.9).map(([h])=>h));
    if(heads.size>=2){const segs=[];let cur=null,lastSeen=0;
      pages.forEach(p=>{const h=headOf(p).find(x=>heads.has(x));if(!h)return;if(!cur||cur.h!==h){cur={h,from:segs.length?lastSeen+1:1};segs.push(cur)}lastSeen=p.n});
      const small=new Set(["and","of","the","in","on","to","a","an","for"]);
      const tc=h=>h.toLowerCase().split(" ").map((w,i)=>i&&small.has(w)?w:w.charAt(0).toUpperCase()+w.slice(1)).join(" ");
      if(segs.length>=2)found.splice(0,found.length,...segs.map((sg,i)=>({num:String(i+1),from:sg.from,title:tc(sg.h)})))}
  }
  if(found.length<2){ // fallback: chapters that open with a bare number and a title, numbered 1,2,3…
    const seq=[];pages.forEach(p=>{const m=p.text.match(/^\s*(\d{1,2})\s*\n+\s*([A-Z][^\n]{2,60})(?:\n([A-Za-z][^\n]{1,40}))?/);if(!m)return;const num=+m[1];const exp=seq.length?+seq[seq.length-1].num+1:num;if(num!==exp||num>40)return;
      let title=m[2].trim();if(m[3]&&title.length<40&&!/[.!?]$/.test(title)&&m[3].split(" ").length<=4)title+=" "+m[3].trim();seq.push({num:String(num),from:p.n,title})});
    if(seq.length>=2)found.splice(0,found.length,...seq)}
  if(found.length<2){const n=10,out=[];for(let p=1;p<=pages.length;p+=n)out.push({title:"Part "+(out.length+1)+" (pages "+p+"–"+Math.min(pages.length,p+n-1)+")",subject:"Chapters",from:p,to:Math.min(pages.length,p+n-1)});return out}
  return found.map((f,i)=>({title:("Chapter "+f.num+(f.title?": "+f.title:"")).slice(0,90),subject:"Chapters",from:f.from,to:i<found.length-1?Math.max(f.from,found[i+1].from-1):pages.length}));
}

function logU(s){const u=state.upload;u.log+=(u.log?"\n":"")+s;const l=$("#log");if(l){l.hidden=false;l.textContent=u.log;l.scrollTop=l.scrollHeight}}
async function generateBank(){
  const u=state.upload;if(!u.chapters.length)return toast(t("addOne"));
  u.busy=true;u.step=3;u.progress=0;u.log="";u.stop=false;renderUpload();
  const out=[];const per=u.perCh;
  for(let i=0;i<u.chapters.length;i++){
    if(u.stop)break;
    const c=u.chapters[i];const pages=u.pages.slice(c.from-1,c.to);const text=pages.map(p=>p.text).join("\n");
    logU(t("logCh",{i:i+1,n:u.chapters.length,t:c.title,c:text.length.toLocaleString()}));
    let qs=[],chTe=null;
    if(text.replace(/\s/g,"").length<300){logU(t("logSkip"))}
    else if(u.method==="ai"){
      try{const r=await aiQuestions(c.title,pages,per,u);qs=r.qs;chTe=r.titleTe;logU(t("logAi",{n:qs.length}))}
      catch(e){if(e&&e.code==="cancelled"){logU(t("logStop"));break}
        logU(t("logAiFail",{c:(e&&e.code)||"error"}));qs=offlineQuestions(pages,per,c.title);
        if(e&&(e.code==="not_granted"||e.code==="rate_limited")){u.method="offline";logU(t("logSwitch"))}}
    }else{qs=offlineQuestions(pages,per,c.title);logU(t("logOff",{n:qs.length}))}
    const cleanTitle=c.title.replace(/^chapter\s*\w+\s*[:.\-–]\s*/i,"")||c.title;
    out.push({id:"c"+i+"-"+uid(),subject:(c.subject||"Chapters").trim()||"Chapters",unit:"",no:i+1,title:cleanTitle,te:chTe?{title:chTe,subject:"",unit:""}:undefined,pages:c.from+"–"+c.to,questions:qs});
    u.progress=Math.round(100*(i+1)/u.chapters.length);const bar=$("#genBar");bar&&(bar.style.width=u.progress+"%");
    await new Promise(r=>setTimeout(r,0));
  }
  u.busy=false;
  const total=out.reduce((s,c)=>s+c.questions.length,0);
  if(!total){renderUpload();logU(t("noneMade"));return}
  const b={id:"bk-"+uid(),title:(u.title||"Uploaded book").trim(),publisher:tr("fromFile",{f:u.file?u.file.name:"PDF"},"en"),method:u.method,created:Date.now(),chapters:out.filter(c=>c.questions.length)};
  await IDB.put(b);books.push(b);currentBookId=b.id;LS.set("dsc.book",b.id);
  state.upload=null;toast(t("savedBook",{t:b.title,n:total}),4000);go("home");
}

/* --- Claude-written questions (runs only inside Claude, with the viewer's consent) --- */
async function aiQuestions(title,pages,count,u){
  const chunks=[];let cur="";
  for(const p of pages){if(cur.length+p.text.length>(u.withTe!==false?32000:42000)&&cur){chunks.push(cur);cur=""}cur+=`\n[page ${p.n}]\n`+p.text}
  if(cur)chunks.push(cur);
  const all=[];let titleTe=null;const withTe=u.withTe!==false;
  for(let k=0;k<chunks.length;k++){
    if(u.stop)throw{code:"cancelled"};
    const n=Math.max(3,Math.round(count*chunks[k].length/chunks.reduce((s,c)=>s+c.length,0)));
    const teRule=withTe?`
Also give a faithful Telugu translation of every question in a "te" object: {"question":"...","options":["...","...","...","..."],"explanation":"...","note":"..."} — Telugu script, standard AP school-textbook terminology, same option order as English, names, dates and numbers unchanged. In the first item also add "chapter_te": the chapter title in Telugu.`:"";
    const prompt=`You are an expert paper-setter for the Andhra Pradesh DSC (District Selection Committee) teacher-recruitment exam. Using ONLY the textbook content below (chapter: "${title}"), write exactly ${n} objective questions in DSC pattern.
Mix of types: about 50% direct MCQs; 20% statement-based ("Consider the following statements:\\nI. ...\\nII. ..." with options exactly ["I only","II only","Both I and II","Neither I nor II"]); 15% assertion-reason ("Assertion (A): ...\\nReason (R): ..." with options exactly ["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, but R is false","A is false, but R is true"]); 15% match-the-following or chronological order (put the lists in the question with \\n line breaks; options are codes like "a-ii, b-i, c-iv, d-iii").
Rules: exactly 4 options, one correct; distractors plausible and from the same chapter; spread correct answers across A-D; test facts, dates, definitions, causes and concepts actually stated in the text; no questions about page numbers, activities or pictures. If the textbook is in Telugu, write the English version as a translation and the Telugu version from the text.
For each question give "explanation" (1-3 sentences on why the answer is right, using the textbook's own facts) and "note" (one short revision fact).${teRule}
Reply with only a JSON array, no prose: [{"type":"MCQ","question":"...","options":["...","...","...","..."],"answer":0,"explanation":"...","note":"..."${withTe?`,"te":{"question":"...","options":["...","...","...","..."],"explanation":"...","note":"..."}`:""}}] where answer is the 0-based index.

TEXTBOOK CONTENT:
${chunks[k]}`;
    u.abort=new AbortController();
    logU(t("logAsk",{n,p:chunks.length>1?t("logPart",{k:k+1,n:chunks.length}):""}));
    const arr=await caps.sample.json(prompt,{signal:u.abort.signal,modelTier:"default"});
    if(Array.isArray(arr))for(const x of arr){
      if(!x||typeof x!=="object")continue;
      if(!titleTe&&typeof x.chapter_te==="string")titleTe=x.chapter_te.slice(0,120);
      const q={t:String(x.type||"MCQ").slice(0,24),q:String(x.question||""),o:Array.isArray(x.options)?x.options.map(String):[],a:Number(x.answer),e:String(x.explanation||""),n:String(x.note||"")};
      if(x.te&&typeof x.te==="object")q.te=cleanTe({q:x.te.question,o:x.te.options,e:x.te.explanation,n:x.te.note});
      if(validQ(q)&&q.q.length>8)all.push(q)}
  }
  return{qs:all,titleTe};
}

/* --- Offline generator: questions built directly from the book's sentences --- */
const STOP=new Set("The A An In On At Of For And But Or If This That These Those It Its They Their There Then When Where Which Who Whom What Why How As By From With Without Into Under Over After Before During Since Some Many Most Such Each Every All Any No Not One Two Three First Second Third Also Yet So Thus Hence Therefore However Although Though While Because Do Does Did Can Could May Might Must Shall Should Will Would Is Are Was Were Be Been Being Has Have Had Let Look Read Find Write Imagine Discuss Activity Fig Figure Source Chapter Lesson Unit Page Exercises Glossary Answer Note Do You Know Mr Mrs Ms Dr I We He She You Our Your His Her Him Them Us Me My".split(" "));
const reW=n=>new RegExp("(?<![\\w’'-])"+n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?![\\w’'-])");
const hasW=(s,n)=>reW(n).test(s.slice(1));
function sentencesOf(pages){
  const out=[];
  for(const p of pages){const t=p.text.replace(/\s+/g," ");
    t.split(/(?<=[.!?])\s+(?=[A-Z0-9“"‘(])/).forEach(s=>{s=s.trim();
      if(s.length<45||s.length>280)return;if(/\?|Fig\.|Activity|Let’s|Let's|Exercise|www\.|http|true or false|Fill in|Match the|Answer the|Tick the|Discuss|^\(?[a-h]\)|\([a-h]\)\s/i.test(s))return;
      const letters=(s.match(/[A-Za-z]/g)||[]).length;if(letters/s.length<0.7)return;if(/\b[A-Z]{2,}(?:\s*,?\s+[A-Z]{2,}){2,}/.test(s)||/Source \d|Hindustan Times|\d{1,3}\s*$/.test(s))return;if(!/^[A-Z“"‘(]/.test(s))return;
      out.push({s,p:p.n})})}
  return out;
}
function poolsOf(sents){
  const years=new Set(),nums=new Set(),names=new Map(),defs=[];
  for(const {s} of sents){
    (s.match(/\b(1[0-9]{3}|20[0-4][0-9])\b/g)||[]).forEach(y=>years.add(y));
    (s.match(/\b\d[\d,.]*\s?(?:per cent|percent|%|km|kilometres|hectares|litres|million|billion|crore|lakh|years|days|members|metres)\b/gi)||[]).forEach(n=>nums.add(n));
    const body=s.replace(/^\S+\s/,"");
    (body.match(/\b(?:[A-Z][a-z’'\-]+(?:\s+(?:of|the|and|de|da|ud|al)\s+|\s+)){0,3}[A-Z][a-z’'\-]{2,}\b/g)||[]).forEach(n=>{n=n.trim();if(STOP.has(n.split(" ")[0])||n.length<4)return;names.set(n,(names.get(n)||0)+1)});
    let m=s.match(/^(.{6,120}?)\s+(?:is|are|was|were)\s+(?:called|known as|termed|referred to as|described as)\s+(?:the\s+|a\s+|an\s+)?[‘“"']?([^,.;:’”"']{3,60})/i);
    if(m&&m[2].trim().split(/\s+/).length<=5&&!/^(It|This|That|These|They|He|She|We|You)\b/.test(m[1]))defs.push({term:m[2].trim(),desc:m[1].trim(),s});
    m=s.match(/^[‘“"']?([A-Z][A-Za-z’'\- ]{2,40}?)[’”"']?\s+(?:means|refers to|is defined as)\s+(?:(?:the|a|an)\s+)?([^.]{15,160})\./)||s.match(/^([A-Z][A-Za-z’'\- ]{2,30}?)\s[–:\-]\s((?:A|An|The|To)\s[^.]{12,160})/);
    if(m){const term=m[1].trim(),w=term.split(/\s+/);if(w.length<=4&&!STOP.has(w[0])&&!/\b(it|this|that|they|we|you|he|she)\b/i.test(term))defs.push({term,desc:m[2].trim().replace(/^(A|An|The)\s/,s=>s.toLowerCase()),s,rev:true})}
  }
  return{years:[...years],nums:[...nums],names:[...names.entries()].filter(([n,c])=>c<=6).map(([n])=>n),defs};
}
function pickDistractors(ans,pool,k,sim){
  const cand=shuffle(pool.filter(x=>x.toLowerCase()!==ans.toLowerCase()&&!ans.toLowerCase().includes(x.toLowerCase())&&!x.toLowerCase().includes(ans.toLowerCase())));
  if(sim)cand.sort((a,b)=>sim(a)-sim(b));
  return cand.slice(0,k);
}
function yearDistractors(y,pool){const n=+y;let d=pickDistractors(y,pool,3,x=>Math.abs(+x-n)).filter(x=>Math.abs(+x-n)<=150);
  const offs=shuffle([-12,-7,-5,-3,3,5,8,10,15,20,-20,25]);while(d.length<3){const v=String(n+offs.pop());if(!d.includes(v)&&v!==y&&+v<2100)d.push(v)}return d}
function numDistractors(x){const m=x.match(/^([\d,.]+)\s?(.*)$/);if(!m)return[];const v=parseFloat(m[1].replace(/,/g,""));const unit=m[2];
  const fs=shuffle([0.5,2,1.5,0.25,3,10,0.1]);const out=new Set();for(const f of fs){let w=v*f;w=w>=100?Math.round(w):Math.round(w*10)/10;if(w!==v&&w>0)out.add((w>=1000?w.toLocaleString("en-IN"):String(w))+(unit?(/^%/.test(unit)?"":" ")+unit:""));if(out.size>=3)break}return[...out]}
function mkQ(t,q,correct,distractors,e,n){if(!correct||distractors.length<3)return null;const opts=shuffle([correct,...distractors.slice(0,3)]);return{t,q,o:opts,a:opts.indexOf(correct),e,n}}
function offlineQuestions(pages,count,title){
  const sents=sentencesOf(pages);if(!sents.length)return[];
  const P=poolsOf(sents);const used=new Set();const out=[];
  const src=x=>`From the textbook (page ${x.p}): “${x.s}”`;
  const ctx=x=>{const i=sents.indexOf(x);const nb=sents[i+1]&&sents[i+1].p===x.p?sents[i+1].s:"";return nb.length<220?nb:""};
  // 1. definitions
  for(const d of shuffle(P.defs)){if(out.length>=count*0.35)break;const sx=sents.find(z=>z.s===d.s);if(!sx||used.has(sx))continue;
    const pool=P.defs.map(z=>z.term).concat(P.names);
    let q;
    if(d.rev)q=mkQ("MCQ",`Which term is described as: “${d.desc.replace(/\s+/g," ")}”?`,d.term,pickDistractors(d.term,pool,3),src(sx),ctx(sx)||`Key term: ${d.term}.`);
    else q=mkQ("MCQ",`${d.desc.charAt(0).toUpperCase()+d.desc.slice(1)} is called —`,d.term,pickDistractors(d.term,pool,3),src(sx),ctx(sx)||`Key term: ${d.term}.`);
    if(q){out.push(q);used.add(sx)}}
  // 2. year cloze
  for(const x of shuffle(sents)){if(out.length>=count*0.6)break;if(used.has(x))continue;const m=x.s.match(/(?:\b(?:in|of|from|since|by|till|until|year|after|before|between|and|to|c\.)\s+|\(|^)(1[0-9]{3}|20[0-4][0-9])\b(?!\s+(?:people|persons|men|women|workers|policemen|soldiers|villages|species|km|metres|litres))/i);if(!m)continue;
    const q=mkQ("Fill in the blank",`Fill in the blank:\n${x.s.replace(m[1],"______")}`,m[1],yearDistractors(m[1],P.years),src(x),ctx(x));if(q){out.push(q);used.add(x)}}
  // 3. number cloze
  for(const x of shuffle(sents)){if(out.length>=count*0.7)break;if(used.has(x))continue;const m=x.s.match(/\b\d[\d,.]*\s?(?:per cent|percent|%|km|kilometres|hectares|litres|million|billion|crore|lakh|years|days|members|metres)\b/i);if(!m)continue;
    const q=mkQ("Fill in the blank",`Fill in the blank:\n${x.s.replace(m[0],"______")}`,m[0],numDistractors(m[0]),src(x),ctx(x));if(q){out.push(q);used.add(x)}}
  // 4. statements (one true, one altered)
  const withNames=shuffle(sents.filter(x=>!used.has(x)&&P.names.some(n=>hasW(x.s,n))));
  for(let i=0;i+1<withNames.length&&out.length<count*0.85;i+=2){const a=withNames[i],b=withNames[i+1];
    const kind=w=>(w.split(' ').length)*10+(/(an|ish|ese)$/.test(w)?1:0);const alter=x=>{const n=P.names.find(n=>hasW(x.s,n)&&!/-$/.test(n));if(!n)return null;const d=pickDistractors(n,P.names.filter(z=>!/-$/.test(z)),1,z=>Math.abs(kind(z)-kind(n))*5+Math.random())[0];return d?{txt:x.s.charAt(0)+x.s.slice(1).replace(reW(n),d),n,d}:null};
    const mode=Math.floor(Math.random()*4);let s1=a.s,s2=b.s,notes=[];
    if(mode===0||mode===3){const r=alter(a);if(!r)continue;s1=r.txt;notes.push(`Statement I is wrong: the text says “${r.n}”, not “${r.d}”.`)}
    if(mode===1||mode===3){const r=alter(b);if(!r)continue;s2=r.txt;notes.push(`Statement II is wrong: the text says “${r.n}”, not “${r.d}”.`)}
    const ansIdx=mode===0?1:mode===1?0:mode===2?2:3;
    out.push({t:"Statements",q:`Consider the following statements:\nI. ${s1}\nII. ${s2}`,o:["I only","II only","Both I and II","Neither I nor II"],a:ansIdx,
      e:(notes.length?notes.join(" ")+" ":"Both statements are given in the textbook. ")+`(pages ${a.p}${b.p!==a.p?", "+b.p:""})`,n:`Correct versions: “${a.s}” “${b.s}”`.slice(0,600)});used.add(a);used.add(b)}
  // 5. name cloze to fill the rest
  for(const x of shuffle(sents)){if(out.length>=count)break;if(used.has(x))continue;const n=P.names.filter(n=>hasW(x.s,n)).sort((p,q)=>q.length-p.length)[0];if(!n)continue;
    const q=mkQ("Fill in the blank",`Fill in the blank:\n${x.s.charAt(0)+x.s.slice(1).replace(reW(n),"______")}`,n,pickDistractors(n,P.names,3,y=>Math.abs(y.split(" ").length-n.split(" ").length)),src(x),ctx(x));if(q){out.push(q);used.add(x)}}
  return shuffle(out).slice(0,count);
}
