e","Copying","Speed writing"],"a":1,"e":"Open problems with many solutions build flexibility and understanding.","n":"","te":{"q":"గణితంలో 10ని ఏర్పరచే అనేక మార్గాలు కనుగొనమని అడగడం దేనిని ప్రోత్సహిస్తుంది?","o":["బట్టీ","విస్తార ఆలోచన, సంఖ్యా జ్ఞానం","నకలు","వేగంగా రాయడం"],"e":"అనేక పరిష్కారాలు గల ముక్త సమస్యలు వశ్యత, అవగాహనను పెంచుతాయి.","n":""}},{"t":"MCQ","q":"The 'laboratory method' in science is valued because it:","o":["Needs no planning","Saves the teacher's time","Lets students learn by experimenting and verifying","Avoids questions"],"a":2,"e":"Hands-on experiments develop process skills and scientific attitude.","n":"","te":{"q":"విజ్ఞాన శాస్త్రంలో 'ప్రయోగశాల పద్ధతి'కి విలువ ఎందుకు?","o":["ప్రణాళిక అవసరం లేదు","ఉపాధ్యాయుని సమయం ఆదా","విద్యార్థులు ప్రయోగించి, నిర్ధారించి నేర్చుకుంటారు","ప్రశ్నలు నివారిస్తుంది"],"e":"చేతితో చేసే ప్రయోగాలు ప్రక్రియా నైపుణ్యాలు, శాస్త్రీయ వైఖరిని పెంచుతాయి.","n":""}},{"t":"MCQ","q":"The 'analytic method' in mathematics proceeds:","o":["From examples to rule","From the known to the unknown","From the unknown (what is to be proved) to the known","From rule to examples"],"a":2,"e":"Analytic: unknown → known (discovery, reasons). Synthetic: known → unknown (concise presentation of proof).","n":"","te":{"q":"గణితంలో 'విశ్లేషణ పద్ధతి' ఎలా సాగుతుంది?","o":["ఉదాహరణల నుండి సూత్రానికి","తెలిసినదాని నుండి తెలియనిదానికి","తెలియనిదాని (నిరూపించాల్సినది) నుండి తెలిసినదానికి","సూత్రం నుండి ఉదాహరణలకు"],"e":"విశ్లేషణ: తెలియనిది → తెలిసినది (ఆవిష్కరణ, కారణాలు). సంశ్లేషణ: తెలిసినది → తెలియనిది (నిరూపణ సంక్షిప్త ప్రదర్శన).","n":""}},{"t":"MCQ","q":"Which is the best way to teach map-reading skills?","o":["Memorising the names of all countries","Practical work with real maps, scales and directions","Copying maps from guides","Lectures on map history"],"a":1,"e":"Map skills (direction, scale, symbols) develop through hands-on map work, from local sketch maps to atlases.","n":"","te":{"q":"పటాలు చదివే నైపుణ్యాన్ని బోధించడానికి ఉత్తమ మార్గం ఏది?","o":["అన్ని దేశాల పేర్లు బట్టీ","నిజమైన పటాలు, స్కేలు, దిక్కులతో ప్రాయోగిక పని","గైడ్ల నుండి పటాల నకలు","పట చరిత్రపై ఉపన్యాసాలు"],"e":"దిక్కు, స్కేలు, సంకేతాలు వంటి పట నైపుణ్యాలు స్థానిక చిత్తు పటాల నుండి అట్లాస్ వరకు చేతితో పని ద్వారా పెరుగుతాయి.","n":""}},{"t":"MCQ","q":"A science teacher who encourages questions like 'How do we know?' is developing:","o":["Rote learning","Blind belief","Scientific temper","Fear of science"],"a":2,"e":"Scientific temper (Article 51A(h)) values evidence, reasoning and open-mindedness.","n":"","te":{"q":"'మనకు ఎలా తెలుసు?' వంటి ప్రశ్నలను ప్రోత్సహించే విజ్ఞాన ఉపాధ్యాయుడు దేనిని పెంపొందిస్తున్నాడు?","o":["బట్టీ అభ్యసనం","గుడ్డి నమ్మకం","శాస్త్రీయ దృక్పథం","విజ్ఞానంపై భయం"],"e":"శాస్త్రీయ దృక్పథం (అధికరణం 51A(h)) సాక్ష్యం, తర్కం, విశాల దృష్టికి విలువ ఇస్తుంది.","n":""}},{"t":"MCQ","q":"In inclusive classrooms, 'Universal Design for Learning' means:","o":["Only braille textbooks","One fixed method for all","Separate classes for disabled pupils","Planning lessons with multiple ways of representation, engagement and expression"],"a":3,"e":"UDL designs flexible teaching from the start so all learners can access it.","n":"","te":{"q":"సమ్మిళిత తరగతుల్లో 'సార్వత్రిక అభ్యసన రూపకల్పన' (యూడీఎల్) అంటే ఏమిటి?","o":["బ్రెయిలీ పుస్తకాలు మాత్రమే","అందరికీ ఒకే స్థిర పద్ధతి","దివ్యాంగులకు వేరు తరగతులు","ప్రాతినిధ్యం, నిమగ్నత, వ్యక్తీకరణకు అనేక మార్గాలతో పాఠ ప్రణాళిక"],"e":"యూడీఎల్ మొదటి నుండే అందరు అభ్యాసకులు అందుకునేలా సరళమైన బోధనను రూపొందిస్తుంది.","n":""}},{"t":"MCQ","q":"For a child with low vision in class, the teacher should first:","o":["Seat the child in front and use large, clear print and verbal descriptions","Send the child home","Give the child no written work","Ignore the difficulty"],"a":0,"e":"Simple accommodations — seating, large print, good light, oral description — support children with low vision.","n":"","te":{"q":"తరగతిలో తక్కువ దృష్టి గల బిడ్డ కోసం ఉపాధ్యాయుడు మొదట ఏం చేయాలి?","o":["ముందు కూర్చోబెట్టి పెద్ద, స్పష్టమైన అక్షరాలు, మౌఖిక వివరణలు వాడటం","ఇంటికి పంపడం","రాత పని ఇవ్వకపోవడం","ఇబ్బందిని పట్టించుకోకపోవడం"],"e":"కూర్చునే స్థానం, పెద్ద అక్షరాలు, మంచి వెలుతురు, మౌఖిక వివరణ వంటి సరళ సర్దుబాట్లు తక్కువ దృష్టి గల పిల్లలకు సహాయపడతాయి.","n":""}},{"t":"MCQ","q":"'Learning outcomes' in AP textbooks are statements of:","o":["What children should be able to do at the end of a lesson or class","What the teacher should cover","The number of periods","The exam timetable"],"a":0,"e":"Learning outcomes (NCERT 2017) describe expected competencies and guide teaching and assessment.","n":"","te":{"q":"ఏపీ పాఠ్యపుస్తకాల్లోని 'అభ్యసన ఫలితాలు' దేనిని తెలియజేస్తాయి?","o":["పాఠం లేదా తరగతి చివరికి పిల్లలు ఏమి చేయగలగాలో","ఉపాధ్యాయుడు ఏమి పూర్తి చేయాలో","పీరియడ్ల సంఖ్య","పరీక్షల కాలపట్టిక"],"e":"అభ్యసన ఫలితాలు (ఎన్‌సీఈఆర్టీ 2017) ఆశించిన సామర్థ్యాలను వివరించి బోధన, మూల్యాంకనానికి మార్గదర్శనం చేస్తాయి.","n":""}},{"t":"MCQ","q":"Which question type is most suitable to test 'application' of a maths concept?","o":["'Define a polygon.'","'State the formula for area of a circle.'","A word problem from daily life","'Write the multiplication table of 7.'"],"a":2,"e":"Applying a concept to a new real-life situation tests the application level.","n":"","te":{"q":"గణిత భావన 'వినియోగం'ను పరీక్షించడానికి అత్యంత అనువైన ప్రశ్న రకం ఏది?","o":["'బహుభుజిని నిర్వచించండి.'","'వృత్త వైశాల్య సూత్రం రాయండి.'","దైనందిన జీవితం నుండి మాటల సమస్య","'7వ ఎక్కం రాయండి.'"],"e":"భావనను కొత్త నిజ జీవిత సందర్భానికి అన్వయించడం వినియోగ స్థాయిని పరీక్షిస్తుంది.","n":""}}]},"meth-tel":{"id":"meth-tel","title":["Telugu Teaching Methodology","తెలుగు బోధనా పద్ధతులు"],"desc":["Language skills, teaching poetry, prose and grammar, lesson planning and assessment in Telugu.","భాషా నైపుణ్యాలు, పద్య, గద్య, వ్యాకరణ బోధన, పాఠ్య ప్రణాళిక, తెలుగులో మూల్యాంకనం."],"qs":[{"t":"MCQ","q":"What is the natural order in which language skills develop?","o":["Writing, Reading, Speaking, Listening","Reading, Writing, Listening, Speaking","Speaking, Listening, Writing, Reading","Listening, Speaking, Reading, Writing"],"a":3,"e":"Children first listen, then speak, then read and finally write (LSRW).","n":"","te":{"q":"భాషా నైపుణ్యాలు సహజంగా ఏ క్రమంలో అభివృద్ధి చెందుతాయి?","o":["రాయడం, చదవడం, మాట్లాడడం, వినడం","చదవడం, రాయడం, వినడం, మాట్లాడడం","మాట్లాడడం, వినడం, రాయడం, చదవడం","వినడం, మాట్లాడడం, చదవడం, రాయడం"],"e":"పిల్లలు మొదట వింటారు, తర్వాత మాట్లాడతారు, తర్వాత చదువుతారు, చివరగా రాస్తారు (LSRW).","n":""}},{"t":"MCQ","q":"In teaching a poem (padyam), the first step usually is:","o":["Asking students to write word meanings","Model recitation by the teacher with proper rhythm","Explaining the grammar","Giving a test"],"a":1,"e":"The teacher's model (ādarśa) recitation creates interest and shows rhythm and pronunciation; explanation and appreciation follow.","n":"","te":{"q":"పద్య బోధనలో సాధారణంగా మొదటి సోపానం ఏది?","o":["విద్యార్థులతో పదాల అర్థాలు రాయించడం","ఉపాధ్యాయుడు రాగయుక్తంగా చేసే ఆదర్శ పఠనం","వ్యాకరణం వివరించడం","పరీక్ష ఇవ్వడం"],"e":"ఉపాధ్యాయుని ఆదర్శ పఠనం ఆసక్తి కలిగించి లయ, ఉచ్చారణను చూపుతుంది; తర్వాత భావ వివరణ, రసానుభూతి.","n":""}},{"t":"MCQ","q":"The main aim of teaching poetry is:","o":["Increasing writing speed","Memorising grammar rules","Aesthetic enjoyment (rasānubhūti) and appreciation","Learning spellings only"],"a":2,"e":"Poetry teaching aims at rasānubhūti — enjoying and appreciating the feeling, imagery and music of the poem.","n":"","te":{"q":"పద్య బోధన ప్రధాన లక్ష్యం ఏది?","o":["రాసే వేగం పెంచడం","వ్యాకరణ సూత్రాలు కంఠస్థం","రసానుభూతి, ప్రశంస","అక్షర క్రమం మాత్రమే"],"e":"పద్య బోధన లక్ష్యం రసానుభూతి — పద్యంలోని భావం, చిత్రణ, సంగీతాన్ని ఆస్వాదించి ప్రశంసించడం.","n":""}},{"t":"MCQ","q":"Teaching grammar by first giving many examples and then helping pupils discover the rule is the:","o":["Translation method","Deductive (nigamana) method","Lecture method","Inductive (āgamana) method"],"a":3,"e":"Inductive: examples → rule (from known to unknown). Deductive: rule → examples. Inductive suits school learners better.","n":"","te":{"q":"మొదట అనేక ఉదాహరణలు ఇచ్చి, తర్వాత విద్యార్థులే సూత్రం కనుగొనేలా వ్యాకరణం బోధించడం ఏ పద్ధతి?","o":["అనువాద పద్ధతి","నిగమన పద్ధతి","ఉపన్యాస పద్ధతి","ఆగమన పద్ధతి"],"e":"ఆగమన పద్ధతి: ఉదాహరణలు → సూత్రం (తెలిసినదాని నుండి తెలియనిదానికి). నిగమన పద్ధతి: సూత్రం → ఉదాహరణలు.","n":""}},{"t":"MCQ","q":"Silent reading mainly develops:","o":["Voice modulation","Correct pronunciation","Comprehension and reading speed","Handwriting"],"a":2,"e":"Silent reading builds understanding and speed; reading aloud (sasvara paṭhanam) develops pronunciation, fluency and expression.","n":"","te":{"q":"మౌన పఠనం ప్రధానంగా దేనిని పెంపొందిస్తుంది?","o":["స్వర నియంత్రణ","సరైన ఉచ్చారణ","అవగాహన, చదివే వేగం","చేతిరాత"],"e":"మౌన పఠనం అవగాహన, వేగం పెంచుతుంది; సస్వర పఠనం ఉచ్చారణ, ధారాళత, భావ వ్యక్తీకరణను పెంచుతుంది.","n":""}},{"t":"MCQ","q":"The 'project method' of teaching was developed by:","o":["Helen Parkhurst","W. H. Kilpatrick","Maria Montessori","H. E. Palmer"],"a":1,"e":"Kilpatrick (a student of Dewey) developed the project method; Helen Parkhurst developed the Dalton Plan.","n":"","te":{"q":"బోధనలో 'ప్రాజెక్టు పద్ధతి'ని రూపొందించింది ఎవరు?","o":["హెలెన్ పార్క్‌హర్స్ట్","డబ్ల్యూ.హెచ్. కిల్‌పాట్రిక్","మరియా మాంటిస్సోరి","హెచ్.ఇ. పామర్"],"e":"డ్యూయీ శిష్యుడు కిల్‌పాట్రిక్ ప్రాజెక్టు పద్ధతిని రూపొందించాడు; హెలెన్ పార్క్‌హర్స్ట్ డాల్టన్ ప్రణాళికను.","n":""}},{"t":"MCQ","q":"Herbart's steps of lesson planning are:","o":["Preparation, Presentation, Association, Generalisation, Application","Engage, Explore, Explain, Elaborate, Evaluate","Knowledge, Understanding, Application, Skill","Read, Recite, Review"],"a":0,"e":"Herbart's (formal) steps: preparation, presentation, comparison/association, generalisation and application (5E is a later constructivist model).","n":"","te":{"q":"హెర్బార్ట్ పాఠ్య ప్రణాళిక సోపానాలు ఏవి?","o":["సన్నాహం, ప్రదర్శనం, పోలిక, సాధారణీకరణం, అన్వయం","నిమగ్నం, అన్వేషణ, వివరణ, విస్తరణ, మూల్యాంకనం","జ్ఞానం, అవగాహన, వినియోగం, నైపుణ్యం","చదవడం, వల్లె వేయడం, సమీక్ష"],"e":"హెర్బార్ట్ సోపానాలు: సన్నాహం, ప్రదర్శనం, పోలిక/సంసర్గం, సాధారణీకరణం, అన్వయం (5E తర్వాతి నిర్మాణాత్మక నమూనా).","n":""}},{"t":"MCQ","q":"A teacher notices that many pupils write 'ష' for 'శ'. The best next step is:","o":["Deduct marks and move on","Diagnose the error pattern and give remedial practice","Ignore it as it is minor","Ask them to copy the lesson five times"],"a":1,"e":"Error analysis followed by remedial teaching (pronunciation drills, word lists, dictation) fixes systematic errors.","n":"","te":{"q":"చాలా మంది విద్యార్థులు 'శ' బదులు 'ష' రాస్తున్నారని ఉపాధ్యాయుడు గమనించాడు. తదుపరి ఉత్తమ చర్య ఏది?","o":["మార్కులు తగ్గించి ముందుకు సాగడం","దోష స్వరూపాన్ని గుర్తించి దోష నివారణ సాధన ఇవ్వడం","చిన్న విషయమని వదిలేయడం","పాఠాన్ని ఐదుసార్లు రాయించడం"],"e":"దోష విశ్లేషణ తర్వాత నివారణ బోధన (ఉచ్చారణ సాధన, పద జాబితాలు, శ్రుతలేఖనం) క్రమబద్ధ దోషాలను సరిచేస్తుంది.","n":""}},{"t":"MCQ","q":"Dictation (śrutalekhanam) mainly helps to develop:","o":["Oral fluency","Creative writing","Listening attentively and correct spelling","Reading speed"],"a":2,"e":"Dictation combines listening, recall and writing; it is a good check on spelling.","n":"","te":{"q":"శ్రుతలేఖనం ప్రధానంగా దేనిని పెంపొందిస్తుంది?","o":["మాట్లాడే ధారాళత","సృజనాత్మక రచన","శ్రద్ధగా వినడం, సరైన అక్షర క్రమం","చదివే వేగం"],"e":"శ్రుతలేఖనంలో వినడం, గుర్తుంచుకోవడం, రాయడం కలిసి ఉంటాయి; ఇది అక్షర దోషాలను తనిఖీ చేయడానికి మంచి సాధనం.","n":""}},{"t":"MCQ","q":"Which activity best develops speaking skills in a Telugu class?","o":["Silent reading","Copying answers from a guide","Role play and debates on lesson themes","Writing spelling lists"],"a":2,"e":"Role play, debates, story-telling and discussions give real reasons to speak.","n":"","te":{"q":"తెలుగు తరగతిలో మాట్లాడే నైపుణ్యాన్ని ఉత్తమంగా పెంపొందించే కృత్యం ఏది?","o":["మౌన పఠనం","గైడ్ నుండి జవాబులు రాయడం","పాఠ్యాంశాలపై పాత్రాభినయం, చర్చలు","అక్షర జాబితాలు రాయడం"],"e":"పాత్రాభినయం, చర్చలు, కథ చెప్పడం, సంభాషణలు మాట్లాడడానికి సహజ సందర్భాలు ఇస్తాయి.","n":""}},{"t":"MCQ","q":"According to Gandhiji, the mother tongue for a child is like:","o":["A heavy load","A foreign coin","A school uniform","Mother's milk"],"a":3,"e":"Gandhiji held that education through the mother tongue nourishes the child as naturally as mother's milk.","n":"","te":{"q":"గాంధీజీ ప్రకారం బిడ్డకు మాతృభాష దేని వంటిది?","o":["బరువైన భారం వంటిది","విదేశీ నాణెం వంటిది","పాఠశాల యూనిఫాం వంటిది","తల్లి పాల వంటిది"],"e":"మాతృభాష ద్వారా విద్య బిడ్డకు తల్లి పాల వలె సహజమైన పోషణ ఇస్తుందని గాంధీజీ భావించారు.","n":""}},{"t":"MCQ","q":"A 'unit plan' differs from a 'lesson plan' in that a unit plan:","o":["Is written after teaching","Is for one period only","Covers a whole unit across several periods","Is meant only for examinations"],"a":2,"e":"A unit plan organises objectives, activities and assessment for a complete unit; lesson plans break it into individual periods.","n":"","te":{"q":"'యూనిట్ ప్రణాళిక' 'పాఠ్య ప్రణాళిక' నుండి ఎలా భిన్నమైనది?","o":["బోధన తర్వాత రాస్తారు","ఒక పీరియడ్‌కు మాత్రమే","అనేక పీరియడ్లలో పూర్తి యూనిట్‌ను కవర్ చేస్తుంది","పరీక్షలకు మాత్రమే"],"e":"యూనిట్ ప్రణాళిక పూర్తి యూనిట్‌కు లక్ష్యాలు, కృత్యాలు, మూల్యాంకనం ఏర్పాటు చేస్తుంది; పాఠ్య ప్రణాళికలు దానిని ఒక్కో పీరియడ్‌గా విభజిస్తాయి.","n":""}},{"t":"MCQ","q":"A 'blueprint' of a question paper shows:","o":["Weightage to objectives, content and types of questions","The school map","The students' seating plan","Answers to all questions"],"a":0,"e":"A blueprint is a three-dimensional chart of objectives × content × question types with marks, ensuring a balanced test.","n":"","te":{"q":"ప్రశ్నాపత్రం 'బ్లూప్రింట్' ఏమి చూపుతుంది?","o":["లక్ష్యాలు, విషయం, ప్రశ్నల రకాలకు ఇచ్చిన భారత్వం","పాఠశాల పటం","విద్యార్థుల సీటింగ్ ప్లాన్","అన్ని ప్రశ్నలకు జవాబులు"],"e":"బ్లూప్రింట్ లక్ష్యాలు × విషయం × ప్రశ్నల రకాలు, మార్కులతో కూడిన పట్టిక; ఇది సమతుల్య పరీక్షను నిర్ధారిస్తుంది.","n":""}},{"t":"MCQ","q":"Which teaching aid is most useful for teaching Telugu pronunciation of aspirated and unaspirated letters?","o":["A bar graph","A globe","Audio recordings and a language laboratory","A thermometer"],"a":2,"e":"Audio aids and language labs let pupils hear and compare sounds such as క/ఖ and గ/ఘ.","n":"","te":{"q":"మహాప్రాణ, అల్పప్రాణ అక్షరాల తెలుగు ఉచ్చారణ బోధనకు అత్యంత ఉపయోగకరమైన బోధనోపకరణం ఏది?","o":["కమ్మీ రేఖాచిత్రం","గ్లోబు","ఆడియో రికార్డింగులు, భాషా ప్రయోగశాల","ఉష్ణమాపకం"],"e":"ఆడియో సాధనాలు, భాషా ప్రయోగశాల క/ఖ, గ/ఘ వంటి ధ్వనులను విని పోల్చడానికి సహాయపడతాయి.","n":""}},{"t":"MCQ","q":"Asking pupils to write a pamphlet, a poster slogan or a letter after a lesson develops:","o":["Rote memory","Creative expression (vyaktīkaraṇa–sṛjanātmakata)","Listening only","Handwriting only"],"a":1,"e":"AP Telugu textbooks include 'వ్యక్తీకరణ – సృజనాత్మకత' tasks for creative and functional writing.","n":"","te":{"q":"పాఠం తర్వాత కరపత్రం, నినాదం లేదా లేఖ రాయించడం దేనిని పెంపొందిస్తుంది?","o":["బట్టీ జ్ఞాపకం","వ్యక్తీకరణ – సృజనాత్మకత","వినడం మాత్రమే","చేతిరాత మాత్రమే"],"e":"ఏపీ తెలుగు పాఠ్యపుస్తకాల్లో సృజనాత్మక, వ్యావహారిక రచనల కోసం 'వ్యక్తీకరణ – సృజనాత్మకత' అభ్యాసాలు ఉంటాయి.","n":""}},{"t":"MCQ","q":"Formative assessment in Telugu (as per AP CCE) includes:","o":["Children's participation, written works, projects and slip tests","Only the annual examination","Only board exams","Only attendance"],"a":0,"e":"Formative assessment tools: observation of participation, written works (notebooks), project work and slip tests.","n":"","te":{"q":"ఏపీ సీసీఈ ప్రకారం తెలుగులో నిర్మాణాత్మక మూల్యాంకనంలో ఏమి ఉంటాయి?","o":["పిల్లల భాగస్వామ్యం, రాత పనులు, ప్రాజెక్టులు, లఘు పరీక్షలు","వార్షిక పరీక్ష మాత్రమే","బోర్డు పరీక్షలు మాత్రమే","హాజరు మాత్రమే"],"e":"నిర్మాణాత్మక మూల్యాంకన సాధనాలు: భాగస్వామ్య పరిశీలన, రాత పనులు (నోట్‌బుక్స్), ప్రాజెక్టు పని, లఘు పరీక్షలు.","n":""}},{"t":"MCQ","q":"'Bhāṣā' as a means of communication is primarily:","o":["A set of written letters only","A system of spoken sounds expressing thoughts","A collection of grammar rules","A list of books"],"a":1,"e":"Language is basically spoken; writing is a later representation of speech.","n":"","te":{"q":"భావ ప్రసార సాధనంగా 'భాష' ప్రధానంగా ఏమిటి?","o":["రాత అక్షరాలు మాత్రమే","ఆలోచనలను వ్యక్తీకరించే ఉచ్చరిత ధ్వనుల వ్యవస్థ","వ్యాకరణ సూత్రాల సంకలనం","పుస్తకాల జాబితా"],"e":"భాష మౌలికంగా ఉచ్చరితమైనది; రాత తర్వాత వచ్చిన ప్రాతినిధ్యం.","n":""}},{"t":"MCQ","q":"A good Telugu textbook lesson should begin with a 'చదవండి – ఆలోచించి చెప్పండి' task mainly to:","o":["Connect to the child's experience and motivate","Test grammar","Assign homework","Fill time"],"a":0,"e":"The opening task activates prior knowledge and arouses interest (unmukhīkaraṇam).","n":"","te":{"q":"తెలుగు పాఠం 'చదవండి – ఆలోచించి చెప్పండి' కృత్యంతో ప్రారంభం కావడానికి ప్రధాన ఉద్దేశం ఏమిటి?","o":["బిడ్డ అనుభవంతో అనుసంధానించి ప్రేరణ కలిగించడం","వ్యాకరణ పరీక్ష","హోంవర్క్ ఇవ్వడం","సమయం గడపడం"],"e":"ప్రారంభ కృత్యం పూర్వ జ్ఞానాన్ని ఉత్తేజపరచి ఆసక్తి కలిగిస్తుంది (ఉన్ముఖీకరణం).","n":""}},{"t":"MCQ","q":"Which statement about prose (gadya) teaching is correct?","o":["Its main aim is comprehension of ideas and language","Its main aim is rhythm and music","It needs no reading by pupils","It should be taught only through translation"],"a":0,"e":"Prose lessons focus on understanding content, vocabulary and sentence structures; poetry focuses on enjoyment.","n":"","te":{"q":"గద్య బోధన గురించి సరైన వాక్యం ఏది?","o":["భావాలు, భాష అవగాహన దీని ప్రధాన లక్ష్యం","లయ, సంగీతం దీని ప్రధాన లక్ష్యం","విద్యార్థులు చదవాల్సిన అవసరం లేదు","అనువాదం ద్వారా మాత్రమే బోధించాలి"],"e":"గద్య పాఠాలు విషయం, పదజాలం, వాక్య నిర్మాణాల అవగాహనపై దృష్టి పెడతాయి; పద్యం ఆస్వాదనపై.","n":""}},{"t":"MCQ","q":"A pupil reads fluently but cannot say what the paragraph was about. The skill that needs attention is:","o":["Reading comprehension","Pronunciation","Handwriting","Listening"],"a":0,"e":"Decoding without understanding shows weak comprehension; questioning, summarising and silent reading tasks help.","n":"","te":{"q":"ఒక విద్యార్థి ధారాళంగా చదువుతాడు కానీ పేరా దేని గురించో చెప్పలేడు. ఏ నైపుణ్యంపై దృష్టి పెట్టాలి?","o":["పఠన అవగాహన","ఉచ్చారణ","చేతిరాత","వినడం"],"e":"అర్థం కాకుండా చదవడం అవగాహన లోపాన్ని చూపుతుంది; ప్రశ్నించడం, సారాంశం చెప్పించడం, మౌన పఠన కృత్యాలు సహాయపడతాయి.","n":""}},{"t":"MCQ","q":"The 'story-telling method' is most suitable for teaching:","o":["Primary classes, to build interest and listening","Advanced grammar rules","Chandassu rules","Essay writing to Class 10"],"a":0,"e":"Young children enjoy stories; story-telling builds listening, vocabulary and imagination.","n":"","te":{"q":"'కథా కథన పద్ధతి' ఏ బోధనకు అత్యంత అనువైనది?","o":["ప్రాథమిక తరగతుల్లో ఆసక్తి, వినడం పెంచడానికి","ఉన్నత వ్యాకరణ సూత్రాలకు","ఛందో నియమాలకు","10వ తరగతి వ్యాస రచనకు"],"e":"చిన్న పిల్లలు కథలను ఆస్వాదిస్తారు; కథ చెప్పడం వినడం, పదజాలం, ఊహాశక్తిని పెంచుతుంది.","n":""}},{"t":"MCQ","q":"Learning a poem by heart (kaṇṭhastham) is useful mainly because it:","o":["Builds a store of good language and rhythm","Replaces understanding","Is the only aim of poetry","Improves handwriting"],"a":0,"e":"Memorising selected verses (marked with a flower in AP books) enriches vocabulary and appreciation, but only after understanding.","n":"","te":{"q":"పద్యాన్ని కంఠస్థం చేయడం ప్రధానంగా ఎందుకు ఉపయోగకరం?","o":["మంచి భాష, లయల నిధిని పెంచుతుంది","అవగాహనకు ప్రత్యామ్నాయం","పద్య బోధనకు ఏకైక లక్ష్యం","చేతిరాత మెరుగుపడుతుంది"],"e":"ఎంపిక చేసిన పద్యాలను (ఏపీ పుస్తకాల్లో పువ్వు గుర్తు) కంఠస్థం చేయడం పదసంపద, రసజ్ఞత పెంచుతుంది — అవగాహన తర్వాతే.","n":""}},{"t":"MCQ","q":"Which question best checks higher-order thinking after a Telugu lesson?","o":["'Who is the author of the lesson?'","'If you were the main character, what would you have done and why?'","'Write the meaning of the word ధాత్రి.'","'Copy the first paragraph.'"],"a":1,"e":"Open-ended questions that ask for evaluation and justification check higher-order thinking.","n":"","te":{"q":"తెలుగు పాఠం తర్వాత ఉన్నత స్థాయి ఆలోచనను ఉత్తమంగా పరీక్షించే ప్రశ్న ఏది?","o":["'పాఠ్యభాగ రచయిత ఎవరు?'","'నువ్వు ప్రధాన పాత్ర స్థానంలో ఉంటే ఏం చేసేవాడివి? ఎందుకు?'","'ధాత్రి అనే పదానికి అర్థం రాయండి.'","'మొదటి పేరాను రాయండి.'"],"e":"మూల్యాంకనం, సమర్థన అడిగే ముక్త ప్రశ్నలు ఉన్నత స్థాయి ఆలోచనను పరీక్షిస్తాయి.","n":""}},{"t":"MCQ","q":"A child speaks a tribal language at home and struggles in a Telugu-medium class. The best approach is:","o":["Seat the child separately","Forbid the home language in class","Make the child repeat the year","Use the home language as a bridge to Telugu (multilingual approach)"],"a":3,"e":"NCF 2005 and NEP 2020 treat multilingualism as a resource; bridging from the home language helps.","n":"","te":{"q":"ఇంట్లో గిరిజన భాష మాట్లాడే బిడ్డ తెలుగు మాధ్యమ తరగతిలో ఇబ్బంది పడుతోంది. ఉత్తమ విధానం ఏది?","o":["బిడ్డను వేరుగా కూర్చోబెట్టడం","తరగతిలో ఇంటి భాషను నిషేధించడం","అదే తరగతిలో మళ్లీ ఉంచడం","ఇంటి భాషను తెలుగుకు వారధిగా వాడడం (బహుభాషా విధానం)"],"e":"ఎన్‌సీఎఫ్ 2005, ఎన్‌ఈపీ 2020 బహుభాషాత్మకతను వనరుగా చూస్తాయి; ఇంటి భాష నుండి వారధి వేయడం సహాయపడుతుంది.","n":""}},{"t":"MCQ","q":"Using newspapers, children's magazines and the school library in Telugu teaching mainly develops:","o":["Only handwriting","Only spelling","Only grammar","Reading habit and wider exposure to language"],"a":3,"e":"Supplementary reading materials build a reading habit beyond the textbook.","n":"","te":{"q":"తెలుగు బోధనలో వార్తాపత్రికలు, బాల పత్రికలు, పాఠశాల గ్రంథాలయం వాడడం ప్రధానంగా దేనిని పెంచుతుంది?","o":["చేతిరాత మాత్రమే","అక్షర క్రమం మాత్రమే","వ్యాకరణం మాత్రమే","పఠనాసక్తి, భాషకు విస్తృత పరిచయం"],"e":"అనుబంధ పఠన సామగ్రి పాఠ్యపుస్తకానికి మించి చదివే అలవాటును పెంచుతుంది.","n":""}},{"t":"MCQ","q":"A 'rubric' for assessing a child's essay helps the teacher to:","o":["Check only handwriting","Avoid reading the essay","Give the same marks to all","Grade consistently on clear criteria like ideas, organisation and language"],"a":3,"e":"Rubrics state criteria and levels, making assessment transparent and fair.","n":"","te":{"q":"బిడ్డ వ్యాసాన్ని అంచనా వేయడానికి 'రూబ్రిక్' ఉపాధ్యాయుడికి ఎలా సహాయపడుతుంది?","o":["చేతిరాతను మాత్రమే చూడడానికి","వ్యాసం చదవకుండా ఉండడానికి","అందరికీ ఒకే మార్కులు ఇవ్వడానికి","భావాలు, క్రమం, భాష వంటి స్పష్టమైన ప్రమాణాలతో స్థిరంగా గ్రేడ్ ఇవ్వడానికి"],"e":"రూబ్రిక్‌లు ప్రమాణాలు, స్థాయిలను స్పష్టం చేసి మూల్యాంకనాన్ని పారదర్శకంగా, న్యాయంగా చేస్తాయి.","n":""}},{"t":"MCQ","q":"Correct pronunciation of Telugu letters is best taught through:","o":["Writing grammar rules","Teacher's model, imitation and practice of minimal pairs","Silent reading","Copying from the board"],"a":1,"e":"Oral modelling, imitation and drills with minimal pairs (e.g., పలు/ఫలు) improve pronunciation.","n":"","te":{"q":"తెలుగు అక్షరాల సరైన ఉచ్చారణను ఉత్తమంగా ఎలా బోధించవచ్చు?","o":["వ్యాకరణ సూత్రాలు రాయించడం","ఉపాధ్యాయుని నమూనా, అనుకరణ, కనిష్ఠ యుగ్మాల సాధన","మౌన పఠనం","బోర్డు నుండి రాయించడం"],"e":"నోటి నమూనా, అనుకరణ, కనిష్ఠ యుగ్మాల (ఉదా: పలు/ఫలు) సాధన ఉచ్చారణను మెరుగుపరుస్తాయి.","n":""}},{"t":"MCQ","q":"The 'āgamana' (inductive) method moves:","o":["From whole to part only","From rule to examples","From examples to rule; from known to unknown","From abstract to concrete"],"a":2,"e":"Inductive teaching starts with concrete examples and leads pupils to form the generalisation themselves.","n":"","te":{"q":"'ఆగమన' పద్ధతి ఏ విధంగా సాగుతుంది?","o":["పూర్ణం నుండి భాగానికి మాత్రమే","సూత్రం నుండి ఉదాహరణలకు","ఉదాహరణల నుండి సూత్రానికి; తెలిసినదాని నుండి తెలియనిదానికి","అమూర్తం నుండి మూర్తానికి"],"e":"ఆగమన బోధన మూర్త ఉదాహరణలతో ప్రారంభించి విద్యార్థులే సాధారణీకరణకు చేరేలా చేస్తుంది.","n":""}},{"t":"MCQ","q":"Which is the best example of a functional (vyāvahārika) writing task?","o":["Writing word meanings","Copying a poem","Writing the alphabet","Writing a leave letter to the headmaster"],"a":3,"e":"Functional writing — letters, applications, notices, invitations — has a real purpose and audience.","n":"","te":{"q":"వ్యావహారిక రచనకు ఉత్తమ ఉదాహరణ ఏది?","o":["పదాల అర్థాలు రాయడం","పద్యం రాయడం","అక్షరమాల రాయడం","ప్రధానోపాధ్యాయునికి సెలవు లేఖ రాయడం"],"e":"లేఖలు, దరఖాస్తులు, ప్రకటనలు, ఆహ్వానాలు వంటి వ్యావహారిక రచనకు నిజమైన ప్రయోజనం, పాఠకులు ఉంటారు.","n":""}}]},"pe-content":{"id":"pe-content","title":["Physical Education Content","వ్యాయామ విద్య విషయం"],"desc":["For PET / Physical Director: Olympics, games and rules, athletics, anatomy, health, first aid, yoga, tournaments.","పీఈటీ / ఫిజికల్ డైరెక్టర్ కోసం: ఒలింపిక్స్, ఆటలు–నియమాలు, అథ్లెటిక్స్, శరీర నిర్మాణం, ఆరోగ్యం, ప్రథమ చికిత్స, యోగా, టోర్నమెంట్లు."],"qs":[{"t":"MCQ","q":"The modern Olympic Games began in 1896 at:","o":["Rome","Paris","London","Athens"],"a":3,"e":"The first modern Olympics were held in Athens, Greece, in 1896.","n":"","te":{"q":"ఆధునిక ఒలింపిక్ క్రీడలు 1896లో ఎక్కడ ప్రారంభమయ్యాయి?","o":["రోమ్","పారిస్","లండన్","ఏథెన్స్"],"e":"మొదటి ఆధునిక ఒలింపిక్స్ 1896లో గ్రీస్‌లోని ఏథెన్స్‌లో జరిగాయి.","n":""}},{"t":"MCQ","q":"Who is regarded as the founder of the modern Olympic movement?","o":["Juan Antonio Samaranch","Avery Brundage","Pierre de Coubertin","Jesse Owens"],"a":2,"e":"Baron Pierre de Coubertin founded the IOC in 1894.","n":"","te":{"q":"ఆధునిక ఒలింపిక్ ఉద్యమ స్థాపకుడిగా ఎవరిని భావిస్తారు?","o":["జువాన్ ఆంటోనియో సమరాంచ్","ఎవరీ బ్రండేజ్","పియర్ డి కూబర్టిన్","జెస్సీ ఓవెన్స్"],"e":"బారన్ పియర్ డి కూబర్టిన్ 1894లో అంతర్జాతీయ ఒలింపిక్ కమిటీని స్థాపించారు.","n":""}},{"t":"MCQ","q":"How many rings are there in the Olympic symbol?","o":["Six","Four","Five","Seven"],"a":2,"e":"The five interlocking rings represent the five inhabited continents united by sport.","n":"","te":{"q":"ఒలింపిక్ చిహ్నంలో ఎన్ని వలయాలు ఉంటాయి?","o":["ఆరు","నాలుగు","ఐదు","ఏడు"],"e":"ఐదు అనుసంధాన వలయాలు ఐదు ఖండాల ఐక్యతను సూచిస్తాయి.","n":""}},{"t":"MCQ","q":"The Olympic motto 'Citius, Altius, Fortius' means:","o":["Peace, Unity, Friendship","Faster, Higher, Stronger","Play, Win, Smile","Strong, Bold, Brave"],"a":1,"e":"In 2021 the IOC added 'Communiter' (Together).","n":"","te":{"q":"ఒలింపిక్ నినాదం 'సిటియస్, ఆల్టియస్, ఫోర్టియస్' అర్థం:","o":["శాంతి, ఐక్యత, స్నేహం","వేగంగా, ఎత్తుగా, బలంగా","ఆడు, గెలువు, నవ్వు","బలం, ధైర్యం, శౌర్యం"],"e":"2021లో 'కమ్యూనిటర్' (కలిసి) అనే పదాన్ని జో 0 minutes.","n":"","te":{"q":"బాస్కెట్‌బాల్‌లో కోర్టులో ఒక జట్టుకు ఎంతమంది?","o":["11","6","7","5"],"e":"ఫిబా మ్యాచ్‌లలో 10 నిమిషాల చొప్పున నాలుగు క్వార్టర్లు.","n":""}}]},"pe":{"id":"pe","title":["Physical Education Pedagogy","వ్యాయామ విద్య బోధనాశాస్త్రం"],"desc":["Fitness, training principles, first aid, games and methods of teaching physical education.","దృఢత్వం, శిక్షణ సూత్రాలు, ప్రథమ చికిత్స, ఆటలు, వ్యాయామ విద్య బోధనా పద్ధతులు."],"qs":[{"t":"MCQ","q":"The 'FITT' principle of exercise stands for:","o":["Flexibility, Intensity, Tempo, Technique","Fitness, Interest, Training, Test","Frequency, Intensity, Time, Type","Force, Inertia, Time, Tension"],"a":2,"e":"FITT guides exercise prescription: how often, how hard, how long and what kind.","n":"","te":{"q":"వ్యాయామంలో 'ఎఫ్ఐటీటీ' (FITT) సూత్రం అంటే?","o":["వశ్యత, తీవ్రత, వేగం, సాంకేతికత","దృఢత్వం, ఆసక్తి, శిక్షణ, పరీక్ష","తరచుదనం, తీవ్రత, సమయం, రకం","బలం, జడత్వం, సమయం, ఒత్తిడి"],"e":"ఎఫ్ఐటీటీ వ్యాయామ నిర్దేశానికి మార్గదర్శి: ఎంత తరచుగా, ఎంత తీవ్రంగా, ఎంతసేపు, ఏ రకం.","n":""}},{"t":"MCQ","q":"A warm-up before exercise mainly helps to:","o":["Build maximum strength","Raise body temperature and reduce the risk of injury","Reduce flexibility","Replace the main activity"],"a":1,"e":"Warm-up increases heart rate, blood flow and muscle elasticity; cool-down helps recovery.","n":"","te":{"q":"వ్యాయామానికి ముందు వార్మ్-అప్ ప్రధానంగా దేనికి సహాయపడుతుంది?","o":["గరిష్ఠ బలం పెంచుతుంది","శరీర ఉష్ణోగ్రత పెంచి గాయాల ప్రమాదం తగ్గిస్తుంది","వశ్యత తగ్గిస్తుంది","ప్రధాన కృత్యానికి ప్రత్యామ్నాయం"],"e":"వార్మ్-అప్ హృదయ స్పందన, రక్త ప్రసరణ, కండరాల స్థితిస్థాపకత పెంచుతుంది; కూల్-డౌన్ కోలుకోవడానికి సహాయపడుతుంది.","n":""}},{"t":"MCQ","q":"Which component of physical fitness is measured by the sit-and-reach test?","o":["Flexibility","Muscular strength","Cardiovascular endurance","Speed"],"a":0,"e":"Sit-and-reach measures hamstring and lower-back flexibility; a 600 m run/walk measures cardiovascular endurance.","n":"","te":{"q":"'సిట్ అండ్ రీచ్' పరీక్ష శారీరక దృఢత్వంలోని ఏ అంశాన్ని కొలుస్తుంది?","o":["వశ్యత","కండరాల బలం","హృదయ-శ్వాసకోశ ఓర్పు","వేగం"],"e":"సిట్-అండ్-రీచ్ తొడ వెనుక, నడుము వశ్యతను కొలుస్తుంది; 600 మీ. పరుగు/నడక హృదయ ఓర్పును కొలుస్తుంది.","n":""}},{"t":"MCQ","q":"First aid for a sprain follows the 'RICE' method, which stands for:","o":["Relax, Ice, Cream, Elevation","Run, Ice, Cool, Exercise","Rest, Inject, Cover, Exercise","Rest, Ice, Compression, Elevation"],"a":3,"e":"RICE reduces swelling and pain in soft-tissue injuries.","n":"","te":{"q":"బెణుకుకు ప్రథమ చికిత్స 'రైస్' (RICE) పద్ధతిలో ఉంటుంది. దీని అర్థం?","o":["విశ్రాంతి, ఐస్, క్రీమ్, ఎత్తుగా ఉంచడం","పరుగు, ఐస్, చల్లదనం, వ్యాయామం","విశ్రాంతి, ఇంజెక్షన్, కప్పడం, వ్యాయామం","విశ్రాంతి, ఐస్, కుదింపు (కట్టు), ఎత్తుగా ఉంచడం"],"e":"రైస్ మృదు కణజాల గాయాల్లో వాపు, నొప్పిని తగ్గిస్తుంది.","n":""}},{"t":"MCQ","q":"The Fit India Movement was launched on National Sports Day, 29 August, which honours:","o":["Major Dhyan Chand","Milkha Singh","P. T. Usha","Sachin Tendulkar"],"a":0,"e":"29 August is Major Dhyan Chand's birthday; the Fit India Movement began on 29 August 2019.","n":"","te":{"q":"ఫిట్ ఇండియా ఉద్యమం జాతీయ క్రీడా దినోత్సవం 29 ఆగస్టున ప్రారంభమైంది. ఈ దినోత్సవం ఎవరి గౌరవార్థం?","o":["మేజర్ ధ్యాన్ చంద్","మిల్ఖా సింగ్","పి.టి. ఉష","సచిన్ టెండూల్కర్"],"e":"29 ఆగస్టు మేజర్ ధ్యాన్ చంద్ జయంతి; ఫిట్ ఇండియా ఉద్యమం 29 ఆగస్టు 2019న ప్రారంభమైంది.","n":""}},{"t":"MCQ","q":"A standard athletics running track (outdoor) has a length of:","o":["200 m","400 m","300 m","500 m"],"a":1,"e":"A standard outdoor track is 400 m with 8 or 9 lanes; indoor tracks are 200 m.","n":"","te":{"q":"ప్రామాణిక అథ్లెటిక్స్ రన్నింగ్ ట్రాక్ (బహిరంగ) పొడవు ఎంత?","o":["200 మీ.","400 మీ.","300 మీ.","500 మీ."],"e":"ప్రామాణిక బహిరంగ ట్రాక్ 8 లేదా 9 లేన్లతో 400 మీ.; ఇండోర్ ట్రాక్ 200 మీ.","n":""}},{"t":"MCQ","q":"How many players does a kabaddi team have on court at a time?","o":["7","9","11","5"],"a":0,"e":"Each kabaddi team has 7 players on court (12 in the squad).","n":"","te":{"q":"కబడ్డీ జట్టులో ఒకేసారి కోర్టులో ఎంత మంది ఆటగాళ్లు ఉంటారు?","o":["7","9","11","5"],"e":"ప్రతి కబడ్డీ జట్టులో కోర్టులో 7 మంది (స్క్వాడ్‌లో 12).","n":""}},{"t":"MCQ","q":"Teaching a complex skill by breaking it into parts and then combining them is the:","o":["Part–whole method","Whole method only","Lecture method","Command method only"],"a":0,"e":"The part method suits complex skills (e.g., triple jump); the whole method suits simple, continuous skills.","n":"","te":{"q":"సంక్లిష్ట నైపుణ్యాన్ని భాగాలుగా విభజించి తర్వాత కలిపి బోధించడం ఏ పద్ధతి?","o":["భాగ–పూర్ణ పద్ధతి","పూర్ణ పద్ధతి మాత్రమే","ఉపన్యాస పద్ధతి","ఆదేశ పద్ధతి మాత్రమే"],"e":"భాగ పద్ధతి సంక్లిష్ట నైపుణ్యాలకు (ఉదా: ట్రిపుల్ జంప్), పూర్ణ పద్ధతి సరళమైన, నిరంతర నైపుణ్యాలకు సరిపోతుంది.","n":""}},{"t":"MCQ","q":"Body Mass Index (BMI) is calculated as:","o":["Height ÷ Weight","Weight (kg) ÷ Height² (m²)","Weight × Height","Weight ÷ Age"],"a":1,"e":"BMI = kg/m². For Asian adults, 18.5–22.9 is considered normal.","n":"","te":{"q":"బాడీ మాస్ ఇండెక్స్ (బీఎంఐ) ఎలా లెక్కిస్తారు?","o":["ఎత్తు ÷ బరువు","బరువు (కి.గ్రా.) ÷ ఎత్తు² (మీ²)","బరువు × ఎత్తు","బరువు ÷ వయస్సు"],"e":"బీఎంఐ = కి.గ్రా./మీ². ఆసియా పెద్దలకు 18.5–22.9 సాధారణం.","n":""}},{"t":"MCQ","q":"Yoga as a regular school activity mainly contributes to:","o":["Only weight gain","Only muscle bulk","Only competition","Physical and mental well-being, concentration and flexibility"],"a":3,"e":"Yoga improves flexibility, balance, breathing and concentration; 21 June is International Day of Yoga.","n":"","te":{"q":"పాఠశాలలో క్రమం తప్పని యోగా ప్రధానంగా దేనికి తోడ్పడుతుంది?","o":["బరువు పెరగడం మాత్రమే","కండరాల పరిమాణం మాత్రమే","పోటీ మాత్రమే","శారీరక, మానసిక ఆరోగ్యం, ఏకాగ్రత, వశ్యత"],"e":"యోగా వశ్యత, సమతుల్యత, శ్వాస, ఏకాగ్రతను మెరుగుపరుస్తుంది; 21 జూన్ అంతర్జాతీయ యోగా దినోత్సవం.","n":""}},{"t":"MCQ","q":"A physical education lesson is usually organised in the order:","o":["Cool-down → warm-up → game","Warm-up → skill/main activity → cool-down","Game → warm-up → skill","Skill → game → warm-up"],"a":1,"e":"Every PE period begins with a warm-up, moves to skill teaching and practice, and ends with a cool-down and review.","n":"","te":{"q":"వ్యాయామ విద్య పాఠాన్ని సాధారణంగా ఏ క్రమంలో నిర్వహిస్తారు?","o":["కూల్-డౌన్ → వార్మ్-అప్ → ఆట","వార్మ్-అప్ → నైపుణ్యం/ప్రధాన కార్యకలాపం → కూల్-డౌన్","ఆట → వార్మ్-అప్ → నైపుణ్యం","నైపుణ్యం → ఆట → వార్మ్-అప్"],"e":"ప్రతి పీఈ పీరియడ్ వార్మ్-అప్‌తో మొదలై, నైపుణ్య బోధన–సాధన తర్వాత కూల్-డౌన్, సమీక్షతో ముగుస్తుంది.","n":""}},{"t":"MCQ","q":"The 'principle of overload' in training means:","o":["Training only once a month","Training with the same load always","Resting completely for weeks","Gradually increasing the load beyond what the body is used to"],"a":3,"e":"Fitness improves only when the body is stressed slightly more than usual; the load is increased progressively.","n":"","te":{"q":"శిక్షణలో 'అధిక భార సూత్రం' అంటే:","o":["నెలకు ఒకసారే సాధన","ఎప్పుడూ ఒకే భారంతో సాధన","వారాల తరబడి పూర్తి విశ్రాంతి","శరీరానికి అలవాటైన దానికంటే భారాన్ని క్రమంగా పెంచడం"],"e":"శరీరంపై సాధారణం కంటే కొంచెం ఎక్కువ ఒత్తిడి పెట్టినప్పుడే దృఢత్వం పెరుగుతుంది; భారాన్ని క్రమంగా పెంచాలి.","n":""}},{"t":"MCQ","q":"'Fartlek' training, which mixes fast and slow running over natural terrain, originated in:","o":["USA","India","Sweden","Kenya"],"a":2,"e":"Fartlek means 'speed play' in Swedish; it was developed by Gösta Holmér.","n":"","te":{"q":"సహజ భూభాగంపై వేగంగా, నెమ్మదిగా పరుగును కలిపే 'ఫార్ట్‌లెక్' శిక్షణ ఎక్కడ పుట్టింది?","o":["అమెరికా","భారత్","స్వీడన్","కెన్యా"],"e":"ఫార్ట్‌లెక్ అంటే స్వీడిష్‌లో 'వేగపు ఆట'; దీన్ని గోస్టా హోల్మర్ రూపొందించారు.","n":""}},{"t":"MCQ","q":"Circuit training, in which learners move through a series of exercise stations, was developed by:","o":["Pierre de Coubertin","R. E. Morgan and G. T. Adamson","James Naismith","Kenneth Cooper"],"a":1,"e":"Morgan and Adamson developed circuit training at the University of Leeds in 1953.","n":"","te":{"q":"వివిధ వ్యాయామ కేంద్రాల గుండా వరుసగా సాధన చేసే సర్క్యూట్ శిక్షణను రూపొందించినవారు:","o":["పియర్ డి కూబర్టిన్","ఆర్. ఇ. మోర్గాన్, జి. టి. ఆడమ్సన్","జేమ్స్ నైస్మిత్","కెన్నెత్ కూపర్"],"e":"మోర్గాన్, ఆడమ్సన్ 1953లో లీడ్స్ విశ్వవిద్యాలయంలో సర్క్యూట్ శిక్షణను రూపొందించారు.","n":""}},{"t":"MCQ","q":"Cooper's 12-minute run test measures:","o":["Cardiovascular (aerobic) endurance","Flexibility","Reaction time","Grip strength"],"a":0,"e":"Dr Kenneth Cooper's test records the distance covered in 12 minutes to estimate aerobic fitness.","n":"","te":{"q":"కూపర్ 12 నిమిషాల పరుగు పరీక్ష దేన్ని కొలుస్తుంది?","o":["హృదయ-శ్వాసకోశ (ఏరోబిక్) సహనశక్తి","వశ్యత","ప్రతిచర్య కాలం","పట్టు బలం"],"e":"డా. కెన్నెత్ కూపర్ పరీక్షలో 12 నిమిషాల్లో పరిగెత్తిన దూరం ఆధారంగా ఏరోబిక్ దృఢత్వాన్ని అంచనా వేస్తారు.","n":""}},{"t":"MCQ","q":"The shuttle run test is mainly used to measure:","o":["Muscular endurance of the arms","Flexibility","Agility","Balance on one leg"],"a":2,"e":"Quick changes of direction in the shuttle run test agility (AAHPER youth fitness test).","n":"","te":{"q":"షటిల్ రన్ పరీక్షను ప్రధానంగా దేన్ని కొలవడానికి ఉపయోగిస్తారు?","o":["చేతుల కండర సహనశక్తి","వశ్యత","చురుకుదనం (ఎజిలిటీ)","ఒంటికాలిపై సమతుల్యత"],"e":"షటిల్ రన్‌లో వేగంగా దిశ మార్చడం చురుకుదనాన్ని పరీక్షిస్తుంది (AAHPER యువత దృఢత్వ పరీక్ష).","n":""}},{"t":"MCQ","q":"Exercises in which muscles contract without any visible movement of the joint (e.g., pushing a wall) are:","o":["Isokinetic","Isotonic","Isometric","Plyometric"],"a":2,"e":"Isometric = static contraction; isotonic = muscle shortens/lengthens with movement; isokinetic = constant speed.","n":"","te":{"q":"కీలు కదలిక లేకుండా కండరాలు సంకోచించే వ్యాయామాలు (ఉదా: గోడను నెట్టడం):","o":["ఐసోకైనెటిక్","ఐసోటానిక్","ఐసోమెట్రిక్","ప్లయోమెట్రిక్"],"e":"ఐసోమెట్రిక్ = స్థిర సంకోచం; ఐసోటానిక్ = కదలికతో కండరం కుదించుకోవడం/సాగడం.","n":""}},{"t":"MCQ","q":"Competitions organised among students within the same school are called:","o":["National championships","Extramurals","Inter-school meets","Intramurals"],"a":3,"e":"Intra = within; extramural/inter-school competitions are held between schools.","n":"","te":{"q":"ఒకే పాఠశాలలోని విద్యార్థుల మధ్య నిర్వహించే పోటీలను ఏమంటారు?","o":["జాతీయ ఛాంపియన్‌షిప్‌లు","ఎక్స్‌ట్రామ్యూరల్స్","అంతర్-పాఠశాల పోటీలు","ఇంట్రామ్యూరల్స్"],"e":"ఇంట్రా = లోపల; ఎక్స్‌ట్రామ్యూరల్/అంతర్-పాఠశాల పోటీలు పాఠశాలల మధ్య జరుగుతాయి.","n":""}},{"t":"MCQ","q":"An abnormal exaggerated outward curve of the upper back (hunchback) is called:","o":["Kyphosis","Lordosis","Scoliosis","Flat foot"],"a":0,"e":"Kyphosis = rounded upper back; lordosis = excessive inward lower-back curve; scoliosis = sideways curve.","n":"","te":{"q":"వీపు పై భాగం అసాధారణంగా బయటికి వంగడాన్ని (గూని) ఏమంటారు?","o":["కైఫోసిస్","లార్డోసిస్","స్కోలియోసిస్","చదునైన పాదం"],"e":"కైఫోసిస్ = గుండ్రని పై వీపు; లార్డోసిస్ = నడుము లోపలికి అధిక వంపు; స్కోలియోసిస్ = పక్కకు వంపు.","n":""}},{"t":"MCQ","q":"A sideways (lateral) curvature of the spine is:","o":["Scoliosis","Kyphosis","Lordosis","Knock-knees"],"a":0,"e":"Scoliosis is an S- or C-shaped lateral curve; postural screening helps early detection.","n":"","te":{"q":"వెన్నెముక పక్కకు వంగడాన్ని ఏమంటారు?","o":["స్కోలియోసిస్","కైఫోసిస్","లార్డోసిస్","నాక్-నీస్"],"e":"స్కోలియోసిస్ అనేది S లేదా C ఆకారపు పక్క వంపు; భంగిమ పరీక్షలతో ముందుగా గుర్తించవచ్చు.","n":""}},{"t":"MCQ","q":"Teaching a skill by first showing it correctly and then letting learners practise is the:","o":["Project method","Lecture method","Discovery method only","Demonstration method"],"a":3,"e":"In PE, explanation + demonstration + practice + correction is the standard sequence.","n":"","te":{"q":"నైపుణ్యాన్ని మొదట సరిగా చేసి చూపించి తర్వాత విద్యార్థులతో సాధన చేయించే పద్ధతి:","o":["ప్రాజెక్టు పద్ధతి","ఉపన్యాస పద్ధతి","అన్వేషణ పద్ధతి మాత్రమే","ప్రదర్శన పద్ధతి"],"e":"పీఈలో వివరణ + ప్రదర్శన + సాధన + సవరణ అనేది ప్రామాణిక క్రమం.","n":""}},{"t":"MCQ","q":"The main purpose of a cool-down after vigorous exercise is to:","o":["Increase heart rate further","Bring heart rate and breathing gradually back to normal and reduce stiffness","Build maximum strength","Replace the warm-up"],"a":1,"e":"Light jogging and stretching help remove waste products and prevent dizziness and soreness.","n":"","te":{"q":"తీవ్ర వ్యాయామం తర్వాత కూల్-డౌన్ ముఖ్య ఉద్దేశం:","o":["గుండె వేగం ఇంకా పెంచడం","గుండె వేగం, శ్వాసను క్రమంగా సాధారణ స్థితికి తేవడం, బిగుసుకుపోవడం తగ్గించడం","గరిష్ఠ బలం పెంచడం","వార్మ్-అప్ స్థానంలో చేయడం"],"e":"తేలికపాటి జాగింగ్, స్ట్రెచింగ్ వ్యర్థాలను తొలగించి తలతిరగడం, నొప్పులను నివారిస్తాయి.","n":""}},{"t":"MCQ","q":"Activities like sprinting 100 m mainly use energy from the:","o":["Nervous system","Aerobic system only","Digestive system","Anaerobic system"],"a":3,"e":"Short, intense efforts use anaerobic energy (ATP–PC and glycolysis); long, steady efforts use aerobic energy.","n":"","te":{"q":"100 మీ. పరుగు వంటి కార్యకలాపాలు ప్రధానంగా ఏ వ్యవస్థ నుండి శక్తిని పొందుతాయి?","o":["నాడీ వ్యవస్థ","ఏరోబిక్ వ్యవస్థ మాత్రమే","జీర్ణ వ్యవస్థ","అనెరోబిక్ వ్యవస్థ"],"e":"తక్కువ వ్యవధి, అధిక తీవ్రత కార్యకలాపాలు అనెరోబిక్ శక్తిని; దీర్ఘ, స్థిర కార్యకలాపాలు ఏరోబిక్ శక్తిని వాడతాయి.","n":""}},{"t":"MCQ","q":"The Kraus–Weber test is used to measure:","o":["Lung capacity","Intelligence","Minimum muscular fitness (strength and flexibility of key muscles)","Height and weight"],"a":2,"e":"Six simple items test abdominal, psoas, back muscles and flexibility; failure on any item indicates minimum fitness is lacking.","n":"","te":{"q":"క్రాస్–వెబర్ పరీక్షను దేన్ని కొలవడానికి ఉపయోగిస్తారు?","o":["ఊపిరితిత్తుల సామర్థ్యం","బుద్ధి","కనీస కండర దృఢత్వం (ముఖ్య కండరాల బలం, వశ్యత)","ఎత్తు, బరువు"],"e":"ఆరు సులభ అంశాలతో ఉదర, వీపు కండరాలు, వశ్యతను పరీక్షిస్తారు.","n":""}},{"t":"MCQ","q":"Adapted physical education is meant for:","o":["Only boys","Only national-level athletes","Children with disabilities, by modifying activities, rules and equipment","Only teachers"],"a":2,"e":"Adapted PE ensures inclusion by changing rules, space, equipment or instruction to suit each learner.","n":"","te":{"q":"అడాప్టెడ్ (అనుకూలీకృత) వ్యాయామ విద్య ఎవరి కోసం?","o":["బాలురకు మాత్రమే","జాతీయ స్థాయి క్రీడాకారులకు మాత్రమే","కార్యకలాపాలు, నియమాలు, పరికరాలను మార్చి వికలాంగ పిల్లల కోసం","ఉపాధ్యాయులకు మాత్రమే"],"e":"నియమాలు, స్థలం, పరికరాలు, బోధనను మార్చి ప్రతి విద్యార్థిని భాగస్వామిని చేయడమే అడాప్టెడ్ పీఈ.","n":""}}]},"persp":{"id":"persp","title":["Perspectives in Education","విద్యలో దృక్పథాలు"],"desc":["History of education, commissions, NEP 2020, NCF, RTE Act, inclusion, child rights and educational thinkers.","విద్యా చరిత్ర, కమిషన్లు, ఎన్‌ఈపీ 2020, ఎన్‌సీఎఫ్, విద్యా హక్కు చట్టం, సమ్మిళిత విద్య, బాలల హక్కులు, విద్యావేత్తలు."],"qs":[{"t":"MCQ","q":"Which document of 1854 is called the 'Magna Carta of English Education in India'?","o":["Macaulay's Minute","Wood's Despatch","Hunter Commission Report","Sargent Plan"],"a":1,"e":"Sir Charles Wood's Despatch (1854) proposed departments of education, universities at Calcutta, Bombay and Madras (1857), grants-in-aid and teacher training.","n":"","te":{"q":"1854 నాటి ఏ పత్రాన్ని 'భారతదేశంలో ఆంగ్ల విద్యకు మాగ్నాకార్టా' అంటారు?","o":["మెకాలే మినిట్","వుడ్స్ డిస్పాచ్","హంటర్ కమిషన్ నివేదిక","సార్జెంట్ ప్రణాళిక"],"e":"సర్ చార్లెస్ వుడ్ డిస్పాచ్ (1854) విద్యా శాఖలు, కలకత్తా, బొంబాయి, మద్రాసు విశ్వవిద్యాలయాలు (1857), గ్రాంట్-ఇన్-ఎయిడ్, ఉపాధ్యాయ శిక్షణను ప్రతిపాదించింది.","n":""}},{"t":"MCQ","q":"Macaulay's Minute on Indian Education (1835) supported:","o":["Teaching through mother tongues","Teaching Western knowledge through English","Sanskrit and Arabic learning","Vocational education in villages"],"a":1,"e":"Macaulay argued for English as the medium and the 'downward filtration' of Western learning.","n":"","te":{"q":"మెకాలే మినిట్ (1835) దేనిని సమర్థించింది?","o":["మాతృభాషల ద్వారా బోధన","ఇంగ్లీషు ద్వారా పాశ్చాత్య జ్ఞాన బోధన","సంస్కృత, అరబిక్ అధ్యయనం","గ్రామాల్లో వృత్తి విద్య"],"e":"మెకాలే ఇంగ్లీషు మాధ్యమాన్ని, పాశ్చాత్య జ్ఞానం 'అధోముఖ వడపోత' సిద్ధాంతాన్ని సమర్థించాడు.","n":""}},{"t":"MCQ","q":"The Indian Education Commission of 1882 is better known as the:","o":["Hartog Committee","Sadler Commission","Raleigh Commission","Hunter Commission"],"a":3,"e":"Chaired by William Hunter, the 1882 commission focused on primary and secondary education and handed primary education to local bodies.","n":"","te":{"q":"1882 భారతీయ విద్యా కమిషన్‌ను సాధారణంగా ఏమని పిలుస్తారు?","o":["హార్టాగ్ కమిటీ","సాడ్లర్ కమిషన్","రాలీ కమిషన్","హంటర్ కమిషన్"],"e":"విలియం హంటర్ అధ్యక్షతన 1882 కమిషన్ ప్రాథమిక, మాధ్యమిక విద్యపై దృష్టి పెట్టి ప్రాథమిక విద్యను స్థానిక సంస్థలకు అప్పగించింది.","n":""}},{"t":"MCQ","q":"Gandhiji's scheme of 'Basic Education' (Nai Talim) was adopted at which conference in 1937?","o":["Wardha","Haripura","Lucknow","Karachi"],"a":0,"e":"The Wardha Educational Conference (1937) adopted Basic Education: craft-centred learning in the mother tongue, free and compulsory for seven years. The Zakir Hussain Committee prepared its details.","n":"","te":{"q":"గాంధీజీ 'బేసిక్ విద్య' (నయీ తాలీమ్)ను 1937లో ఏ సమావేశంలో ఆమోదించారు?","o":["వార్ధా","హరిపుర","లక్నో","కరాచీ"],"e":"వార్ధా విద్యా సమావేశం (1937) బేసిక్ విద్యను ఆమోదించింది: మాతృభాషలో వృత్తి కేంద్రీకృత అభ్యసనం, ఏడేళ్ల ఉచిత నిర్బంధ విద్య. జాకిర్ హుస్సేన్ కమిటీ దీని వివరాలు రూపొందించింది.","n":""}},{"t":"MCQ","q":"The Secondary Education Commission (1952–53) was headed by:","o":["Dr D. S. Kothari","Dr A. Lakshmanaswami Mudaliar","Dr S. Radhakrishnan","Acharya Ramamurti"],"a":1,"e":"The Mudaliar Commission recommended diversified courses, multipurpose schools and a three-language approach at secondary level.","n":"","te":{"q":"మాధ్యమిక విద్యా కమిషన్ (1952–53) అధ్యక్షుడు ఎవరు?","o":["డా. డి.ఎస్. కొఠారి","డా. ఎ. లక్ష్మణస్వామి మొదలియార్","డా. ఎస్. రాధాకృష్ణన్","ఆచార్య రామమూర్తి"],"e":"మొదలియార్ కమిషన్ వైవిధ్యభరిత కోర్సులు, బహుళార్థ పాఠశాలలు సిఫారసు చేసింది.","n":""}},{"t":"MCQ","q":"Which commission (1964–66) opened its report with 'The destiny of India is now being shaped in her classrooms'?","o":["Radhakrishnan Commission","Mudaliar Commission","Kothari Commission","Yash Pal Committee"],"a":2,"e":"The Education Commission chaired by Dr D. S. Kothari recommended the 10+2+3 pattern, a Common School System, 6% of GDP for education and the three-language formula.","n":"","te":{"q":"'భారతదేశ భవిష్యత్తు తరగతి గదుల్లో రూపుదిద్దుకుంటోంది' అనే వాక్యంతో నివేదిక ప్రారంభించిన కమిషన్ (1964–66) ఏది?","o":["రాధాకృష్ణన్ కమిషన్","మొదలియార్ కమిషన్","కొఠారి కమిషన్","యశ్‌పాల్ కమిటీ"],"e":"డా. డి.ఎస్. కొఠారి అధ్యక్షతన విద్యా కమిషన్ 10+2+3 విధానం, ఉమ్మడి పాఠశాల వ్యవస్థ, విద్యకు జీడీపీలో 6%, త్రిభాషా సూత్రం సిఫారసు చేసింది.","n":""}},{"t":"MCQ","q":"The University Education Commission of 1948–49 was chaired by:","o":["Dr D. S. Kothari","Dr Zakir Hussain","Dr S. Radhakrishnan","Maulana Azad"],"a":2,"e":"The Radhakrishnan Commission was the first education commission of independent India; it led to the UGC.","n":"","te":{"q":"విశ్వవిద్యాలయ విద్యా కమిషన్ (1948–49) అధ్యక్షుడు ఎవరు?","o":["డా. డి.ఎస్. కొఠారి","డా. జాకిర్ హుస్సేన్","డా. ఎస్. రాధాకృష్ణన్","మౌలానా ఆజాద్"],"e":"రాధాకృష్ణన్ కమిషన్ స్వతంత్ర భారత తొలి విద్యా కమిషన్; దీని ఫలితంగా యూజీసీ ఏర్పడింది.","n":""}},{"t":"MCQ","q":"Operation Blackboard (1987) was launched under which policy to improve facilities in primary schools?","o":["NEP 2020","NPE 1968","National Policy on Education 1986","RTE Act 2009"],"a":2,"e":"NPE 1986 launched Operation Blackboard (minimum facilities: two rooms, two teachers, teaching aids) and set up DIETs.","n":"","te":{"q":"ప్రాథమిక పాఠశాలల్లో సౌకర్యాలు మెరుగుపరచడానికి ఆపరేషన్ బ్లాక్‌బోర్డ్ (1987) ఏ విధానం కింద ప్రారంభమైంది?","o":["జాతీయ విద్యా విధానం 2020","జాతీయ విద్యా విధానం 1968","జాతీయ విద్యా విధానం 1986","విద్యా హక్కు చట్టం 2009"],"e":"ఎన్‌పీఈ 1986 ఆపరేషన్ బ్లాక్‌బోర్డ్ (కనీస సౌకర్యాలు: రెండు గదులు, ఇద్దరు ఉపాధ్యాయులు, బోధనోపకరణాలు) ప్రారంభించి డైట్‌లు ఏర్పాటు చేసింది.","n":""}},{"t":"MCQ","q":"The Yash Pal Committee report of 1993 is known as:","o":["Education for All","Learning: The Treasure Within","Learning Without Burden","Towards an Enlightened and Humane Society"],"a":2,"e":"'Learning Without Burden' (1993) addressed the heavy school bag and joyless rote learning.","n":"","te":{"q":"1993 యశ్‌పాల్ కమిటీ నివేదికను ఏమంటారు?","o":["అందరికీ విద్య","అభ్యసనం: అంతర్గత నిధి","భారం లేని అభ్యసనం (లెర్నింగ్ వితౌట్ బర్డెన్)","జ్ఞానవంత, మానవీయ సమాజం వైపు"],"e":"'భారం లేని అభ్యసనం' (1993) పుస్తకాల సంచి భారం, ఆనందం లేని బట్టీ చదువుల సమస్యను చర్చించింది.","n":""}},{"t":"MCQ","q":"The UNESCO report 'Learning: The Treasure Within' (1996) by the Delors Commission gave how many pillars of learning?","o":["Five","Three","Four","Six"],"a":2,"e":"The four pillars: learning to know, learning to do, learning to live together, and learning to be.","n":"","te":{"q":"డెలర్స్ కమిషన్ యునెస్కో నివేదిక 'అభ్యసనం: అంతర్గత నిధి' (1996) అభ్యసనానికి ఎన్ని స్తంభాలు చెప్పింది?","o":["ఐదు","మూడు","నాలుగు","ఆరు"],"e":"నాలుగు స్తంభాలు: తెలుసుకోవడం నేర్చుకోవడం, చేయడం నేర్చుకోవడం, కలిసి జీవించడం నేర్చుకోవడం, ఉండటం (వ్యక్తిత్వం) నేర్చుకోవడం.","n":""}},{"t":"MCQ","q":"NEP 2020 replaces the 10+2 structure with which curricular structure?","o":["4+4+4","5+3+3+4","5+3+2+2","3+5+4"],"a":1,"e":"Foundational (3–8 years: 3 years pre-school + Classes 1–2), Preparatory (Classes 3–5), Middle (6–8) and Secondary (9–12).","n":"","te":{"q":"జాతీయ విద్యా విధానం 2020 10+2 విధానానికి బదులుగా ఏ పాఠ్యప్రణాళిక నిర్మాణాన్ని ప్రతిపాదించింది?","o":["4+4+4","5+3+3+4","5+3+2+2","3+5+4"],"e":"పునాది (3–8 ఏళ్లు: 3 ఏళ్ల ప్రీ-స్కూల్ + 1–2 తరగతులు), సన్నాహక (3–5), మాధ్యమిక (6–8), సెకండరీ (9–12).","n":""}},{"t":"MCQ","q":"Which committee drafted the National Education Policy 2020?","o":["Ramamurti Committee","T. S. R. Subramanian Committee","Yash Pal Committee","Dr K. Kasturirangan Committee"],"a":3,"e":"The Kasturirangan committee submitted the draft NEP in 2019; the Union Cabinet approved NEP on 29 July 2020.","n":"","te":{"q":"జాతీయ విద్యా విధానం 2020 ముసాయిదా రూపొందించిన కమిటీ ఏది?","o":["రామమూర్తి కమిటీ","టి.ఎస్.ఆర్. సుబ్రమణియన్ కమిటీ","యశ్‌పాల్ కమిటీ","డా. కె. కస్తూరిరంగన్ కమిటీ"],"e":"కస్తూరిరంగన్ కమిటీ 2019లో ముసాయిదా సమర్పించింది; కేంద్ర మంత్రివర్గం 29 జూలై 2020న ఆమోదించింది.","n":""}},{"t":"MCQ","q":"According to NEP 2020, by which year should universal foundational literacy and numeracy be achieved in primary schools?","o":["2025","2030","2027","2035"],"a":0,"e":"NEP 2020 set 2025 as the target for foundational literacy and numeracy; the NIPUN Bharat Mission (2021) implements it.","n":"","te":{"q":"జాతీయ విద్యా విధానం 2020 ప్రకారం ప్రాథమిక పాఠశాలల్లో సార్వత్రిక పునాది అక్షరాస్యత, సంఖ్యా జ్ఞానం ఏ సంవత్సరానికి సాధించాలి?","o":["2025","2030","2027","2035"],"e":"ఎన్‌ఈపీ 2020 పునాది అక్షరాస్యత, సంఖ్యా జ్ఞానానికి 2025 లక్ష్యం పెట్టింది; నిపుణ్ భారత్ మిషన్ (2021) దీనిని అమలు చేస్తుంది.","n":""}},{"t":"MCQ","q":"NEP 2020 recommends the medium of instruction till at least Class 5 (preferably Class 8) to be:","o":["English only","Home language / mother tongue / regional language","Hindi only","Any foreign language"],"a":1,"e":"NEP 2020 encourages teaching in the home language or mother tongue wherever possible.","n":"","te":{"q":"కనీసం 5వ తరగతి వరకు (వీలైతే 8 వరకు) బోధనా మాధ్యమం ఏది కావాలని ఎన్‌ఈపీ 2020 సూచిస్తుంది?","o":["ఇంగ్లీషు మాత్రమే","ఇంటి భాష / మాతృభాష / ప్రాంతీయ భాష","హిందీ మాత్రమే","ఏదైనా విదేశీ భాష"],"e":"వీలైనంత వరకు ఇంటి భాష లేదా మాతృభాషలో బోధించాలని ఎన్‌ఈపీ 2020 ప్రోత్సహిస్తుంది.","n":""}},{"t":"MCQ","q":"PARAKH, set up under NEP 2020, is a:","o":["School infrastructure fund","Teacher recruitment board","Scholarship scheme","National assessment centre"],"a":3,"e":"PARAKH (Performance Assessment, Review and Analysis of Knowledge for Holistic Development) is the national assessment centre under NCERT.","n":"","te":{"q":"ఎన్‌ఈపీ 2020 కింద ఏర్పాటైన 'పరఖ్' (PARAKH) అంటే ఏమిటి?","o":["పాఠశాల మౌలిక వసతుల నిధి","ఉపాధ్యాయ నియామక మండలి","ఉపకార వేతన పథకం","జాతీయ మూల్యాంకన కేంద్రం"],"e":"పరఖ్ (సమగ్ర వికాసానికి జ్ఞాన పనితీరు మూల్యాంకనం, సమీక్ష, విశ్లేషణ) ఎన్‌సీఈఆర్టీ కింద జాతీయ మూల్యాంకన కేంద్రం.","n":""}},{"t":"MCQ","q":"Which National Curriculum Framework stressed 'connecting knowledge to life outside the school' and 'moving away from rote methods'?","o":["NCF 2005","NCF 1975","NCF 1988","NCF 2000"],"a":0,"e":"NCF 2005 (chaired by Prof. Yash Pal) gave five guiding principles, including linking knowledge to life outside school and shifting from rote learning.","n":"","te":{"q":"'పాఠశాల బయటి జీవితంతో జ్ఞానాన్ని అనుసంధానించాలి', 'బట్టీ పద్ధతుల నుండి దూరంగా జరగాలి' అని నొక్కిచెప్పిన జాతీయ పాఠ్యప్రణాళికా చట్రం ఏది?","o":["ఎన్‌సీఎఫ్ 2005","ఎన్‌సీఎఫ్ 1975","ఎన్‌సీఎఫ్ 1988","ఎన్‌సీఎఫ్ 2000"],"e":"ఎన్‌సీఎఫ్ 2005 (ప్రొ. యశ్‌పాల్ అధ్యక్షతన) ఐదు మార్గదర్శక సూత్రాలు ఇచ్చింది — పాఠశాల బయటి జీవితంతో జ్ఞానం అనుసంధానం, బట్టీ నుండి విముక్తి మొ.","n":""}},{"t":"MCQ","q":"The NCF for School Education 2023 was prepared by a steering committee headed by:","o":["Dr D. P. Singh","Prof. Yash Pal","Dr K. Kasturirangan","Prof. J. S. Rajput"],"a":2,"e":"The Kasturirangan-led National Steering Committee released NCF-FS (2022) and NCF-SE (2023).","n":"","te":{"q":"పాఠశాల విద్యకు జాతీయ పాఠ్యప్రణాళికా చట్రం 2023ను రూపొందించిన స్టీరింగ్ కమిటీ అధ్యక్షుడు ఎవరు?","o":["డా. డి.పి. సింగ్","ప్రొ. యశ్‌పాల్","డా. కె. కస్తూరిరంగన్","ప్రొ. జె.ఎస్. రాజ్‌పుత్"],"e":"కస్తూరిరంగన్ నేతృత్వంలోని జాతీయ స్టీరింగ్ కమిటీ ఎన్‌సీఎఫ్-ఎఫ్‌ఎస్ (2022), ఎన్‌సీఎఫ్-ఎస్‌ఈ (2023) విడుదల చేసింది.","n":""}},{"t":"MCQ","q":"The RTE Act, 2009 came into force on:","o":["1 April 2010","4 August 2009","26 January 2010","15 August 2010"],"a":0,"e":"The Right of Children to Free and Compulsory Education Act was passed in August 2009 and came into force on 1 April 2010.","n":"","te":{"q":"విద్యా హక్కు చట్టం 2009 ఎప్పటి నుండి అమలులోకి వచ్చింది?","o":["1 ఏప్రిల్ 2010","4 ఆగస్టు 2009","26 జనవరి 2010","15 ఆగస్టు 2010"],"e":"ఉచిత, నిర్బంధ విద్యకు బాలల హక్కు చట్టం ఆగస్టు 2009లో ఆమోదం పొంది 1 ఏప్రిల్ 2010 నుండి అమలులోకి వచ్చింది.","n":""}},{"t":"MCQ","q":"Under Section 12(1)(c) of the RTE Act, private unaided schools must reserve what share of entry-level seats for children of weaker sections?","o":["20%","15%","25%","33%"],"a":2,"e":"Section 12(1)(c) requires 25% of seats at the entry class for children from disadvantaged groups and weaker sections, reimbursed by the state.","n":"","te":{"q":"విద్యా హక్కు చట్టం సెక్షన్ 12(1)(c) ప్రకారం ప్రైవేట్ అన్‌ఎయిడెడ్ పాఠశాలలు బలహీన వర్గాల పిల్లలకు ప్రవేశ తరగతిలో ఎంత శాతం సీట్లు కేటాయించాలి?","o":["20%","15%","25%","33%"],"e":"సెక్షన్ 12(1)(c) ప్రకారం ప్రవేశ తరగతిలో 25% సీట్లు వెనుకబడిన, బలహీన వర్గాల పిల్లలకు; ఖర్చు ప్రభుత్వం భరిస్తుంది.","n":""}},{"t":"MCQ","q":"The RTE Act's norm for the Pupil–Teacher Ratio at the primary level is:","o":["25:1","35:1","40:1","30:1"],"a":3,"e":"The Schedule sets 30:1 for primary (Classes 1–5) and 35:1 for upper primary (Classes 6–8).","n":"","te":{"q":"విద్యా హక్కు చట్టం ప్రకారం ప్రాథమిక స్థాయిలో విద్యార్థి–ఉపాధ్యాయ నిష్పత్తి ఎంత?","o":["25:1","35:1","40:1","30:1"],"e":"షెడ్యూల్ ప్రకారం ప్రాథమిక (1–5) 30:1, ప్రాథమికోన్నత (6–8) 35:1.","n":""}},{"t":"MCQ","q":"Which section of the RTE Act prohibits physical punishment and mental harassment of children?","o":["Section 17","Section 12","Section 21","Section 29"],"a":0,"e":"Section 17 bans physical punishment and mental harassment; Section 21 deals with School Management Committees; Section 29 with curriculum and evaluation.","n":"","te":{"q":"పిల్లలకు శారీరక శిక్ష, మానసిక వేధింపులను నిషేధించిన విద్యా హక్కు చట్టం సెక్షన్ ఏది?","o":["సెక్షన్ 17","సెక్షన్ 12","సెక్షన్ 21","సెక్షన్ 29"],"e":"సెక్షన్ 17 శారీరక శిక్ష, మానసిక వేధింపులను నిషేధిస్తుంది; సెక్షన్ 21 పాఠశాల యాజమాన్య కమిటీలు; సెక్షన్ 29 పాఠ్యప్రణాళిక, మూల్యాంకనం.","n":""}},{"t":"MCQ","q":"Under the RTE Act, at least what proportion of School Management Committee members must be parents or guardians?","o":["One-third","One-half","Two-thirds","Three-fourths"],"a":3,"e":"Section 21: at least 75% of SMC members are parents/guardians, with proportionate representation of weaker sections and 50% women.","n":"","te":{"q":"విద్యా హక్కు చట్టం ప్రకారం పాఠశాల యాజమాన్య కమిటీ సభ్యుల్లో కనీసం ఎంత భాగం తల్లిదండ్రులు/సంరక్షకులు ఉండాలి?","o":["మూడింట ఒక వంతు","సగం","మూడింట రెండు వంతులు","మూడు వంతులు (3/4)"],"e":"సెక్షన్ 21: ఎస్‌ఎంసీ సభ్యుల్లో కనీసం 75% తల్లిదండ్రులు/సంరక్షకులు; బలహీన వర్గాలకు దామాషా ప్రాతినిధ్యం, 50% మహిళలు.","n":""}},{"t":"MCQ","q":"Which body is the academic authority that lays down minimum qualifications for teachers under Section 23 of the RTE Act?","o":["CBSE","NCERT","UGC","NCTE"],"a":3,"e":"The National Council for Teacher Education (NCTE, statutory since 1993) was notified as the academic authority; it made TET compulsory.","n":"","te":{"q":"విద్యా హక్కు చట్టం సెక్షన్ 23 కింద ఉపాధ్యాయుల కనీస అర్హతలు నిర్ణయించే అకడమిక్ అథారిటీ ఏది?","o":["సీబీఎస్‌ఈ","ఎన్‌సీఈఆర్టీ","యూజీసీ","ఎన్‌సీటీఈ"],"e":"జాతీయ ఉపాధ్యాయ విద్యా మండలి (ఎన్‌సీటీఈ, 1993 నుండి చట్టబద్ధ సంస్థ) అకడమిక్ అథారిటీగా నోటిఫై అయింది; అది టెట్‌ను తప్పనిసరి చేసింది.","n":""}},{"t":"MCQ","q":"Which body monitors children's rights under the RTE Act at the national level?","o":["NHRC","NCPCR","NCW","NCTE"],"a":1,"e":"The National Commission for Protection of Child Rights (NCPCR, set up in 2007 under the CPCR Act 2005) monitors implementation of the RTE Act.","n":"","te":{"q":"జాతీయ స్థాయిలో విద్యా హక్కు చట్టం కింద బాలల హక్కులను పర్యవేక్షించే సంస్థ ఏది?","o":["ఎన్‌హెచ్‌ఆర్‌సీ","ఎన్‌సీపీసీఆర్","ఎన్‌సీడబ్ల్యూ","ఎన్‌సీటీఈ"],"e":"జాతీయ బాలల హక్కుల పరిరక్షణ కమిషన్ (ఎన్‌సీపీసీఆర్, సీపీసీఆర్ చట్టం 2005 కింద 2007లో ఏర్పాటు) విద్యా హక్కు చట్టం అమలును పర్యవేక్షిస్తుంది.","n":""}},{"t":"MCQ","q":"Samagra Shiksha (2018) merged which three earlier schemes?","o":["SSA, DPEP and Mid-Day Meal","SSA, RMSA and Teacher Education","RMSA, KGBV and NPEGEL","DPEP, Operation Blackboard and SSA"],"a":1,"e":"Samagra Shiksha is an integrated scheme from pre-school to Class 12 subsuming Sarva Shiksha Abhiyan, Rashtriya Madhyamik Shiksha Abhiyan and Teacher Education.","n":"","te":{"q":"సమగ్ర శిక్ష (2018) ఏ మూడు పూర్వ పథకాలను విలీనం చేసింది?","o":["ఎస్‌ఎస్‌ఏ, డీపీఈపీ, మధ్యాహ్న భోజనం","ఎస్‌ఎస్‌ఏ, ఆర్‌ఎంఎస్‌ఏ, ఉపాధ్యాయ విద్య","ఆర్‌ఎంఎస్‌ఏ, కేజీబీవీ, ఎన్‌పీఈజీఈ development because growth is:","o":["Only social","Qualitative and lifelong","Only emotional","Quantitative and structural"],"a":3,"e":"Growth means measurable changes in size, height and weight; development includes qualitative changes in functions and continues throughout life.","n":"","te":{"q":"పెరుగుదల వికాసం నుండి ఎలా భిన్నమైనది?","o":["కేవలం సామాజిక","పెరుగుదల గుణాత్మకం, జీవితాంతం","కేవలం భావోద్వేగ","పెరుగుదల పరిమాణాత్మకం, నిర్మాణాత్మకం"],"e":"పెరుగుదల అంటే ఎత్తు, బరువు వంటి కొలవగలిగే మార్పులు; వికాసంలో విధుల్లో గుణాత్మక మార్పులు ఉంటాయి, అది జీవితాంతం జరుగుతుంది.","n":""}},{"t":"MCQ","q":"According to Piaget, a child who can conserve quantity and think logically about concrete objects is in which stage?","o":["Concrete operational (7–11 years)","Pre-operational (2–7 years)","Sensorimotor (0–2 years)","Formal operational (11+ years)"],"a":0,"e":"Conservation, reversibility, classification and seriation appear in the concrete operational stage.","n":"","te":{"q":"పియాజే ప్రకారం పరిమాణ సంరక్షణ సాధించి, మూర్త వస్తువులపై తార్కికంగా ఆలోచించే బిడ్డ ఏ దశలో ఉంటాడు?","o":["మూర్త ప్రచాలక దశ (7–11 ఏళ్లు)","పూర్వ ప్రచాలక దశ (2–7 ఏళ్లు)","సంవేదన చాలక దశ (0–2 ఏళ్లు)","అమూర్త ప్రచాలక దశ (11+ ఏళ్లు)"],"e":"సంరక్షణ, ప్రతివర్తనీయత, వర్గీకరణ, క్రమీకరణ మూర్త ప్రచాలక దశలో కనిపిస్తాయి.","n":""}},{"t":"MCQ","q":"Egocentrism and animism (believing toys have feelings) are typical of which Piagetian stage?","o":["Sensorimotor","Pre-operational","Concrete operational","Formal operational"],"a":1,"e":"In the pre-operational stage (2–7 years) children use symbols but think egocentrically and attribute life to objects.","n":"","te":{"q":"అహం కేంద్రీకృత ఆలోచన, సజీవ భావన (బొమ్మలకు భావాలు ఉన్నాయని నమ్మడం) పియాజే ఏ దశ లక్షణాలు?","o":["సంవేదన చాలక దశ","పూర్వ ప్రచాలక దశ","మూర్త ప్రచాలక దశ","అమూర్త ప్రచాలక దశ"],"e":"పూర్వ ప్రచాలక దశలో (2–7 ఏళ్లు) పిల్లలు సంకేతాలు వాడతారు కానీ అహంకేంద్రంగా ఆలోచిస్తారు, వస్తువులకు ప్రాణం ఆపాదిస్తారు.","n":""}},{"t":"MCQ","q":"'Object permanence' is achieved during which stage of Piaget's theory?","o":["Sensorimotor","Pre-operational","Concrete operational","Formal operational"],"a":0,"e":"Towards the end of the sensorimotor stage (0–2 years) infants understand that objects continue to exist when out of sight.","n":"","te":{"q":"పియాజే సిద్ధాంతంలో 'వస్తు స్థిరత్వం' ఏ దశలో సాధిస్తారు?","o":["సంవేదన చాలక దశ","పూర్వ ప్రచాలక దశ","మూర్త ప్రచాలక దశ","అమూర్త ప్రచాలక దశ"],"e":"సంవేదన చాలక దశ (0–2 ఏళ్లు) చివరికి వస్తువు కనిపించకపోయినా అది ఉంటుందని శిశువు గ్రహిస్తుంది.","n":""}},{"t":"MCQ","q":"In Piaget's theory, fitting new information into an existing schema is called:","o":["Accommodation","Assimilation","Equilibration","Adaptation"],"a":1,"e":"Assimilation fits new experience into existing schemas; accommodation changes schemas to fit new experience.","n":"","te":{"q":"పియాజే సిద్ధాంతంలో కొత్త సమాచారాన్ని ఉన్న స్కీమాలో ఇమిడ్చడాన్ని ఏమంటారు?","o":["అనుగుణ్యత (అకామడేషన్)","సాంశీకరణం (అసిమిలేషన్)","సమతుల్యత","అనుకూలనం"],"e":"సాంశీకరణం కొత్త అనుభవాన్ని ఉన్న స్కీమాలో ఇమిడ్చుతుంది; అనుగుణ్యత కొత్త అనుభవానికి తగినట్లు స్కీమాను మారుస్తుంది.","n":""}},{"t":"MCQ","q":"Vygotsky's 'Zone of Proximal Development' refers to:","o":["What a child can do with help but not yet alone","What a child has already mastered","Tasks too hard even with help","The child's IQ range"],"a":0,"e":"The ZPD is the gap between independent performance and performance with guidance from a more knowledgeable other.","n":"","te":{"q":"వైగోట్‌స్కీ 'సమీప వికాస మండలం' (జెడ్‌పీడీ) అంటే ఏమిటి?","o":["సహాయంతో చేయగలిగి, ఇంకా ఒంటరిగా చేయలేని పనులు","బిడ్డ ఇప్పటికే నేర్చుకున్నవి","సహాయంతోనూ చేయలేని కష్టమైన పనులు","బిడ్డ ఐక్యూ పరిధి"],"e":"స్వతంత్ర ప్రదర్శనకు, అధిక జ్ఞానం గలవారి మార్గదర్శనంతో ప్రదర్శనకు మధ్య అంతరమే జెడ్‌పీడీ.","n":""}},{"t":"MCQ","q":"Temporary support given by a teacher and gradually withdrawn as the learner becomes competent is called:","o":["Scaffolding","Reinforcement","Shaping","Chaining"],"a":0,"e":"Scaffolding (Wood, Bruner and Ross, linked to Vygotsky's ZPD) is support that fades as competence grows.","n":"","te":{"q":"అభ్యాసకుడు సమర్థుడయ్యే కొద్దీ క్రమంగా తొలగించే ఉపాధ్యాయుని తాత్కాలిక సహాయాన్ని ఏమంటారు?","o":["ఆధార నిర్మాణం (స్కాఫోల్డింగ్)","పునర్బలనం","రూపకల్పన (షేపింగ్)","శృంఖలనం"],"e":"స్కాఫోల్డింగ్ (వుడ్, బ్రూనర్, రాస్; వైగోట్‌స్కీ జెడ్‌పీడీతో సంబంధం) సామర్థ్యం పెరిగే కొద్దీ తగ్గే సహాయం.","n":""}},{"t":"MCQ","q":"According to Vygotsky, a young child talking aloud to guide their own actions ('private speech') shows that:","o":["The child has a speech disorder","The child is egocentric and immature","Language helps regulate thinking","Language develops after thought only"],"a":2,"e":"Vygotsky saw private speech as self-guidance that later becomes inner speech; Piaget viewed it as egocentric speech.","n":"","te":{"q":"వైగోట్‌స్కీ ప్రకారం చిన్న పిల్లలు తమ పనులను నడిపించుకోవడానికి గట్టిగా మాట్లాడుకోవడం ('స్వీయ భాషణ') దేనిని సూచిస్తుంది?","o":["బిడ్డకు మాటల లోపం ఉంది","బిడ్డ అహంకేంద్రుడు, అపరిపక్వుడు","భాష ఆలోచనను నియంత్రించడానికి సహాయపడుతుంది","ఆలోచన తర్వాతే భాష వస్తుంది"],"e":"వైగోట్‌స్కీ స్వీయ భాషణను స్వీయ మార్గదర్శనంగా, తర్వాత అంతర్ భాషణగా మారేదిగా చూశాడు; పియాజే దానిని అహంకేంద్ర భాషణగా భావించాడు.","n":""}},{"t":"MCQ","q":"Erikson's psychosocial crisis of adolescence (12–18 years) is:","o":["Initiative vs Guilt","Industry vs Inferiority","Intimacy vs Isolation","Identity vs Role confusion"],"a":3,"e":"Adolescents search for a sense of self; Industry vs Inferiority belongs to the school age (6–12).","n":"","te":{"q":"కౌమార దశ (12–18 ఏళ్లు)లో ఎరిక్‌సన్ చెప్పిన మనోసాంఘిక సంక్షోభం ఏది?","o":["చొరవ vs అపరాధ భావం","శ్రమశీలత vs న్యూనతా భావం","సాన్నిహిత్యం vs ఏకాంతం","గుర్తింపు vs పాత్ర గందరగోళం"],"e":"కౌమారులు స్వీయ గుర్తింపు కోసం వెతుకుతారు; శ్రమశీలత vs న్యూనత పాఠశాల వయస్సు (6–12) దశ.","n":""}},{"t":"MCQ","q":"A primary-school child who feels competent after completing tasks is resolving which Erikson stage?","o":["Identity vs Role confusion","Trust vs Mistrust","Autonomy vs Shame","Industry vs Inferiority"],"a":3,"e":"In the school years (6–12) children develop a sense of industry through mastering skills; repeated failure leads to inferiority.","n":"","te":{"q":"పనులు పూర్తి చేసి సమర్థుడినని భావించే ప్రాథమిక పాఠశాల బిడ్డ ఎరిక్‌సన్ ఏ దశను పరిష్కరిస్తున్నాడు?","o":["గుర్తింపు vs పాత్ర గందరగోళం","విశ్వాసం vs అపనమ్మకం","స్వయంప్రతిపత్తి vs సిగ్గు","శ్రమశీలత vs న్యూనతా భావం"],"e":"పాఠశాల వయస్సులో (6–12) నైపుణ్యాలు సాధించడం ద్వారా శ్రమశీలత పెరుగుతుంది; పదే పదే వైఫల్యం న్యూనతకు దారితీస్తుంది.","n":""}},{"t":"MCQ","q":"In Kohlberg's theory, a child who obeys rules to avoid punishment is at which level?","o":["Pre-conventional","Conventional","Post-conventional","Formal"],"a":0,"e":"Pre-conventional morality is based on punishment and reward; conventional on social approval and law; post-conventional on universal principles.","n":"","te":{"q":"కోల్‌బర్గ్ సిద్ధాంతంలో శిక్ష తప్పించుకోవడానికి నియమాలు పాటించే బిడ్డ ఏ స్థాయిలో ఉంటాడు?","o":["పూర్వ సాంప్రదాయ","సాంప్రదాయ","ఉత్తర సాంప్రదాయ","ఔపచారిక"],"e":"పూర్వ సాంప్రదాయ నైతికత శిక్ష, ప్రతిఫలంపై; సాంప్రదాయ నైతికత సామాజిక ఆమోదం, చట్టంపై; ఉత్తర సాంప్రదాయం సార్వత్రిక సూత్రాలపై ఆధారపడుతుంది.","n":""}},{"t":"MCQ","q":"Kohlberg studied moral reasoning by presenting children with:","o":["Conservation tasks","Moral dilemmas such as the Heinz dilemma","Inkblot cards","Maze problems"],"a":1,"e":"Kohlberg analysed the reasons children gave for their answers to dilemmas like Heinz stealing a drug for his wife.","n":"","te":{"q":"కోల్‌బర్గ్ పిల్లల నైతిక తర్కాన్ని అధ్యయనం చేయడానికి ఏమి ఉపయోగించాడు?","o":["సంరక్షణ ప్రయోగాలు","హీంజ్ సందిగ్ధం వంటి నైతిక సందిగ్ధాలు","సిరా మచ్చ కార్డులు","చిక్కుదారి సమస్యలు"],"e":"భార్య కోసం మందు దొంగిలించిన హీంజ్ వంటి సందిగ్ధాలకు పిల్లలు ఇచ్చిన కారణాలను కోల్‌బర్గ్ విశ్లేషించాడు.","n":""}},{"t":"MCQ","q":"Heredity and environment in a child's development are best described as:","o":["Heredity alone decides","Interacting — both are important","Environment alone decides","Unrelated factors"],"a":1,"e":"Development results from the interaction of nature (heredity) and nurture (environment).","n":"","te":{"q":"బిడ్డ వికాసంలో అనువంశికత, పరిసరాల పాత్రను ఉత్తమంగా వివరించేది ఏది?","o":["అనువంశికత ఒక్కటే నిర్ణయిస్తుంది","పరస్పర ప్రభావం — రెండూ ముఖ్యమే","పరిసరాలు ఒక్కటే నిర్ణయిస్తాయి","సంబంధం లేని కారకాలు"],"e":"వికాసం ప్రకృతి (అనువంశికత), పోషణ (పరిసరాలు)ల పరస్పర చర్య ఫలితం.","n":""}},{"t":"MCQ","q":"Adolescence is often called a period of 'storm and stress'. Who used this phrase?","o":["Sigmund Freud","G. Stanley Hall","Jean Piaget","B. F. Skinner"],"a":1,"e":"G. Stanley Hall described adolescence as 'Sturm und Drang' (storm and stress) in 1904.","n":"","te":{"q":"కౌమారాన్ని 'తుఫాను, ఒత్తిడి' దశగా పేర్కొన్నది ఎవరు?","o":["సిగ్మండ్ ఫ్రాయిడ్","జి. స్టాన్లీ హాల్","జీన్ పియాజే","బి.ఎఫ్. స్కిన్నర్"],"e":"జి. స్టాన్లీ హాల్ 1904లో కౌమారాన్ని 'స్టర్మ్ ఉండ్ డ్రాంగ్' (తుఫాను, ఒత్తిడి) దశగా వర్ణించాడు.","n":""}},{"t":"MCQ","q":"Pavlov's experiment, in which a dog salivated at the sound of a bell, demonstrates:","o":["Observational learning","Operant conditioning","Insight learning","Classical conditioning"],"a":3,"e":"Pairing a neutral stimulus (bell) with an unconditioned stimulus (food) makes the bell a conditioned stimulus.","n":"","te":{"q":"గంట శబ్దానికి కుక్క లాలాజలం స్రవించిన పావ్‌లోవ్ ప్రయోగం దేనిని నిరూపిస్తుంది?","o":["పరిశీలనా అభ్యసనం","కార్యసాధక నిబంధనం","అంతర్దృష్టి అభ్యసనం","శాస్త్రీయ నిబంధనం"],"e":"తటస్థ ఉద్దీపన (గంట)ను సహజ ఉద్దీపన (ఆహారం)తో జతచేస్తే గంట నిబంధిత ఉద్దీపనగా మారుతుంది.","n":""}},{"t":"MCQ","q":"Skinner's operant conditioning says behaviour that is followed by reinforcement:","o":["Becomes reflexive","Disappears immediately","Is more likely to be repeated","Is not affected"],"a":2,"e":"Skinner (Skinner box with rats/pigeons) showed consequences shape behaviour; programmed instruction is based on his work.","n":"","te":{"q":"స్కిన్నర్ కార్యసాధక నిబంధనం ప్రకారం పునర్బలనం పొందిన ప్రవర్తన:","o":["ప్రతిచర్యగా మారుతుంది","వెంటనే మాయమవుతుంది","మళ్లీ జరిగే అవకాశం ఎక్కువ","ప్రభావితం కాదు"],"e":"స్కిన్నర్ (ఎలుకలు/పావురాలతో స్కిన్నర్ బాక్స్) పరిణామాలే ప్రవర్తనను రూపొందిస్తాయని చూపాడు; క్రమబద్ధ అభ్యసనం (ప్రోగ్రామ్డ్ ఇన్‌స్ట్రక్షన్) దీనిపై ఆధారపడింది.","n":""}},{"t":"MCQ","q":"Removing an unpleasant stimulus to increase a desired behaviour is called:","o":["Negative reinforcement","Punishment","Positive reinforcement","Extinction"],"a":0,"e":"Negative reinforcement strengthens behaviour by removing something unpleasant (e.g., cancelling extra homework when work is completed). It is not punishment.","n":"","te":{"q":"కోరుకున్న ప్రవర్తన పెరగడానికి అసహ్యకరమైన ఉద్దీపనను తొలగించడాన్ని ఏమంటారు?","o":["రుణాత్మక పునర్బలనం","శిక్ష","ధనాత్మక పునర్బలనం","విలోపనం"],"e":"రుణాత్మక పునర్బలనం అసహ్యకరమైనదాన్ని తొలగించి ప్రవర్తనను బలపరుస్తుంది (ఉదా: పని పూర్తి చేస్తే అదనపు హోంవర్క్ రద్దు). ఇది శిక్ష కాదు.","n":""}},{"t":"MCQ","q":"Thorndike's 'Law of Effect' states that:","o":["Practice alone makes perfect","Responses followed by satisfaction are strengthened","Learning needs readiness only","Insight comes suddenly"],"a":1,"e":"Thorndike (trial-and-error learning with a cat in a puzzle box) gave the laws of readiness, exercise and effect.","n":"","te":{"q":"థార్న్‌డైక్ 'ఫలిత నియమం' ఏమి చెబుతుంది?","o":["సాధన ఒక్కటే పరిపూర్ణత ఇస్తుంది","సంతృప్తి కలిగించిన ప్రతిస్పందనలు బలపడతాయి","అభ్యసనానికి సంసిద్ధత మాత్రమే చాలు","అంతర్దృష్టి హఠాత్తుగా వస్తుంది"],"e":"థార్న్‌డైక్ (పజిల్ బాక్స్‌లో పిల్లితో ప్రయత్న-దోష అభ్యసనం) సంసిద్ధత, అభ్యాస, ఫలిత నియమాలు ఇచ్చాడు.","n":""}},{"t":"MCQ","q":"Köhler's experiments with the chimpanzee Sultan joining sticks to reach bananas illustrate:","o":["Classical conditioning","Trial and error","Insight learning","Imitation"],"a":2,"e":"Gestalt psychologist Wolfgang Köhler showed sudden perception of relationships ('aha' experience) solves problems.","n":"","te":{"q":"అరటిపండ్లు అందుకోవడానికి కర్రలను జతచేసిన సుల్తాన్ చింపాంజీపై కోహ్లర్ ప్రయోగాలు దేనిని వివరిస్తాయి?","o":["శాస్త్రీయ నిబంధనం","ప్రయత్న-దోష అభ్యసనం","అంతర్దృష్టి అభ్యసనం","అనుకరణ"],"e":"గెస్టాల్ట్ మనోవిజ్ఞాని వోల్ఫ్‌గాంగ్ కోహ్లర్ సంబంధాలను హఠాత్తుగా గ్రహించడం ('ఆహా' అనుభవం) సమస్యను పరిష్కరిస్తుందని చూపాడు.","n":""}},{"t":"MCQ","q":"Bandura's Bobo doll experiment demonstrated:","o":["Classical conditioning","Observational (social) learning","Insight learning","Programmed learning"],"a":1,"e":"Children imitated aggressive behaviour they observed in adult models; attention, retention, reproduction and motivation are the key processes.","n":"","te":{"q":"బండూరా బోబో బొమ్మ ప్రయోగం దేనిని నిరూపించింది?","o":["శాస్త్రీయ నిబంధనం","పరిశీలనా (సామాజిక) అభ్యసనం","అంతర్దృష్టి అభ్యసనం","క్రమబద్ధ అభ్యసనం"],"e":"పెద్దల నమూనాలో చూసిన దూకుడు ప్రవర్తనను పిల్లలు అనుకరించారు; అవధానం, నిలుపుదల, పునరుత్పత్తి, ప్రేరణ కీలక ప్రక్రియలు.","n":""}},{"t":"MCQ","q":"Bruner's stages of representation are:","o":["Sensorimotor, Concrete, Formal","Enactive, Iconic, Symbolic","Oral, Anal, Phallic","Knowledge, Comprehension, Application"],"a":1,"e":"Bruner: learning moves from action (enactive) to images (iconic) to symbols and language (symbolic); he advocated discovery learning and the spiral curriculum.","n":"","te":{"q":"బ్రూనర్ ప్రాతినిధ్య దశలు ఏవి?","o":["సంవేదన చాలక, మూర్త, అమూర్త","కృత్యాత్మక, ప్రతిమాత్మక, సంకేతాత్మక","నోటి, మల, లైంగికాంగ","జ్ఞానం, అవగాహన, వినియోగం"],"e":"బ్రూనర్: అభ్యసనం చర్య (కృత్యాత్మక) నుండి చిత్రాలు (ప్రతిమాత్మక) నుండి సంకేతాలు, భాష (సంకేతాత్మక) వైపు సాగుతుంది; ఆవిష్కరణ అభ్యసనం, సర్పిలాకార పాఠ్యప్రణాళికను సమర్థించాడు.","n":""}},{"t":"MCQ","q":"Ausubel's 'advance organiser' is used to:","o":["Link new material to what learners already know","Punish late-comers","Test memory at the end","Arrange seating"],"a":0,"e":"Ausubel's meaningful reception learning uses an introductory framework (advance organiser) to anchor new information in existing cognitive structure.","n":"","te":{"q":"ఆసుబెల్ 'అడ్వాన్స్ ఆర్గనైజర్' (ముందస్తు నిర్వాహకం) దేనికి ఉపయోగిస్తారు?","o":["కొత్త విషయాన్ని అభ్యాసకులకు ఇప్పటికే తెలిసిన దానితో అనుసంధానించడానికి","ఆలస్యంగా వచ్చినవారిని శిక్షించడానికి","చివరలో జ్ఞాపకశక్తిని పరీక్షించడానికి","కూర్చునే ఏర్పాటుకు"],"e":"ఆసుబెల్ అర్థవంత స్వీకరణ అభ్యసనంలో కొత్త సమాచారాన్ని ఉన్న జ్ఞాన నిర్మాణంలో నిలపడానికి పరిచయ చట్రం (అడ్వాన్స్ ఆర్గనైజర్) వాడతారు.","n":""}},{"t":"MCQ","q":"Gagné's hierarchy places which type of learning at the highest level?","o":["Signal learning","Problem solving","Chaining","Concept learning"],"a":1,"e":"Gagné's eight types run from signal learning up to problem solving.","n":"","te":{"q":"గాగ్నే శ్రేణిలో అత్యున్నత స్థాయి అభ్యసనం ఏది?","o":["సంకేత అభ్యసనం","సమస్యా పరిష్కారం","శృంఖలనం","భావన అభ్యసనం"],"e":"గాగ్నే ఎనిమిది అభ్యసన రకాలు సంకేత అభ్యసనం నుండి సమస్యా పరిష్కారం వరకు ఉంటాయి.","n":""}},{"t":"MCQ","q":"When learning to ride a bicycle helps a child learn to ride a motorbike, it is:","o":["Zero transfer","Negative transfer","Positive transfer of learning","Retroactive inhibition"],"a":2,"e":"Positive transfer: earlier learning helps new learning. Negative transfer: it interferes (e.g., driving on the other side of the road).","n":"","te":{"q":"సైకిల్ తొక్కడం నేర్చుకోవడం మోటారు సైకిల్ నడపడం నేర్చుకోవడానికి సహాయపడితే అది:","o":["శూన్య బదలాయింపు","రుణాత్మక బదలాయింపు","ధనాత్మక అభ్యసన బదలాయింపు","పశ్చాత్ నిరోధం"],"e":"ధనాత్మక బదలాయింపు: పాత అభ్యసనం కొత్తదానికి సహాయపడుతుంది. రుణాత్మక బదలాయింపు: అడ్డుపడుతుంది.","n":""}},{"t":"MCQ","q":"Ebbinghaus's 'curve of forgetting' shows that forgetting is:","o":["Absent if learning is rote","Uniform over time","Slowest at the start","Fastest soon after learning, then slows down"],"a":3,"e":"Most forgetting happens shortly after learning; spaced revision reduces it.","n":"","te":{"q":"ఎబ్బింగ్‌హాస్ 'విస్మృతి వక్రరేఖ' ప్రకారం మరచిపోవడం:","o":["బట్టీ పడితే అసలు జరగదు","కాలంతో సమానంగా జరుగుతుంది","ప్రారంభంలో నెమ్మదిగా ఉంటుంది","నేర్చుకున్న వెంటనే వేగంగా జరిగి తర్వాత నెమ్మదిస్తుంది"],"e":"నేర్చుకున్న కొద్దిసేపటికే ఎక్కువ మరపు జరుగుతుంది; విరామాలతో పునశ్చరణ దానిని తగ్గిస్తుంది.","n":""}},{"t":"MCQ","q":"When newly learnt material interferes with the recall of previously learnt material, it is called:","o":["Proactive inhibition","Retroactive inhibition","Positive transfer","Reminiscence"],"a":1,"e":"Retroactive inhibition: new learning disrupts old memories. Proactive inhibition: old learning disrupts new.","n":"","te":{"q":"కొత్తగా నేర్చుకున్న విషయం గతంలో నేర్చుకున్నదాన్ని గుర్తుచేసుకోవడానికి అడ్డుపడితే దానిని ఏమంటారు?","o":["పూర్వ (ప్రోయాక్టివ్) నిరోధం","పశ్చాత్ (రెట్రోయాక్టివ్) నిరోధం","ధనాత్మక బదలాయింపు","స్మరణ వృద్ధి"],"e":"పశ్చాత్ నిరోధం: కొత్త అభ్యసనం పాత జ్ఞాపకాలను భంగపరుస్తుంది. పూర్వ నిరోధం: పాత అభ్యసనం కొత్తదానికి అడ్డుపడుతుంది.","n":""}},{"t":"MCQ","q":"A 'learning curve' that flattens for a while before rising again shows a:","o":["Trough","Peak","Plateau","Spike"],"a":2,"e":"A plateau is a temporary period of no progress, often due to fatigue, loss of interest or a shift to a higher skill level.","n":"","te":{"q":"కొంతకాలం సమతలంగా ఉండి తర్వాత మళ్లీ పెరిగే 'అభ్యసన వక్రరేఖ' దేనిని సూచిస్తుంది?","o":["లోయ","శిఖరం","పీఠభూమి (ప్లాటో)","ఆకస్మిక పెరుగుదల"],"e":"పీఠభూమి అనేది అలసట, ఆసక్తి తగ్గడం లేదా ఉన్నత నైపుణ్య స్థాయికి మారడం వల్ల తాత్కాలికంగా పురోగతి లేని కాలం.","n":""}},{"t":"MCQ","q":"Constructivism views the learner as:","o":["An active builder of knowledge from experience","A blank slate to be filled","A passive receiver of rewards","A product of heredity only"],"a":0,"e":"Constructivists (Piaget, Vygotsky, Bruner) see learners constructing meaning through activity, interaction and reflection.","n":"","te":{"q":"నిర్మాణాత్మకవాదం అభ్యాసకుడిని ఎలా చూస్తుంది?","o":["అనుభవం నుండి జ్ఞానాన్ని చురుకుగా నిర్మించుకునే వ్యక్తిగా","నింపవలసిన ఖాళీ పలకగా","ప్రతిఫలాల నిష్క్రియ స్వీకర్తగా","అనువంశికత ఉత్పత్తిగా మాత్రమే"],"e":"నిర్మాణాత్మకవాదులు (పియాజే, వైగోట్‌స్కీ, బ్రూనర్) అభ్యాసకులు కృత్యం, పరస్పర చర్య, ఆలోచన ద్వారా అర్థాన్ని నిర్మించుకుంటారని భావిస్తారు.","n":""}},{"t":"MCQ","q":"IQ is calculated (Terman's formula) as:","o":["Mental age × Chronological age","(Chronological age ÷ Mental age) × 100","Mental age − Chronologi
