ne; laissez-faire leaders avoid decisions.","n":"","te":{"q":"పాఠశాలలో ప్రజాస్వామ్య నాయకత్వ శైలి లక్షణం ఏమిటి?","o":["అసలు నిర్ణయాలే లేవు","అన్ని నిర్ణయాలు అధిపతి ఒక్కరే","సిబ్బంది, భాగస్వాములతో ఉమ్మడి నిర్ణయాలు","విద్యార్థులే నిర్ణయాలు"],"e":"ప్రజాస్వామ్య నాయకత్వం సిబ్బంది, తల్లిదండ్రులు, విద్యార్థులను సంప్రదిస్తుంది; నిరంకుశ నాయకుడు ఒంటరిగా నిర్ణయిస్తాడు; యథేచ్ఛ నాయకుడు నిర్ణయాలు తప్పించుకుంటాడు.","n":""}},{"t":"MCQ","q":"UDISE+ is a national system for:","o":["Teacher recruitment","Collecting school-level data on enrolment, teachers and infrastructure","Board examinations","Textbook printing"],"a":1,"e":"UDISE+ (Unified District Information System for Education Plus) collects annual data from every school.","n":"","te":{"q":"యూడైస్+ (UDISE+) ఏ జాతీయ వ్యవస్థ?","o":["ఉపాధ్యాయ నియామకం","నమోదు, ఉపాధ్యాయులు, మౌలిక వసతులపై పాఠశాల స్థాయి డేటా సేకరణ","బోర్డు పరీక్షలు","పాఠ్యపుస్తకాల ముద్రణ"],"e":"యూడైస్+ (విద్యకు ఏకీకృత జిల్లా సమాచార వ్యవస్థ ప్లస్) ప్రతి పాఠశాల నుండి వార్షిక డేటా సేకరిస్తుంది.","n":""}},{"t":"MCQ","q":"A 'school complex', recommended by the Kothari Commission and revived by NEP 2020, is:","o":["A hostel","A single large building","A private school chain","A cluster of nearby schools sharing resources and support"],"a":3,"e":"NEP 2020 recommends school complexes/clusters around a secondary school to share teachers, libraries, labs and training.","n":"","te":{"q":"కొఠారి కమిషన్ సిఫారసు చేసి, ఎన్‌ఈపీ 2020 పునరుద్ధరించిన 'పాఠశాల సముదాయం' (స్కూల్ కాంప్లెక్స్) అంటే ఏమిటి?","o":["వసతి గృహం","ఒకే పెద్ద భవనం","ప్రైవేట్ పాఠశాలల గొలుసు","వనరులు, సహాయం పంచుకునే సమీప పాఠశాలల సమూహం"],"e":"ఎన్‌ఈపీ 2020 ఒక సెకండరీ పాఠశాల చుట్టూ ఉపాధ్యాయులు, గ్రంథాలయాలు, ప్రయోగశాలలు, శిక్షణ పంచుకునే పాఠశాల సముదాయాలను సిఫారసు చేసింది.","n":""}},{"t":"MCQ","q":"Which record shows the daily attendance of students?","o":["Stock register","Attendance register","Cash book","Service register"],"a":1,"e":"The attendance register records daily attendance; the stock register records materials; the service register records staff service details.","n":"","te":{"q":"విద్యార్థుల రోజువారీ హాజరును చూపే రికార్డు ఏది?","o":["స్టాక్ రిజిస్టరు","హాజరు రిజిస్టరు","నగదు పుస్తకం","సర్వీసు రిజిస్టరు"],"e":"హాజరు రిజిస్టరులో రోజువారీ హాజరు; స్టాక్ రిజిస్టరులో సామగ్రి; సర్వీసు రిజిస్టరులో సిబ్బంది సేవా వివరాలు ఉంటాయి.","n":""}},{"t":"MCQ","q":"Supervision that helps teachers improve rather than finding faults is called:","o":["Audit","Inspection","Punitive supervision","Clinical / developmental supervision"],"a":3,"e":"Clinical supervision (Goldhammer, Cogan) follows a cycle of pre-observation conference, observation, analysis and feedback.","n":"","te":{"q":"తప్పులు వెతకడం కాకుండా ఉపాధ్యాయులు మెరుగుపడటానికి సహాయపడే పర్యవేక్షణను ఏమంటారు?","o":["ఆడిట్","తనిఖీ","శిక్షాత్మక పర్యవేక్షణ","క్లినికల్ / అభివృద్ధి పర్యవేక్షణ"],"e":"క్లినికల్ పర్యవేక్షణ (గోల్డ్‌హామర్, కోగన్) పరిశీలనకు ముందు సమావేశం, పరిశీలన, విశ్లేషణ, ఫీడ్‌బ్యాక్ చక్రాన్ని అనుసరిస్తుంది.","n":""}},{"t":"MCQ","q":"A SWOT analysis of a school examines its:","o":["Students, Workers, Officers and Teachers","Strengths, Weaknesses, Opportunities and Threats","Syllabus, Work, Output and Time","Staff, Wages, Office and Timetable"],"a":1,"e":"SWOT helps in planning school development by analysing internal and external factors.","n":"","te":{"q":"పాఠశాల 'స్వాట్' (SWOT) విశ్లేషణ దేనిని పరిశీలిస్తుంది?","o":["విద్యార్థులు, కార్మికులు, అధికారులు, ఉపాధ్యాయులు","బలాలు, బలహీనతలు, అవకాశాలు, ముప్పులు","సిలబస్, పని, ఫలితం, సమయం","సిబ్బంది, వేతనాలు, కార్యాలయం, కాలపట్టిక"],"e":"స్వాట్ అంతర్గత, బాహ్య అంశాలను విశ్లేషించి పాఠశాల అభివృద్ధి ప్రణాళికకు సహాయపడుతుంది.","n":""}},{"t":"MCQ","q":"The best way for a principal to handle a conflict between two teachers is:","o":["Punish both immediately","Listen to both, focus on the issue, and find a fair solution together","Ignore it","Take sides with the senior teacher"],"a":1,"e":"Collaborative problem-solving preserves relationships and addresses the real issue.","n":"","te":{"q":"ఇద్దరు ఉపాధ్యాయుల మధ్య విభేదాన్ని ప్రిన్సిపాల్ పరిష్కరించడానికి ఉత్తమ మార్గం ఏది?","o":["ఇద్దరినీ వెంటనే శిక్షించడం","ఇద్దరి మాటా విని, సమస్యపై దృష్టి పెట్టి, కలిసి న్యాయమైన పరిష్కారం కనుగొనడం","పట్టించుకోకపోవడం","సీనియర్ ఉపాధ్యాయుని పక్షం వహించడం"],"e":"సహకార సమస్యా పరిష్కారం సంబంధాలను కాపాడి అసలు సమస్యను పరిష్కరిస్తుంది.","n":""}},{"t":"MCQ","q":"A school timetable should give the most demanding subjects:","o":["Only after lunch","The last period of the day","Early periods when pupils are fresh","Saturday only"],"a":2,"e":"Fatigue rises through the day; difficult subjects are usually scheduled in the morning.","n":"","te":{"q":"పాఠశాల కాలపట్టికలో ఎక్కువ శ్రమ కోరే విషయాలకు ఏ సమయం ఇవ్వాలి?","o":["భోజనం తర్వాత మాత్రమే","రోజు చివరి పీరియడ్","విద్యార్థులు ఉల్లాసంగా ఉండే తొలి పీరియడ్లు","శనివారం మాత్రమే"],"e":"రోజు గడిచే కొద్దీ అలసట పెరుగుతుంది; కష్టమైన విషయాలు సాధారణంగా ఉదయం ఉంటాయి.","n":""}},{"t":"MCQ","q":"School safety and disaster-management planning should include:","o":["Mock drills, evacuation plans and trained staff","Locking all exits","Only insurance","Only a notice on the board"],"a":0,"e":"NDMA school safety guidelines call for school disaster management plans, regular drills and trained committees.","n":"","te":{"q":"పాఠశాల భద్రత, విపత్తు నిర్వహణ ప్రణాళికలో ఏమి ఉండాలి?","o":["మాక్ డ్రిల్స్, ఖాళీ చేయించే ప్రణాళికలు, శిక్షణ పొందిన సిబ్బంది","అన్ని ద్వారాలు మూసివేయడం","బీమా మాత్రమే","బోర్డుపై నోటీసు మాత్రమే"],"e":"ఎన్‌డీఎంఏ పాఠశాల భద్రతా మార్గదర్శకాలు విపత్తు నిర్వహణ ప్రణాళిక, తరచూ డ్రిల్స్, శిక్షణ పొందిన కమిటీలను సూచిస్తాయి.","n":""}},{"t":"MCQ","q":"Community participation in school improvement is best ensured through:","o":["Only annual day functions","Active SMC and parent–teacher meetings","Collecting donations only","Keeping parents away"],"a":1,"e":"Regular SMC and PTM meetings involve parents in planning, monitoring and support.","n":"","te":{"q":"పాఠశాల అభివృద్ధిలో సమాజ భాగస్వామ్యం ఉత్తమంగా ఎలా నిర్ధారించవచ్చు?","o":["వార్షికోత్సవాలు మాత్రమే","చురుకైన ఎస్‌ఎంసీ, తల్లిదండ్రులు–ఉపాధ్యాయుల సమావేశాలు","విరాళాల సేకరణ మాత్రమే","తల్లిదండ్రులను దూరంగా ఉంచడం"],"e":"క్రమం తప్పని ఎస్‌ఎంసీ, పీటీఎం సమావేశాలు తల్లిదండ్రులను ప్రణాళిక, పర్యవేక్షణ, సహాయంలో భాగస్వాములను చేస్తాయి.","n":""}},{"t":"MCQ","q":"'Total Quality Management' in a school focuses on:","o":["Cutting all costs","Inspection at year end only","Continuous improvement involving everyone","Punishing mistakes"],"a":2,"e":"TQM (Deming) stresses continuous improvement, stakeholder focus and teamwork.","n":"","te":{"q":"పాఠశాలలో 'సంపూర్ణ నాణ్యతా నిర్వహణ' (టీక్యూఎం) దేనిపై దృష్టి పెడుతుంది?","o":["అన్ని ఖర్చుల కోత","సంవత్సరాంత తనిఖీ మాత్రమే","అందరి భాగస్వామ్యంతో నిరంతర మెరుగుదల","తప్పులకు శిక్ష"],"e":"టీక్యూఎం (డెమింగ్) నిరంతర మెరుగుదల, భాగస్వాములపై దృష్టి, జట్టు కృషిని నొక్కి చెబుతుంది.","n":""}},{"t":"MCQ","q":"Which body grants recognition to teacher-education institutions in India?","o":["NCTE","NCERT","CBSE","NIOS"],"a":0,"e":"NCTE regulates and recognises teacher-education programmes such as D.El.Ed and B.Ed.","n":"","te":{"q":"భారతదేశంలో ఉపాధ్యాయ విద్యా సంస్థలకు గుర్తింపు ఇచ్చే సంస్థ ఏది?","o":["ఎన్‌సీటీఈ","ఎన్‌సీఈఆర్టీ","సీబీఎస్‌ఈ","ఎన్‌ఐఓఎస్"],"e":"ఎన్‌సీటీఈ డీ.ఎల్.ఎడ్, బీ.ఎడ్ వంటి ఉపాధ్యాయ విద్యా కార్యక్రమాలను నియంత్రించి గుర్తింపు ఇస్తుంది.","n":""}},{"t":"MCQ","q":"Budgeting in a school should be:","o":["Secret and decided by one person","Need-based, transparent and approved through the SMC","Spent only at year end","Unrelated to the development plan"],"a":1,"e":"Composite school grants are planned with the SMC and recorded transparently.","n":"","te":{"q":"పాఠశాలలో బడ్జెట్ ఎలా ఉండాలి?","o":["రహస్యంగా, ఒక్కరి నిర్ణయంతో","అవసరం ఆధారంగా, పారదర్శకంగా, ఎస్‌ఎంసీ ఆమోదంతో","సంవత్సరాంతంలోనే ఖర్చు","అభివృద్ధి ప్రణాళికతో సంబంధం లేకుండా"],"e":"సమగ్ర పాఠశాల గ్రాంట్లను ఎస్‌ఎంసీతో ప్రణాళిక చేసి పారదర్శకంగా నమోదు చేస్తారు.","n":""}},{"t":"MCQ","q":"The Right of Children to Free and Compulsory Education Act was passed in 2009 and came into force on:","o":["15 August 2009","26 January 2010","1 April 2010","1 June 2011"],"a":2,"e":"The RTE Act, 2009 came into force on 1 April 2010; it covers children aged 6–14 (Article 21A).","n":"","te":{"q":"ఉచిత, నిర్బంధ విద్యాహక్కు చట్టం 2009లో ఆమోదం పొంది ఏ తేదీ నుండి అమలులోకి వచ్చింది?","o":["15 ఆగస్టు 2009","26 జనవరి 2010","1 ఏప్రిల్ 2010","1 జూన్ 2011"],"e":"ఆర్టీఈ చట్టం 2009, 1 ఏప్రిల్ 2010 నుండి అమలులోకి వచ్చింది; ఇది 6–14 ఏళ్ల పిల్లలకు వర్తిస్తుంది (అధికరణ 21A).","n":""}},{"t":"MCQ","q":"Under the RTE Act, the pupil–teacher ratio to be maintained at the primary level is:","o":["30 : 1","40 : 1","45 : 1","25 : 1"],"a":0,"e":"RTE Schedule: 30:1 at the primary level and 35:1 at the upper-primary level.","n":"","te":{"q":"ఆర్టీఈ చట్టం ప్రకారం ప్రాథమిక స్థాయిలో పాటించాల్సిన విద్యార్థి–ఉపాధ్యాయ నిష్పత్తి:","o":["30 : 1","40 : 1","45 : 1","25 : 1"],"e":"ఆర్టీఈ షెడ్యూల్: ప్రాథమిక స్థాయిలో 30:1, ప్రాథమికోన్నత స్థాయిలో 35:1.","n":""}},{"t":"MCQ","q":"Section 12(1)(c) of the RTE Act requires private unaided schools to reserve what share of entry-level seats for disadvantaged children?","o":["15%","10%","25%","50%"],"a":2,"e":"Private unaided schools must admit at least 25% of the entry class from weaker and disadvantaged groups.","n":"","te":{"q":"ఆర్టీఈ చట్టం సెక్షన్ 12(1)(సి) ప్రకారం ప్రైవేట్ అన్‌ఎయిడెడ్ పాఠశాలలు ప్రవేశ తరగతిలో బలహీన వర్గాల పిల్లలకు ఎంత శాతం సీట్లు కేటాయించాలి?","o":["15%","10%","25%","50%"],"e":"ప్రైవేట్ అన్‌ఎయిడెడ్ పాఠశాలలు ప్రవేశ తరగతిలో కనీసం 25% బలహీన, వెనుకబడిన వర్గాల పిల్లలను చేర్చుకోవాలి.","n":""}},{"t":"MCQ","q":"Which section of the RTE Act prohibits physical punishment and mental harassment of children?","o":["Section 17","Section 12","Section 21","Section 29"],"a":0,"e":"Section 17 bans physical punishment and mental harassment; Section 21 deals with SMCs; Section 29 with curriculum and evaluation.","n":"","te":{"q":"పిల్లలకు శారీరక శిక్ష, మానసిక వేధింపులను నిషేధించే ఆర్టీఈ చట్టం సెక్షన్ ఏది?","o":["సెక్షన్ 17","సెక్షన్ 12","సెక్షన్ 21","సెక్షన్ 29"],"e":"సెక్షన్ 17 శారీరక శిక్ష, మానసిక వేధింపులను నిషేధిస్తుంది; సెక్షన్ 21 పాఠశాల యాజమాన్య కమిటీలు; సెక్షన్ 29 పాఠ్యప్రణాళిక, మూల్యాంకనం.","n":""}},{"t":"MCQ","q":"Under the RTE Act, at least what proportion of School Management Committee members must be parents or guardians?","o":["One-third","One-half","Three-fourths (75%)","All members"],"a":2,"e":"Section 21: at least 75% of SMC members are parents/guardians, with proportionate representation for disadvantaged groups and 50% women.","n":"","te":{"q":"ఆర్టీఈ ప్రకారం పాఠశాల యాజమాన్య కమిటీ సభ్యుల్లో కనీసం ఎంత భాగం తల్లిదండ్రులు/సంరక్షకులు ఉండాలి?","o":["మూడో వంతు","సగం","మూడొంతులు (75%)","అందరూ"],"e":"సెక్షన్ 21: ఎస్ఎంసీ సభ్యుల్లో కనీసం 75% తల్లిదండ్రులు/సంరక్షకులు; అందులో 50% మహిళలు ఉండాలి.","n":""}},{"t":"MCQ","q":"The School Development Plan prepared by the SMC under the RTE Model Rules is a:","o":["One-month plan","Three-year plan made up of three annual sub-plans","Ten-year plan","Plan prepared only by the district officer"],"a":1,"e":"The SDP is a three-year plan with annual sub-plans, covering enrolment, teachers, infrastructure and finances.","n":"","te":{"q":"ఆర్టీఈ నమూనా నియమాల ప్రకారం ఎస్ఎంసీ తయారుచేసే పాఠశాల అభివృద్ధి ప్రణాళిక:","o":["ఒక నెల ప్రణాళిక","మూడు వార్షిక ఉపప్రణాళికలతో కూడిన మూడేళ్ల ప్రణాళిక","పదేళ్ల ప్రణాళిక","జిల్లా అధికారి మాత్రమే తయారుచేసే ప్రణాళిక"],"e":"ఎస్‌డీపీ మూడేళ్ల ప్రణాళిక; ఇందులో నమోదు, ఉపాధ్యాయులు, మౌలిక వసతులు, నిధుల వివరాలు ఉంటాయి.","n":""}},{"t":"MCQ","q":"NEP 2020 replaces the 10+2 structure with a pedagogical structure of:","o":["5+5+2","4+4+4","6+3+3","5+3+3+4"],"a":3,"e":"Foundational (ages 3–8), Preparatory (8–11), Middle (11–14) and Secondary (14–18).","n":"","te":{"q":"జాతీయ విద్యా విధానం 2020, 10+2 వ్యవస్థ స్థానంలో ఏ నిర్మాణాన్ని ప్రతిపాదించింది?","o":["5+5+2","4+4+4","6+3+3","5+3+3+4"],"e":"పునాది (3–8 ఏళ్లు), సన్నాహక (8–11), మధ్య (11–14), సెకండరీ (14–18) దశలు.","n":""}},{"t":"MCQ","q":"Samagra Shiksha, launched in 2018, merged which schemes?","o":["Navodaya and Kendriya Vidyalayas","Mid-Day Meal and ICDS","NSS and NCC","SSA, RMSA and Teacher Education"],"a":3,"e":"Samagra Shiksha is an integrated scheme for school education from pre-school to Class 12.","n":"","te":{"q":"2018లో ప్రారంభమైన సమగ్ర శిక్ష ఏ పథకాలను విలీనం చేసింది?","o":["నవోదయ, కేంద్రీయ విద్యాలయాలు","మధ్యాహ్న భోజనం, ఐసీడీఎస్","ఎన్ఎస్ఎస్, ఎన్‌సీసీ","ఎస్ఎస్ఏ, ఆర్ఎంఎస్ఏ, ఉపాధ్యాయ విద్య"],"e":"సమగ్ర శిక్ష పూర్వ ప్రాథమిక నుండి 12వ తరగతి వరకు పాఠశాల విద్యకు సమగ్ర పథకం.","n":""}},{"t":"MCQ","q":"The Mid-Day Meal Scheme was renamed in 2021 as:","o":["Akshaya Patra","Poshan Abhiyaan","Annapurna","PM POSHAN"],"a":3,"e":"PM POSHAN (Pradhan Mantri Poshan Shakti Nirman) provides hot cooked meals in government and aided schools.","n":"","te":{"q":"మధ్యాహ్న భోజన పథకానికి 2021లో పెట్టిన కొత్త పేరు:","o":["అక్షయ పాత్ర","పోషణ్ అభియాన్","అన్నపూర్ణ","పీఎం పోషణ్"],"e":"పీఎం పోషణ్ ప్రభుత్వ, ఎయిడెడ్ పాఠశాలల్లో వేడి వండిన భోజనం అందిస్తుంది.","n":""}},{"t":"MCQ","q":"NISHTHA is a national programme for:","o":["Free bicycles for girls","Integrated in-service training of school heads and teachers","Scholarships for college students","Building school toilets"],"a":1,"e":"NISHTHA = National Initiative for School Heads' and Teachers' Holistic Advancement (2019).","n":"","te":{"q":"నిష్ఠ (NISHTHA) దేనికి సంబంధించిన జాతీయ కార్యక్రమం?","o":["బాలికలకు ఉచిత సైకిళ్లు","ప్రధానోపాధ్యాయులు, ఉపాధ్యాయులకు సమగ్ర వృత్తి శిక్షణ","కళాశాల విద్యార్థులకు ఉపకారవేతనాలు","పాఠశాల మరుగుదొడ్ల నిర్మాణం"],"e":"నిష్ఠ = పాఠశాల అధిపతులు, ఉపాధ్యాయుల సమగ్ర అభివృద్ధికి జాతీయ కార్యక్రమం (2019).","n":""}},{"t":"MCQ","q":"DIKSHA is:","o":["A school inspection report","A teacher recruitment test","A board examination","A national digital platform of e-content for teachers and students"],"a":3,"e":"DIKSHA (Digital Infrastructure for Knowledge Sharing) hosts QR-coded textbook content and teacher courses.","n":"","te":{"q":"దీక్ష (DIKSHA) అంటే:","o":["పాఠశాల తనిఖీ నివేదిక","ఉపాధ్యాయ నియామక పరీక్ష","బోర్డు పరీక్ష","ఉపాధ్యాయులు, విద్యార్థుల కోసం జాతీయ డిజిటల్ ఈ-కంటెంట్ వేదిక"],"e":"దీక్ష పాఠ్యపుస్తకాల్లోని క్యూఆర్ కోడ్ కంటెంట్, ఉపాధ్యాయ కోర్సులను అందిస్తుంది.","n":""}},{"t":"MCQ","q":"PARAKH, set up under NEP 2020, is a:","o":["Scholarship scheme","Teacher transfer portal","Sports authority","National assessment centre that sets norms for student assessment"],"a":3,"e":"PARAKH = Performance Assessment, Review, and Analysis of Knowledge for Holistic Development, under NCERT.","n":"","te":{"q":"జాతీయ విద్యా విధానం 2020 కింద ఏర్పాటైన పరఖ్ (PARAKH):","o":["ఉపకారవేతన పథకం","ఉపాధ్యాయ బదిలీల పోర్టల్","క్రీడా ప్రాధికార సంస్థ","విద్యార్థుల మూల్యాంకన ప్రమాణాలు నిర్ణయించే జాతీయ మూల్యాంకన కేంద్రం"],"e":"పరఖ్ ఎన్‌సీఈఆర్‌టీ ఆధ్వర్యంలోని జాతీయ మూల్యాంకన కేంద్రం.","n":""}},{"t":"MCQ","q":"The acronym POSDCORB, describing the functions of an administrator, was given by:","o":["F. W. Taylor","Henri Fayol","Luther Gulick","Max Weber"],"a":2,"e":"Gulick (1937): Planning, Organising, Staffing, Directing, Co-ordinating, Reporting, Budgeting.","n":"","te":{"q":"పరిపాలకుడి విధులను సూచించే POSDCORB అనే సంక్షిప్త పదాన్ని ఇచ్చినవారు:","o":["ఎఫ్. డబ్ల్యూ. టేలర్","హెన్రీ ఫెయోల్","లూథర్ గ్యూలిక్","మాక్స్ వెబర్"],"e":"గ్యూలిక్ (1937): ప్రణాళిక, వ్యవస్థీకరణ, సిబ్బంది నియామకం, నిర్దేశం, సమన్వయం, నివేదన, బడ్జెట్.","n":""}},{"t":"MCQ","q":"A 'laissez-faire' leadership style in a school means the head:","o":["Leaves almost all decisions to the staff and gives little direction","Takes every decision alone","Consults staff and decides together","Follows only written rules"],"a":0,"e":"Laissez-faire = minimal interference; autocratic = head decides alone; democratic = shared decisions.","n":"","te":{"q":"పాఠశాలలో 'లేసే-ఫెయిర్' నాయకత్వ శైలి అంటే అధిపతి:","o":["దాదాపు అన్ని నిర్ణయాలను సిబ్బందికే వదిలేసి తక్కువ మార్గదర్శనం ఇస్తారు","ప్రతి నిర్ణయాన్ని ఒంటరిగా తీసుకుంటారు","సిబ్బందిని సంప్రదించి కలిసి నిర్ణయిస్తారు","లిఖిత నియమాలనే పాటిస్తారు"],"e":"లేసే-ఫెయిర్ = అతి తక్కువ జోక్యం; నిరంకుశ = అధిపతి ఒక్కరే నిర్ణయం; ప్రజాస్వామ్య = కలిసి నిర్ణయం.","n":""}},{"t":"MCQ","q":"In Herzberg's two-factor theory, salary, job security and working conditions are:","o":["Hygiene factors that prevent dissatisfaction","Motivators that create satisfaction","Unrelated to work","Self-actualisation needs"],"a":0,"e":"Motivators are achievement, recognition, responsibility and growth; hygiene factors only prevent dissatisfaction.","n":"","te":{"q":"హెర్జ్‌బర్గ్ ద్వికారక సిద్ధాంతంలో జీతం, ఉద్యోగ భద్రత, పని పరిస్థితులు:","o":["అసంతృప్తిని నివారించే పరిశుభ్రత (హైజీన్) కారకాలు","సంతృప్తి కలిగించే ప్రేరకాలు","పనితో సంబంధం లేనివి","ఆత్మసాక్షాత్కార అవసరాలు"],"e":"ప్రేరకాలు: సాధన, గుర్తింపు, బాధ్యత, ఎదుగుదల; హైజీన్ కారకాలు అసంతృప్తిని మాత్రమే నివారిస్తాయి.","n":""}}]},"eng":{"id":"eng","title":["English Language Proficiency","ఇంగ్లీషు భాషా సామర్థ్యం"],"desc":["Grammar, vocabulary, usage and literature for TGT/PGT Paper 1 and SA English content.","టీజీటీ/పీజీటీ పేపర్ 1, ఎస్ఏ ఇంగ్లీషు విషయ భాగం కోసం వ్యాకరణం, పదజాలం, వాడుక, సాహిత్యం."],"qs":[{"t":"MCQ","q":"Choose the correct sentence.","o":["He lives here since 2015.","He is living here since 2015.","He has been living here since 2015.","He has been living here for 2015."],"a":2,"e":"Present perfect continuous with 'since' + point of time.","n":""},{"t":"MCQ","q":"Choose the correct form: 'If I ____ a bird, I would fly.'","o":["will be","was being","am","were"],"a":3,"e":"Second conditional uses the subjunctive 'were' for all persons.","n":""},{"t":"MCQ","q":"Fill in the blank: 'She is good ____ mathematics.'","o":["with","in","on","at"],"a":3,"e":"'Good at' is the correct collocation.","n":""},{"t":"MCQ","q":"The passive voice of 'They are building a bridge' is:","o":["A bridge is being built by them.","A bridge was built by them.","A bridge has been built by them.","A bridge is built by them."],"a":0,"e":"Present continuous passive: is/are + being + past participle.","n":""},{"t":"MCQ","q":"Change into reported speech: He said, 'I am tired.'","o":["He said that he was tired.","He said that I am tired.","He says that he is tired.","He said that he is being tired."],"a":0,"e":"Present changes to past and 'I' to 'he' in reported speech after a past reporting verb.","n":""},{"t":"MCQ","q":"Choose the synonym of 'benevolent'.","o":["Kind","Cruel","Lazy","Proud"],"a":0,"e":"Benevolent = well-meaning, kind.","n":""},{"t":"MCQ","q":"Choose the antonym of 'scarce'.","o":["Little","Rare","Plentiful","Short"],"a":2,"e":"Scarce = insufficient; antonym: plentiful/abundant.","n":""},{"t":"MCQ","q":"Which is correctly spelt?","o":["Acommodation","Accomodation","Accommodation","Accommadation"],"a":2,"e":"Accommodation has double 'c' and double 'm'.","n":""},{"t":"MCQ","q":"'To bury the hatchet' means:","o":["To hide a weapon","To make peace","To start a fight","To dig a hole"],"a":1,"e":"The idiom means to end a quarrel.","n":""},{"t":"MCQ","q":"Choose the correct article: 'He is ____ honest man.'","o":["the","a","an","no article"],"a":2,"e":"'Honest' begins with a vowel sound (silent h), so 'an'.","n":""},{"t":"MCQ","q":"Identify the part of speech of the underlined word: 'She sings *beautifully*.'","o":["Noun","Adjective","Adverb","Verb"],"a":2,"e":"'Beautifully' modifies the verb 'sings', so it is an adverb.","n":""},{"t":"MCQ","q":"Choose the correct question tag: 'You are coming tomorrow, ____?'","o":["won't you","isn't it","don't you","aren't you"],"a":3,"e":"A positive statement with 'are' takes the negative tag 'aren't you'.","n":""},{"t":"MCQ","q":"Fill in: 'Neither the teacher nor the students ____ present.'","o":["was","were","is","has"],"a":1,"e":"With 'neither…nor', the verb agrees with the nearer subject (students → were).","n":""},{"t":"MCQ","q":"Choose the correct preposition: 'The book is ____ the table.'","o":["at","on","in","over"],"a":1,"e":"'On' is used for a surface.","n":""},{"t":"MCQ","q":"One-word substitute for 'a person who knows many languages':","o":["Linguist only of one language","Bibliophile","Philanthropist","Polyglot"],"a":3,"e":"Polyglot = one who knows several languages; bibliophile = book lover.","n":""},{"t":"MCQ","q":"Choose the correctly punctuated sentence.","o":["Ravi my friend, is a doctor.","Ravi, my friend, is a doctor.","Ravi, my friend is a doctor","Ravi my friend is, a doctor."],"a":1,"e":"A non-defining appositive is set off by commas on both sides.","n":""},{"t":"MCQ","q":"Choose the correct degree: 'This is the ____ building in the city.'","o":["most tall","taller","tall","tallest"],"a":3,"e":"Superlative degree with 'the' for comparison among many.","n":""},{"t":"MCQ","q":"Combine using a relative pronoun: 'This is the boy. He won the prize.'","o":["This is the boy which won the prize.","This is the boy who won the prize.","This is the boy whom won the prize.","This is the boy whose won the prize."],"a":1,"e":"'Who' is used for persons as subject.","n":""},{"t":"MCQ","q":"Choose the correct tense: 'By next March, she ____ her course.'","o":["has completed","will complete","completes","will have completed"],"a":3,"e":"Future perfect for an action completed before a future time.","n":""},{"t":"MCQ","q":"What is the plural of 'criterion'?","o":["Criteria","Criterions","Criterias","Criterion"],"a":0,"e":"Criterion (singular) → criteria (plural).","n":""},{"t":"MCQ","q":"'A Letter to God' was written by:","o":["G. L. Fuentes","Ruskin Bond","O. Henry","Anton Chekhov"],"a":0,"e":"Gregorio López y Fuentes wrote 'A Letter to God' (Class 10 First Flight).","n":""},{"t":"MCQ","q":"'The Road Not Taken' and 'Dust of Snow' are poems by:","o":["Robert Frost","William Wordsworth","W. B. Yeats","John Keats"],"a":0,"e":"Robert Frost wrote both; they appear in NCERT/AP Class 9 and 10 readers.","n":""},{"t":"MCQ","q":"Identify the figure of speech: 'The wind whispered through the trees.'","o":["Simile","Personification","Metaphor","Hyperbole"],"a":1,"e":"Giving human qualities (whispering) to a non-human thing is personification.","n":""},{"t":"MCQ","q":"'As brave as a lion' is an example of:","o":["Alliteration","Metaphor","Simile","Irony"],"a":2,"e":"A simile compares using 'as' or 'like'.","n":""},{"t":"MCQ","q":"Choose the correct modal: 'You ____ wear a helmet while riding. It's the law.'","o":["could","might","must","would"],"a":2,"e":"'Must' expresses obligation.","n":""},{"t":"MCQ","q":"Which sentence is in the present perfect tense?","o":["I finished my work.","I have finished my work.","I had finished my work.","I am finishing my work."],"a":1,"e":"Have/has + past participle.","n":""},{"t":"MCQ","q":"The word 'unhappiness' has how many morphemes?","o":["Four","Two","One","Three (un-happy-ness)"],"a":3,"e":"un- (prefix) + happy (root) + -ness (suffix).","n":""},{"t":"MCQ","q":"Choose the correctly ordered adjectives.","o":["a wooden old beautiful table","a beautiful old wooden table","an old wooden beautiful table","a beautiful wooden old table"],"a":1,"e":"Order: opinion – age – material.","n":""},{"t":"MCQ","q":"Fill in: 'He prefers tea ____ coffee.'","o":["than","to","over","from"],"a":1,"e":"'Prefer X to Y'.","n":""},{"t":"MCQ","q":"Select the word with the silent 'k'.","o":["Knife","Kite","Kettle","Kind"],"a":0,"e":"In 'knife' the initial 'k' is silent.","n":""}]},"gk":{"id":"gk","title":["General Knowledge & Current Affairs","జనరల్ నాలెడ్జ్ & కరెంట్ అఫైర్స్"],"desc":["Andhra Pradesh and India GK with current affairs to October 2026.","ఆంధ్రప్రదేశ్, భారత జీకే, అక్టోబర్ 2026 వరకు కరెంట్ అఫైర్స్."],"qs":[{"t":"MCQ","q":"Who won the ICC Men's T20 World Cup 2026, held in India and Sri Lanka?","o":["India","New Zealand","Australia","South Africa"],"a":0,"e":"India beat New Zealand by 96 runs in the final at Ahmedabad on 8 March 2026, winning its third T20 World Cup title (after 2007 and 2024).","n":"India's T20 WC titles: 2007, 2024, 2026.","te":{"q":"భారత్, శ్రీలంకలో జరిగిన ఐసీసీ పురుషుల టీ20 ప్రపంచ కప్ 2026 విజేత ఎవరు?","o":["భారత్","న్యూజిలాండ్","ఆస్ట్రేలియా","దక్షిణాఫ్రికా"],"e":"8 మార్చి 2026న అహ్మదాబాద్‌లో జరిగిన ఫైనల్‌లో భారత్ న్యూజిలాండ్‌ను 96 పరుగుల తేడాతో ఓడించి మూడో టీ20 ప్రపంచ కప్ (2007, 2024 తర్వాత) గెలిచింది.","n":"భారత్ టీ20 ప్రపంచ కప్‌లు: 2007, 2024, 2026."}},{"t":"MCQ","q":"Which country won the FIFA World Cup 2026, defeating Argentina in the final?","o":["Spain","France","Brazil","England"],"a":0,"e":"Spain beat Argentina 1–0 after extra time at MetLife Stadium, New Jersey, on 19 July 2026 — Spain's second title after 2010.","n":"FIFA WC 2026 was hosted jointly by the USA, Canada and Mexico with 48 teams.","te":{"q":"ఫైనల్‌లో అర్జెంటీనాను ఓడించి ఫిఫా ప్రపంచ కప్ 2026 గెలిచిన దేశం ఏది?","o":["స్పెయిన్","ఫ్రాన్స్","బ్రెజిల్","ఇంగ్లాండ్"],"e":"19 జూలై 2026న న్యూజెర్సీలోని మెట్‌లైఫ్ స్టేడియంలో స్పెయిన్ అదనపు సమయంలో అర్జెంటీనాపై 1–0తో గెలిచింది — 2010 తర్వాత స్పెయిన్‌కు ఇది రెండో టైటిల్.","n":"ఫిఫా 2026ను అమెరికా, కెనడా, మెక్సికో సంయుక్తంగా 48 జట్లతో నిర్వహించాయి."}},{"t":"MCQ","q":"The 2026 Asian Games were held in which country?","o":["South Korea (Incheon)","China (Hangzhou)","Japan (Aichi–Nagoya)","Qatar (Doha)"],"a":2,"e":"The 20th Asian Games were held in Aichi–Nagoya, Japan, in 2026. The previous edition (2022, held in 2023) was in Hangzhou, China.","n":"","te":{"q":"2026 ఆసియా క్రీడలు ఏ దేశంలో జరిగాయి?","o":["దక్షిణ కొరియా (ఇంచియాన్)","చైనా (హాంగ్‌జౌ)","జపాన్ (ఐచి–నగోయా)","ఖతార్ (దోహా)"],"e":"20వ ఆసియా క్రీడలు 2026లో జపాన్‌లోని ఐచి–నగోయాలో జరిగాయి. అంతకుముందు (2022, 2023లో జరిగినవి) చైనాలోని హాంగ్‌జౌలో జరిగాయి.","n":""}},{"t":"MCQ","q":"At the 2026 Asian Games, India finished in which position on the medal table, with 85 medals?","o":["5th","3rd","4th","6th"],"a":2,"e":"India won 85 medals (21 gold, 27 silver, 37 bronze) and finished 4th, behind China, Japan and South Korea.","n":"","te":{"q":"2026 ఆసియా క్రీడల్లో 85 పతకాలతో భారత్ పతకాల పట్టికలో ఏ స్థానంలో నిలిచింది?","o":["5వ","3వ","4వ","6వ"],"e":"భారత్ 85 పతకాలు (21 స్వర్ణం, 27 రజతం, 37 కాంస్యం) సాధించి చైనా, జపాన్, దక్షిణ కొరియా తర్వాత 4వ స్థానంలో నిలిచింది.","n":""}},{"t":"MCQ","q":"The 2026 Commonwealth Games (23 July – 2 August 2026) were hosted by which city?","o":["Glasgow","Birmingham","Gold Coast","Victoria"],"a":0,"e":"Glasgow, Scotland hosted the 2026 Commonwealth Games. Birmingham hosted in 2022 and Gold Coast in 2018.","n":"","te":{"q":"2026 కామన్వెల్త్ క్రీడలు (23 జూలై – 2 ఆగస్టు 2026) ఏ నగరంలో జరిగాయి?","o":["గ్లాస్గో","బర్మింగ్‌హామ్","గోల్డ్ కోస్ట్","విక్టోరియా"],"e":"స్కాట్లాండ్‌లోని గ్లాస్గో 2026 కామన్వెల్త్ క్రీడలకు ఆతిథ్యం ఇచ్చింది. 2022లో బర్మింగ్‌హామ్, 2018లో గోల్డ్ కోస్ట్.","n":""}},{"t":"MCQ","q":"Who won the Nobel Prize in Literature 2026?","o":["László Krasznahorkai","Anne Carson","Han Kang","Jon Fosse"],"a":1,"e":"Canadian poet and classicist Anne Carson won the 2026 Nobel Prize in Literature. Krasznahorkai won in 2025, Han Kang in 2024, Jon Fosse in 2023.","n":"","te":{"q":"2026 సాహిత్య నోబెల్ బహుమతి ఎవరికి లభించింది?","o":["లాస్లో క్రాస్నహోర్కై","ఆన్ కార్సన్","హాన్ కాంగ్","జాన్ ఫోసె"],"e":"కెనడా కవయిత్రి, సాంప్రదాయ సాహిత్య పండితురాలు ఆన్ కార్సన్‌కు 2026 సాహిత్య నోబెల్ లభించింది. 2025లో క్రాస్నహోర్కై, 2024లో హాన్ కాంగ్, 2023లో జాన్ ఫోసె.","n":""}},{"t":"MCQ","q":"Who won the Nobel Peace Prize 2025?","o":["Narges Mohammadi","Nihon Hidankyo","María Corina Machado","Ales Bialiatski"],"a":2,"e":"Venezuelan opposition leader María Corina Machado received the 2025 Nobel Peace Prize for promoting democratic rights in Venezuela.","n":"","te":{"q":"2025 నోబెల్ శాంతి బహుమతి ఎవరికి లభించింది?","o":["నర్గెస్ మొహమ్మదీ","నిహాన్ హిడాంక్యో","మరియా కొరినా మచాడో","అలెస్ బియాలియాట్‌స్కీ"],"e":"వెనిజులాలో ప్రజాస్వామ్య హక్కుల కోసం పోరాడిన ప్రతిపక్ష నేత మరియా కొరినా మచాడోకు 2025 నోబెల్ శాంతి బహుమతి లభించింది.","n":""}},{"t":"MCQ","q":"India's women's cricket team won its first ICC Women's ODI World Cup in November 2025 by defeating which team in the final?","o":["England","Australia","South Africa","New Zealand"],"a":2,"e":"India beat South Africa in the final at Navi Mumbai on 2 November 2025 to win their first Women's ODI World Cup, led by Harmanpreet Kaur.","n":"","te":{"q":"నవంబర్ 2025లో భారత మహిళా క్రికెట్ జట్టు ఫైనల్‌లో ఏ జట్టును ఓడించి తొలి మహిళల వన్డే ప్రపంచ కప్ గెలిచింది?","o":["ఇంగ్లాండ్","ఆస్ట్రేలియా","దక్షిణాఫ్రికా","న్యూజిలాండ్"],"e":"2 నవంబర్ 2025న నవీ ముంబైలో జరిగిన ఫైనల్‌లో హర్మన్‌ప్రీత్ కౌర్ నాయకత్వంలో భారత్ దక్షిణాఫ్రికాను ఓడించి తొలి మహిళల వన్డే ప్రపంచ కప్ గెలిచింది.","n":""}},{"t":"MCQ","q":"Who presented the Union Budget 2026–27 on 1 February 2026?","o":["Piyush Goyal","Nirmala Sitharaman","Arun Jaitley","Pankaj Chaudhary"],"a":1,"e":"Finance Minister Nirmala Sitharaman presented the Union Budget 2026–27 on 1 February 2026.","n":"","te":{"q":"1 ఫిబ్రవరి 2026న కేంద్ర బడ్జెట్ 2026–27ను ఎవరు ప్రవేశపెట్టారు?","o":["పీయూష్ గోయల్","నిర్మలా సీతారామన్","అరుణ్ జైట్లీ","పంకజ్ చౌదరి"],"e":"ఆర్థిక మంత్రి నిర్మలా సీతారామన్ 1 ఫిబ్రవరి 2026న కేంద్ర బడ్జెట్ 2026–27ను ప్రవేశపెట్టారు.","n":""}},{"t":"MCQ","q":"What fiscal deficit target did the Union Budget 2026–27 set for FY 2026–27?","o":["3.5% of GDP","4.4% of GDP","4.9% of GDP","4.3% of GDP"],"a":3,"e":"The Budget set the fiscal deficit target at 4.3% of GDP for 2026–27, down from 4.4% in 2025–26. Capital expenditure was about ₹12.2 lakh crore.","n":"","te":{"q":"కేంద్ర బడ్జెట్ 2026–27లో 2026–27 ఆర్థిక లోటు లక్ష్యం ఎంత?","o":["జీడీపీలో 3.5%","జీడీపీలో 4.4%","జీడీపీలో 4.9%","జీడీపీలో 4.3%"],"e":"2026–27 ఆర్థిక లోటు లక్ష్యం జీడీపీలో 4.3% (2025–26లో 4.4%). మూలధన వ్యయం సుమారు ₹12.2 లక్షల కోట్లు.","n":""}},{"t":"MCQ","q":"Andhra Pradesh's Budget for 2026–27, presented on 14 February 2026, had a total size of about:","o":["₹2.94 lakh crore","₹3.32 lakh crore","₹3.22 lakh crore","₹2.79 lakh crore"],"a":1,"e":"Finance Minister Payyavula Keshav presented an AP Budget of ₹3,32,205 crore for 2026–27; School Education got about ₹32,308 crore.","n":"","te":{"q":"14 ఫిబ్రవరి 2026న ప్రవేశపెట్టిన ఆంధ్రప్రదేశ్ 2026–27 బడ్జెట్ మొత్తం సుమారు ఎంత?","o":["₹2.94 లక్షల కోట్లు","₹3.32 లక్షల కోట్లు","₹3.22 లక్షల కోట్లు","₹2.79 లక్షల కోట్లు"],"e":"ఆర్థిక మంత్రి పయ్యావుల కేశవ్ ₹3,32,205 కోట్ల 2026–27 బడ్జెట్ ప్రవేశపెట్టారు; పాఠశాల విద్యకు సుమారు ₹32,308 కోట్లు కేటాయించారు.","n":""}},{"t":"MCQ","q":"Who presented Andhra Pradesh's 2026–27 Budget in the State Assembly?","o":["Buggana Rajendranath","K. Atchannaidu","Nara Lokesh","Payyavula Keshav"],"a":3,"e":"AP Finance Minister Payyavula Keshav presented the 2026–27 budget on 14 February 2026.","n":"","te":{"q":"ఆంధ్రప్రదేశ్ 2026–27 బడ్జెట్‌ను శాసనసభలో ఎవరు ప్రవేశపెట్టారు?","o":["బుగ్గన రాజేంద్రనాథ్","కె. అచ్చెన్నాయుడు","నారా లోకేష్","పయ్యావుల కేశవ్"],"e":"ఏపీ ఆర్థిక మంత్రి పయ్యావుల కేశవ్ 14 ఫిబ్రవరి 2026న 2026–27 బడ్జెట్ ప్రవేశపెట్టారు.","n":""}},{"t":"MCQ","q":"How many tentative posts were announced in the AP DSC 2026 brief notification of 13 October 2026?","o":["5,089","16,347","6,100","2,721"],"a":3,"e":"The brief notification listed 2,721 posts (2,111 general, 350 special education, 260 in societies/residential schools). 16,347 was the 2025 Mega DSC.","n":"","te":{"q":"13 అక్టోబర్ 2026 ఏపీ డీఎస్సీ 2026 సంక్షిప్త నోటిఫికేషన్‌లో ఎన్ని తాత్కాలిక పోస్టులు ప్రకటించారు?","o":["5,089","16,347","6,100","2,721"],"e":"సంక్షిప్త నోటిఫికేషన్‌లో 2,721 పోస్టులు (సాధారణ 2,111, ప్రత్యేక విద్య 350, సొసైటీలు/గురుకులాలు 260). 16,347 అనేది 2025 మెగా డీఎస్సీ.","n":""}},{"t":"MCQ","q":"The 2025 AP Mega DSC notification (April 2025) was for how many teacher posts?","o":["6,100","16,347","2,721","10,143"],"a":1,"e":"The Mega DSC notified on 20 April 2025 covered 16,347 teacher posts.","n":"","te":{"q":"2025 ఏపీ మెగా డీఎస్సీ నోటిఫికేషన్ (ఏప్రిల్ 2025) ఎన్ని ఉపాధ్యాయ పోస్టులకు?","o":["6,100","16,347","2,721","10,143"],"e":"20 ఏప్రిల్ 2025న విడుదలైన మెగా డీఎస్సీ 16,347 ఉపాధ్యాయ పోస్టులకు సంబంధించినది.","n":""}},{"t":"MCQ","q":"Who became the 53rd Chief Justice of India in November 2025?","o":["Justice Vikram Nath","Justice B. R. Gavai","Justice Sanjiv Khanna","Justice Surya Kant"],"a":3,"e":"Justice Surya Kant took oath as the 53rd CJI on 24 November 2025, succeeding Justice B. R. Gavai.","n":"","te":{"q":"నవంబర్ 2025లో భారత 53వ ప్రధాన న్యాయమూర్తి ఎవరయ్యారు?","o":["జస్టిస్ విక్రమ్ నాథ్","జస్టిస్ బి.ఆర్. గవాయ్","జస్టిస్ సంజీవ్ ఖన్నా","జస్టిస్ సూర్యకాంత్"],"e":"జస్టిస్ బి.ఆర్. గవాయ్ తర్వాత జస్టిస్ సూర్యకాంత్ 24 నవంబర్ 2025న 53వ సీజేఐగా ప్రమాణం చేశారు.","n":""}},{"t":"MCQ","q":"Who was elected Vice-President of India in September 2025?","o":["Om Birla","Jagdeep Dhankhar","B. Sudershan Reddy","C. P. Radhakrishnan"],"a":3,"e":"C. P. Radhakrishnan was elected the 15th Vice-President on 9 September 2025 after Jagdeep Dhankhar resigned in July 2025.","n":"","te":{"q":"సెప్టెంబర్ 2025లో భారత ఉపరాష్ట్రపతిగా ఎవరు ఎన్నికయ్యారు?","o":["ఓం బిర్లా","జగదీప్ ధన్‌ఖడ్","బి. సుదర్శన్ రెడ్డి","సి.పి. రాధాకృష్ణన్"],"e":"జూలై 2025లో జగదీప్ ధన్‌ఖడ్ రాజీనామా తర్వాత 9 సెప్టెంబర్ 2025న సి.పి. రాధాకృష్ణన్ 15వ ఉపరాష్ట్రపతిగా ఎన్నికయ్యారు.","n":""}},{"t":"MCQ","q":"Who is the Governor of the Reserve Bank of India (since December 2024)?","o":["Sanjay Malhotra","Shaktikanta Das","Urjit Patel","Raghuram Rajan"],"a":0,"e":"Sanjay Malhotra became the 26th RBI Governor in December 2024, succeeding Shaktikanta Das.","n":"","te":{"q":"భారతీయ రిజర్వ్ బ్యాంక్ గవర్నర్ (డిసెంబర్ 2024 నుండి) ఎవరు?","o":["సంజయ్ మల్హోత్రా","శక్తికాంత దాస్","ఉర్జిత్ పటేల్","రఘురామ్ రాజన్"],"e":"శక్తికాంత దాస్ తర్వాత డిసెంబర్ 2024లో సంజయ్ మల్హోత్రా 26వ ఆర్‌బీఐ గవర్నర్ అయ్యారు.","n":""}},{"t":"MCQ","q":"Who became the first Indian astronaut to visit the International Space Station (Axiom-4 mission, 2025)?","o":["Rakesh Sharma","Shubhanshu Shukla","Prasanth Nair","Angad Pratap"],"a":1,"e":"Group Captain Shubhanshu Shukla flew on Axiom-4 (June–July 2025), becoming the first Indian on the ISS and the second Indian in space after Rakesh Sharma (1984).","n":"","te":{"q":"అంతర్జాతీయ అంతరిక్ష కేంద్రానికి వెళ్లిన తొలి భారతీయ వ్యోమగామి (ఆక్సియం-4, 2025) ఎవరు?","o":["రాకేశ్ శర్మ","శుభాంశు శుక్లా","ప్రశాంత్ నాయర్","అంగద్ ప్రతాప్"],"e":"గ్రూప్ కెప్టెన్ శుభాంశు శుక్లా ఆక్సియం-4 (జూన్–జూలై 2025)లో ఐఎస్‌ఎస్‌కు వెళ్లిన తొలి భారతీయుడు; రాకేశ్ శర్మ (1984) తర్వాత అంతరిక్షంలోకి వెళ్లిన రెండో భారతీయుడు.","n":""}},{"t":"MCQ","q":"Under 'GST 2.0' (from 22 September 2025), most goods fall into which two main GST slabs?","o":["5% and 18%","12% and 28%","5% and 12%","18% and 28%"],"a":0,"e":"GST was simplified into two main slabs, 5% and 18%, with a special 40% rate for luxury and sin goods.","n":"","te":{"q":"'జీఎస్టీ 2.0' (22 సెప్టెంబర్ 2025 నుండి) ప్రకారం చాలా వస్తువులు ఏ రెండు ప్రధాన శ్లాబ్‌లలో ఉంటాయి?","o":["5% మరియు 18%","12% మరియు 28%","5% మరియు 12%","18% మరియు 28%"],"e":"జీఎస్టీని 5%, 18% అనే రెండు ప్రధాన శ్లాబ్‌లుగా సరళీకరించారు; విలాస, హానికర వస్తువులకు ప్రత్యేకంగా 40%.","n":""}},{"t":"MCQ","q":"India's next Census will use which reference date (for most of the country)?","o":["1 March 2027","1 March 2026","1 October 2026","1 January 2027"],"a":0,"e":"Census 2027 uses 1 March 2027 as the reference date (1 October 2026 for snow-bound areas). It is India's first digital census and includes caste enumeration.","n":"","te":{"q":"భారతదేశపు తదుపరి జనగణనకు (చాలా ప్రాంతాలకు) ప్రమాణ తేదీ ఏది?","o":["1 మార్చి 2027","1 మార్చి 2026","1 అక్టోబర్ 2026","1 జనవరి 2027"],"e":"జనగణన 2027కు ప్రమాణ తేదీ 1 మార్చి 2027 (మంచు ప్రాంతాలకు 1 అక్టోబర్ 2026). ఇది తొలి డిజిటల్ జనగణన, కులగణన కూడా ఉంటుంది.","n":""}},{"t":"MCQ","q":"Which Indian military operation of May 2025 targeted terror camps in Pakistan and PoK after the Pahalgam attack?","o":["Operation Kaveri","Operation Ajay","Operation Sindoor","Operation Ganga"],"a":2,"e":"Operation Sindoor (7 May 2025) struck terror infrastructure after the Pahalgam terror attack of 22 April 2025.","n":"","te":{"q":"పహల్గాం దాడి తర్వాత మే 2025లో పాకిస్తాన్, పీఓకేలోని ఉగ్ర శిబిరాలపై జరిగిన భారత సైనిక చర్య ఏది?","o":["ఆపరేషన్ కావేరి","ఆపరేషన్ అజయ్","ఆపరేషన్ సిందూర్","ఆపరేషన్ గంగా"],"e":"22 ఏప్రిల్ 2025 పహల్గాం ఉగ్రదాడి తర్వాత 7 మే 2025న ఆపరేషన్ సిందూర్ ఉగ్రవాద స్థావరాలపై దాడి చేసింది.","n":""}},{"t":"MCQ","q":"India won the ICC Champions Trophy 2025 by defeating which team in the final at Dubai?","o":["New Zealand","Australia","South Africa","Pakistan"],"a":0,"e":"India beat New Zealand by four wickets on 9 March 2025 to win their third Champions Trophy.","n":"","te":{"q":"దుబాయ్‌లో జరిగిన ఐసీసీ ఛాంపియన్స్ ట్రోఫీ 2025 ఫైనల్‌లో భారత్ ఏ జట్టును ఓడించింది?","o":["న్యూజిలాండ్","ఆస్ట్రేలియా","దక్షిణాఫ్రికా","పాకిస్తాన్"],"e":"9 మార్చి 2025న భారత్ న్యూజిలాండ్‌ను నాలుగు వికెట్ల తేడాతో ఓడించి మూడోసారి ఛాంపియన్స్ ట్రోఫీ గెలిచింది.","n":""}},{"t":"MCQ","q":"Which AP welfare scheme gives ₹15,000 a year to mothers for each school-going child?","o":["Annadata Sukhibhava","Thalliki Vandanam","Deepam-2","Stree Shakti"],"a":1,"e":"Thalliki Vandanam, one of the 'Super Six' promises, provides ₹15,000 per year for every school-going child.","n":"","te":{"q":"పాఠశాలకు వెళ్లే ప్రతి బిడ్డకు తల్లులకు సంవత్సరానికి ₹15,000 ఇచ్చే ఏపీ సంక్షేమ పథకం ఏది?","o":["అన్నదాత సుఖీభవ","తల్లికి వందనం","దీపం-2","స్త్రీ శక్తి"],"e":"'సూపర్ సిక్స్' హామీల్లో ఒకటైన తల్లికి వందనం పాఠశాలకు వెళ్లే ప్రతి బిడ్డకు సంవత్సరానికి ₹15,000 అందిస్తుంది.","n":""}},{"t":"MCQ","q":"AP's 'Stree Shakti' scheme, launched on 15 August 2025, provides:","o":["Free LPG cylinders","Free travel for women in APSRTC buses","Interest-free loans to SHGs","Free sewing machines"],"a":1,"e":"Stree Shakti lets women, girls and transgender persons travel free in specified APSRTC bus services.","n":"","te":{"q":"15 ఆగస్టు 2025న ప్రారంభమైన ఏపీ 'స్త్రీ శక్తి' పథకం ఏమి అందిస్తుంది?","o":["ఉచిత ఎల్పీజీ సిలిండర్లు","ఏపీఎస్ఆర్టీసీ బస్సుల్లో మహిళలకు ఉచిత ప్రయాణం","స్వయం సహాయక సంఘాలకు వడ్డీ లేని రుణాలు","ఉచిత కుట్టు మిషన్లు"],"e":"స్త్రీ శక్తి కింద మహిళలు, బాలికలు, ట్రాన్స్‌జెండర్లు నిర్ణీత ఏపీఎస్ఆర్టీసీ బస్సుల్లో ఉచితంగా ప్రయాణించవచ్చు.","n":""}},{"t":"MCQ","q":"Under AP's Deepam-2 scheme, eligible families get:","o":["Free solar lamps","Free electricity up to 200 units","Three free LPG cylinders a year","One free cylinder a month"],"a":2,"e":"Deepam-2 (from November 2024) gives eligible households three free LPG cylinders per year.","n":"","te":{"q":"ఏపీ దీపం-2 పథకం కింద అర్హ కుటుంబాలకు ఏమి లభిస్తుంది?","o":["ఉచిత సోలార్ దీపాలు","200 యూనిట్ల వరకు ఉచిత విద్యుత్","సంవత్సరానికి మూడు ఉచిత ఎల్పీజీ సిలిండర్లు","నెలకు ఒక ఉచిత సిలిండర్"],"e":"దీపం-2 (నవంబర్ 2024 నుండి) అర్హ కుటుంబాలకు సంవత్సరానికి మూడు ఉచిత ఎల్పీజీ సిలిండర్లు ఇస్తుంది.","n":""}},{"t":"MCQ","q":"Andhra State was formed on 1 October 1953 with which city as its capital?","o":["Guntur","Kurnool","Visakhapatnam","Vijayawada"],"a":1,"e":"Andhra State (1 Oct 1953) had Kurnool as its capital; Andhra Pradesh was formed on 1 November 1956 with Hyderabad as capital.","n":"","te":{"q":"1 అక్టోబర్ 1953న ఏర్పడిన ఆంధ్ర రాష్ట్ర రాజధాని ఏది?","o":["గుంటూరు","కర్నూలు","విశాఖపట్నం","విజయవాడ"],"e":"ఆంధ్ర రాష్ట్రం (1 అక్టోబర్ 1953) రాజధాని కర్నూలు; 1 నవంబర్ 1956న హైదరాబాద్ రాజధానిగా ఆంధ్రప్రదేశ్ ఏర్పడింది.","n":""}},{"t":"MCQ","q":"Potti Sriramulu died on 15 December 1952 after fasting for how many days for a separate Andhra State?","o":["56","58","48","64"],"a":1,"e":"Potti Sriramulu fasted for 58 days; his death led to the announcement of Andhra State. He is called 'Amarajeevi'.","n":"","te":{"q":"ప్రత్యేక ఆంధ్ర రాష్ట్రం కోసం పొట్టి శ్రీరాములు ఎన్ని రోజులు నిరాహార దీక్ష చేసి 15 డిసెంబర్ 1952న మరణించారు?","o":["56","58","48","64"],"e":"పొట్టి శ్రీరాములు 58 రోజులు దీక్ష చేశారు; ఆయన మరణంతో ఆంధ్ర రాష్ట్రం ప్రకటించారు. ఆయనను 'అమరజీవి' అంటారు.","n":""}},{"t":"MCQ","q":"Satish Dhawan Space Centre (SHAR), India's main launch site, is at Sriharikota in which AP district?","o":["Chittoor","Nellore (SPSR)","Prakasam","Tirupati"],"a":3,"e":"After the 2022 district reorganisation, Sriharikota falls in Tirupati district (earlier Nellore district).","n":"","te":{"q":"భారత ప్రధాన ప్రయోగ కేంద్రం సతీష్ ధావన్ స్పేస్ సెంటర్ (షార్) ఉన్న శ్రీహరికోట ఏ జిల్లాలో ఉంది?","o":["చిత్తూరు","నెల్లూరు (ఎస్‌పీఎస్‌ఆర్)","ప్రకాశం","తిరుపతి"],"e":"2022 జిల్లాల పునర్విభజన తర్వాత శ్రీహరికోట తిరుపతి జిల్లాలో ఉంది (గతంలో నెల్లూరు జిల్లా).","n":""}},{"t":"MCQ","q":"Andhra Pradesh has India's ____ longest coastline (about 974 km).","o":["second","first","third","fourth"],"a":0,"e":"Gujarat has the longest coastline; Andhra Pradesh is second with about 974 km along the Bay of Bengal.","n":"","te":{"q":"ఆంధ్రప్రదేశ్ తీర రేఖ (సుమారు 974 కి.మీ.) దేశంలో ____ పొడవైనది.","o":["రెండవ","మొదటి","మూడవ","నాల్గవ"],"e":"గుజరాత్‌కు అత్యంత పొడవైన తీరం; బంగాళాఖాతం వెంట సుమారు 974 కి.మీ.తో ఏపీ రెండవది.","n":""}},{"t":"MCQ","q":"What is the state animal of Andhra Pradesh?","o":["Blackbuck (Krishna Jinka)","Tiger","Elephant","Spotted deer"],"a":0,"e":"AP's state symbols: animal – Blackbuck; bird – Rose-ringed parakeet; tree – Neem; flower – Jasmine.","n":"","te":{"q":"ఆంధ్రప్రదేశ్ రాష్ట్ర జంతువు ఏది?","o":["కృష్ణ జింక","పులి","ఏనుగు","చుక్కల జింక"],"e":"ఏపీ రాష్ట్ర చిహ్నాలు: జంతువు – కృష్ణ జింక; పక్షి – రామ చిలుక; చెట్టు – వేప; పువ్వు – మల్లె.","n":""}}],"asof":"as of Oct 2026"},"hin-content":{"id":"hin-content","title":["Hindi Grammar & Literature","హిందీ వ్యాకరణం & సాహిత్యం"],"desc":["Sandhi, samas, karak, muhavare, alankar, chhand and Hindi literary history — SA Hindi content.","సంధి, సమాస, కారక, ముహావరే, అలంకార, ఛంద, హిందీ సాహిత్య చరిత్ర — ఎస్ఏ హిందీ విషయ భాగం."],"qs":[{"t":"MCQ","q":"'हिमालय' का संधि विच्छेद है—","o":["हिम + आलय","हिमा + लय","हि + मालय","हिम + लय"],"a":0,"e":"दीर्घ संधि: अ + आ = आ.","n":""},{"t":"MCQ","q":"'विद्यालय' में कौन-सी संधि है?","o":["गुण संधि","दीर्घ संधि","वृद्धि संधि","यण संधि"],"a":1,"e":"विद्या + आलय: आ + आ = आ (दीर्घ).","n":""},{"t":"MCQ","q":"'महेंद्र' (महा + इंद्र) में कौन-सी संधि है?","o":["यण संधि","दीर्घ संधि","वृद्धि संधि","गुण संधि"],"a":3,"e":"आ + इ = ए (गुण).","n":""},{"t":"MCQ","q":"'सदैव' (सदा + एव) में कौन-सी संधि है?","o":["गुण संधि","वृद्धि संधि","दीर्घ संधि","यण संधि"],"a":1,"e":"आ + ए = ऐ (वृद्धि).","n":""},{"t":"MCQ","q":"'इत्यादि' (इति + आदि) में कौन-सी संधि है?","o":["यण संधि","दीर्घ संधि","गुण संधि","अयादि संधि"],"a":0,"e":"इ + आ = या (यण).","n":""},{"t":"MCQ","q":"'माता-पिता' में कौन-सा समास है?","o":["बहुव्रीहि समास","द्विगु समास","द्वंद्व समास","कर्मधारय समास"],"a":2,"e":"Both words are equally important: द्वंद्व.","n":""},{"t":"MCQ","q":"'त्रिलोक' में कौन-सा समास है?","o":["तत्पुरुष समास","द्वंद्व समास","अव्ययीभाव समास","द्विगु समास"],"a":3,"e":"Number as first word: द्विगु.","n":""},{"t":"MCQ","q":"'नीलकंठ' (नीला है कंठ जिसका — शिव) में कौन-सा समास है?","o":["द्विगु समास","कर्मधारय समास","बहुव्रीहि समास","द्वंद्व समास"],"a":2,"e":"Points to a third person (Shiva): बहुव्रीहि.","n":""},{"t":"MCQ","q":"'यथाशक्ति' में कौन-सा समास है?","o":["अव्ययीभाव समास","तत्पुरुष समास","द्वंद्व समास","द्विगु समास"],"a":0,"e":"First word is an indeclinable (यथा): अव्ययीभाव.","n":""},{"t":"MCQ","q":"'राजपुत्र' (राजा का पुत्र) में कौन-सा समास है?","o":["द्विगु समास","द्वंद्व समास","बहुव्रीहि समास","तत्पुरुष समास"],"a":3,"e":"Genitive relation (का): षष्ठी तत्पुरुष.","n":""},{"t":"MCQ","q":"'अग्नि' का पर्यायवाची शब्द है—","o":["अंबर","पवन","नीर","पावक"],"a":3,"e":"पावक, अनल = fire; पवन = wind; नीर = water; अंबर = sky.","n":""},{"t":"MCQ","q":"'आदर' का विलोम शब्द है—","o":["प्रेम","सम्मान","अनादर","आदरणीय"],"a":2,"e":"आदर ↔ अनादर.","n":""},{"t":"MCQ","q":"'अपवित्र' में उपसर्ग है—","o":["अप","अ","पवि","त्र"],"a":1,"e":"अ + पवित्र.","n":""},{"t":"MCQ","q":"'मिठास' में प्रत्यय है—","o":["स","आस","मिठ","ठास"],"a":1,"e":"मीठा + आस = मिठास.","n":""},{"t":"MCQ","q":"'आँखों का तारा' मुहावरे का अर्थ है—","o":["नाराज़ होना","आँख में चोट","दूर का तारा","बहुत प्यारा"],"a":3,"e":"Means very dear.","n":""},{"t":"MCQ","q":"'लड़का' शब्द का लिंग है—","o":["स्त्रीलिंग","पुल्लिंग","नपुंसकलिंग","उभयलिंग"],"a":1,"e":"Hindi has two genders; लड़का is masculine.","n":""},{"t":"MCQ","q":"'राम ने रावण को बाण से मारा' में 'से' कौन-सा कारक है?","o":["कर्म कारक","अपादान कारक","करण कारक","संप्रदान कारक"],"a":2,"e":"Instrument (बाण से) = करण.","n":""},{"t":"MCQ","q":"'पेड़ से पत्ता गिरा' में 'से' कौन-सा कारक है?","o":["कर्ता कारक","करण कारक","अपादान कारक","अधिकरण कारक"],"a":2,"e":"Separation = अपादान.","n":""},{"t":"MCQ","q":"'ईदगाह' कहानी के लेखक हैं—","o":["यशपाल","जयशंकर प्रसाद","प्रेमचंद","मन्नू भंडारी"],"a":2,"e":"Premchand wrote 'Idgah' (Class 10 Sugandh-2).","n":""},{"t":"MCQ","q":"'रामचरितमानस' के रचयिता हैं—","o":["सूरदास","तुलसीदास","कबीर","मीराबाई"],"a":1,"e":"Tulsidas (16th c.) wrote Ramcharitmanas in Awadhi.","n":""},{"t":"MCQ","q":"'सूरसागर' किसकी रचना है?","o":["रहीम","तुलसीदास","बिहारी","सूरदास"],"a":3,"e":"Surdas, poet of the Krishna bhakti branch.","n":""},{"t":"MCQ","q":"हिंदी साहित्य के इतिहास में 'भक्तिकाल' को क्या कहा जाता है?","o":["वीरगाथा काल","स्वर्ण युग","रीतिकाल","आधुनिक काल"],"a":1,"e":"The Bhakti period is called the golden age of Hindi literature.","n":""},{"t":"MCQ","q":"'कामायनी' महाकाव्य के रचयिता हैं—","o":["जयशंकर प्रसाद","सुमित्रानंदन पंत","महादेवी वर्मा","निराला"],"a":0,"e":"Jaishankar Prasad, a Chhayavad poet.","n":""},{"t":"MCQ","q":"'बरसते बादल' कविता के कवि हैं—","o":["सुमित्रानंदन पंत","रामधारी सिंह दिनकर","मैथिलीशरण गुप्त","हरिवंशराय बच्चन"],"a":0,"e":"Sumitranandan Pant, 'poet of nature' (Class 10 Sugandh-2).","n":""},{"t":"MCQ","q":"'रश्मिरथी' और 'कुरुक्षेत्र' के रचयिता हैं—","o":["मैथिलीशरण गुप्त","जयशंकर प्रसाद","सुमित्रानंदन पंत","रामधारी सिंह 'दिनकर'"],"a":3,"e":"Dinkar, the 'Rashtrakavi', who also wrote the poem 'कण-कण का अधिकारी'.","n":""},{"t":"MCQ","q":"दोहा छंद के प्रत्येक चरण में मात्राएँ होती हैं—","o":["विषम चरण 13, सम चरण 11","विषम 11, सम 13","सभी चरण 16","विषम 12, सम 12"],"a":0,"e":"Doha: 13 + 11 mātrās per half-line; soratha reverses it (11 + 13).","n":""},{"t":"MCQ","q":"'चरण-कमल बंदौं हरि राई' में कौन-सा अलंकार है?","o":["उपमा अलंकार","रूपक अलंकार","अनुप्रास अलंकार","यमक अलंकार"],"a":1,"e":"चरण-कमल identifies feet with lotus (no comparison word): रूपक.","n":""},{"t":"MCQ","q":"'पीपर पात सरिस मन डोला' में कौन-सा अलंकार है?","o":["उपमा अलंकार","रूपक अलंकार","उत्प्रेक्षा अलंकार","श्लेष अलंकार"],"a":0,"e":"सरिस (like) compares the mind to a peepal leaf: उपमा.","n":""},{"t":"MCQ","q":"हिंदी को संघ की राजभाषा किस अनुच्छेद में घोषित किया गया है?","o":["अनुच्छेद 343","अनुच्छेद 345","अनुच्छेद 351","अनुच्छेद 350A"],"a":0,"e":"Article 343: Hindi in Devanagari script is the official language of the Union. 14 September is Hindi Divas.","n":""},{"t":"MCQ","q":"'हिंदी दिवस' कब मनाया जाता है?","o":["26 जनवरी","10 जनवरी","14 सितंबर","2 अक्टूबर"],"a":2,"e":"14 September (1949, adoption of Hindi as official language). 10 January is World Hindi Day.","n":""}]},"meth-eng":{"id":"meth-eng","title":["English Teaching Methodology","ఇంగ్లీషు బోధనా పద్ధతులు"],"desc":["Approaches and methods, LSRW skills, phonetics, discourse-oriented pedagogy and assessment.","విధానాలు, పద్ధతులు, ఎల్‌ఎస్‌ఆర్‌డబ్ల్యూ నైపుణ్యాలు, ధ్వనిశాస్త్రం, డిస్కోర్స్ బోధన, మూల్యాంకనం."],"qs":[{"t":"MCQ","q":"Which method teaches a foreign language by translating texts and memorising grammar rules?","o":["Audio-Lingual Method","Direct Method","Communicative Approach","Grammar-Translation Method"],"a":3,"e":"The Grammar-Translation Method focuses on reading, translation and explicit rules; it neglects speaking.","n":""},{"t":"MCQ","q":"The Direct Method of teaching English insists on:","o":["Using only English in class and no translation","Translating every sentence into the mother tongue","Teaching grammar rules first","Silent reading only"],"a":0,"e":"The Direct (natural) Method associates words directly with objects and actions, avoiding the mother tongue.","n":""},{"t":"MCQ","q":"The Audio-Lingual Method is based on which learning theory?","o":["Gestalt theory","Constructivism","Behaviourism (habit formation through drills)","Humanism"],"a":2,"e":"Audio-lingualism uses mimicry–memorisation and pattern drills, based on Skinner's behaviourism and structural linguistics.","n":""},{"t":"MCQ","q":"Communicative Language Teaching (CLT) mainly aims at:","o":["Accurate translation","Perfect knowledge of grammar rules","Communicative competence — using language appropriately in real situations","Beautiful handwriting"],"a":2,"e":"CLT (Hymes' 'communicative competence') stresses meaningful interaction, fluency and appropriateness.","n":""},{"t":"MCQ","q":"Krashen's 'Input Hypothesis' says learners acquire language when they receive input that is:","o":["Only grammatical rules","Far above their level","Only written","Comprehensible and slightly beyond their level (i+1)"],"a":3,"e":"Stephen Krashen: acquisition happens through comprehensible input at i+1; he also proposed the affective filter hypothesis.","n":""},{"t":"MCQ","q":"According to Krashen, high anxiety and low motivation raise the:","o":["Affective filter, which blocks acquisition","Monitor, which improves fluency","Input, which speeds learning","Natural order"],"a":0,"e":"A high affective filter blocks input from reaching the language acquisition device; a relaxed classroom lowers it.","n":""},{"t":"MCQ","q":"The 'Structural Approach' to teaching English was popularised in India mainly through:","o":["Free conversation without planning","Graded sentence patterns taught through situations and drills","Translation of literary texts","Learning grammar terminology"],"a":1,"e":"Structural approach (Palmer, Hornby; in India via CIEFL/Madras Snowball) selects and grades structures and vocabulary.","n":""},{"t":"MCQ","q":"Which skill is a 'receptive' skill?","o":["Listening","Speaking","Writing","None of these"],"a":0,"e":"Listening and reading are receptive skills; speaking and writing are productive skills.","n":""},{"t":"MCQ","q":"Reading a passage quickly to get the general idea is called:","o":["Skimming","Scanning","Intensive reading","Loud reading"],"a":0,"e":"Skimming = gist; scanning = searching for specific information like a date or name.","n":""},{"t":"MCQ","q":"Looking through a timetable to find the departure time of one train is:","o":["Skimming","Scanning","Extensive reading","Intensive reading"],"a":1,"e":"Scanning locates specific information without reading everything.","n":""},{"t":"MCQ","q":"Extensive reading mainly aims at:","o":["Detailed study of grammar in a short text","Reading for pleasure and building fluency through large amounts of easy text","Translation practice","Pronunciation drills"],"a":1,"e":"Extensive reading (supplementary readers, library books) builds vocabulary, fluency and reading habit.","n":""},{"t":"MCQ","q":"A 'discourse' in the AP English curriculum refers to:","o":["A spelling test","A single grammar rule","A list of new words","A meaningful whole text such as a conversation, description, letter or story"],"a":3,"e":"The discourse-oriented pedagogy asks learners to produce whole texts (narratives, descriptions, letters, diaries, posters) instead of isolated sentences.","n":""},{"t":"MCQ","q":"Teaching vocabulary is most effective when new words are:","o":["Translated only","Listed with dictionary meanings to memorise","Presented in context and used repeatedly","Tested before being taught"],"a":2,"e":"Contextual presentation and recycling help retention.","n":""},{"t":"MCQ","q":"Which activity best develops listening skills?","o":["Listening to an audio story and completing a task based on it","Copying from the board","Writing grammar exercises","Silent reading of a textbook"],"a":0,"e":"Listening tasks with a clear purpose (pre-, while-, post-listening) develop real listening.","n":""},{"t":"MCQ","q":"The correct order of a 'PPP' lesson is:","o":["Preparation, Presentation, Practice","Practice, Presentation, Production","Production, Practice, Presentation","Presentation, Practice, Production"],"a":3,"e":"PPP: the teacher presents the item, learners practise it in controlled ways, then produce it freely.","n":""},{"t":"MCQ","q":"An error that a learner makes consistently because of an incomplete rule ('goed', 'childs') is called:","o":["A spelling error","A slip or mistake","A developmental (systematic) error","A pronunciation error"],"a":2,"e":"Errors are systematic and show the learner's interlanguage (Corder); mistakes are occasional slips.","n":""},{"t":"MCQ","q":"The 'Language Acquisition Device' was proposed by:","o":["Stephen Krashen","B. F. Skinner","Noam Chomsky","Lev Vygotsky"],"a":2,"e":"Chomsky argued that humans have an innate capacity for language (universal grammar).","n":""},{"t":"MCQ","q":"A teacher shows a picture and asks learners to describe it in pairs. This is an example of:","o":["Dictation","Information-gap / speaking activity","Grammar-translation","Rote learning"],"a":1,"e":"Picture description and information-gap tasks create a need to communicate.","n":""},{"t":"MCQ","q":"Which is the best way to correct learners' oral errors during a fluency activity?","o":["Ignore errors forever","Stop the learner at every error","Laugh at the error","Note errors and give feedback later, without interrupting"],"a":3,"e":"During fluency work, delayed feedback keeps communication going; accuracy work allows immediate correction.","n":""},{"t":"MCQ","q":"'Phonetics' deals with:","o":["Spelling rules","Meaning of words","Sentence structure","Speech sounds — their production and description"],"a":3,"e":"Phonetics studies speech sounds; phonology studies sound systems; morphology words; syntax sentences; semantics meaning.","n":""},{"t":"MCQ","q":"How many vowel sounds (monophthongs and diphthongs) are there in Received Pronunciation English?","o":["12","26","20","44"],"a":2,"e":"RP has 12 pure vowels and 8 diphthongs = 20 vowel sounds, and 24 consonant sounds (44 phonemes).","n":""},{"t":"MCQ","q":"The word 'photograph' has its primary stress on the:","o":["First syllable (PHO-to-graph)","Second syllable","Third syllable","No syllable"],"a":0,"e":"PHO-to-graph; but pho-TO-gra-pher and pho-to-GRA-phic — stress shifts with suffixes.","n":""},{"t":"MCQ","q":"In a writing class, the 'process approach' focuses on:","o":["Only the final product","Planning, drafting, revising and editing","Copying model essays","Handwriting"],"a":1,"e":"Process writing treats writing as stages with feedback between drafts.","n":""},{"t":"MCQ","q":"A portfolio in language assessment is:","o":["A purposeful collection of a learner's work over time","A single end-of-year test","A list of marks","A teacher's diary"],"a":0,"e":"Portfolios show progress and allow self-reflection; they are part of continuous assessment.","n":""},{"t":"MCQ","q":"Which question is a 'higher-order' question about a story?","o":["'How many friends did he have?'","'What is the name of the boy?'","'Where did he go?'","'Do you think the ending was fair? Why?'"],"a":3,"e":"Evaluative 'why/do you think' questions require analysis and judgement.","n":""},{"t":"MCQ","q":"Bilingual method (C. J. Dodson) allows the teacher to use the mother tongue:","o":["Never","For the whole lesson","Only to convey the meaning of new words and structures, then practise in English","Only in examinations"],"a":2,"e":"Dodson's bilingual method uses the mother tongue for meaning and English for practice.","n":""},{"t":"MCQ","q":"Teaching grammar 'in context' means:","o":["Teaching rules before any examples","Presenting structures through meaningful texts and situations","Making learners memorise tables","Avoiding grammar completely"],"a":1,"e":"Contextualised grammar shows form, meaning and use together.","n":""},{"t":"MCQ","q":"A language laboratory is most useful for practising:","o":["Handwriting","Listening and pronunciation","Silent reading","Spelling"],"a":1,"e":"Labs provide models of native-like speech and allow individual recording and comparison.","n":""}]},"meth-hin":{"id":"meth-hin","title":["Hindi Teaching Methodology","హిందీ బోధనా పద్ధతులు"],"desc":["Teaching Hindi as a language in AP schools: skills, methods, lesson planning and assessment (in Hindi).","ఏపీ పాఠశాలల్లో హిందీ బోధన: నైపుణ్యాలు, పద్ధతులు, పాఠ్య ప్రణాళిక, మూల్యాంకనం (హిందీలో)."],"qs":[{"t":"MCQ","q":"भाषा कौशलों का स्वाभाविक क्रम क्या है?","o":["लिखना, पढ़ना, बोलना, सुनना","पढ़ना, लिखना, सुनना, बोलना","बोलना, सुनना, लिखना, पढ़ना","सुनना, बोलना, पढ़ना, लिखना"],"a":3,"e":"Natural order of language skills: listening, speaking, reading, writing (LSRW).","n":""},{"t":"MCQ","q":"व्याकरण शिक्षण में पहले उदाहरण देकर फिर नियम निकलवाना कौन-सी विधि है?","o":["अनुवाद विधि","निगमन विधि","व्याख्यान विधि","आगमन विधि"],"a":3,"e":"Inductive (आगमन) method: examples → rule. Deductive (निगमन): rule → examples.","n":""},{"t":"MCQ","q":"कविता शिक्षण का मुख्य उद्देश्य क्या है?","o":["रसानुभूति और सौंदर्यबोध","व्याकरण के नियम रटना","लेखन की गति बढ़ाना","केवल शब्दार्थ याद करना"],"a":0,"e":"The main aim of teaching poetry is aesthetic enjoyment (रसानुभूति).","n":""},{"t":"MCQ","q":"मौन वाचन से मुख्य रूप से क्या विकसित होता है?","o":["अर्थग्रहण और पढ़ने की गति","शुद्ध उच्चारण","स्वर का उतार-चढ़ाव","सुलेख"],"a":0,"e":"Silent reading develops comprehension and speed; loud reading (सस्वर वाचन) develops pronunciation.","n":""},{"t":"MCQ","q":"गद्य शिक्षण में 'आदर्श वाचन' कौन करता है?","o":["सबसे कमज़ोर छात्र","शिक्षक","पूरी कक्षा एक साथ","प्रधानाचार्य"],"a":1,"e":"The teacher's model reading (आदर्श वाचन) shows correct pronunciation, pause and expression; students then read (अनुकरण वाचन).","n":""},{"t":"MCQ","q":"श्रुतलेख (डिक्टेशन) से मुख्य रूप से किसकी जाँच होती है?","o":["रचनात्मक लेखन","ध्यान से सुनना और वर्तनी","वाक्पटुता","पढ़ने की गति"],"a":1,"e":"Dictation checks attentive listening and spelling.","n":""},{"t":"MCQ","q":"हिंदी को द्वितीय भाषा के रूप में पढ़ाने में सबसे उपयुक्त विधि कौन-सी है?","o":["केवल रटना","केवल व्याकरण-अनुवाद विधि","प्रत्यक्ष विधि के साथ संप्रेषणात्मक गतिविधियाँ","केवल व्याख्यान"],"a":2,"e":"For a second language, direct and communicative methods build real use; translation alone does not.","n":""},{"t":"MCQ","q":"'प्रोजेक्ट विधि' के प्रवर्तक कौन हैं?","o":["हेलेन पार्कहर्स्ट","किलपैट्रिक","मॉन्टेसरी","फ्रोबेल"],"a":1,"e":"W. H. Kilpatrick developed the project method; Helen Parkhurst the Dalton plan.","n":""},{"t":"MCQ","q":"रचनात्मक लेखन के अंतर्गत कौन-सी गतिविधि आती है?","o":["कहानी पूरी करना और विज्ञापन/पोस्टर बनाना","पाठ की नकल करना","वर्णमाला लिखना","शब्दार्थ रटना"],"a":0,"e":"Completing stories, writing posters, slogans and dialogues are creative writing tasks.","n":""},{"t":"MCQ","q":"उच्चारण दोष दूर करने के लिए सबसे उपयुक्त उपाय क्या है?","o":["मौन वाचन","व्याकरण के नियम लिखवाना","शिक्षक का आदर्श उच्चारण, अनुकरण और अभ्यास","बोर्ड से नकल"],"a":2,"e":"Model–imitate–practise drills correct pronunciation errors.","n":""},{"t":"MCQ","q":"सतत और व्यापक मूल्यांकन (सीसीई) में शामिल है—","o":["रचनात्मक और योगात्मक दोनों मूल्यांकन","केवल वार्षिक परीक्षा","केवल मौखिक परीक्षा","केवल उपस्थिति"],"a":0,"e":"CCE includes formative and summative assessment of scholastic and co-scholastic areas.","n":""},{"t":"MCQ","q":"भाषा प्रयोगशाला का सबसे अधिक उपयोग किस कौशल के लिए होता है?","o":["निबंध लेखन","सुलेख","मौन वाचन","श्रवण और उच्चारण"],"a":3,"e":"Language labs help listening and pronunciation practice.","n":""},{"t":"MCQ","q":"'शुद्ध वर्तनी' सिखाने का सबसे प्रभावी उपाय है—","o":["केवल पाठ्यपुस्तक पढ़ना","केवल डाँटना","श्रुतलेख, शब्द-खेल और त्रुटि विश्लेषण","केवल व्याकरण रटना"],"a":2,"e":"Dictation, word games and error analysis with remedial practice improve spelling.","n":""},{"t":"MCQ","q":"बहुभाषी कक्षा में शिक्षक को बच्चे की मातृभाषा के प्रति कैसा व्यवहार करना चाहिए?","o":["उसे संसाधन मानकर हिंदी सीखने के लिए सेतु बनाना","कक्षा में प्रतिबंधित करना","उपहास करना","अनदेखा करना"],"a":0,"e":"NCF 2005 and NEP 2020 treat multilingualism as a resource.","n":""},{"t":"MCQ","q":"उच्च स्तरीय चिंतन जाँचने वाला प्रश्न कौन-सा है?","o":["'पहला अनुच्छेद लिखो।'","'ईदगाह के लेखक कौन हैं?'","'हामिद ने क्या खरीदा?'","'यदि तुम हामिद की जगह होते तो क्या करते और क्यों?'"],"a":3,"e":"Open-ended evaluative questions test higher-order thinking.","n":""},{"t":"MCQ","q":"बालकों में पठन रुचि जगाने के लिए सबसे उपयुक्त है—","o":["केवल परीक्षा के प्रश्न","पुस्तकालय, बाल पत्रिकाएँ और कहानी-पुस्तकें","केवल व्याकरण","केवल सुलेख"],"a":1,"e":"Supplementary reading builds reading habit.","n":""},{"t":"MCQ","q":"'पत्र लेखन' किस प्रकार का लेखन है?","o":["केवल सृजनात्मक लेखन","व्यावहारिक (कार्यात्मक) लेखन","अनुवाद","सुलेख"],"a":1,"e":"Letters, applications and notices are functional writing.","n":""},{"t":"MCQ","q":"हरबर्ट की पाठ योजना के सोपानों का सही क्रम है—","o":["सामान्यीकरण, प्रयोग, तुलना, प्रस्तावना, प्रस्तुतीकरण","प्रयोग, तुलना, प्रस्तावना, प्रस्तुतीकरण, सामान्यीकरण","प्रस्तुतीकरण, प्रयोग, प्रस्तावना, तुलना, सामान्यीकरण","प्रस्तावना, प्रस्तुतीकरण, तुलना, सामान्यीकरण, प्रयोग"],"a":3,"e":"Herbart: preparation, presentation, comparison, generalisation, application.","n":""},{"t":"MCQ","q":"बच्चों की गलतियों के प्रति शिक्षक का सही दृष्टिकोण क्या है?","o":["गलतियों को अनदेखा करना","हर गलती पर दंड देना","गलतियाँ सीखने का स्वाभाविक हिस्सा हैं; उनका विश्लेषण कर सुधार कराना","बच्चे को कक्षा से बाहर भेजना"],"a":2,"e":"Errors show the learner's developing system; analyse and remediate.","n":""},{"t":"MCQ","q":"'नीति दोहे' किस विधा के उदाहरण हैं?","o":["निबंध","एकांकी","पद्य (दोहा छंद)","यात्रा वृत्तांत"],"a":2,"e":"Doha is a verse form (13+11 mātrās per half).","n":""}]},"meth-san":{"id":"meth-san","title":["Sanskrit Teaching Methodology","సంస్కృత బోధనా పద్ధతులు"],"desc":["Pathashala, Bhandarkar and direct methods, teaching shlokas and grammar, assessment (in Sanskrit).","పాఠశాల, భండార్కర్, ప్రత్యక్ష పద్ధతులు, శ్లోక, వ్యాకరణ బోధన, మూల్యాంకనం (సంస్కృతంలో)."],"qs":[{"t":"MCQ","q":"संस्कृतशिक्षणस्य 'पाठशाला-विधिः' (परम्परागतविधिः) मुख्यतया किं बलयति?","o":["चित्रप्रदर्शनम्","केवलं वार्तालापम्","कण्ठस्थीकरणं सूत्राणां च पठनम्","प्रयोगशालाकार्यम्"],"a":2,"e":"The traditional Pathashala method stresses memorising sutras, shlokas and commentaries.","n":""},{"t":"MCQ","q":"भण्डारकर-विधिः (व्याकरण-अनुवाद-विधिः) केन नाम्ना प्रसिद्धः?","o":["परियोजना-विधिः","प्रत्यक्ष-विधिः","पाठ्यपुस्तक-विधिः / व्याकरण-अनुवाद-विधिः","खेल-विधिः"],"a":2,"e":"R. G. Bhandarkar's method teaches grammar through graded textbooks with translation.","n":""},{"t":"MCQ","q":"संस्कृतेन एव संस्कृतशिक्षणं (मातृभाषाप्रयोगं विना) कः विधिः?","o":["प्रत्यक्ष-विधिः (संस्कृतमाध्यम-विधिः)","अनुवाद-विधिः","व्याख्यान-विधिः","पाठशाला-विधिः"],"a":0,"e":"T ":""}},{"t":"MCQ","q":"A teacher asks 'What do you think will happen if we keep a plant in a dark room?' This develops:","o":["Reading speed","Rote memory","Handwriting","Hypothesising — a science process skill"],"a":3,"e":"Predicting and hypothesising are science process skills along with observing, measuring, classifying and inferring.","n":"","te":{"q":"'మొక్కను చీకటి గదిలో ఉంచితే ఏమవుతుందని అనుకుంటున్నారు?' అని ఉపాధ్యాయుడు అడిగాడు. ఇది దేనిని పెంపొందిస్తుంది?","o":["చదివే వేగం","బట్టీ జ్ఞాపకం","చేతిరాత","పరికల్పన — ఒక శాస్త్ర ప్రక్రియా నైపుణ్యం"],"e":"ఊహించడం, పరికల్పన రూపొందించడం పరిశీలన, కొలత, వర్గీకరణ, అనుమితితో పాటు శాస్త్ర ప్రక్రియా నైపుణ్యాలు.","n":""}},{"t":"MCQ","q":"A 'rubric' is useful mainly because it:","o":["Removes the need for feedback","Replaces teaching","Increases marks for all","Makes assessment criteria clear and consistent"],"a":3,"e":"Rubrics describe performance levels for each criterion, improving fairness and feedback.","n":"","te":{"q":"'రూబ్రిక్' ప్రధానంగా ఎందుకు ఉపయోగకరం?","o":["ఫీడ్‌బ్యాక్ అవసరం తొలగిస్తుంది","బోధనకు ప్రత్యామ్నాయం","అందరి మార్కులు పెంచుతుంది","మూల్యాంకన ప్రమాణాలను స్పష్టంగా, స్థిరంగా చేస్తుంది"],"e":"రూబ్రిక్‌లు ప్రతి ప్రమాణానికి ప్రదర్శన స్థాయిలను వివరిస్తాయి — న్యాయం, ఫీడ్‌బ్యాక్ మెరుగవుతాయి.","n":""}},{"t":"MCQ","q":"Which is an example of 'open-ended' assessment?","o":["'Water boils at ___ °C.'","'Suggest three ways your village can save water.'","'True or False: The Sun is a star.'","'Match the columns.'"],"a":1,"e":"Open-ended tasks allow multiple correct responses and show reasoning and creativity.","n":"","te":{"q":"'ముక్త (ఓపెన్-ఎండెడ్)' మూల్యాంకనానికి ఉదాహరణ ఏది?","o":["'నీరు ___ °C వద్ద మరుగుతుంది.'","'మీ గ్రామం నీటిని పొదుపు చేయడానికి మూడు మార్గాలు సూచించండి.'","'సరైనదా తప్పా: సూర్యుడు ఒక నక్షత్రం.'","'జతపరచండి.'"],"e":"ముక్త పనులు అనేక సరైన జవాబులను అనుమతించి, తర్కం, సృజనాత్మకతను చూపుతాయి.","n":""}},{"t":"MCQ","q":"ICT integration in teaching is most meaningful when:","o":["It is used only for attendance
