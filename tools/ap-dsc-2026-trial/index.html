"e":"సవర్ణ అచ్చులు (అ/ఆ + అ/ఆ) కలిసినప్పుడు దీర్ఘంగా మారడం సవర్ణదీర్ఘ సంధి.","n":""}},{"t":"MCQ","q":"మహా + ఇంద్రుడు = మహేంద్రుడు. Name the sandhi.","o":["Ātva sandhi","Savarṇadīrgha sandhi","Vṛddhi sandhi","Guṇa sandhi"],"a":3,"e":"అ/ఆ + ఇ/ఈ = ఏ; అ/ఆ + ఉ/ఊ = ఓ; అ/ఆ + ఋ = అర్ — guṇa sandhi.","n":"","te":{"q":"మహా + ఇంద్రుడు = మహేంద్రుడు. ఇది ఏ సంధి?","o":["అత్వ సంధి","సవర్ణదీర్ఘ సంధి","వృద్ధి సంధి","గుణ సంధి"],"e":"అ/ఆ లకు ఇ/ఈ పరమైతే ఏ, ఉ/ఊ పరమైతే ఓ, ఋ పరమైతే అర్ ఆదేశం — గుణ సంధి.","n":""}},{"t":"MCQ","q":"ఏక + ఏక = ఏకైక. Name the sandhi.","o":["Vṛddhi sandhi","Guṇa sandhi","Yaṇādeśa sandhi","Savarṇadīrgha sandhi"],"a":0,"e":"అ/ఆ + ఏ/ఐ = ఐ; అ/ఆ + ఓ/ఔ = ఔ — vṛddhi sandhi.","n":"","te":{"q":"ఏక + ఏక = ఏకైక. ఇది ఏ సంధి?","o":["వృద్ధి సంధి","గుణ సంధి","యణాదేశ సంధి","సవర్ణదీర్ఘ సంధి"],"e":"అ/ఆ లకు ఏ/ఐ పరమైతే ఐ, ఓ/ఔ పరమైతే ఔ — వృద్ధి సంధి.","n":""}},{"t":"MCQ","q":"అతి + అంతం = అత్యంతం. Name the sandhi.","o":["Guṇa sandhi","Yaṇādeśa sandhi","Vṛddhi sandhi","Ikārādi sandhi"],"a":1,"e":"ఇ/ఉ/ఋ followed by a dissimilar vowel become య/వ/ర — yaṇādeśa sandhi.","n":"","te":{"q":"అతి + అంతం = అత్యంతం. ఇది ఏ సంధి?","o":["గుణ సంధి","యణాదేశ సంధి","వృద్ధి సంధి","ఇత్వ సంధి"],"e":"ఇ, ఉ, ఋ లకు అసవర్ణ అచ్చులు పరమైతే వరుసగా య, వ, ర ఆదేశం — యణాదేశ సంధి.","n":""}},{"t":"MCQ","q":"రామ + అయ్య = రామయ్య. This is:","o":["Itva sandhi","Atva sandhi","Utva sandhi","Yaḍāgama sandhi"],"a":1,"e":"అత్తునకు సంధి బహుళంబుగానగు — the final అ of the first word drops: atva sandhi.","n":"","te":{"q":"రామ + అయ్య = రామయ్య. ఇది ఏ సంధి?","o":["ఇత్వ సంధి","అత్వ సంధి","ఉత్వ సంధి","యడాగమ సంధి"],"e":"'అత్తునకు సంధి బహుళంబుగానగు' — పూర్వపదం చివరి అ లోపిస్తుంది: అత్వ సంధి.","n":""}},{"t":"MCQ","q":"రాముడు + అతడు = రాముడతడు. Name the sandhi.","o":["Āmreḍita sandhi","Atva sandhi","Itva sandhi","Utva sandhi"],"a":3,"e":"ఉత్తునకు అచ్చు పరంబగునప్పుడు సంధి యగు — the final ఉ drops: utva sandhi.","n":"","te":{"q":"రాముడు + అతడు = రాముడతడు. ఇది ఏ సంధి?","o":["ఆమ్రేడిత సంధి","అత్వ సంధి","ఇత్వ సంధి","ఉత్వ సంధి"],"e":"'ఉత్తునకు అచ్చు పరంబగునప్పుడు సంధియగు' — చివరి ఉ లోపిస్తుంది: ఉత్వ సంధి.","n":""}},{"t":"MCQ","q":"మా + అమ్మ = మాయమ్మ. Name the sandhi.","o":["Yaḍāgama sandhi","Atva sandhi","Trika sandhi","Gasaḍadavādeśa sandhi"],"a":0,"e":"When sandhi does not occur, య is inserted between the vowels — yaḍāgama.","n":"","te":{"q":"మా + అమ్మ = మాయమ్మ. ఇది ఏ సంధి?","o":["యడాగమ సంధి","అత్వ సంధి","త్రిక సంధి","గసడదవాదేశ సంధి"],"e":"సంధి జరగనిచోట అచ్చుల మధ్య య కారం ఆగమంగా వస్తుంది — యడాగమ సంధి.","n":""}},{"t":"MCQ","q":"వాడు + కొట్టె = వాడుగొట్టె. Here క changes to గ. Name the sandhi.","o":["Gasaḍadavādeśa sandhi","Saralādeśa sandhi","Dvirukta-ṭakāra sandhi","Trika sandhi"],"a":0,"e":"After a prathamā vibhakti form, క, చ, ట, త, ప at the beginning of a verb become గ, స, డ, ద, వ — gasaḍadavādeśa.","n":"","te":{"q":"వాడు + కొట్టె = వాడుగొట్టె. ఇక్కడ క గ గా మారింది. ఇది ఏ సంధి?","o":["గసడదవాదేశ సంధి","సరళాదేశ సంధి","ద్విరుక్తటకార సంధి","త్రిక సంధి"],"e":"ప్రథమా విభక్తి ప్రత్యయాల తర్వాత క, చ, ట, త, ప లకు గ, స, డ, ద, వ లు ఆదేశంగా వస్తాయి — గసడదవాదేశం.","n":""}},{"t":"MCQ","q":"ఔర + ఔర = ఔరౌర. Name the sandhi.","o":["Atva sandhi","Vṛddhi sandhi","Āmreḍita sandhi","Yaḍāgama sandhi"],"a":2,"e":"When a word is repeated (āmreḍitam), the vowel sandhi that occurs is āmreḍita sandhi.","n":"","te":{"q":"ఔర + ఔర = ఔరౌర. ఇది ఏ సంధి?","o":["అత్వ సంధి","వృద్ధి సంధి","ఆమ్రేడిత సంధి","యడాగమ సంధి"],"e":"ఒక పదం రెండుసార్లు వచ్చినప్పుడు (ఆమ్రేడితం) జరిగే సంధి ఆమ్రేడిత సంధి.","n":""}},{"t":"MCQ","q":"ఆ + కన్య = అక్కన్య. Name the sandhi.","o":["Yaḍāgama sandhi","Trika sandhi","Guṇa sandhi","Atva sandhi"],"a":1,"e":"ఆ, ఈ, ఏ (trika) shorten and the following consonant doubles — trika sandhi.","n":"","te":{"q":"ఆ + కన్య = అక్కన్య. ఇది ఏ సంధి?","o":["యడాగమ సంధి","త్రిక సంధి","గుణ సంధి","అత్వ సంధి"],"e":"ఆ, ఈ, ఏ (త్రికం) హ్రస్వమై తర్వాతి హల్లు ద్విత్వమవుతుంది — త్రిక సంధి.","n":""}},{"t":"MCQ","q":"తల్లిదండ్రులు is an example of which samāsa?","o":["Dvigu","Dvandva","Bahuvrīhi","Karmadhāraya"],"a":1,"e":"Dvandva: both words are equally important (తల్లియు, తండ్రియు).","n":"","te":{"q":"'తల్లిదండ్రులు' ఏ సమాసానికి ఉదాహరణ?","o":["ద్విగు సమాసం","ద్వంద్వ సమాసం","బహువ్రీహి సమాసం","కర్మధారయ సమాసం"],"e":"ద్వంద్వ సమాసంలో రెండు పదాలకూ సమాన ప్రాధాన్యం (తల్లియు, తండ్రియు).","n":""}},{"t":"MCQ","q":"ముల్లోకాలు (మూడు లోకాలు) is a:","o":["Dvigu samāsa","Dvandva samāsa","Bahuvrīhi samāsa","Avyayībhāva samāsa"],"a":0,"e":"A samāsa whose first word is a number is dvigu.","n":"","te":{"q":"'ముల్లోకాలు' (మూడు లోకాలు) ఏ సమాసం?","o":["ద్విగు సమాసం","ద్వంద్వ సమాసం","బహువ్రీహి సమాసం","అవ్యయీభావ సమాసం"],"e":"పూర్వపదం సంఖ్యావాచకమైతే అది ద్విగు సమాసం.","n":""}},{"t":"MCQ","q":"చక్రపాణి (one who holds the discus — Vishnu) is a:","o":["Dvigu samāsa","Tatpuruṣa samāsa","Dvandva samāsa","Bahuvrīhi samāsa"],"a":3,"e":"In bahuvrīhi neither word is primary; the compound points to a third person or thing (చక్రం పాణియందు కలవాడు).","n":"","te":{"q":"'చక్రపాణి' (చక్రం చేతిలో కలవాడు — విష్ణువు) ఏ సమాసం?","o":["ద్విగు సమాసం","తత్పురుష సమాసం","ద్వంద్వ సమాసం","బహువ్రీహి సమాసం"],"e":"బహువ్రీహిలో అన్యపదార్థం ప్రధానం (చక్రం పాణియందు కలవాడు).","n":""}},{"t":"MCQ","q":"నల్లకలువ is an example of:","o":["Dvandva","Ṣaṣṭhī tatpuruṣa","Viśeṣaṇa pūrvapada karmadhāraya","Bahuvrīhi"],"a":2,"e":"The first word (నల్లని) qualifies the second (కలువ): viśeṣaṇa pūrvapada karmadhāraya.","n":"","te":{"q":"'నల్లకలువ' దేనికి ఉదాహరణ?","o":["ద్వంద్వ సమాసం","షష్ఠీ తత్పురుష సమాసం","విశేషణ పూర్వపద కర్మధారయ సమాసం","బహువ్రీహి సమాసం"],"e":"పూర్వపదం (నల్లని) విశేషణం, ఉత్తరపదం (కలువ) విశేష్యం: విశేషణ పూర్వపద కర్మధారయం.","n":""}},{"t":"MCQ","q":"విద్యాధనం (విద్య అనెడి ధనం) is a:","o":["Dvigu samāsa","Dvandva samāsa","Rūpaka samāsa","Bahuvrīhi samāsa"],"a":2,"e":"When the upameya and upamāna are identified (అనెడి), it is rūpaka samāsa.","n":"","te":{"q":"'విద్యాధనం' (విద్య అనెడి ధనం) ఏ సమాసం?","o":["ద్విగు సమాసం","ద్వంద్వ సమాసం","రూపక సమాసం","బహువ్రీహి సమాసం"],"e":"ఉపమేయ ఉపమానాలకు అభేదం చెప్పినప్పుడు ('అనెడి') అది రూపక సమాసం.","n":""}},{"t":"MCQ","q":"'ఆమె ముఖం చంద్రుని వలె అందంగా ఉంది' — the alaṅkāra is:","o":["Rūpaka","Upamā","Utprekṣā","Atiśayokti"],"a":1,"e":"Upamā compares upameya (face) with upamāna (moon) using a word like 'వలె'.","n":"","te":{"q":"'ఆమె ముఖం చంద్రుని వలె అందంగా ఉంది' — ఇది ఏ అలంకారం?","o":["రూపకాలంకారం","ఉపమాలంకారం","ఉత్ప్రేక్షాలంకారం","అతిశయోక్తి అలంకారం"],"e":"ఉపమేయమైన ముఖాన్ని ఉపమానమైన చంద్రునితో 'వలె' అనే ఉపమావాచకంతో పోల్చడం ఉపమాలంకారం.","n":""}},{"t":"MCQ","q":"When the upameya and upamāna are presented as identical ('ఆమె ముఖమే చంద్రుడు'), the alaṅkāra is:","o":["Utprekṣā","Upamā","Rūpaka","Arthāntaranyāsa"],"a":2,"e":"Rūpaka states non-difference (abheda) between the two.","n":"","te":{"q":"ఉపమేయ, ఉపమానాలకు అభేదం చెప్పినప్పుడు ('ఆమె ముఖమే చంద్రుడు') అది ఏ అలంకారం?","o":["ఉత్ప్రేక్షాలంకారం","ఉపమాలంకారం","రూపకాలంకారం","అర్థాంతరన్యాసాలంకారం"],"e":"రూపకాలంకారంలో ఉపమేయ ఉపమానాలకు అభేదం చెబుతారు.","n":""}},{"t":"MCQ","q":"Supporting a general statement with a particular example (or vice versa) is:","o":["Utprekṣā","Arthāntaranyāsa","Yamaka","Svabhāvokti"],"a":1,"e":"Arthāntaranyāsa: sāmānya is supported by viśeṣa or viśeṣa by sāmānya.","n":"","te":{"q":"సామాన్య విషయాన్ని విశేషంతో (లేదా విశేషాన్ని సామాన్యంతో) సమర్థించడం ఏ అలంకారం?","o":["ఉత్ప్రేక్ష","అర్థాంతరన్యాసం","యమకం","స్వభావోక్తి"],"e":"అర్థాంతరన్యాసంలో సామాన్యాన్ని విశేషంతో గానీ, విశేషాన్ని సామాన్యంతో గానీ సమర్థిస్తారు.","n":""}},{"t":"MCQ","q":"Repeating the same consonant many times in a line is:","o":["Lāṭānuprāsa","Antyanuprāsa","Yamaka","Vṛttyanuprāsa"],"a":3,"e":"Vṛttyanuprāsa is a śabdālaṅkāra in which one consonant recurs several times.","n":"","te":{"q":"ఒకే హల్లు పలుమార్లు ఆవృత్తి కావడం ఏ అలంకారం?","o":["లాటానుప్రాసం","అంత్యానుప్రాసం","యమకం","వృత్త్యనుప్రాసం"],"e":"ఒకే హల్లు అనేకసార్లు వచ్చే శబ్దాలంకారం వృత్త్యనుప్రాసం.","n":""}},{"t":"MCQ","q":"How many letters are there in each line (pāda) of Utpalamāla, and where is the yati?","o":["21 letters, yati at the 11th letter","20 letters, yati at the 10th letter","19 letters, yati at the 13th letter","20 letters, yati at the 14th letter"],"a":1,"e":"Utpalamāla: గణాలు భ, ర, న, భ, భ, ర, వ — 20 letters, yati at the 10th. (Champakamāla 21/11, Śārdūla 19/13, Mattebha 20/14.)","n":"","te":{"q":"ఉత్పలమాల పద్యంలో ప్రతి పాదానికి ఎన్ని అక్షరాలు, యతి ఎక్కడ?","o":["21 అక్షరాలు, 11వ అక్షరం యతి","20 అక్షరాలు, 10వ అక్షరం యతి","19 అక్షరాలు, 13వ అక్షరం యతి","20 అక్షరాలు, 14వ అక్షరం యతి"],"e":"ఉత్పలమాల: భ, ర, న, భ, భ, ర, వ గణాలు — 20 అక్షరాలు, 10వ అక్షరం యతి. (చంపకమాల 21/11, శార్దూలం 19/13, మత్తేభం 20/14.)","n":""}},{"t":"MCQ","q":"The gaṇas of Champakamāla are:","o":["స, భ, ర, న, మ, య, వ","భ, ర, న, భ, భ, ర, వ","మ, స, జ, స, త, త, గ","న, జ, భ, జ, జ, జ, ర"],"a":3,"e":"Champakamāla: న జ భ జ జ జ ర (21 letters, yati at 11).","n":"","te":{"q":"చంపకమాల గణాలు ఏవి?","o":["స, భ, ర, న, మ, య, వ","భ, ర, న, భ, భ, ర, వ","మ, స, జ, స, త, త, గ","న, జ, భ, జ, జ, జ, ర"],"e":"చంపకమాల: న జ భ జ జ జ ర (21 అక్షరాలు, 11వ అక్షరం యతి).","n":""}},{"t":"MCQ","q":"Which gaṇa has the pattern U I U (guru–laghu–guru)?","o":["భ గణం","జ గణం","స గణం","ర గణం"],"a":3,"e":"య IUU, మ UUU, త UUI, ర UIU, జ IUI, భ UII, న III, స IIU.","n":"","te":{"q":"U I U (గురువు–లఘువు–గురువు) ఏ గణం?","o":["భ గణం","జ గణం","స గణం","ర గణం"],"e":"య IUU, మ UUU, త UUI, ర UIU, జ IUI, భ UII, న III, స IIU.","n":""}},{"t":"MCQ","q":"Āṭaveladi has which structure?","o":["Lines 1 & 3: 3 gaṇas; lines 2 & 4: 5 gaṇas of 4 mātras","Each line: 1 sūrya, 2 indra, 2 sūrya gaṇas","Lines 1 & 3: 3 sūrya + 2 indra gaṇas; lines 2 & 4: 5 sūrya gaṇas","Each line: 6 indra + 2 sūrya gaṇas"],"a":2,"e":"Āṭaveladi alternates (3 sūrya + 2 indra) and (5 sūrya). Teṭagīti: 1 sūrya + 2 indra + 2 sūrya. Kanda uses 4-mātra gaṇas. Sīsa: 6 indra + 2 sūrya.","n":"","te":{"q":"ఆటవెలది నిర్మాణం ఏది?","o":["1, 3 పాదాల్లో 3 గణాలు; 2, 4 పాదాల్లో 5 గణాలు (4 మాత్రలు)","ప్రతి పాదం: 1 సూర్య, 2 ఇంద్ర, 2 సూర్య గణాలు","1, 3 పాదాల్లో 3 సూర్య + 2 ఇంద్ర గణాలు; 2, 4 పాదాల్లో 5 సూర్య గణాలు","ప్రతి పాదం: 6 ఇంద్ర + 2 సూర్య గణాలు"],"e":"ఆటవెలది: (3 సూర్య + 2 ఇంద్ర), (5 సూర్య) ఏకాంతరంగా. తేట const IDB=(()=>{let dbp=null;const mem=new Map();
  function open(){if(dbp)return dbp;dbp=new Promise(res=>{try{const r=indexedDB.open("dsc-exam-hall",1);r.onupgradeneeded=()=>r.result.createObjectStore("books",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});return dbp}
  async function tx(mode,fn){const db=await open();if(!db)return null;return new Promise(res=>{try{const t=db.transaction("books",mode);const s=t.objectStore("books");const r=fn(s);t.oncomplete=()=>res(r&&r.result!==undefined?r.result:true);t.onerror=()=>res(null)}catch(e){res(null)}})}
  return{async all(){const r=await tx("readonly",s=>s.getAll());return r||[...mem.values()]},async put(b){mem.set(b.id,b);await tx("readwrite",s=>s.put(b))},async del(id){mem.delete(id);await tx("readwrite",s=>s.delete(id))}}})();

/* --- mock tests and part practice --- */
async function contentPool(post,need){
  if(post.contentBank)return bankPool(post.contentBank,need);
  const ex=post.extra?bankPool(post.extra,Math.round(need*0.35)):[];
  const seen=new Set(ex.map(q=>q.q));const fromBooks=(await bookContentPool(post,need-ex.length+5)).filter(q=>!seen.has(q.q)).slice(0,need-ex.length);
  return shuffle([...fromBooks,...ex]).slice(0,need)}
async function bookContentPool(post,need){
  const cc=contentChapters(post);if(!cc.length||need<=0)return [];const ids=[...new Set(cc.map(x=>x.book.id))];
  toast(t("mockBuilding",{n:ids.length}),12000);
  const loaded=await Promise.all(ids.map(id=>loadBook(id).catch(()=>null)));$("#toast").hidden=true;
  const per=[];for(const b of loaded){if(!b)continue;for(const p of b.parts){if(!post.content.codes.includes(p.code))continue;for(const c of p.chapters){const qs=chapterQs(c);if(qs.length)per.push({c,qs})}}}
  // spread across chapters: round-robin from shuffled chapters, preferring curated/AI questions
  const order=shuffle(per).map(x=>({...x,qs:[...shuffle(x.qs.filter(q=>q.src!=="auto")),...shuffle(x.qs.filter(q=>q.src==="auto"))]}));
  const out=[];const seen=new Set();let round=0;
  while(out.length<need&&order.some(x=>x.qs.length>round)){for(const x of order){if(out.length>=need)break;const q=x.qs[round];if(q&&!seen.has(q.q)){seen.add(q.q);out.push(wrapQ(q,x.c.id,x.c.title,x.c.te,x.c.n))}}round++}
  return out}
function bankPool(bankId,need){const b=BANKS&&BANKS[bankId];if(!b)return[];return shuffle(b.qs).slice(0,need).map(q=>({...q,ch:bankId,chTitle:b.title[0],chTitleTe:b.title[1]}))}
async function partQuestions(post,part,n){
  if(part==="content")return contentPool(post,n);
  const id=bankFor(part,post);let qs=bankPool(id,n);
  if(part==="meth"&&qs.length<n&&id!=="meth-sgt")qs=[...qs,...bankPool("meth-sgt",n-qs.length)];
  return qs}
async function startMock(post,paperIdx){
  const pp=post.papers[paperIdx];let qs=[];let short=false;
  for(const [k,n] of pp.parts){const got=await partQuestions(post,k,n);if(got.length<n)short=true;qs.push(...got.map(q=>({...q,sec:k,ch:"sec-"+k,chTitle:PARTS[k][0],chTitleTe:PARTS[k][1]})))}
  if(!qs.length)return toast(t("noQs"));
  if(short)setTimeout(()=>toast(t("shortPool"),5000),400);
  const nm=post.papers.length>1?" · "+pp.name[0]:"";
  startTest({title:`${tr("mockT",null,"en")} · ${post.name[0]}${nm}`,titleTe:`${tr("mockT",null,"te")} · ${post.name[1]}${post.papers.length>1?" · "+pp.name[1]:""}`,qs,mode:"mock",dur:settings.timer?(settings.mockMins||150)*60:0,ctx:{k:"mock",post:post.id,paper:paperIdx},sections:true,postId:post.id});
}
async function startMini(post){
  const pp=post.papers[0];const tot=pp.parts.reduce((s,[,n])=>s+n,0);const want=TCFG().mini;
  const al=pp.parts.map(([k,n])=>[k,Math.max(1,Math.round(n*want/tot))]);let d=want-al.reduce((s,[,n])=>s+n,0);
  for(let i=0;d!==0&&i<200;i++){const j=i%al.length;if(d>0){al[j][1]++;d--}else if(al[j][1]>1){al[j][1]--;d++}}
  let qs=[];for(const [k,n] of al){const got=await partQuestions(post,k,n);qs.push(...got.map(q=>({...q,sec:k,ch:"sec-"+k,chTitle:PARTS[k][0],chTitleTe:PARTS[k][1]})))}
  if(!qs.length)return toast(t("noQs"));
  startTest({title:`${tr("miniT",null,"en")} · ${post.name[0]}`,titleTe:`${tr("miniT",null,"te")} · ${post.name[1]}`,qs,mode:"mock",dur:settings.timer?qs.length*60:0,ctx:{k:"mini",post:post.id},sections:true,postId:post.id});
}
async function startPart(post,part,n){
  const qs=await partQuestions(post,part,n);if(!qs.length)return toast(t("noQs"));
  startTest({title:`${PARTS[part][0]} · ${qs.length} Q`,titleTe:`${PARTS[part][1]} · ${qs.length} ప్ర`,qs,mode:"part",ctx:{k:"part",post:post.id,part,n}});
}

/* --- notebook rendering --- */
function nbHead(book,part){return `<div class="nb-top"><span>AP DSC</span><span>${esc(two(SUBJ[part.code]||[part.code,part.code]))}</span><span>Class-${book.cls} ${book.term==="S1"?"Sem-1":book.term==="S2"?"Sem-2":""}</span></div>`}
function noteModel(c,sub){
  const s=c.subs[sub];const ai=aiNote(c.id,sub);
  if(ai)return{...ai,ai:true};
  const n=s.note||{pts:[],ex:[],terms:[],l:"en"};const te=n.l==="te",hi=n.l==="hi";
  const lab=k=>te?tr(k,null,"te"):hi?{keyPts:"मुख्य बिंदु",examples:"उदाहरण",terms:"मुख्य शब्द"}[k]||tr(k,null,"en"):tr(k,null,"en");
  const secs=[];
  if(sub===0&&c.lo&&c.lo.length)secs.push({h:te?"అభ్యసన ఫలితాలు":hi?"सीखने की संप्राप्तियाँ":"Learning outcomes",pts:c.lo.slice(0,6)});
  if(n.pts.length)secs.push({h:lab("keyPts"),pts:n.pts});if(n.ex.length)secs.push({h:lab("examples"),ex:n.ex});
  for(const x of s.ch||[])secs.push({h:x.t,pts:[]});
  return{title:s.t,sections:secs,terms:n.terms,flow:sub===0?c.subs.slice(1,8).map(x=>x.t):[],slogan:(c.dyk[sub%Math.max(1,c.dyk.length)]||{}).t||"",l:n.l}}
function notebookHTML(c,book,part,sub){
  const m=noteModel(c,sub);const s=c.subs[sub];const l=m.l||scriptLang(m.title);
  const lc=l==="te"?" te":l==="hi"?" hi":"";
  const meta=c.meta||{};const mk=Object.entries(meta);
  const doodles=["bulb","book","star","pen"];
  const secHTML=(x,i)=>`<div><span class="nb-h c${i%3}">${L_(x.h)} :</span>${x.sh?`<div class="nb-sh">${L_(x.sh)}</div>`:""}${x.pts&&x.pts.length?`<ul class="nb-ul">${x.pts.map(p=>`<li>${L_(p)}</li>`).join("")}</ul>`:""}${x.ex&&x.ex.length?x.ex.map(e=>`<div class="nb-ex"><b>${l==="te"?"ఉదా:":l==="hi"?"उदा:":"e.g."}</b> ${L_(e)}</div>`).join(""):""}</div>`;
  const left=`<div class="nb-page${lc}">${nbHead(book,part)}
    <div class="nb-title">${esc(c.n)}. ${c.te?`${L_(c.te)} (${esc(c.title)})`:L_(c.title)}</div>
    ${sub===0&&mk.length?`<div><span class="nb-h c1">${L_(l==="hi"?"पाठ परिचय":l==="te"?"పాఠం గురించి":"About the lesson")} :</span><div class="nb-meta">${mk.map(([k,v])=>`<div><b>${L_(k)}:</b> ${L_(v)}</div>`).join("")}</div></div>`:""}
    <div class="nb-sh">${c.n}.${sub+1} ${L_(m.title||s.t)} ${m.ai?`<span class="nb-ai">${esc(t("aiNote"))}</span>`:""}</div>
    ${DOODLE[doodles[sub%4]]}
    ${(m.sections||[]).slice(0,Math.max(1,Math.ceil((m.sections||[]).length/2))).map(secHTML).join("")}
    ${!(m.sections||[]).length?`<p class="nb-src">${esc(t("noneHere"))}</p>`:""}
    <div class="nb-num">— ${esc(t("pg",{p:s.s}))} —</div></div>`;
  const rest=(m.sections||[]).slice(Math.max(1,Math.ceil((m.sections||[]).length/2)));
  const right=`<div class="nb-page${lc}">${nbHead(book,part)}
    ${rest.map((x,i)=>secHTML(x,i+1)).join("")}
    ${m.terms&&m.terms.length?`<div><span class="nb-h c2">${L_(l==="te"?"ముఖ్య పదాలు":l==="hi"?"मुख्य शब्द":"Key terms")} :</span><div class="nb-terms">${m.terms.map(x=>`<div class="nb-term"><b>${L_(x.w)}</b> = ${L_(x.m)}</div>`).join("")}</div></div>`:""}
    ${m.flow&&m.flow.length>1?`<div><span class="nb-h c0">${L_(l==="te"?"అధ్యాయ క్రమం":"Chapter flow")} :</span><div class="nb-flow">${m.flow.map((x,i)=>`${i?"<i>→</i>":""}<span>${L_(x)}</span>`).join("")}</div></div>`:""}
    ${m.slogan?`<div class="nb-cloud">${L_(m.slogan.length>220?m.slogan.slice(0,220)+"…":m.slogan)}</div>`:""}
    ${!m.ai?`<p class="nb-src">${esc(t("autoNote"))}</p>`:""}
    <div class="nb-num">— ${esc(t("pg",{p:s.e}))} —</div></div>`;
  return `<div class="nb">${left}${right}</div>`}

/* --- tests from chapters --- */
async function startChapterTest(chId,mode,sub){
  const meta=catCh(chId);if(!meta)return;if(!chOpen(chId))return unlockModal();let b;try{b=await loadBook(meta.book.id)}catch(e){return toast(t("loadFail"))}
  const {ch:c}=findCh(b,chId);
  let pool=chapterQs(c,mode==="topic"?sub:null).map(q=>wrapQ(q,c.id,c.title,c.te,c.n));
  if(!pool.length)return toast(t("noQs"));
  let qs;if(mode==="quick")qs=shuffle(pool).slice(0,10);else if(mode==="topic")qs=shuffle(pool).slice(0,25);else qs=settings.shuffleFull?shuffle(pool):pool;
  const subT=mode==="topic"?` · ${c.n}.${sub+1} ${c.subs[sub].t}`:"";
  const lab=mode==="quick"?"quickT":mode==="topic"?"topicTest":"fullT";
  startTest({title:`${tr(lab,null,"en")} · ${c.n}. ${c.title}${subT}`,titleTe:`${tr(lab,null,"te")} · ${c.n}. ${c.te||c.title}${subT}`,qs,mode,ctx:{k:"ch",ch:chId,mode,sub},key:"ch:"+chId,bookTitle:meta.book.title});
}

/* ========== EXAM ENGINE ========== */
let timerId=null;
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function startTest(o){trialPing("test",{kind:o.mode});
  state.exam={id:uid(),title:o.title,titleTe:o.titleTe,mode:o.mode,ctx:o.ctx,key:o.key||null,sections:!!o.sections,postId:o.postId||null,bookTitle:o.bookTitle||"DSC Exam Hall",
    qs:o.qs,ans:o.qs.map(()=>-1),mark:o.qs.map(()=>false),cur:0,start:Date.now(),dur:o.dur!=null?o.dur:(settings.timer?o.qs.length*settings.secPerQ:0),marks:settings.marks,neg:settings.neg};
  state.view="exam";stopTimer();render();window.scrollTo({top:0});
}
function examTitleHTML(x){const lang=LANG();if(lang==="te"&&x.titleTe)return L_(x.titleTe);if(lang==="both"&&x.titleTe&&x.titleTe!==x.title)return `${L_(x.title)}<span class="sub-te" lang="te">${esc(x.titleTe)}</span>`;return L_(x.title)}
function renderExam(){
  const ex=state.exam;if(!ex)return go("home");
  $("#app").innerHTML=`
  <div class="exam-head">
    <h1 id="examTitle">${examTitleHTML(ex)}</h1>

}
function tick(){const ex=state.exam;if(!ex||state.view!=="exam")return stopTimer();const el=$("#timer");if(!el)return;
  const used=(Date.now()-ex.start)/1000;
  if(ex.dur){const left=ex.dur-used;el.textContent=fmtTime(left);el.classList.toggle("low",left<=60);if(left<=0){stopTimer();submitExam(true)}}
  else el.textContent=fmtTime(used)}
function chLabel(q){if(LANG()==="te"&&q.chTitleTe)return `<span lang="te">${esc(q.chTitleTe)}</span>`;return L_(q.chTitle||"")}
function drawQ(){
  const ex=state.exam,i=ex.cur,q=ex.qs[i];
  $("#qcard").innerHTML=`
    <div class="qmeta"><span class="qno">Q ${i+1} / ${ex.qs.length}</span><span class="qtype">${esc(typeLabel(q.t||"MCQ"))}</span>${new Set(ex.qs.map(x=>x.ch)).size>1?`<span class="muted" style="font-size:12.5px">${chLabel(q)}</span>`:""}${ex.mark[i]?`<span class="verdict" style="background:var(--mark-soft);color:var(--mark)">${esc(t("marked"))}</span>`:""}</div>
    ${qBlock(q)}
    <div class="opts" role="radiogroup" aria-label="Options">
      ${q.o.map((o,k)=>`<button class="opt ${ex.ans[i]===k?"sel":""}" role="radio" aria-checked="${ex.ans[i]===k}" data-k="${k}"><span class="bub">${L[k]}</span><span class="tx">${qOpt(q,k)}</span></button>`).join("")}
    </div>
    <div class="qnav">
      <button class="btn sm" id="prev" ${i===0?"disabled":""}>${esc(t("prev"))}</button>
      <button class="btn sm ghost" id="clear" ${ex.ans[i]<0?"disabled":""}>${esc(t("clearResp"))}</button>
      <button class="btn sm ghost" id="markB">${esc(ex.mark[i]?t("unmark"):t("markRev"))}</button>
      <span class="sp"></span>
      <button class="btn sm ink" id="next">${esc(i===ex.qs.length-1?t("revSubmit"):t("saveNext"))}</button>
    </div>`;
  $("#qcard").querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.k));
  $("#prev").onclick=()=>move(-1);$("#next").onclick=()=>{if(i===ex.qs.length-1)askSubmit();else move(1)};
  $("#clear").onclick=()=>{ex.ans[i]=-1;drawQ();drawPalette()};
  $("#markB").onclick=toggleMark;
}
function choose(k){const ex=state.exam;ex.ans[ex.cur]=k;drawQ();drawPalette()}
function toggleMark(){const ex=state.exam;ex.mark[ex.cur]=!ex.mark[ex.cur];drawQ();drawPalette()}
function move(d){const ex=state.exam;const n=ex.cur+d;if(n<0||n>=ex.qs.length)return;ex.cur=n;drawQ();drawPalette();if(innerWidth<900)$("#qcard").scrollIntoView({block:"start",behavior:"smooth"})}
function drawPalette(){
  const ex=state.exam;const a=ex.ans.filter(x=>x>=0).length,m=ex.mark.filter(Boolean).length;
  $("#paletteBox").innerHTML=`<div class="eyebrow">${esc(t("palette"))}</div>
    <div class="pal-grid" id="pal">${ex.qs.map((_,i)=>`<button class="pal ${ex.ans[i]>=0?"ans":""} ${ex.mark[i]?"mk":""} ${i===ex.cur?"cur":""}" data-i="${i}" aria-label="Q ${i+1}">${i+1}</button>`).join("")}</div>

function pdfText(o){

  set(16,"bold",[255,255,255]);doc.text(doc.splitTextToSize(ascii(o.title),CW-14).slice(0,2),M+14,21);
  set(9,"normal",[200,205,225]);doc.text(ascii(o.sub),M+14,34);
  y=48;
  const meta=[];
  if(o.kind==="result"){const a=o.attempt;meta.push(["Candidate",a.name||settings.name||"-"],["Date",fmtDate(a.date)],["Marks",`${a.score} / ${a.max}`+(a.neg?`  (-${a.neg} per wrong)`:"")],["Accuracy",a.pct+"%"],["Correct / Wrong / Not answered",`${a.correct} / ${a.wrong} / ${a.skipped}`],["Time taken",fmtTime(a.used)]);}

function validQ(q){return q&&typeof q.q==="string"&&Array.isArray(q.o)&&q.o.length===4&&q.o.every(o=>typeof o==="string")&&Number.isInteger(q.a)&&q.a>=0&&q.a<4}
function cleanTe(x){if(!x||typeof x!=="object"||typeof x.q!=="string"||!x.q.trim())return undefined;const o=Array.isArray(x.o)&&x.o.length===4?x.o.map(String):undefined;return{q:x.q,o,e:String(x.e||""),n:String(x.n||"")}}
function chText(c,from,to,limit){let s="";for(const p of c.pg){if(p.p<from||p.p>to)continue;const add=`\n[page ${p.p}]\n${p.t}`;if(s.length+add.length>limit)break;s+=add}return s}
function langName(l){return l==="te"?"Telugu":l==="hi"?"Hindi (Devanagari script)":"English"}
function chLang(c){const n={en:0,te:0,hi:0};c.pg.forEach(p=>n[p.l]=(n[p.l]||0)+p.t.length);return Object.entries(n).sort((a,b)=>b[1]-a[1])[0][0]}
async function aiChapterQuestions(c,book,part,btn){

    const prompt=`You are an expert paper-setter for the Andhra Pradesh DSC teacher-recruitment exam (CBT, 4-option objective questions). Using ONLY the textbook content below (Class ${book.cls}, ${book.title}, chapter ${c.n}: "${c.title}"), write exactly 15 objective questions in DSC pattern.

${lang}

${text}`;

async function aiTopicNotes(c,book,part,sub,btn){

    const q=mkQ("Fill in the blank",`Fill in the blank:\n${x.s.charAt(0)+x.s.slice(1).replace(reW(n),"______")}`,n,pickDistractors(n,P.names,3,y=>Math.abs(y.split(" ").length-n.split(" ").length)),src(x),ctx(x));if(q){out.push(q);used.add(x)}}
  return shuffle(out).slice(0,count);
}
