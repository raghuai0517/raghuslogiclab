<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AP DSC 2026 Exam Hall · Free Trial · RaghusLogicLab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="AP DSC 2026 preparation: post-wise mock tests, chapter and topic tests from every AP textbook (Classes 1–10), Do You Know, Glossary, Exercises and notebook-style notes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Kalam:wght@400;700&family=Gidugu&display=swap">
<style>
/* Layout concept: an exam hall — question-booklet header, OMR answer bubbles, CBT palette — plus a ruled student notebook for revision notes. */
:root{
  --paper:#F5F6FA; --card:#FFFFFF; --ink:#141B33; --muted:#59617D; --line:#DADEEA; --line-strong:#B9BFD3;
  --omr:#B5195A; --omr-ink:#FFFFFF; --omr-soft:#FBE7EF; --ink-soft:#E9ECF6; --te:#2E3A66;
  --ok:#17784A; --ok-soft:#E2F3EA; --bad:#C0352B; --bad-soft:#FCEBE9; --mark:#6A3FB0; --mark-soft:#EFE8FA; --warn:#9A5B00;
  /* the notebook is a physical paper object: same look in both themes */
  --nb-paper:#FFFEF8; --nb-rule:#C9DDF2; --nb-margin:#F07AA8; --nb-ink:#1C3FA6; --nb-ink2:#22314F; --nb-hl-pink:#FFB3D1; --nb-hl-lime:#DDF58A; --nb-hl-cyan:#BFEFFA; --nb-box:#D6F6FD; --nb-green:#17784A; --nb-shadow:rgba(20,27,51,.16);
  --f-display:"Archivo","Noto Sans Telugu","Noto Sans",system-ui,sans-serif;
  --f-body:"Noto Sans","Noto Sans Telugu","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-te:"Noto Sans Telugu","Noto Sans",system-ui,sans-serif;
  --f-hi:"Noto Sans Devanagari","Noto Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-hand:"Kalam","Gidugu","Noto Sans Telugu","Noto Sans Devanagari","Comic Sans MS",cursive;
  --f-hand-te:"Gidugu","Kalam","Noto Sans Telugu",cursive;
  --r:10px; --gut:max(16px, env(safe-area-inset-left, 0px)); --gutr:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1120; --card:#151A2C; --ink:#E8EBF6; --muted:#9CA4C2; --line:#283050; --line-strong:#3A4470;
  --omr:#F0679B; --omr-ink:#1A0B12; --omr-soft:#3A1528; --ink-soft:#1E2540; --te:#C3CBEA;
  --ok:#5FD39A; --ok-soft:#10301F; --bad:#FF8A80; --bad-soft:#3A1715; --mark:#B79AF0; --mark-soft:#2A2045; --warn:#E3A84B; --nb-shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1120; --card:#151A2C; --ink:#E8EBF6; --muted:#9CA4C2; --line:#283050; --line-strong:#3A4470;
  --omr:#F0679B; --omr-ink:#1A0B12; --omr-soft:#3A1528; --ink-soft:#1E2540; --te:#C3CBEA;
  --ok:#5FD39A; --ok-soft:#10301F; --bad:#FF8A80; --bad-soft:#3A1715; --mark:#B79AF0; --mark-soft:#2A2045; --warn:#E3A84B; --nb-shadow:rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
a{color:var(--omr)}
:focus-visible{outline:2px solid var(--omr);outline-offset:2px}
[lang="te"]{font-family:var(--f-te);line-height:1.7}
[lang="hi"],[lang="sa"]{font-family:var(--f-hi);line-height:1.7}
.wrap{max-width:1180px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gutr)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-display);font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
:root[lang="te"] .eyebrow{letter-spacing:.02em;font-size:12.5px}
.sub-te{display:block;font-family:var(--f-te);font-weight:500;color:var(--te);font-size:.86em;margin-top:2px;line-height:1.6}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;border:0;background:none;padding:0}
.brand-mark{width:32px;height:32px;border-radius:50%;border:2px solid var(--omr);display:grid;place-items:center;flex:none}
.brand-mark::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--omr)}
.brand>span:last-child{text-align:left}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:800;letter-spacing:-.01em;display:block}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:-1px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{border:0;background:none;padding:6px 10px;border-radius:8px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.nav button:hover{background:var(--ink-soft);color:var(--ink)}
.nav button.on{color:var(--omr);background:var(--omr-soft)}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lang{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.lang button{border:0;background:var(--card);padding:5px 10px;font-size:13px;font-weight:600;cursor:pointer;min-height:32px}
.lang button+button{border-left:1px solid var(--line-strong)}
.lang button.on{background:var(--ink);color:var(--paper)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:var(--card);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;min-height:38px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--omr);border-color:var(--omr);color:var(--omr-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--ink-soft)}
.btn.ai{border-color:var(--mark);color:var(--mark);background:var(--mark-soft)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn.xs{padding:2px 8px;min-height:26px;font-size:12px;border-radius:6px;gap:4px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.btn.xs svg{width:12px;height:12px}
main{padding-block:22px 60px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=text],input[type=number],input[type=search],textarea{background:var(--card);border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;min-height:38px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.chip b{color:var(--ink);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-size:17px;font-weight:700;margin-bottom:10px}
.empty{color:var(--muted);font-size:13.5px;padding:10px 0}
.crumb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.crumb button{border:0;background:none;color:var(--omr);cursor:pointer;padding:0;font-weight:600}
.page-head{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{font-size:clamp(22px,3vw,30px);font-weight:800;flex:1;min-width:220px}

/* home: post booklet */
.booklet{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px 28px}
.booklet h1{font-size:clamp(24px,3.4vw,34px);font-weight:800;letter-spacing:-.015em}
.booklet .pub{margin-top:6px;color:var(--muted);font-size:14px}
.post-pick{display:grid;gap:10px;margin-top:16px;background:#0284C7;border:2px solid #FACC15;border-radius:12px;padding:14px 16px;box-shadow:0 4px 14px rgba(2,132,199,.3)}
.post-pick label{font-size:20px;font-weight:800;line-height:1.3;color:#FDE047;letter-spacing:.01em;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.post-pick select{font-weight:700;font-size:18px;max-width:100%;background:#0369A1;color:#FDE047;border:2px solid #FACC15;border-radius:8px;padding:10px 12px;min-height:46px}
.post-pick select option,.post-pick select optgroup{background:#fff;color:#111827}
.btn.hl-blue{background:#0284C7;color:#FDE047;border:2px solid #FACC15;font-size:17px;font-weight:800;padding:10px 18px;min-height:46px;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.btn.hl-blue:hover{background:#0369A1;color:#FEF08A}
.btn.hl-blue svg{stroke:#FDE047}
.patt{border-left:1px dashed var(--line-strong);padding-left:24px;min-width:0}
.patt table{margin-top:6px}
.patt .tot td{font-weight:700;border-top:1.5px solid var(--ink)}
.facts{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap}
.fact b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:600}
.fact span{font-size:12px;color:var(--muted)}
.notice{margin-top:12px;font-size:12.5px;color:var(--warn);background:var(--paper);border:1px dashed var(--line-strong);border-radius:8px;padding:8px 10px}
.sec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sec .k{font-family:var(--f-mono);font-size:12px;color:var(--omr);font-weight:600}
.sec h3{font-size:16px;font-weight:700}
.sec p{margin:0;font-size:13px;color:var(--muted)}
.sec .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.side-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.hist{display:grid;gap:6px;max-height:340px;overflow:auto}
.hist-item{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:none;text-align:left;width:100%}
.hist-item:hover{border-color:var(--ink)}
.hist-item .t{flex:1;min-width:0}
.hist-item .t b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-item .t span{font-size:12px;color:var(--muted)}
.pct{font-family:var(--f-mono);font-weight:600;font-size:14px;padding:2px 8px;border-radius:6px}
.pct.g{background:var(--ok-soft);color:var(--ok)}.pct.m{background:var(--ink-soft);color:var(--warn)}.pct.b{background:var(--bad-soft);color:var(--bad)}

/* syllabus index */
.filterbar{display:grid;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:16px}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchips button{border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer;font-weight:600}
.fchips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cls-block{margin-top:22px}
.cls-block>h2{font-size:20px;font-weight:800;display:flex;gap:10px;align-items:baseline}
.cls-block>h2 .mono{font-size:13px;color:var(--muted);font-weight:500}
.bookcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-top:12px;overflow:hidden}
.bookcard>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;padding:12px 16px;flex-wrap:wrap}
.bookcard>summary::-webkit-details-marker{display:none}
.bookcard>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
.bookcard[open]>summary::before{transform:rotate(45deg)}
.bookcard>summary b{font-size:15px}
.bookcard>summary .muted{font-size:12.5px}
.part{border-top:1px solid var(--line);padding:6px 16px 12px}
.part h3{font-size:13px;font-weight:700;color:var(--omr);margin:8px 0 4px;letter-spacing:.02em}
.chrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 10px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:start}
.chrow:last-child{border-bottom:0}
.chrow .no{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--omr);border:1.4px solid var(--omr);border-radius:50%;width:32px;height:32px;display:grid;place-items:center}
.chrow .ttl{border:0;background:none;padding:0;text-align:left;cursor:pointer;font-weight:700;font-size:15px;color:var(--ink)}
.chrow .ttl:hover{color:var(--omr);text-decoration:underline}
.chrow .cnt{font-size:12px;color:var(--muted)}
.chrow .tst{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.subidx{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:2px}
.subidx button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:2px 8px;font-size:12.5px;cursor:pointer;color:var(--ink);text-align:left}
.subidx button:hover{border-color:var(--omr);color:var(--omr)}
.subidx button .k{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-right:4px}
.best{font-size:11.5px;font-family:var(--f-mono)}

/* chapter hub */
.hub-head{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.hub-head h1{font-size:clamp(22px,3vw,30px);font-weight:800}
.tests{display:grid;gap:8px;min-width:240px}
.tests .btn{justify-content:flex-start}
.free-ch{margin-top:20px;border:2px solid #FACC15}.free-ch h2{margin:0 0 6px;font-size:18px;color:#0284C7}
.trial-bar{background:#0284C7;color:#FDE047;font-weight:700;font-size:14px}
.trial-bar .wrap{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.trial-bar .tb-tag{background:#FDE047;color:#0C4A6E;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;letter-spacing:.04em}
.trial-bar .tb-txt{flex:1;min-width:180px;line-height:1.35}
.trial-bar a{background:#FDE047;color:#0C4A6E;border-radius:8px;padding:7px 14px;font-weight:800;text-decoration:none;white-space:nowrap}
body.in-exam .trial-bar{display:none}
.btn.lockb{border-style:dashed;color:var(--muted)}
.btn.lockb svg{width:14px;height:14px}
.chrow.locked .ttl{color:var(--muted)}
.lock-ic{display:inline-flex;vertical-align:-2px;margin-right:4px;color:var(--muted)}.lock-ic svg{width:14px;height:14px}
.unlock-box .price{font-size:30px;font-weight:800;color:var(--omr);margin:6px 0 2px}
.unlock-box ul{margin:8px 0 14px;padding-left:20px;line-height:1.6}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.tile{display:flex;gap:12px;align-items:center;text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.tile:hover{border-color:var(--ink)}
.tile.on{border-color:var(--omr);background:var(--omr-soft)}
.tile .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--paper);border:1.5px solid var(--omr);color:var(--omr)}
.tile .ic svg{width:20px;height:20px}
.tile b{display:block;font-family:var(--f-display);font-size:15px}
.tile span{font-size:12.5px;color:var(--muted)}
.tilebody{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.dyk{display:grid;gap:10px}
.dyk div{border-left:3px solid var(--omr);padding:6px 12px;background:var(--paper);border-radius:0 8px 8px 0}
.dyk small,.glo small,.exr small{color:var(--muted);font-family:var(--f-mono);font-size:11px}
.glo{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.glo div{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.glo b{color:var(--omr)}
.exr{display:grid;gap:4px;margin:0;padding-left:0;list-style:none}
.exr li{padding:6px 0;border-bottom:1px dashed var(--line)}
.exr .h{font-weight:700;margin-top:10px;color:var(--te)}
.hub-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
.toc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow:auto}
.toc button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:13.5px}
.toc button:hover{background:var(--ink-soft)}
.toc button.on{background:var(--omr-soft);color:var(--omr);font-weight:700}
.toc button .k{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-right:6px}
.toc .chs{padding-left:18px;font-size:12.5px;color:var(--muted)}
.notes-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.notes-bar h2{font-size:17px;font-weight:700;flex:1;min-width:160px}
.reader{margin-top:16px}
.reader summary{cursor:pointer;font-weight:700}
.reader .pgt{white-space:pre-wrap;font-size:14px;line-height:1.7;border-top:1px dashed var(--line);padding-top:8px;margin-top:8px;overflow-wrap:anywhere}

/* notebook */
.nb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;filter:drop-shadow(0 6px 14px var(--nb-shadow))}
.nb-page{background-color:var(--nb-paper);background-image:linear-gradient(90deg,transparent 46px,var(--nb-margin) 46px,var(--nb-margin) 48px,transparent 48px),repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--nb-rule) 31px,var(--nb-rule) 32px);background-position:0 0,0 14px;color:var(--nb-ink);padding:14px 22px 40px 62px;min-height:640px;position:relative;font-family:var(--f-hand);font-size:17px;line-height:32px;min-width:0;overflow-wrap:anywhere}
.nb-page:first-child{border-radius:6px 0 0 6px;border-right:1px solid var(--nb-rule)}
.nb-page:last-child{border-radius:0 6px 6px 0}
.nb-page:only-child{border-radius:6px}
.nb-page [lang="te"],.nb-page.te{font-family:var(--f-hand-te);font-size:19px;line-height:32px}
.nb-page [lang="hi"],.nb-page.hi{font-family:var(--f-hand);line-height:32px}
.nb-top{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-display);font-size:11.5px;font-weight:700;color:var(--nb-ink2);letter-spacing:.04em;line-height:32px;height:32px;white-space:nowrap;overflow:hidden}
.nb-top span:first-child{color:#C2185B}
.nb-title{border:2.5px solid #E2457F;background:var(--nb-box);border-radius:10px;padding:2px 12px;margin:8px 0 10px;color:#0F2C7A;font-weight:700;font-size:20px;line-height:30px;text-align:center}
.nb-h{display:inline-block;padding:0 12px;border-radius:14px;margin:6px 0 2px;font-weight:700;color:#141B33;line-height:28px}
.nb-h.c0{background:var(--nb-hl-pink)}.nb-h.c1{background:var(--nb-hl-lime)}.nb-h.c2{background:var(--nb-hl-cyan)}
.nb-sh{color:#0F2C7A;font-weight:700;text-decoration:underline;text-decoration-color:#2F6BFF;text-underline-offset:5px;text-decoration-thickness:2px}
.nb-ul{list-style:none;margin:0;padding:0}

.nb-flow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px;margin:8px 0}
.nb-flow>span{border:2px solid #2F6BFF;border-radius:8px;padding:0 8px;line-height:26px;background:#fff;color:#0F2C7A;font-size:.9em}
.nb-flow i{font-style:normal;color:#E2457F;font-weight:700;padding:0 2px}
.nb-cloud{margin:14px 6px 4px;padding:8px 18px;border:2.5px solid #2F6BFF;border-radius:40px 34px 44px 30px / 30px 40px 28px 38px;background:#F4FBFF;color:#0F2C7A;text-align:center;font-weight:700;line-height:28px}
.nb-meta{display:grid;gap:0}
.nb-meta div b{color:#C2185B}
.nb-num{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-family:var(--f-mono);font-size:11px;color:var(--nb-ink2);line-height:20px}
.nb-doodle{float:right;width:58px;height:58px;margin:4px 0 4px 8px;color:#E2457F}
.nb-src{font-size:.82em;color:var(--nb-ink2);opacity:.8}
.nb-ai{display:inline-block;font-family:var(--f-display);font-size:10.5px;letter-spacing:.06em;background:#EFE8FA;color:#6A3FB0;border-radius:999px;padding:0 8px;line-height:20px;vertical-align:middle}

/* exam */
.exam-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.exam-head h1{font-size:19px;font-weight:700;flex:1;min-width:200px}
.timer{font-family:var(--f-mono);font-size:20px;font-weight:600;border:1.5px solid var(--ink);border-radius:8px;padding:4px 12px;min-width:104px;text-align:center}
.timer.low{border-color:var(--bad);color:var(--bad)}
.exam-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.qno{font-family:var(--f-mono);font-weight:600;font-size:13px;background:var(--ink);color:var(--paper);border-radius:6px;padding:2px 8px}
.qtype{font-size:12px;font-weight:600;color:var(--omr);border:1px solid var(--omr);border-radius:999px;padding:1px 9px}
.qtext{font-size:17px;line-height:1.6;white-space:pre-line;font-weight:500;overflow-wrap:anywhere}
.qtext.te{font-family:var(--f-te);color:var(--te);font-size:16.5px;line-height:1.8;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.qtext.only-te{margin-top:0;padding-top:0;border-top:0;color:var(--ink)}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;background:var(--card);text-align:left;width:100%;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--line-strong);background:var(--paper)}
.bub{flex:none;width:30px;height:30px;border-radius:50%;border:1.6px solid var(--omr);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--omr);transition:background .12s,color .12s}
.opt.sel{border-color:var(--omr);background:var(--omr-soft)}
.opt.sel .bub{background:var(--omr);color:var(--omr-ink)}
.opt .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.opt .tx .sub-te{font-size:.95em}
.qnav{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
.qnav .sp{flex:1}
.palette{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.pal-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0;max-height:46vh;overflow:auto;padding:2px}
.pal{aspect-ratio:1;border-radius:7px;border:1px solid var(--line-strong);background:var(--card);font-family:var(--f-mono);font-size:12px;font-weight:600;cursor:pointer;padding:0;max-width:100%}
.pal.ans{background:var(--ok);border-color:var(--ok);color:var(--card)}
.pal.mk{background:var(--mark);border-color:var(--mark);color:var(--card)}
.pal.mk.ans{box-shadow:inset 0 -4px 0 var(--ok)}
.pal.cur{outline:2px solid var(--omr);outline-offset:1px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line-strong)}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px;text-align:center}
.counts div{border:1px solid var(--line);border-radius:8px;padding:6px 2px}
.counts b{display:block;font-family:var(--f-mono);font-size:17px}
.counts span{font-size:11px;color:var(--muted)}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-strong);border-radius:4px;padding:0 4px}

/* result */
.res-head{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font-family:var(--f-mono);font-size:28px;font-weight:600;display:block;line-height:1}
.ring .v span{font-size:11.5px;color:var(--muted)}
.res-head h1{font-size:22px;font-weight:800}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:92px}

.stat span{font-size:11.5px;color:var(--muted)}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}.stat.mk b{color:var(--mark)}
.res-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tablewrap{overflow-x:auto;margin-top:6px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-display);font-size:12px;letter-spacing:.04em;color:var(--muted)}
td.num,th.num{font-family:var(--f-mono);text-align:right}
td.wrapc{white-space:normal;min-width:160px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 12px}
.filters button{border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}

.rv{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px;border-left:4px solid var(--line-strong)}

.rv .qtext.te{font-size:15px}
.rv .opts{gap:6px;margin-top:12px}
.rv .opt{cursor:default;padding:8px 12px}

.verdict.c{background:var(--ok-soft);color:var(--ok)}.verdict.w{background:var(--bad-soft);color:var(--bad)}.verdict.s{background:var(--ink-soft);color:var(--warn)}

.expl p{margin:0;overflow-wrap:anywhere}
.expl .note{padding-top:8px;border-top:1px dashed var(--line-strong)}
.expl b.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.04em;margin-right:6px}
.expl .te{font-family:var(--f-te);color:var(--te);line-height:1.75}

/* upload */

.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}

.drop b{font-size:16px}

.chrows{display:grid;gap:8px;margin-top:12px}

.radio-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

.rc span{font-size:13px;color:var(--muted)}
.log{font-family:var(--f-mono);font-size:12.5px;background:var(--paper);border-radius:8px;padding:10px;margin-top:10px;max-height:180px;overflow:auto;white-space:pre-wrap}
.preview{font-size:12.5px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
