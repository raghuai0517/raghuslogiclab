<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>APPSC Group 2 Prep Hall · RaghusLogicLab</title>
  <meta name="description" content="Free APPSC Group 2 preparation in English and Telugu: syllabus notes, mock tests with negative marking, unlimited mental ability practice with visual solutions, flashcards, daily planner and progress tracking. No login.">
  <meta name="theme-color" content="#1f3b2f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Serif:ital,wght@0,600;0,700;1,400&family=Noto+Serif+Telugu:wght@600;700&display=swap" rel="stylesheet">
  <script defer src="../../assets/track.js?v=1"></script>
  <style>
    :root {
      --bg: #f8f5ec; --bg2: #ffffff; --panel: #ffffff; --panel2: #f4efdf; --line: #e2dac4;
      --text: #1c2a22; --muted: #5d655c; --acc: #1f3b2f; --acc2: #86691f; --on-acc: #f6efd9;
      --gold: #a8873a; --gold2: #c9a95a; --head: #1f3b2f; --head2: #17291f; --cream: #f3eedc;
      --good: #1d6b45; --bad: #b3261e; --warn: #b7791f; --info: #2b5c8a;
      --font: "Inter", "Noto Sans Telugu", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --display: "Noto Serif", "Noto Serif Telugu", Georgia, "Times New Roman", serif;
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg: #12201a; --bg2: #16281f; --panel: #1b3026; --panel2: #223b2f; --line: #3a5646;
      --text: #f3eedc; --muted: #b5bfb0; --acc: #c9a95a; --acc2: #d9bd77; --on-acc: #14241c;
      --head: #17291f; --head2: #0f1c15;
      --good: #6fcf97; --bad: #f28b82; --warn: #e6c35c; --info: #8ab4f8; color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
    body.te { line-height: 1.7; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; cursor: pointer; }
    h1, h2, h3 { font-family: var(--display); line-height: 1.25; margin: 0; }
    h1 { font-size: 1.45rem; } h2 { font-size: 1.15rem; } h3 { font-size: 1rem; }
    p { margin: 0; }
    .muted { color: var(--muted); } .small { font-size: .85rem; } .center { text-align: center; }
    :focus-visible { outline: 2px solid var(--acc2); outline-offset: 2px; }

    .top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: linear-gradient(180deg, var(--head2), var(--head)); border-bottom: 2px solid var(--gold); color: var(--cream); }
    .top .brand { flex: 1; min-width: 0; font-family: var(--display); font-weight: 700; font-size: 1.05rem; letter-spacing: .14em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      background: linear-gradient(180deg, #e2c77c, #a8873a 55%, #7d6224); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .top .brand small { display: block; font-family: var(--font); font-weight: 500; font-size: .62rem; letter-spacing: .16em; color: #c9d1c3; -webkit-text-fill-color: #c9d1c3; text-transform: uppercase; }
    .pill { border: 1px solid var(--gold); background: rgba(255,255,255,.06); color: var(--cream); border-radius: 8px; padding: 6px 12px; font-size: .85rem; font-weight: 600; min-height: 36px; }
    .pill:hover { background: rgba(201,169,90,.22); }
    main { max-width: 860px; margin: 0 auto; padding: 16px 14px 96px; }
    main, .card { overflow-wrap: anywhere; }
    body.testing main { padding-bottom: 24px; }

    .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; background: var(--bg2); border-top: 2px solid var(--gold); padding-bottom: env(safe-area-inset-bottom); }
    .tabs a { flex: 1; text-align: center; padding: 8px 2px 9px; font-size: .72rem; font-weight: 600; color: var(--muted); }
    .tabs a svg { display: block; width: 22px; height: 22px; margin: 0 auto 2px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tabs a.on { color: var(--acc2); box-shadow: inset 0 3px 0 var(--gold); }
    body.testing .tabs { display: none; }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .card.tap { display: block; transition: border-color .15s, transform .15s; }
    .card.tap:hover { border-color: var(--gold); transform: translateY(-1px); }
    .card.gold { border: 2px solid var(--gold); background: color-mix(in srgb, var(--gold2) 10%, var(--panel)); }
    .row { display: flex; align-items: center; gap: 12px; } .row > .grow { flex: 1; min-width: 0; }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    .grid .card { margin: 0; }
    .sec { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 22px 0 10px; }
    .sec h2 { text-transform: uppercase; letter-spacing: .14em; font-size: 1rem; padding-bottom: 6px; border-bottom: 3px solid var(--gold); }
    body.te .sec h2 { letter-spacing: .02em; }
    .eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--acc2); }
    body.te .eyebrow { letter-spacing: .03em; }
    .ico { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-size: 1.35rem; background: var(--panel2); border: 1px solid var(--line); flex: none; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); font-weight: 600; }
    .btn { max-width: 100%; text-align: center; overflow-wrap: normal; }
    .row > .btn, .plan .btn, .topic .btn { flex: none; }
    .btn:hover { border-color: var(--gold); }
    .btn.pri { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
    .btn.ghost { background: transparent; } .btn.bad { color: var(--bad); }
    .btn[disabled] { opacity: .45; cursor: not-allowed; }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; }
    .btns.end { justify-content: space-between; }
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: .82rem; font-weight: 600; min-height: 34px; }
    .chip:hover { border-color: var(--gold); }
    .chip.on { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .tag { font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--panel2); color: var(--muted); white-space: nowrap; }
    .tag.wrap { white-space: normal; border-radius: 8px; }
    .tag.good { color: var(--good); } .tag.bad { color: var(--bad); } .tag.warn { color: var(--warn); }
    .bar { height: 8px; border-radius: 99px; background: var(--panel2); overflow: hidden; }
    .bar > i { display: block; height: 100%; border-radius: 99px; background: var(--gold); }

    /* hero */
    .hero { --text: #f3eedc; --muted: #c9d1c3; --line: rgba(201,169,90,.5); --panel2: rgba(255,255,255,.07); --acc: #c9a95a; --acc2: #d9bd77; --on-acc: #14241c;
      background: var(--head); color: var(--text); border: 2px solid var(--gold); border-radius: 4px; text-align: center; padding: 26px 16px 18px;
      box-shadow: inset 0 0 0 5px var(--head), inset 0 0 0 6px rgba(201,169,90,.7); }
    :root[data-theme="dark"] .hero { background: var(--head2); box-shadow: inset 0 0 0 5px var(--head2), inset 0 0 0 6px rgba(201,169,90,.7); }
    .hero h1 { text-transform: uppercase; letter-spacing: .03em; margin: 8px 0 6px; font-size: 1.5rem; }
    .hero .it { font-family: var(--display); font-style: italic; font-weight: 400; color: var(--muted); }
    .hero .tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; }
    .hero .tags span { border: 1px solid var(--gold); background: rgba(168,135,58,.16); border-radius: 4px; padding: 5px 10px; font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
    .stat { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 6px; text-align: center; }
    .stat b { display: block; font-family: var(--display); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
    .stat span { font-size: .7rem; color: var(--muted); }
    .ring { width: 76px; height: 76px; flex: none; } .ring circle { fill: none; stroke-width: 9; }
    .ring .bg { stroke: var(--panel2); } .ring .fg { stroke: var(--gold); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .6s; }
    .ring text { fill: var(--text); font: 700 20px var(--display); text-anchor: middle; }
    .plan li { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
    .plan { list-style: none; margin: 8px 0 0; padding: 0; } .plan li:first-child { border-top: 0; }
    .plan .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--panel2); font-weight: 700; font-size: .85rem; flex: none; }
    .heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; justify-content: start; }
    .heat i { width: 14px; height: 14px; border-radius: 3px; background: var(--panel2); }
    .heat i { border: 1px solid var(--line); } .heat i.l1 { background: color-mix(in srgb, var(--gold) 35%, var(--panel2)); } .heat i.l2 { background: color-mix(in srgb, var(--gold) 70%, var(--panel2)); }
    .heat i.l3 { background: color-mix(in srgb, var(--head) 60%, var(--gold)); border-color: transparent; } .heat i.l4 { background: var(--head); border-color: var(--gold); } .heat i.today { outline: 1.5px solid var(--text); }
    :root[data-theme="dark"] .heat i.l3 { background: var(--gold); } :root[data-theme="dark"] .heat i.l4 { background: #f0dca0; }

    /* notes */
    .notes { list-style: none; margin: 0; padding: 0; counter-reset: n; }
    .notes li { counter-increment: n; position: relative; padding: 12px 0 12px 40px; border-top: 1px solid var(--line); }
    .notes li:first-child { border-top: 0; }
    .notes li::before { content: counter(n); position: absolute; left: 0; top: 12px; width: 28px; height: 28px; border-radius: 6px; background: var(--head); color: var(--gold2); font-family: var(--display); font-weight: 700; display: grid; place-items: center; font-size: .85rem; }
    .topic { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
    .topic:first-child { border-top: 0; }
    .tick { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: .8rem; flex: none; color: transparent; }
    .tick.on { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }

    /* test */
    .tbar { position: sticky; top: 58px; z-index: 10; background: var(--bg); padding: 8px 0; display: flex; align-items: center; gap: 10px; }
    .timer { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; padding: 4px 10px; border-radius: 8px; background: var(--panel2); }
    .timer.low { color: var(--bad); }
    .q { font-family: var(--display); font-size: 1.1rem; font-weight: 600; margin: 6px 0 14px; }
    .opt { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; padding: 13px 14px; margin-bottom: 10px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--panel2); min-height: 50px; }
    .opt:hover:not([disabled]) { border-color: var(--gold); }
    .opt .k { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font-size: .8rem; font-weight: 700; flex: none; }
    .opt.sel { border-color: var(--info); background: color-mix(in srgb, var(--info) 16%, var(--panel2)); } .opt.sel .k { background: var(--info); border-color: var(--info); color: #fff; }
    .opt.ok { border-color: var(--good); background: color-mix(in srgb, var(--good) 16%, var(--panel2)); } .opt.ok .k { background: var(--good); border-color: var(--good); color: var(--on-acc); }
    .opt.no { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--panel2)); } .opt.no .k { background: var(--bad); border-color: var(--bad); color: #fff; }
    .opt[disabled] { cursor: default; opacity: 1; }
    .expl { border-left: 3px solid var(--gold); background: var(--panel2); border-radius: 0 12px 12px 0; padding: 12px 14px; margin: 6px 0 14px; }
    .expl b.h { display: block; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--acc2); margin-bottom: 4px; }
    .pal { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
    .pal button { height: 40px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--panel2); font-weight: 700; font-size: .85rem; }
    .pal .a { background: color-mix(in srgb, var(--good) 28%, var(--panel2)); border-color: var(--good); }
    .pal .f { background: color-mix(in srgb, var(--warn) 28%, var(--panel2)); border-color: var(--warn); }
    .pal .cur { outline: 2px solid var(--text); }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .78rem; color: var(--muted); margin-top: 10px; }
    .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1.5px solid var(--line); }
    .score { font-family: var(--display); font-size: 2.6rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: right; padding: 8px 6px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
    th { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; border-top: 0; }
    th:first-child, td:first-child { text-align: left; }
    .scroll { overflow-x: auto; }

    /* flashcards, timeline, story cards */
    .flash { min-height: 260px; display: flex; flex-direction: column; justify-content: center; text-align: center; cursor: pointer; }
    .flash .side { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--acc2); font-weight: 700; margin-bottom: 10px; }
    .flash .big { font-size: 1.2rem; font-weight: 600; }
    .tl { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 2px solid var(--line); }
    .tl li { position: relative; padding: 0 0 18px 16px; }
    .tl li::before { content: ""; position: absolute; left: -25px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--gold); border: 2px solid var(--bg); }
    .tl b { font-family: var(--display); color: var(--acc2); display: block; }
    details.story { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; }
    details.story summary { padding: 14px 16px; font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
    details.story summary::-webkit-details-marker { display: none; }
    details.story summary::after { content: "+"; color: var(--acc2); } details.story[open] summary::after { content: "–"; }
    details.story .in { padding: 0 16px 16px; }
    .storybox { background: var(--panel2); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
    input[type=date], select { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; min-height: 44px; max-width: 100%; }
    .set { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
    .set:first-child { border-top: 0; }

    /* visual solutions */
    .vz { display: block; width: 100%; max-width: 230px; margin: 10px auto 0; }
    .vz-face { fill: var(--panel); stroke: var(--line); stroke-width: 3; } .vz-num { fill: var(--muted); font: 600 12px var(--font); text-anchor: middle; }
    .vz-hour, .vz-min { stroke-linecap: round; transform-origin: 100px 100px; animation: vzspin 1.1s ease-out forwards; }
    .vz-hour { stroke: var(--text); stroke-width: 6; } .vz-min { stroke: var(--gold); stroke-width: 4; } .vz-pin { fill: var(--text); }
    .vz-big { fill: var(--acc2); font: 700 22px var(--display); text-anchor: middle; } .vz-big.sm { font-size: 14px; text-anchor: start; }
    @keyframes vzspin { from { transform: rotate(0deg); } to { transform: rotate(var(--to)); } }
    .vz-path { fill: none; stroke: var(--good); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: vzdraw 1.8s ease-in-out forwards; }
    @keyframes vzdraw { to { stroke-dashoffset: 0; } }
    .vz-dash { stroke: var(--warn); stroke-width: 2; stroke-dasharray: 5 5; } .vz-start { fill: var(--info); } .vz-end { fill: var(--warn); }
    .vz-key { text-align: center; font-size: .78rem; color: var(--muted); } .vz-key span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 4px 0 10px; }
    .vz-key .k1 { background: var(--info); } .vz-key .k2 { background: var(--warn); }
    .vz-series, .vz-shift { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
    .vz-series b, .vz-shift b { padding: 5px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
    .vz-series i, .vz-shift i { font-style: normal; font-size: .78rem; color: var(--acc2); font-weight: 700; }
    .vz-series i::after { content: " →"; } b.vz-ans { background: var(--acc) !important; color: var(--on-acc); border-color: var(--acc) !important; }
    .vz-shift span { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .vz-ratio { display: flex; margin-top: 10px; border-radius: 10px; overflow: hidden; font-weight: 700; font-size: .85rem; text-align: center; }
    .vz-ratio span { padding: 8px 4px; background: var(--head); color: var(--cream); } .vz-ratio span + span { background: var(--gold); color: #1c2a22; }
    .vz-tree { margin-top: 10px; text-align: center; font-size: .88rem; } .vz-tree .vz-row span { display: inline-block; padding: 5px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); margin: 2px; }
    .vz-tree em { color: var(--muted); font-style: normal; } .vz-link { color: var(--muted); line-height: 1; }
    .vz-bars { display: flex; align-items: flex-end; gap: 8px; height: 170px; margin: 12px 0 30px; padding: 0 4px; border-bottom: 2px solid var(--line); }
    .vz-bars div { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
    .vz-bars span { width: 100%; max-width: 46px; background: linear-gradient(180deg, var(--gold2), var(--gold)); border-radius: 6px 6px 0 0; }
    .vz-bars b { font-size: .8rem; } .vz-bars i { position: absolute; bottom: -24px; font-style: normal; font-size: .7rem; color: var(--muted); white-space: nowrap; }

    #modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 18px; }
    #modal.on { display: flex; } #modal .card { max-width: 400px; width: 100%; margin: 0; }
    #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 60; background: var(--head2); color: var(--cream); border: 1px solid var(--gold); padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: .88rem; opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 90vw; text-align: center; }
    #toast.on { opacity: 1; }
    @media (max-width: 420px) { .stats { grid-template-columns: repeat(2, 1fr); } h1 { font-size: 1.28rem; } .hero h1 { font-size: 1.3rem; } .top .brand { font-size: .92rem; letter-spacing: .1em; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>

    <button class="pill" id="langBtn" type="button" aria-label="Switch language">తెలుగు</button>
