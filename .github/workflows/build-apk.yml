name: Build Android APK and Play bundle
on:
  push:
    branches: [android-app]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: npm ci --no-audit --no-fund
      - name: Create Android project
        run: |
          npx cap add android
          pip install --quiet pillow
          python3 scripts/brand.py
          sed -i 's/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/' android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle
          grep -E "compileSdk|targetSdk|minSdk" android/variables.gradle
          npx cap sync android
      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Align and sign
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 $IN aligned.apk
          $BT/apksigner sign --ks keystore/dsc-exam-hall.jks --ks-key-alias dscexamhall \
            --ks-pass pass:dscexamhall2026 --key-pass pass:dscexamhall2026 \
            --out AP-DSC-Exam-Hall.apk aligned.apk
          $BT/apksigner verify --print-certs AP-DSC-Exam-Hall.apk | head -3
          ls -la AP-DSC-Exam-Hall.apk
          $BT/aapt2 dump badging AP-DSC-Exam-Hall.apk | grep -E "^package|targetSdkVersion|sdkVersion"
      - name: Build Google Play bundle (no outside payment links)
        run: |
          rm -rf www && mv www-play www
          npx cap copy android
          cd android && ./gradlew --no-daemon bundleRelease && cd ..
          cp android/app/build/outputs/bundle/release/app-release.aab AP-DSC-Exam-Hall-play.aab
          jarsigner -keystore keystore/dsc-exam-hall.jks -storepass dscexamhall2026 -keypass dscexamhall2026 \
            -sigalg SHA256withRSA -digestalg SHA-256 AP-DSC-Exam-Hall-play.aab dscexamhall
          jarsigner -verify AP-DSC-Exam-Hall-play.aab | tail -1
          ls -la AP-DSC-Exam-Hall-play.aab
      - uses: actions/upload-artifact@v4
        with:
          name: AP-DSC-Exam-Hall
          path: |
            AP-DSC-Exam-Hall.apk
            AP-DSC-Exam-Hall-play.aab
      - name: Publish APK to the android-apk branch
        run: |
          mkdir out && cp AP-DSC-Exam-Hall.apk AP-DSC-Exam-Hall-play.aab out/
          echo "Built from ${GITHUB_SHA} (run ${{ github.run_number }})" > out/BUILD.txt
          cd out && git init -q -b android-apk && git add . \
            && git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "APK build ${{ github.run_number }}" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" android-apk
